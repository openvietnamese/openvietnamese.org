<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vietnamese Vibes 1 — Sách tương tác</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&display=swap&subset=vietnamese" rel="stylesheet">
<style>
:root{
  --paper:#F5F8F6; --surface:#FFFFFF; --ink:#0F2A1F; --muted:#4F6359; --line:#D3E0D9;
  --jade:#004C2D; --jade-ink:#FFFFFF; --jade-soft:#E1EEE7; --sun:#FEAE0D; --sun-soft:#FFF1D2;
  --lotus:#8F5A00; --ok:#1B7A4A; --ok-soft:#DDF3E6; --bad:#B93A12; --bad-soft:#FBE4DA;
  --shadow:0 1px 0 rgba(0,76,45,.08);
  --serif:"Literata", "Noto Serif", Georgia, "Times New Roman", serif;
  --sans:"Be Vietnam Pro", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#08170F; --surface:#0F2419; --ink:#EAF2ED; --muted:#9DB3A7; --line:#24402F;
  --jade:#5CC79A; --jade-ink:#08170F; --jade-soft:#123323; --sun:#FEAE0D; --sun-soft:#3A2C0C;
  --lotus:#FEC35A; --ok:#5ACF92; --ok-soft:#173A29; --bad:#FF8A5C; --bad-soft:#40231A; --shadow:none;}}
:root[data-theme="dark"]{
  --paper:#08170F; --surface:#0F2419; --ink:#EAF2ED; --muted:#9DB3A7; --line:#24402F;
  --jade:#5CC79A; --jade-ink:#08170F; --jade-soft:#123323; --sun:#FEAE0D; --sun-soft:#3A2C0C;
  --lotus:#FEC35A; --ok:#5ACF92; --ok-soft:#173A29; --bad:#FF8A5C; --bad-soft:#40231A; --shadow:none;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 var(--sans);}
img,svg{max-width:100%}
a{color:var(--jade)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:6px}
.vi{font-family:var(--serif)}

/* shell */
.shell{display:grid;grid-template-columns:288px 1fr;min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));overflow:auto;border-right:1px solid var(--line);background:var(--surface);padding:22px 14px 30px}
.brand{display:block;text-decoration:none;color:var(--ink);padding:4px 10px 18px}
.brand b{display:block;font-weight:800;font-size:22px;letter-spacing:-.01em;line-height:1.1}
.brand span{font-size:13px;color:var(--muted)}
.toc{list-style:none;margin:0;padding:0}
.toc a{display:grid;grid-template-columns:34px 1fr 22px;align-items:center;gap:6px;padding:7px 10px;border-radius:10px;text-decoration:none;color:var(--ink)}
.toc a:hover{background:var(--jade-soft)}
.toc a[aria-current="page"]{background:var(--jade);color:var(--jade-ink)}
.toc a[aria-current="page"] .n,.toc a[aria-current="page"] small{color:inherit}
.toc .n{font-weight:800;font-size:15px;color:var(--jade);font-variant-numeric:tabular-nums}
.toc .t{line-height:1.25;font-size:14.5px}
.toc small{display:block;color:var(--muted);font-size:12px}
.toc .rev .t{font-style:italic}
.ring{width:18px;height:18px;border-radius:50%;background:conic-gradient(var(--sun) calc(var(--p)*1%),var(--line) 0);position:relative}
.ring::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--surface)}
.toc a[aria-current="page"] .ring::after{background:var(--jade)}
.side-h{font-size:12.5px;font-weight:600;color:var(--muted);margin:18px 10px 6px}
.side-tools{display:flex;gap:6px;flex-wrap:wrap;margin:18px 10px 0}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.vsel{width:100%;font:inherit;font-size:13px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.audios{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.audios .hint{width:100%}
.audios .btn svg{flex:0 0 auto}
.topbar{display:none}
main{min-width:0;padding:34px clamp(16px,4vw,56px) 80px}
.wrap{max-width:860px;margin:0 auto}

/* home */
.hero{padding:26px 0 30px;border-bottom:1px solid var(--line);margin-bottom:28px}
.hero h1{font-size:clamp(34px,6vw,58px);line-height:1.02;margin:0 0 10px;letter-spacing:-.025em;font-weight:800}
.hero p{max-width:60ch;color:var(--muted);margin:0 0 6px}
.tones{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:30px 0 8px;max-width:720px}
.tone{border:0;background:none;cursor:pointer;padding:6px 0 10px;text-align:center;border-radius:14px}
.tone:hover{background:var(--jade-soft)}
.tone .s{display:block;font-family:var(--serif);font-size:clamp(40px,8vw,86px);line-height:1.1;font-weight:500;color:var(--ink)}
.tone .s em{font-style:normal;color:var(--lotus)}
.tone .l{display:block;font-size:12.5px;color:var(--muted)}
.hint{font-size:13.5px;color:var(--muted)}
.cta-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 15px;cursor:pointer;text-decoration:none;color:var(--ink);font-weight:600;font-size:15px;line-height:1.2}
.btn:hover{border-color:var(--jade)}
.btn.primary{background:var(--jade);border-color:var(--jade);color:var(--jade-ink)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:14px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:default}
.contents{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.contents li a{display:grid;grid-template-columns:72px 1fr 120px;gap:14px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.contents li a:hover .ct{color:var(--jade)}
.contents .cn{font-size:36px;font-weight:800;color:var(--jade);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.contents .ct{font-family:var(--serif);font-size:21px;line-height:1.2}
.contents .cs{display:block;font-family:var(--sans);font-size:13px;color:var(--muted);margin-top:2px}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sun);width:calc(var(--p)*1%)}
.contents .cp{font-size:12px;color:var(--muted);text-align:right}
.contents .cp .bar{margin-top:5px}
h2.sec{font-size:15px;font-weight:700;color:var(--muted);margin:38px 0 12px}

/* lesson header */
.lh{margin-bottom:8px}
.lnum{font-weight:800;color:var(--jade);font-size:15px}
.lh h1{font-family:var(--serif);font-weight:600;font-size:clamp(32px,5vw,50px);line-height:1.08;margin:4px 0 6px;letter-spacing:-.015em}
.lh .sub{color:var(--muted);margin:0}
.obj{margin:16px 0 0;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.obj summary{cursor:pointer;padding:10px 14px;font-weight:600;font-size:15px}
.obj .in{padding:0 16px 12px;display:grid;grid-template-columns:1fr 1fr;gap:4px 24px}
.obj h4{margin:6px 0 4px;font-size:13px;color:var(--muted);font-weight:600}
.obj ul{margin:0;padding-left:18px;font-size:14.5px}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin:22px 0 26px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:0 0 auto;padding:12px 13px 10px;text-decoration:none;color:var(--muted);font-weight:600;font-size:15px;border-bottom:3px solid transparent;white-space:nowrap}
.tabs a small{display:block;font-weight:400;font-size:11.5px}
.tabs a[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--jade)}
.tabs a:hover{color:var(--ink)}

/* content blocks */
.panel h2{font-size:24px;margin:0 0 14px;line-height:1.25}
.panel h3{font-size:18px;margin:28px 0 8px}
.note{display:flex;gap:10px;background:var(--sun-soft);border-radius:12px;padding:12px 14px;font-size:15px;margin:0 0 18px}
.note b{white-space:nowrap}
.reading{font-family:var(--serif);font-size:17.5px;line-height:1.7;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px clamp(16px,3vw,30px);margin-bottom:12px}
.reading .ad-h{font-family:var(--sans);font-weight:800;letter-spacing:.01em;font-size:17px;color:var(--jade);margin-top:0}
.reading h4{font-family:var(--sans);font-size:14px;margin:18px 0 4px;color:var(--jade)}
.reading .src{font-size:13px;color:var(--muted);font-family:var(--sans)}
.reading ul,.reading ol{padding-left:22px}
.reading .tips li{margin:4px 0}
.card-t{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:12px;font-size:15px}
.tw{overflow-x:auto;margin-bottom:12px}
.card-t caption{text-align:left;font-weight:700;padding:0 0 8px;font-size:14px;color:var(--muted)}
.card-t td,.card-t th{padding:8px 12px;border-top:1px solid var(--line);vertical-align:top;text-align:left}
.card-t td:first-child{font-family:var(--serif);font-weight:600;width:42%}
.card-t th{font-size:13px;color:var(--muted);font-weight:600;background:var(--paper)}
details.tr{margin:0 0 20px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
details.tr summary{cursor:pointer;padding:10px 14px;font-weight:600;font-size:15px}
details.tr .in{padding:0 16px 14px;font-size:15px}
.tx{white-space:pre-line;font-family:var(--serif);font-size:16.5px;line-height:1.7}
.gp{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 20px 14px;margin-bottom:14px}
.gp h3{margin:14px 0 8px;font-size:18px;color:var(--jade)}
.gp ul{padding-left:20px}
.ex-line,.gp .ex{font-family:var(--serif);font-size:17px;border-left:3px solid var(--sun);padding:2px 0 2px 12px;margin:10px 0}
.gp .ex{background:none;border:0;border-left:3px solid var(--sun);border-radius:0;box-shadow:none;padding:2px 0 2px 12px}
.gp .ex span{font-family:var(--sans);font-size:14px;color:var(--muted)}
.gp .nb{font-size:14.5px;color:var(--muted)}
.gp table.g{border-collapse:collapse;width:100%;font-size:15px}
.gp table.g td,.gp table.g th{border-top:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
.gp table.g th{font-size:13px;color:var(--muted)}
.gp .scale{font-size:15px;line-height:1.9}
blockquote{font-family:var(--serif);font-size:20px;line-height:1.6;margin:8px 0 14px;padding:4px 0 4px 18px;border-left:3px solid var(--lotus)}
.culture{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 22px 14px}
.culture p{max-width:68ch}

/* audio */
.tracks{display:grid;gap:10px;margin-bottom:12px}
.track{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.track .ico{width:42px;height:42px;border-radius:50%;background:var(--jade);color:var(--jade-ink);display:grid;place-items:center}
.track b{display:block}
.track small{color:var(--muted)}
.accent{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:6px;color:var(--muted);font-weight:500}

/* exercises */
.exs{display:grid;gap:18px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px clamp(14px,2.6vw,24px) 16px;box-shadow:var(--shadow)}
.ex-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:10px}
.ex-h h3{margin:0;font-size:17px;line-height:1.35}
.kind{font-size:12px;color:var(--muted);white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.items{list-style:none;margin:0;padding:0;counter-reset:q}
.items>li{counter-increment:q;padding:12px 0;border-top:1px dashed var(--line);display:grid;grid-template-columns:28px 1fr;gap:6px}
.items>li:first-child{border-top:0}
.items>li::before{content:counter(q);font-weight:700;color:var(--muted);font-size:14px;padding-top:3px;font-variant-numeric:tabular-nums}
.qtext{font-family:var(--serif);font-size:17px;margin-bottom:8px}
.qrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.pic{font-size:34px;line-height:1.15;min-width:64px;min-height:56px;padding:6px 10px;border-radius:12px;background:var(--paper);display:inline-flex;align-items:center;justify-content:center;text-align:center}
.pic.txt{font-size:18px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 13px;cursor:pointer;font-family:var(--serif);font-size:16.5px;text-align:left;line-height:1.35}
.opt:hover{border-color:var(--jade)}
.opt[aria-checked="true"]{border-color:var(--jade);background:var(--jade-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.sol{border-color:var(--ok);border-style:dashed}
.opt .k{font-family:var(--sans);font-weight:700;color:var(--muted);margin-right:6px;font-size:13px}
.say{border:0;background:var(--sun);color:#004C2D;width:44px;height:44px;border-radius:50%;cursor:pointer;display:inline-grid;place-items:center;flex:0 0 auto}
.say.sm{width:30px;height:30px;background:transparent;color:var(--lotus);border:1px solid var(--line)}
.say:hover{filter:brightness(1.08)}
.fb{font-size:14px;color:var(--muted);margin-top:6px}
.fb.show{display:block}
.tfrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.tfrow .qtext{margin:0;flex:1 1 280px}
.fill-line{font-family:var(--serif);font-size:17px;line-height:2.15}
.blank{font:inherit;font-family:var(--serif);border:0;border-bottom:2px solid var(--muted);background:var(--paper);border-radius:6px 6px 0 0;padding:1px 6px;margin:0 2px;color:var(--ink);min-width:3.5ch}
.blank:focus{outline:0;border-bottom-color:var(--jade);background:var(--jade-soft)}
.blank.right{border-bottom-color:var(--ok);background:var(--ok-soft)}
.blank.wrong{border-bottom-color:var(--bad);background:var(--bad-soft)}
.solw{font-family:var(--sans);font-size:13px;color:var(--ok);font-weight:700;margin:0 4px}
.bank{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;background:var(--paper);border-radius:12px;margin-bottom:10px}
.bank span{font-size:13px;color:var(--muted);width:100%}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;cursor:pointer;font-family:var(--serif);font-size:15.5px}
.chip:hover{border-color:var(--jade)}
.chip.used{opacity:.45}
.mt{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:8px 14px;align-items:center}
.mt .ml{font-family:var(--serif);font-size:16.5px}
.mt select{width:100%;font:inherit;font-size:15px;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.mt select.right{border-color:var(--ok);background:var(--ok-soft)}
.mt select.wrong{border-color:var(--bad);background:var(--bad-soft)}
.mt .solm{grid-column:2;font-size:13.5px;color:var(--ok);margin-top:-4px}
.ord-ans{min-height:48px;border:1.5px dashed var(--line);border-radius:12px;padding:7px;display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.ord-ans.right{border-color:var(--ok);background:var(--ok-soft)}
.ord-ans.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ord-bank{display:flex;flex-wrap:wrap;gap:6px}
.ord-bank .chip[hidden]{display:none}
.why{font-size:13.5px;color:var(--muted)}
.open-a{display:none;margin-top:6px;padding:8px 12px;border-radius:10px;background:var(--ok-soft);font-family:var(--serif);font-size:16.5px}
.open-a.show{display:block}
textarea{width:100%;font:inherit;font-family:var(--serif);font-size:16px;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--paper);color:var(--ink);resize:vertical}
.ex-f{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.score{margin-left:auto;display:flex;align-items:center;gap:10px;font-weight:700;font-variant-numeric:tabular-nums}
.score .bar{width:110px}
.score.good{color:var(--ok)}
.best{font-size:12.5px;color:var(--muted);font-weight:500}

/* vocab + flashcards */
.vt{width:100%;border-collapse:collapse;font-size:15.5px}
.vt td,.vt th{padding:7px 8px;border-top:1px solid var(--line);text-align:left;vertical-align:middle}
.vt th{font-size:12.5px;color:var(--muted);font-weight:600}
.vt td.w{font-family:var(--serif);font-size:17.5px}
.vgroup{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 16px 6px;margin-bottom:14px;overflow-x:auto}
.vgroup h3{margin:6px 0 6px;font-size:15px;color:var(--jade)}
.deck-pick{display:grid;gap:10px}
.deck-pick .row{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.deck-pick .row b{font-family:var(--serif);font-size:18px;font-weight:600}
.deck-pick .row .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.fc-wrap{max-width:560px;margin:0 auto}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.fc{perspective:1200px;cursor:pointer;user-select:none;-webkit-user-select:none}
.fc-in{position:relative;height:300px;transition:transform .45s;transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.face.back{transform:rotateY(180deg);background:var(--jade);color:var(--jade-ink);border-color:var(--jade)}
.face .big{font-family:var(--serif);font-size:clamp(30px,7vw,46px);line-height:1.15;font-weight:500}
.face .tr2{font-size:clamp(20px,4.5vw,28px);font-weight:600;line-height:1.25}
.face .tr3{font-size:17px;opacity:.85;margin-top:8px}
.face .lab{position:absolute;top:14px;left:18px;font-size:12px;opacity:.7}
.face .say{position:absolute;bottom:16px;right:16px}
.fc-ctl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.fc-ctl .btn{justify-content:center;padding:12px}
.fc-ctl .again{border-color:var(--bad);color:var(--bad)}
.fc-ctl .know{border-color:var(--ok);color:var(--ok)}
.fc-done{text-align:center;padding:40px 10px}
.fc-done b{font-size:40px;display:block;font-family:var(--serif)}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:40px;padding-top:18px;border-top:1px solid var(--line)}
.pager a{text-decoration:none;max-width:48%}
.pager small{display:block;color:var(--muted);font-size:12.5px}
.pager span{font-family:var(--serif);font-size:18px}
.alpha{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.alpha button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 8px;cursor:pointer;text-align:center}
.alpha button:hover{border-color:var(--lotus)}
.alpha .L{display:block;font-size:28px;font-weight:800;color:var(--jade);line-height:1}
.alpha .W{display:block;font-family:var(--serif);font-size:17px;margin-top:4px}
.alpha .G{display:block;font-size:12px;color:var(--muted)}
.combo{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.combo button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 10px;cursor:pointer;font-family:var(--serif);font-size:18px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:14px;max-width:92vw;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
footer.foot{margin-top:56px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:min(320px,86vw);z-index:40;transform:translateX(-102%);transition:transform .25s;height:100%;padding-top:calc(22px + env(safe-area-inset-top,0px))}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
  .topbar{display:flex;position:sticky;top:0;z-index:30;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;background:var(--surface);border-bottom:1px solid var(--line);margin-top:calc(-1 * env(safe-area-inset-top,0px))}
  .topbar b{font-weight:800}
  .tabs{top:calc(52px + env(safe-area-inset-top,0px))}
  main{padding-top:20px}
  .contents li a{grid-template-columns:52px 1fr;}
  .contents .cp{grid-column:2;text-align:left}
  .contents .cn{font-size:28px}
  .obj .in{grid-template-columns:1fr}
  .mt{grid-template-columns:1fr}
  .mt .solm{grid-column:1}
  .score .bar{width:70px}
}
@media (max-width:600px){
  .ex-h{flex-direction:column;gap:6px}
  .vt.show-en .c-it,.vt.show-it .c-en{display:none}
  .vt td.w{font-size:17px}
  .hero h1{font-size:36px}
  .opt{padding:9px 13px}
  .items>li{grid-template-columns:22px 1fr}
  .tw .card-t td:first-child{width:auto}
  .fc-in{height:260px}
  .score{margin-left:0;width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

iới tính", "Gender", "Genere"], ["Quốc tịch", "Nationality", "Nazionalità"], ["Quê quán", "Hometown", "Città natale"], ["Nơi thường trú", "Permanent address", "Indirizzo permanente"], ["Hộ chiếu", "Passport", "Passaporto"], ["Nơi cấp", "Place of issuance", "Luogo di rilascio"], ["Ngày cấp", "Date of issue", "Data di emissione"], ["Ngày hết hạn", "Expiration date", "Data di scadenza"], ["Loại", "Type", "Tipo"]]], ["Động từ · Verbs", [["Là", "To be", "Essere"], ["Không phải là", "To be not", "Non essere"], ["Sống", "To live", "Vivere"], ["Sinh", "To be born", "Essere nato / a"]]], ["Tính từ · Adjectives", [["Trẻ", "Young", "Giovane"], ["Già", "Old", "Anziano / a"]]]], "practice": [{"t": "mcq", "title": "Bài 1. Nghe và chọn đáp án đúng", "listen": 1, "items": [{"say": "chào", "o": ["cháo", "chào"], "a": 1}, {"say": "nước", "o": ["nược", "nước"], "a": 1}, {"say": "tên", "o": ["tên", "tền"], "a": 0}, {"say": "người", "o": ["người", "ngươi"], "a": 0}, {"say": "tuổi", "o": ["tuội", "tuổi"], "a": 1}]}, {"t": "mcq", "title": "Bài 2. Chọn từ đúng", "items": [{"q": "name", "o": ["tên", "tền"], "a": 0}, {"q": "to be", "o": ["la", "là"], "a": 1}, {"q": "country", "o": ["nước", "nược"], "a": 0}, {"q": "age", "o": ["tuội", "tuổi"], "a": 1}, {"q": "I", "o": ["tối", "tôi"], "a": 1}, {"q": "you", "o": ["bàn", "bạn"], "a": 1}]}, {"t": "mcq", "title": "Bài 3. Chọn câu đúng", "items": [{"o": ["Chị tên là gì?", "Chị là gì tên?"], "a": 0}, {"o": ["Anh là người nước nào?", "Anh là nước người nào?"], "a": 0}, {"o": ["Em tuổi bao nhiêu?", "Em bao nhiêu tuổi?"], "a": 1}, {"o": ["Bác ấy là tên Peter.", "Bác ấy tên là Peter."], "a": 1}, {"o": ["Tôi Pháp.", "Tôi là người Pháp."], "a": 1}]}, {"t": "mcq", "title": "Bài 4. Chọn câu hỏi / câu trả lời phù hợp", "items": [{"q": "……? – Tôi tên là Lan.", "o": ["Chị tên là gì?", "Chị là gì tên?"], "a": 0}, {"q": "……? – Anh ấy là người Pháp.", "o": ["Anh là người nước nào?", "Anh ấy là người nước nào?"], "a": 1}, {"q": "……? – Em 12 tuổi.", "o": ["Em tuổi ạp.", "Em ơi, trường đại học Ngoại ngữ *ở đâu*?", "Từ nhà của chị Minh đến hồ Hoàn Kiếm *mất bao lâu*? – Khoảng 40 phút.", "Em Kiên thường đi học *bằng* xe buýt.", "Hiệu sách cách đây *bao xa*? – Khoảng 500m."]}]}, "vocab": [["Danh từ · Nouns", [["Hướng đi", "Direction", "Direzione"], ["Người đi bộ", "Pedestrian", "Pedone"], ["Xe thô sơ", "Primitive (non-motorised) vehicle", "Veicoli senza motore"], ["Tốc độ", "Speed", "Velocità"], ["Tuyến đường", "Route", "Percorso"], ["Cầu vượt", "Overpass", "Cavalcavia"], ["Đoạn đường", "Road segment", "Tratto di strada"], ["Làn đường", "Lane", "Corsia"], ["Vạch kẻ đường", "Lane markings", "Strisce di corsia"], ["Dân cư", "Population", "Popolazione"]]], ["Động từ · Verbs", [["Dành riêng", "To be reserved for", "Essere riservato per"], ["Hạn chế", "To restrict", "Limitare"], ["Cấm", "To prohibit", "Vietare"], ["Đỗ xe", "To park", "Parcheggiare"], ["Kết thúc", "To end", "Terminare"], ["Cắt qua", "To cross through", "Attraversare"], ["Dừng lại", "To stop", "Fermarsi"]]], ["Tính từ · Adjectives", [["Tối thiểu", "Minimum", "Minimo"], ["Tối đa", "Maximum", "Massimo"], ["Đông (dân cư)", "Dense (population)", "Denso (popolazione)"]]]], "practice": [{"t": "mcq", "title": "Bài 1. Nghe và chọn đáp án đúng", "listen": 1, "items": [{"say": "xe đạp", "o": ["xe đạp", "đạp xe"], "a": 0}, {"say": "ô tô", "o": ["ô to", "ô tô"], "a": 1}, {"say": "xích lô", "o": ["xịch lô", "xích lô"], "a": 1}, {"say": "máy bay", "o": ["máy bay", "máy bai"], "a": 0}, {"say": "tàu thủy", "o": ["tàu thủy", "tàu thùy"], "a": 0}]}, {"t": "mcq", "title": "Bài 2. Nhìn hình và chọn đáp án đúng", "items": [{"pic": "🚆", "o": ["tàu hỏa", "tàu thủy"], "a": 0}, {"pic": "🚇", "o": ["tàu thủy", "tàu điện ngầm"], "a": 1}, {"pic": "🚌", "o": ["xe buýt", "xe taxi"], "a": 0}, {"pic": "🚲", "o": ["xe đạp", "xe máy"], "a": 0}, {"pic": "✈️", "o": ["máy bay", "tàu hỏa"], "a": 0}]}, {"t": "mcq", "title": "Bài 3. Chọn đáp án đúng nhất", "items": [{"q": "Cho tôi hỏi siêu thị ở ……?", "o": ["đâu", "đầu"], "a": 0}, {"q": "Nhà anh …… trường bao xa?", "o": ["cách", "cạnh"], "a": 0}, {"q": "Anh đi học …… gì?", "o": ["cái", "bằng"], "a": 1}, {"q": "Anh đi đến công ty …… bao lâu?", "o": ["mất", "xa"], "a": 0}, {"q": "Siêu thị cách nhà anh bao ……?", "o": ["giờ", "xa"], "a": 1}]}, {"t": "tf", "title": "Bài 4. Đúng hay sai?", "items": [["Anh ơi, từ đây đến siêu thị đi thế nào?", true], ["Nhà anh cách trường xa bao?", false], ["Hàng ngày anh đi làm gì bằng?", false], ["Tôi đi đến trường mất 15 phút.", true], ["Bác ơi, nhà hàng ABC ở đâu ạ?", true]]}, {"t": "mcq", "title": "Bài 5. Chọn đáp án đúng", "items": [{"q": "Nhà anh cách công ty bao xa? – Nhà tôi cách công ty ……", "o": ["3 km", "10 phút"], "a": 0}, {"q": "Từ nhà chị đến siêu thị mất bao lâu? – Mất khoảng ……", "o": ["5 phút", "500m"], "a": 0}, {"q": "Bác ơi, trường Hà Nội ở đâu ạ? – À, ……", "o": ["ở đằng kia", "vào mùa thu"], "a": 0}, {"q": "Hàng ngày, em đi học bằng gì? – Bằng ……", "o": ["xe đạp", "máy bay"], "a": 0}, {"q": "Siêu thị có xa nhà chị không? – Không, ……", "o": ["rất rẻ", "rất gần"], "a": 1}]}], "page": 95, "tracks": [["Nghe 1", "Book1_Lesson6_Listening1_NorthSouth.mp3", "Bắc & Nam"], ["Nghe 2", "Book1_Lesson6_Listening2_North.mp3", "Bắc"]]}, {"id": 7, "vi": "Ăn uống", "en": "Eating and drinking", "it": "Cibo e bevande", "grammar": {"points": [{"h": "1. A + adjective + bằng + B — as … as", "b": "<p>Compares two equivalent things.</p><p class='ex'>Anh ấy cao bằng tôi.<br><span>He is as tall as I am.</span></p><p class='ex'>Bạn nên ăn lượng rau củ bằng lượng lương thực.<br><span>You should eat as many vegetables as grains.</span></p>"}, {"h": "2. A + adjective + hơn + B — more … than", "b": "<p class='ex'>Anh ấy ăn nhiều hơn tôi.<br><span>He eats more than I do.</span></p><p class='ex'>Bạn nên ăn rau nhiều hơn ăn thịt.<br><span>You should eat more vegetables than meat.</span></p>"}, {"h": "3. A + adjective + nhất — the most", "b": "<p class='ex'>Trong nhà tôi, em tôi uống nhiều sữa nhất.<br><span>In my family, my younger sibling drinks the most milk.</span></p><p class='ex'>Trong lớp tôi, Linh gầy nhất.<br><span>In my class, Linh is the skinniest.</span></p>"}, {"h": "4. Giống / khác — giống nhau / khác nhau", "b": "<ul><li><b>A giống / khác B</b> — A is similar to / different from B</li><li><b>A và B giống nhau / khác nhau</b> — A and B are alike / different</li></ul><p class='ex'>Em ấy giống mẹ của em ấy. = Em ấy và mẹ của em ấy giống nhau.<br><span>She looks like her mother. = She and her mother are alike.</span></p><p class='ex'>Món ăn của Việt Nam khác món ăn của Ý. = Món ăn của Việt Nam và món ăn của Ý khác nhau.<br><span>Vietnamese food is different from Italian food.</span></p>"}], "ex": [{"t": "open", "title": "Bài 2. Viết lại câu dùng cấu trúc so sánh", "items": [["Quyển sách này đắt. Quyển sách kia cũng đắt.", "Quyển sách này đắt bằng quyển sách kia. (Quyển sách này giống quyển sách kia.)"], ["Anh Minh cao 1m75. Em trai của anh ấy cao 1m75.", "Anh Minh cao bằng em trai của anh ấy."], ["Cái đồng hồ của tôi 3 triệu. Cái đồng hồ của anh ấy 10 triệu.", "Cái đồng hồ của tôi rẻ hơn cái đồng hồ của anh ấy. / Cái đồng hồ của anh ấy đắt hơn cái đồng hồ của tôi."], ["Chị An 40 tuổi. Chị Hà 35 tuổi. Chị Minh 30 tuổi.", "Chị An già nhất. / Chị Minh trẻ nhất."], ["Em ấy học tiếng Việt rất chăm. Anh trai của em ấy học tiếng Việt không chăm.", "Em ấy và anh trai của em ấy khác nhau. = Em ấy khác anh trai của em ấy."], ["Ngôi nhà này có 5 tầng. Ngôi nhà kia có 10 tầng.", "Ngôi nhà này thấp hơn ngôi nhà kia. / Ngôi nhà kia cao hơn ngôi nhà này."], ["Chúng tôi thích ăn thịt gà. Họ cũng thích ăn thịt gà.", "Chúng tôi giống họ. = Chúng tôi và họ giống nhau."]]}]}, "vocab": [["Danh từ · Nouns", [["Muỗng", "Spoon", "Cucchiaio"], ["Cà phê", "Coffee", "Caffè"], ["Muối", "Salt", "Sale"], ["Dầu mỡ", "Fat / oil", "Grassi / olio"], ["Hải sản", "Seafood", "Frutti di mare"], ["Thịt", "Meat", "Carne"], ["Trứng", "Eggs", "Uova"], ["Đậu phụ / Đậu hũ", "Tofu", "Tofu"], ["Trái cây",  Chọn đáp án đúng", "items": [{"q": "Quyển sách này …… quyển sách kia.", "o": ["giống", "giống nhau"], "a": 0}, {"q": "Cái xe đạp này đắt …… cái xe đạp kia.", "o": ["khác", "bằng"], "a": 1}, {"q": "Em ấy và mẹ em ấy ……", "o": ["giống nhau", "giống"], "a": 0}, {"q": "Hà Nội và Sài Gòn ……", "o": ["khác", "khác nhau"], "a": 1}, {"q": "Ở đây, chị ấy cao ……", "o": ["nhất", "hơn"], "a": 0}]}], "page": 123, "tracks": [["Nghe 1", "Book1_Lesson7_Listening1_North.mp3", "Bắc"], ["Nghe 2", "Book1_Lesson7_Listening2_South.mp3", "Nam"]]}, {"id": 8, "vi": "Thuê nhà", "en": "Renting a house", "it": "Affittare una casa", "grammar": {"points": [{"h": "1. Location words — trong, ngoài, trên, dưới, trước, sau, đối diện, xung quanh", "b": "<table class='g'><tr><td><b>trong</b> in</td><td><b>ngoài</b> outside</td><td><b>trên</b> on</td><td><b>dưới</b> under</td></tr><tr><td><b>trước</b> in front of</td><td><b>sau</b> behind</td><td><b>đối diện</b> opposite</td><td><b>xung quanh</b> around</td></tr></table><p class='ex'>Căn hộ ở đối diện phòng cảnh sát giao thông tỉnh Bắc Giang.<br><span>The apartment is opposite the provincial traffic police office.</span></p><p class='ex'>Cái túi của cô ấy ở trên bàn của tôi.<br><span>Her bag is on my table.</span></p>"}, {"h": "2. cho + verb — to provide something for someone", "b": "<p class='ex'>Cho thuê nhà<br><span>Houses for rent (to rent out houses).</span></p><p class='ex'>Dịch vụ cho vay tiền<br><span>Money-lending service.</span></p>"}, {"h": "3. Đã … chưa? — Have you … yet?", "b": "<p>Asks whether an action has been completed. Answer <b>Rồi</b> (yes, already) or <b>Chưa</b> (not yet).</p><p class='ex'>Bạn đã ăn phở chưa? – Chưa. Tôi chưa ăn.<br><span>Have you eaten phở yet? – No, not yet.</span></p><p class='ex'>Chị đã đi Huế chưa? – Rồi. Tôi đi rồi.<br><span>Have you been to Hue? – Yes, I have.</span></p>"}, {"h": "4. Có … nào không? — Is there any …?", "b": "<p>Asks about the existence of an object or person in a certain space.</p><p class=  <b>hiếm khi</b> rarely</p><p class='ex'>Em ấy luôn đi học lúc 7 giờ sáng.<br><span>She always goes to school at 7 a.m.</span></p><p class='ex'>Bà ấy thường tập thể dục vào buổi sáng.<br><span>She usually exercises in the morning.</span></p><p class='ex'>Thỉnh thoảng, chúng tôi đi uống cà phê với nhau.<br><span>Sometimes we go for coffee together.</span></p><p class='ex'>Anh ấy hiếm khi về nhà lúc 8 giờ tối.<br><span>He rarely comes home at 8 p.m.</span></p>"}, {"h": "2. Bị làm sao? — What’s wrong?", "b": "<p>Asks about someone’s health condition.</p><p class='ex'>Anh bị làm sao? – Tôi bị đau đầu.<br><span>What’s wrong? – I have a headache.</span></p><p class='ex'>Bà bị làm sao? – Tôi bị đau lưng.<br><span>What’s wrong? – I have a backache.</span></p>"}, {"h": "3. Hay / hoặc — or", "b": "<ul><li><b>hay</b> — in questions</li><li><b>hoặc</b> — in statements</li></ul><p class='ex'>Bác thích uống trà hay uống cà phê?<br><span>Do you prefer tea or coffee?</span></p><p class='ex'>Ngày mai hoặc ngày kia cô ấy sẽ đi Đà Nẵng.<br><span>She will go to Da Nang tomorrow or the day after.</span></p>"}, {"h": "4. Bị / được", "b": "<ul><li><b>bị</b> — something unfortunate happens to someone</li><li><b>được</b> — something fortunate happens to someone</li></ul><p class='ex'>Tôi bị ốm. · Chị ấy bị mất điện thoại.<br><span>I got sick. · She lost her phone.</span></p><p class='ex'>Anh ấy được mời đi ăn tối. · Học sinh được thầy giáo khen.<br><span>He was invited to dinner. · The student was praised by the teacher.</span></p>"}], "ex": [{"t": "fill", "title": "Bài 2. Điền từ ngữ thích hợp", "items": ["Hàng ngày, ông ấy *luôn/thường xuyên/thường/hay* ăn phở vào buổi sáng.", "Linh ơi, em uống nước cam *hay* nước chanh?", "Cô ơi, chúng em không biết nên mua quyển sách này *hoặc/hay* quyển sách kia.", "Anh ấy *ít khi/hiếm khi* đi xem phim, có lẽ 3 tháng 1 lần.", "Hôm nay tôi *được* điểm cao nên tôi rất vui.", "Cô ấy *bị* đau mắt 2 ngày rồi.", "Các bạn ấy *thường/hay* đến nhà cô giáo 2 lần     body=`<ol class="items">${e.items.map((it,i)=>`<li data-i="${i}"><div><div class="qtext">${esc(it[0])}</div><textarea rows="1" placeholder="Viết câu trả lời của bạn… · Write your answer…"></textarea><button class="btn sm ghost reveal" style="margin-top:6px">Xem đáp án · Show answer</button><div class="open-a">${esc(it[1])}</div></div></li>`).join("")}</ol>`;
  }
  const best=S.get("s:"+key,null);
  const foot=e.t==="open"?`<div class="ex-f"><button class="btn sm" data-act="revealall">Xem tất cả đáp án · Show all</button></div>`:
   `<div class="ex-f"><button class="btn sm primary" data-act="check">Kiểm tra · Check</button><button class="btn sm" data-act="retry">Làm lại · Retry</button><button class="btn sm ghost" data-act="solve">Xem đáp án · Show solution</button><div class="score" aria-live="polite">${best?`<span class="best">Lần tốt nhất · best ${best[0]}/${best[1]}</span>`:""}</div></div>`;
  return `<article class="ex" data-key="${key}" data-t="${e.t}"><div class="ex-h"><h3>${esc(e.title)}</h3><span class="kind">${KIND[e.t]}</span></div>${body}${foot}</article>`;
}
function exList(arr,prefix){if(!arr||!arr.length)return"";return `<div class="exs">${arr.map((e,i)=>exHTML(e,prefix+":"+i)).join("")}</div>`}

function findEx(key){const [id,sec,i]=key.split(":");let l=byId(id)||revById(id);if(!l)return null;
  const m={r:l.reading&&l.reading.ex,g:l.grammar&&l.grammar.ex,l:l.listening&&l.listening.ex,p:l.practice,x:l.ex}[sec];return m&&m[+i]}

function check(card,solve){
  const key=card.dataset.key,e=findEx(key),t=e.t;let ok=0,tot=0;
  if(t==="mcq"||t==="odd"||t==="tf"){
    card.querySelectorAll(".items>li").forEach(li=>{
      const i=+li.dataset.i,it=e.items[i];const ans=t==="tf"?[it[1]?1:0]:[].concat(it.a);tot++;
      const sel=li.querySelector('.opt[aria-checked="true"]');
      li.querySelectorAll(".opt").forEach(b=>b.classList.remove("right","wrong","sol"));
      if(solve){li.querySelectorAll(".opt").forEach(b=>{if(ans.includes(+b.dataset.j))b.classList.add("sol")})}
      else if(sel){if(ans.includes(+sel.dataset.j)){sel.classList.add("right");ok++}else sel.classList.add("wrong")}
      const fb=li.querySelector(".fb");if(fb){const txt=(it.why?"Nhóm: "+it.why:"")+(it.note?(it.why?" · ":"")+it.note:"");if(txt&&(solve||sel)){fb.textContent=txt;fb.hidden=false}}
    });
  } else if(t==="fill"){
    card.querySelectorAll(".blank").forEach(inp=>{tot++;const alts=inp.dataset.a.split("/").map(norm);inp.classList.remove("right","wrong");
      const nx=inp.nextElementSibling;if(nx&&nx.classList.contains("solw"))nx.remove();
      if(solve){inp.value=inp.dataset.a.split("/")[0];inp.classList.add("right");return}
      if(!inp.value.trim())return;if(alts.includes(norm(inp.value))){inp.classList.add("right");ok++}else{inp.classList.add("wrong")}});
  } else if(t==="match"){
    card.querySelectorAll("select").forEach(sel=>{const i=+sel.dataset.i;tot++;sel.classList.remove("right","wrong");const sm=sel.nextElementSibling;sm.hidden=true;
      if(solve){sel.value=e.pairs[i][1];sel.classList.add("right");return}
      if(!sel.value)return;if(sel.value===e.pairs[i][1]){sel.classList.add("right");ok++}else{sel.classList.add("wrong")}});
  } else if(t==="order"){
    card.querySelectorAll(".items>li").forEach(li=>{const i=+li.dataset.i,it=e.items[i];tot++;const box=li.querySelector(".ord-ans");box.classList.remove("right","wrong");const fb=li.querySelector(".fb");
      if(solve){fb.textContent="Đáp án · Answer: "+it.a;fb.hidden=false;return}
      const words=[...box.querySelectorAll(".chip")].map(c=>c.textContent);if(!words.length)return;
      const s=words.join(" ");if(norm(s)===norm(it.a)){box.classList.add("right");ok++}else box.classList.add("wrong")});
  }
  const sc=card.querySelector(".score");
  if(solve){sc.innerHTML=`<span class="best">Đã hiện đáp án · Solution shown</span>`;track(key,"","","Xem đáp án · Showed solution");return}
  const p=tot?Math.round(ok/tot*100):0;
  sc.className="score"+(ok===tot?" good":"");
  sc.innerHTML=`<span>${ok}/${tot}</span><span class="bar" style="--p:${p}"><i></i></span>`;
  const prev=S.get("s:"+key,null);if(!prev||ok>=prev[0]){S.set("s:"+key,[ok,tot])}
  track(key,ok,tot,"Kiểm tra · Checked");
  refreshProgress();
}
function retry(card){
  const key=card.dataset.key,e=findEx(key);
  const fresh=document.createElement("div");fresh.innerHTML=exHTML(e,key);card.replaceWith(fresh.firstElementChild);
}

/* ---------- global click handling ---------- */
let lastBlank=null;
document.addEventListener("focusin",ev=>{if(ev.target.classList&&ev.target.classList.contains("blank"))lastBlank=ev.target});
document.addEventListener("click",ev=>{
  const t=ev.target.closest("button,a");if(!t)return;
  if(t.dataset.say!==undefined&&t.matches("[data-say]")){ev.stopPropagation();speak(t.dataset.say);return}
  const card=t.closest(".ex");
  if(t.classList.contains("opt")&&card){const grp=t.closest(".opts");grp.querySelectorAll(".opt").forEach(b=>{b.setAttribute("aria-checked","false");b.classList.remove("right","wrong","sol")});t.setAttribute("aria-checked","true");return}
  if(t.classList.contains("chip")&&card&&t.dataset.w!==undefined){
    let target=lastBlank&&card.contains(lastBlank)?lastBlank:[...card.querySelectorAll(".blank")].find(b=>!b.value.trim());
    if(target){const w=t.dataset.w;target.value=isStart(target)?w.charAt(0).toUpperCase()+w.slice(1):w.toLowerCase();target.classList.remove("right","wrong");card.querySelectorAll(".bank .chip").forEach(c=>c.classList.toggle("used",[...card.querySelectorAll(".blank")].some(b=>norm(b.value)===norm(c.dataset.w))));const all=[...card.querySelectorAll(".blank")];const nx=all.slice(all.indexOf(target)+1).find(b=>!b.value);if(nx)nx.focus();else target.focus()}
    return}
  if(t.classList.contains("chip")&&card&&t.dataset.k!==undefined){
    const li=t.closest("li");const box=li.querySelector(".ord-ans"),bank=li.querySelector(".ord-bank");box.classList.remove("right","wrong");
    if(t.parentElement===bank){const c=t.cloneNode(true);c.dataset.from=t.dataset.k;box.appendChild(c);t.hidden=true}
    else{const orig=bank.querySelector(`.chip[data-k="${t.dataset.from}"]`);if(orig)orig.hidden=false;t.remove()}
    return}
  if(t.classList.contains("reveal")){t.nextElementSibling.classList.toggle("show");return}
  if(t.dataset.act&&card){
    if(t.dataset.act==="check")check(card,false);
    else if(t.dataset.act==="solve")check(card,true);
    else if(t.dataset.act==="retry")retry(card);
    else if(t.dataset.act==="revealall")card.querySelectorAll(".open-a").forEach(a=>a.classList.add("show"));
    return}
  if(t.dataset.voice){voiceMode=t.dataset.voice;S.set("voice",voiceMode);$("#side").innerHTML=sideHTML(curView);speak("Xin chào");return}
  if(t.dataset.lang){lang=t.dataset.lang;S.set("lang",lang);render();return}
  if(t.dataset.theme!==undefined){const cur=document.documentElement.dataset.theme;const dark=cur?cur==="dark":matchMedia("(prefers-color-scheme: dark)").matches;document.documentElement.dataset.theme=dark?"light":"dark";S.set("theme",document.documentElement.dataset.theme);return}
  if(t.id==="menuBtn"){$("#side").classList.toggle("open");return}
});
function isStart(inp){const prev=inp.previousSibling;return !prev||!prev.textContent.trim()||/[.?!→–-]\s*$/.test(prev.textContent)}
document.addEventListener("click",ev=>{const s=$("#side");if(s.classList.contains("open")&&!s.contains(ev.target)&&!ev.target.closest("#menuBtn"))s.classList.remove("open")},true);

    <h2 style="margin-top:34px">Ghi chú phương ngữ · Dialectal note</h2><p class="hint">Cùng một nghĩa, người miền Bắc và miền Nam có thể dùng từ khác nhau. · Same meaning, different words in the North and the South.</p>
    <div class="vgroup"><table class="vt"><tr><th>Miền Bắc · North</th><th>Miền Nam · South</th><th>English</th><th>Italiano</th></tr>${l.dialect.map(d=>`<tr><td class="w">${esc(d[0])}</td><td class="w">${esc(d[1])}</td><td>${esc(d[2])}</td><td>${esc(d[3])}</td></tr>`).join("")}</table></div>`}
  if(tab==="luyen-tap"){return `<h2>Bài tập bổ trợ · Extra practice</h2><p class="hint">Các nút loa đọc bằng giọng đã chọn ở mục Giọng đọc (Máy hoặc Google). Câu có hình được minh họa bằng biểu tượng. · Speaker buttons use the voice chosen under “Giọng đọc”; pictures are shown as icons.</p>${exList(l.practice,id+":p")}`}
  if(tab==="phat-am"){return `<h2>Giới thiệu · About Vietnamese</h2><div class="gp" style="padding-top:12px">${l.about}</div>
    <h3>Bảng chữ cái · The alphabet (29 letters)</h3><p class="hint">Bấm vào chữ để nghe từ ví dụ. · Tap a letter to hear the example word.</p><div class="alpha">${l.alphabet.map(a=>`<button data-say="${esc(a[1])}"><span class="L">${a[0]}</span><span class="W">${esc(a[1])}</span><span class="G">${esc(a[2])}</span></button>`).join("")}</div>
    <h3>Sáu thanh điệu · The six tones</h3><div class="vgroup"><table class="vt"><tr><th></th><th>Tên thanh · Tone</th><th>Dấu</th><th>Mark</th><th>Description</th></tr>${l.tones.map(t=>`<tr><td>${sayBtn(t[4],true)}</td><td class="w">${esc(t[0])}</td><td class="w" style="font-size:22px">${esc(t[1])}</td><td>${esc(t[2])}</td><td>${esc(t[3])}</td></tr>`).join("")}</table></div>
    <h3>Luyện phát âm · Pronounce the combinations</h3><p class="hint">Đọc to từng âm tiết, bấm để so sánh. · Read each syllable aloud, then tap to compare.</p>${l.combos.map(c=>`<div class="combo">${c.split(" ").map(s=>`<button data-say="${esc(s.toLowerCase())}">${esc(s)}</button>`).join("")}</div>`).join("")}
    <h3>Chính tả · Spelling note</h3><div class="gp" style="padding-top:10px">${l.spelling}</div>`}
  return "";
}

function lesson(id,tab){
  const l=byId(id);if(!l)return home();
  const tabs=l.intro?TABS0:TABS;if(!tabs.some(t=>t[0]===tab))tab=tabs[0][0];
  S.set("last",{h:"#/bai/"+id+"/"+tab,t:(l.intro?"Bài 0":"Bài "+l.id)+" — "+l.vi});
  const i=ALL.indexOf(l),prev=ALL[i-1],next=ALL[i+1];
  return lessonHeader(l)+`<nav class="tabs" role="tablist">${tabs.map(t=>`<a role="tab" href="#/bai/${id}/${t[0]}" aria-selected="${t[0]===tab}">${t[1]}<small>${t[2]}</small></a>`).join("")}</nav><div class="panel" role="tabpanel">${panel(l,tab)}</div>
  <nav class="pager">${prev?`<a href="#/bai/${prev.id}"><small>Bài trước · Previous</small><span>${prev.id}. ${esc(prev.vi)}</span></a>`:"<span></span>"}${next?`<a href="#/bai/${next.id}" style="text-align:right"><small>Bài sau · Next</small><span>${next.id}. ${esc(next.vi)}</span></a>`:"<span></span>"}</nav>`;
}
function revision(id){
  const r=revById(id);if(!r)return home();
  S.set("last",{h:"#/on-tap/"+id,t:r.vi});
  return `<header class="lh"><div class="lnum">Ôn tập · Sách tr. ${r.page}</div><h1>${esc(r.vi)}</h1><p class="sub">${esc(r.en)} · ${esc(r.it)} — phần nghe · listening part</p></header>
  <div class="panel" style="margin-top:22px"><p class="note"><b>Sách</b><span>Phần đọc, viết và nói của bài ôn tập có trong sách (tr. ${r.page}). Ở đây bạn luyện phần nghe với file nghe của sách.</span></p>${tracksHTML(r.tracks)}<h3>Bài tập nghe · Listening exercises</h3>${exList(r.ex,r.id+":x")}<h3>Lời thoại · Transcripts</h3><p class="hint">Chỉ xem sau khi đã làm bài.</p>${transcripts(r.tr,r.tracks.map(t=>t[0]))}</div>`;
}

/* ---------- flashcards ---------- */
let deck=null;
function cardsPicker(){
  return `<header class="lh"><div class="lnum">Từ vựng</div><h1>Flashcard theo chủ đề</h1><p class="sub">Vocabulary flashcards by topic · Flashcard di vocabolario per argomento</p></header>
  <p class="hint" style="margin:18px 0">Chọn một chủ đề (cả bài) hoặc một nhóm từ. Lật thẻ, nghe phát âm, đánh dấu từ đã nhớ. · Pick a whole lesson or a word group.</p>
  <div class="deck-pick">${ALL.filter(l=>l.vocab).map(l=>{const n=l.vocab.reduce((a,g)=>a+g[1].length,0);const known=S.get("k:"+l.id+":a",[]).length;
   return `<div class="row"><b>${l.id}. ${esc(l.vi)}</b> <span class="hint">${esc(l.en)} · ${n} từ${known?` · đã nhớ ${known}`:""}</span><div class="chips"><a class="btn sm primary" href="#/the-tu/${l.id}">Cả bài · All</a>${l.vocab.map((g,gi)=>`<a class="btn sm" href="#/the-tu/${l.id}/${gi}">${esc(g[0])} (${g[1].length})</a>`).join("")}</div></div>`}).join("")}</div>`;
}
function startDeck(id,gi){
  const l=byId(id);if(!l||!l.vocab)return null;
  const words=gi==null?l.vocab.flatMap(g=>g[1]):(l.vocab[gi]||l.vocab[0])[1];
  const dkey=id+":"+(gi==null?"a":gi);
  const known=new Set(S.get("k:"+dkey,[]));
  let queue=words.filter(w=>!known.has(w[0]));
  return {l,gi,dkey,words,known,queue:shuffle(queue),flip:false,rev:S.get("fcrev",false),title:gi==null?"Cả bài":l.vocab[gi][0]};
}
function cardsView(id,gi){
  if(!deck||deck.l.id!==+id||String(deck.gi)!==String(gi==null?null:gi))deck=startDeck(+id,gi==null?null:+gi);
  if(!deck)return cardsPicker();
  S.set("last",{h:location.hash,t:"Flashcard — "+deck.l.vi});
  return `<header class="lh"><div class="lnum"><a href="#/the-tu">Flashcard</a> · Bài ${deck.l.id}</div><h1>${esc(deck.l.vi)}</h1><p class="sub">${esc(deck.title)} · ${esc(deck.l.en)}</p></header><div id="fc" class="fc-wrap" style="margin-top:22px"></div>`;
}
function drawCard(){
  const box=$("#fc");if(!box||!deck)return;
  const total=deck.words.length,kn=deck.known.size;
  const top=`<div class="fc-top"><span class="hint">Đã nhớ · Known <b>${kn}</b>/${total} · Còn lại · Left ${deck.queue.length}</span><span><button class="pill" id="fcDir" aria-pressed="${deck.rev}">${deck.rev?(lang==="it"?"IT":"EN")+" → VI":"VI → "+(lang==="it"?"IT":"EN")}</button> <button class="pill" id="fcShuf">Trộn · Shuffle</button> <button class="pill" id="fcReset">Bắt đầu lại · Reset</button></span></div><div class="bar" style="--p:${total?Math.round(kn/total*100):0};margin-bottom:16px"><i></i></div>`;
  if(!deck.queue.length){box.innerHTML=top+`<div class="fc-done"><b>Giỏi lắm!</b><p>Bạn đã nhớ hết ${total} từ trong nhóm này. · You know all the words in this set.</p><div class="cta-row" style="justify-content:center"><button class="btn primary" id="fcReset2">Học lại từ đầu · Start over</button><a class="btn" href="#/the-tu">Chọn chủ đề khác</a></div></div>`;return}
  const w=deck.queue[0];const tr=lang==="it"?w[2]:w[1],other=lang==="it"?w[1]:w[2];
  const front=deck.rev?`<span class="lab">${lang==="it"?"Italiano":"English"}</span><div class="tr2">${esc(tr)}</div><div class="tr3">${esc(other)}</div>`:`<span class="lab">Tiếng Việt</span><div class="big">${esc(w[0])}</div>${sayBtn(w[0])}`;
  const back=deck.rev?`<span class="lab">Tiếng Việt</span><div class="big">${esc(w[0])}</div>${sayBtn(w[0])}`:`<span class="lab">${lang==="it"?"Italiano":"English"}</span><div class="tr2">${esc(tr)}</div><div class="tr3">${esc(other)}</div>`;
  box.innerHTML=top+`<div class="fc${deck.flip?" flip":""}" id="fcCard" tabindex="0" role="button" aria-label="Lật thẻ · Flip card"><div class="fc-in"><div class="face front">${front}</div><div class="face back">${back}</div></div></div>
  <p class="hint" style="text-align:center;margin:10px 0 0">Bấm vào thẻ hoặc phím cách để lật · Tap or press Space to flip</p>
  <div class="fc-ctl"><button class="btn again" id="fcAgain">Chưa nhớ · Again</button><button class="btn know" id="fcKnow">Đã nhớ · Got it</button></div>`;
  if(!deck.rev&&!deck.flip&&S.get("autoSay",false))speak(w[0]);
}
document.addEventListener("click",ev=>{
  if(!deck)return;const t=ev.target;
  if(t.closest(".say"))return;
  if(t.closest("#fcCard")){deck.flip=!deck.flip;$("#fcCard").classList.toggle("flip",deck.flip);return}
  if(t.closest("#fcAgain")){const w=deck.queue.shift();const pos=Math.min(deck.queue.length,3+Math.floor(Math.random()*3));deck.queue.splice(pos,0,w);deck.flip=false;drawCard();return}
  if(t.closest("#fcKnow")){const w=deck.queue.shift();deck.known.add(w[0]);S.set("k:"+deck.dkey,[...deck.known]);deck.flip=false;drawCard();return}
  if(t.closest("#fcDir")){deck.rev=!deck.rev;S.set("fcrev",deck.rev);deck.flip=false;drawCard();return}
  if(t.closest("#fcShuf")){deck.queue=shuffle(deck.queue);deck.flip=false;drawCard();return}
  if(t.closest("#fcReset")||t.closest("#fcReset2")){deck.known.clear();S.set("k:"+deck.dkey,[]);deck.queue=shuffle(deck.words);deck.flip=false;drawCard();return}
});
document.addEventListener("keydown",ev=>{
  if(!$("#fcCard")||/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;
  if(ev.code==="Space"||ev.key==="Enter"&&document.activeElement.id==="fcCard"){ev.preventDefault();$("#fcCard").click()}
  else if(ev.key==="ArrowRight")$("#fcKnow").click(); else if(ev.key==="ArrowLeft")$("#fcAgain").click();
});
document.addEventListener("input",ev=>{const ta=ev.target;if(ta.dataset&&ta.dataset.draft){S.set("w:"+ta.dataset.draft,ta.value)}if(ta.classList.contains("blank"))ta.classList.remove("right","wrong")});
document.addEventListener("change",ev=>{if(ev.target.id==="voiceSel"){voiceName=ev.target.value;S.set("voiceName",voiceName);loadVoices();speak("Xin chào");return}if(ev.target.matches(".mt select"))ev.target.classList.remove("right","wrong")});

/* ---------- router ---------- */
function render(){
  const h=location.hash.replace(/^#\/?/,"").split("/").filter(Boolean);
  let html,cur="";
  if(h[0]==="bai"){html=lesson(h[1],h[2]);cur="L"+h[1];deck=null}
  else if(h[0]==="on-tap"){html=revision(h[1]);cur=h[1];deck=null}
  else if(h[0]==="the-tu"){html=h[1]!=null?cardsView(h[1],h[2]):cardsPicker();cur="cards";if(h[1]==null)deck=null}
  else {html=home();deck=null}
  $("#view").innerHTML=html+`<footer class="foot">Tài liệu luyện tập dùng kèm giáo trình <i>Vietnamese Vibes 1 – Beginner Level</i> (Phan Trang, Chu Phong Lan, Cafoscarina, 2024). File nghe: <a href="${AUDIO_PAGE}" target="_blank" rel="noopener">cafoscarina.it</a>.</footer>`;
  curView=cur;$("#side").innerHTML=sideHTML(cur);$("#side").classList.remove("open");
  if(deck)drawCard();
  const title=$("#view h1");document.title=(title&&cur?title.textContent+" — ":"")+"Vietnamese Vibes 1";
}
let lastPath="";
window.addEventListener("hashchange",()=>{const p=location.hash.split("/").slice(0,3).join("/");const sameLesson=p===lastPath;lastPath=p;render();if(!sameLesson)window.scrollTo(0,0);else{const tb=$(".tabs");if(tb&&tb.getBoundingClientRect().top<0)tb.scrollIntoView()}});
try{const th=S.get("theme",null);if(th)document.documentElement.dataset.theme=th}catch(e){}
lastPath=location.hash.split("/").slice(0,3).join("/");
render();
})();

</script>
</body>
</html>
