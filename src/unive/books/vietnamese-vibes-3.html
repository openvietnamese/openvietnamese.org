y designed rooms.</span></p>"}], "ex": [{"t": "open", "title": "Bài 2. Dùng các cấu trúc trên để viết lại câu", "items": [["Khi bạn tập thể dục đều đặn bao nhiêu thì cơ thể của bạn sẽ khỏe mạnh bấy nhiêu.", "Bạn càng tập thể dục đều đặn thì cơ thể bạn càng khỏe mạnh."], ["Trong phong tục Tết Việt Nam, mừng tuổi là biếu hoặc tặng người già, trẻ nhỏ những đồng tiền mới cho vào một phong bao.", "Trong phong tục Tết Việt Nam, mừng tuổi nghĩa là biếu hoặc tặng người già, trẻ nhỏ những đồng tiền mới cho vào một phong bao."], ["Ông ấy hãnh diện vì các con đều có sự nghiệp thành đạt, cuộc sống hạnh phúc.", "Ông ấy tự hào có các con đều có sự nghiệp thành đạt, cuộc sống hạnh phúc."], ["Anh ấy đã bắt đầu khởi nghiệp từ 23 năm trước, vào năm 1997.", "Anh ấy đã bắt đầu khởi nghiệp từ 23 năm trước, nghĩa là từ năm 1997."], ["Em ấy học tiếng Việt nhiều năm em ấy hiểu thêm nhiều điều về văn hóa, con người Việt Nam.", "Em ấy càng học tiếng Việt càng hiểu thêm về văn hóa, con người Việt Nam."], ["Chúng tôi rất kiêu hãnh về những thành tích mà sinh viên đã đạt được trong cuộc thi này.", "Chúng tôi tự hào có những sinh viên đạt thành tích trong cuộc thi này."], ["Bà ấy sống trong ngôi nhà này lâu bao nhiêu thì có nhiều tình cảm với nó bấy nhiêu.", "Bà ấy sống ở ngôi nhà này càng lâu thì càng có tình cảm với nó."]]}]}, "vocab": [["Danh từ · Nouns", [["Vốn", "Capital", "Capitale"], ["Thái độ", "Attitude", "Atteggiamento"], ["Kích thước", "Size", "Dimensione"], ["Phong cách", "Style", "Stile"], ["Mặt tiền", "Facade", "Facciata"], ["Máy móc thiết bị", "Machinery and equipment", "Macchinari e attrezzature"], ["Hạng mục", "Item", "Voce"], ["Bảng hiệu", "Signboard", "Insegna"], ["Bề mặt", "Surface", "Superficie"], ["Tranh dán tường", "Wallpaper", "Carta da parati"], ["Tông màu", "Colour tone", "Tonalità di colore"], ["Mẫu mã", "Design", "Design"], ["Tác dụng phụ", "Side effect", "Effetto collaterale"], ["Công suất", "Capacity", "Capacità"]]], ["Động từ · Verbs", [["Đầu tư", "To invest", "Investire"], ["Pha chế", "To mix (drinks)", "Preparare (bevande)"], ["Trang trí", "To decorate", "Decorare"], ["Trang bị", "To equip", "Attrezzare"]]], ["Tính từ · Adjectives", [["Thoáng đãng", "Spacious", "Spazioso"], ["Tối ưu", "Optimal", "Ottimale"], ["Trọn gói", "All-inclusive", "Tutto incluso"]]]], "practice": [{"t": "mcq", "title": "Bài 1. Nghe và chọn cụm từ đúng", "listen": 1, "items": [{"say": "cần nhiều vốn", "o": ["cần nhiều vốn", "gần nhiều vốn"], "a": 0}, {"say": "nhân viên pha chế", "o": ["nhân viên pha chệ", "nhân viên pha chế"], "a": 1}, {"say": "nguyên liệu tươi", "o": ["nguyền liêu tươi", "nguyên liệu tươi"], "a": 1}, {"say": "thái độ chuyên nghiệp", "o": ["thái độ chuyên nghiệp", "thai đồ chuyên nghiệt"], "a": 0}, {"say": "phong cách nhẹ nhàng", "o": ["phong cách nhẹ nhàng", "phong cát nhe nhàng"], "a": 0}, {"say": "mẫu mã đa dạng", "o": ["mấu má đa dạng", "mẫu mã đa dạng"], "a": 1}, {"say": "mặt tiền rộng rãi", "o": ["mặc tiềng rộng rái", "mặt tiền rộng rãi"], "a": 1}]}, {"t": "match", "title": "Bài 2. Nối từ ngữ với phần giải thích", "pairs": [["Vốn", "Số tiền ban đầu trong kinh doanh, sản xuất."], ["Đầu tư", "Dùng tiền, công sức, thời gian để tạo hiệu quả nào đó."], ["Trang trí", "Sắp xếp các vật có hình khối, màu sắc… khác nhau tạo sự hài hòa trong một không gian."], ["Quảng cáo", "Giới thiệu cái gì cho nhiều người biết."], ["Phong cách", "Cách làm việc, hoạt động tạo nên cái riêng cho người hoặc nhóm người."], ["Pha chế", "Tạo ra một loại đồ uống bằng cách pha trộn nguyên liệu theo công thức nhất định."], ["Nguyên liệu", "Những thứ được dùng để nấu món ăn hay làm một đồ uống."], ["Diện tích", "Kích thước hoặc bề mặt của một nơi."]]}, {"t": "fill", "title": "Bài 3. Điền từ vào đoạn văn", "items": ["Quán cà phê mới trên phố gây ấn tượng mạnh nhờ *mặt tiền* được thiết kế hiện đại và tinh tế. Khi vào bên trong, khách hàng có thể nhìn thấy nhiều *máy móc* pha chế ở ngay khu đặt đồ. Điều này giúp đồ uống được phục vụ nhanh. Bàn ghế của quán có *kích thước* vừa phải, tạo cảm giác thoải mái cho khách. Nhân viên luôn giữ *thái độ* thân thiện, khiến ai ghé quán cũng thấy dễ chịu. Tất cả ly tách tại quán đều có *mẫu mã* đồng bộ, tạo điểm nhấn riêng. Phía trước quán, *bảng hiệu* được thiết kế rõ ràng, dễ nhận ra từ xa. Sự kết hợp của những điều trên đã tạo nên *phong cách* riêng, làm quán nổi bật giữa dãy phố đông đúc."], "bank": ["mặt tiền", "máy móc", "kích thước", "thái độ", "mẫu mã", "bảng hiệu", "phong cách"]}, {"t": "tf", "title": "Bài 4. Đúng hay sai?", "items": [["Càng uống cà phê Việt Nam càng tôi thích.", false], ["Câu này có nghĩa là gia đình rất quan trọng với anh ấy.", true], ["Càng nói chuyện với chị ấy chúng tôi càng ngưỡng mộ chị ấy.", true], ["Họ tự hào có người con trai tài giỏi như anh ấy.", true], ["Anh ấy làm như vậy là nghĩa có tình cảm với chị đấy.", false], ["Khó càng em ấy lại càng cố gắng.", false], ["Các anh chị ấy có tự hào một tác phẩm xuất sắc về Mẹ.", false]]}, {"t": "order", "title": "Bài 5. Sắp xếp các từ thành câu đúng", "items": [{"w": ["này", "quán cà phê", "nhỏ", "nhưng", "có", "diện tích", "ánh sáng", "nhiều", "."], "a": "Quán cà phê này diện tích nhỏ nhưng có nhiều ánh sáng."}, {"w": ["nên", "tranh dán tường", "chị", "chọn", "trẻ trung", "mới", "cho", "của", "quán ăn", "mình", "."], "a": "Chị nên chọn tranh dán tường trẻ trung cho quán ăn mới của mình."}, {"w": ["nhân viên pha chế", "xuất sắc", "ở đây", "nên", "lắm", "thích", "tôi", "quán này", "."], "a": "Nhân viên pha chế ở đây xuất sắc lắm nên tôi thích quán này."}, {"w": ["gia đình tôi", "cuối tuần", "thích", "vào", "đến", "không gian", "một", "thoáng đãng", ",", "."], "a": "Vào cuối tuần, gia đình tôi thích đến một không gian thoáng đãng."}, {"w": ["của", "trang trí", "quán cà phê", "phong cách", "này", "hiện đại", "vừa", "vừa", "truyền thống", "."], "a": "Phong cách trang trí của quán cà phê này vừa hiện đại vừa truyền thống."}, {"w": ["sơn", "thích", "nhẹ nhàng", "tôi", "tông màu", "phòng khách", "của mình", "cho", "."], "a": "Tôi thích sơn tông màu nhẹ nhàng cho phòng khách của mình."}, {"w": ["anh ấy", "vì", "mở được", "tự hào", "khi", "quán cà phê", "trẻ", "còn", "."], "a": "Anh ấy tự hào vì mở được quán cà phê khi còn trẻ."}]}]}, {"id": 3, "vi": "Giao thông", "en": "Transportation", "it": "Trasporti", "page": 51, "tracks": [["Nghe 1", "Book3_Lesson3_Listening1_NorthSouth.mp3", "Bắc & Nam"], ["Nghe 2", "Book3_Lesson3_Listening2_South.mp3", "Nam"]], "grammar": {"points": [{"h": "1. Không chỉ A mà còn B — not only A but also B", "b": "<p>Shows the progression of an activity or a state.</p><p class='ex'>Tình trạng tắc đường tại đây không chỉ diễn ra trong khu vực thành thị mà còn phổ biến hơn nữa tại các cao tốc.<br><span>Traffic congestion here happens not only in urban areas but is even more common on the highways.</span></p><p class='ex'>Em ấy không chỉ chăm chỉ học ở trong lớp mà còn chịu khó học thêm ở bên ngoài với bạn Việt Nam nữa.<br><span>She not only studies hard in class but also studies extra outside with Vietnamese friends.</span></p>"}, {"h": "2. A gây thiệt hại không nhỏ cho B — A causes considerable damage to B", "b": "<p>Shows the impact of a cause on a negative result.</p><p class='ex'>Tình trạng tắc nghẽn giao thông vào khung giờ cao điểm gây thiệt hại không nhỏ cho người dân.<br><span>Traffic congestion at peak hours causes considerable damage to residents.</span></p><p class='ex'>Cơn mưa lớn đã gây thiệt hại không nhỏ cho các nông trại ở khu vực này.<br><span>The heavy rain caused considerable damage to the farms in this area.</span></p>"}, {"h": "3. Không có gì lạ khi … — it’s not surprising that", "b": "<p class='ex'>Không có gì lạ khi du khách vẫn tiếp tục quay lại Hotel Majestic Saigon.<br><span>It’s not surprising that guests keep coming back to the Hotel Majestic Saigon.</span></p><p class='ex'>Không có gì lạ khi cả hai người bạn thân này kết hôn sau nhiều năm hẹn hò.<br><span>It’s not surprising that these two close friends got married after years of dating.</span></p>"}], "ex": [{"t": "open", "title": "Bài 2. Hoàn thành câu (gợi ý đáp án)", "items": [["Giao thông ở các đô thị lớn trên thế giới không chỉ …", "… là nỗi ám ảnh với người dân mà còn là gánh nặng về cơ sở hạ tầng của các đô thị đó."], ["Cơn mưa lớn đã gây …", "… thiệt hại không nhỏ cho những người dân ở thị trấn này."], ["Với một nhà hàng sushi chuẩn Nhật, giá rẻ thì không có gì lạ …", "… khi ngày nào quán cũng rất đông khách."], ["Anh ấy quyết định đến Roma sống không chỉ …", "… vì công việc của mình mà còn là vì việc học của các con."], ["Em ấy luôn vô tâm với mọi người nên không có gì …", "… lạ khi em ấy ốm mà không ai hỏi han, quan tâm."], ["Khủng hoảng kinh tế sau Covid đã gây ra …", "… thiệt hại không nhỏ cho người dân cũng như kinh tế các nước."], ["Ngôi nhà cũ đó không chỉ …", "… là kỷ niệm về bố mẹ của tôi mà còn là một phần tuổi thơ tôi."]]}]}, "vocab": [["Danh từ · Nouns", [["Mũ bảo hiểm", "Helmet", "Casco"], ["Lưu lượng", "Traffic flow", "Flusso di traffico"], ["Đặc sản", "Specialty", "Specialità"], ["Người lái xe", "Driver", "Conducente"], ["Cảnh sát giao thông", "Traffic police", "Polizia stradale"], ["Người qua đường", "Pedestrian", "Pedone"], ["Tình hình", "Situation", "Situazione"], ["Tình trạng", "Condition", "Condizione"], ["Người tham gia giao thông", "Road users", "Utenti della strada"], ["Giờ cao điểm", "Rush hour", "Ora di punta"], ["Bảng xếp hạng", "Ranking", "Classifica"], ["Tàu điện ngầm", "Subway", "Metropolitana"], ["Khí đốt", "Gas", "Gas"], ["Mật độ", "Density", "Densità"]]], ["Động từ · Verbs", [["Tiêu tốn", "To consume", "Consumare"], ["Lắc đầu", "To shake one’s head", "Scuotere la testa"], ["Dành ngôi vị", "To take the top spot", "Conquistare il primo posto"], ["Mắc kẹt", "To get stuck", "Restare bloccato"]]], ["Tính từ · Adjectives", [["Ngán ngẩm", "Fed up", "Stufo"], ["Bất tận", "Endless", "Infinito"], ["Nội đô", "Inner-city", "Centro città"]]]], "practice": [{"t": "mcq", "title": "Bài 1. Nghe và chọn cụm từ đúng", "listen": 1, "items": [{"say": "lưu lượng tăng", "o": ["lưu lượng tăng", "lưu lương tăng"], "a": 0}, {"say": "mật độ phương tiện", "o": ["mất đô phương tiền", "mật độ phương tiện"], "a": 1}, {"say": "tình trạng ùn tắc", "o": ["tình trạng ùn tắc", "tình trạng ùn tắt"], "a": 0}, {"say": "tuyến đường lớn", "o": ["tuyến đương lơn", "tuyến đường lớn"], "a": 1}, {"say": "khu vực nội đô", "o": ["khu vực nội đô", "khu vựt nối đô"], "a": 0}, {"say": "tiêu tốn năng lượng", "o": ["tiêu tốn năng lượng", "tiêu tốn nặng lương"], "a": 0}, {"say": "kế hoạch dự kiến", "o": ["kế hoạt dụ kiến", "kế hoạch dự kiến"], "a": 1}]}, {"t": "mcq", "title": "Bài 2. Chọn đáp án đúng", "items": [{"q": "Khi tham gia giao thông, bạn bắt buộc phải đội ___ để đảm bảo an toàn.", "o": ["áo phản quang", "mũ bảo hiểm", "găng tay lái xe"], "a": 1}, {"q": "Cầu vượt này thường bị ùn ứ khi ___ xe tăng đột ngột vào giờ tan tầm.", "o": ["tốc độ", "lưu lượng", "biển báo"], "a": 1}, {"q": "Cảnh sát đã nhờ ___ hỗ trợ cung cấp thông tin về vụ va chạm.", "o": ["người điều khiển xe", "người qua đường", "người làm việc"], "a": 1}, {"q": "Khu trung tâm có ___ phương tiện rất cao vào cuối tuần.", "o": ["tần suất", "mật độ", "lối rẽ"], "a": 1}, {"q": "Bài báo phản ánh rõ ___ giao thông phức tạp trong những ngày mưa lớn.", "o": ["quy định", "tình trạng", "tuyến đường"], "a": 1}, {"q": "Nhiều xe bị ___ giữa dòng người chen chúc khi có sự cố phía trước.", "o": ["mắc kẹt", "thoát ra", "tăng tốc"], "a": 0}, {"q": "Anh ấy tỏ ra ___ khi phải chờ đợi quá lâu trong cảnh tắc đường.", "o": ["phấn khởi", "ngán ngẩm", "bình tĩnh"], "a": 1}]}, {"t": "mcq", "title": "Bài 3. Chọn nghĩa đúng", "items": [{"q": "“Đặc sản” nghĩa là:", "o": ["Món ăn tiêu biểu của một vùng miền", "Món ăn phổ biến toàn quốc", "Món ăn chỉ dành cho lễ hội"], "a": 0}, {"q": "“Người tham gia giao thông” là:", "o": ["Người làm việc trong ngành vận tải", "Người đứng quan sát giao thông", "Người điều khiển hoặc di chuyển trên đường bằng bất kỳ phương tiện nào"], "a": 2}, {"q": "“Giờ cao điểm” là thời gian:", "o": ["Đường phố đông nhất trong ngày", "Có nhiều sự kiện diễn ra", "Dành cho ưu tiên xe buýt"], "a": 0}, {"q": "“Khí đốt” có nghĩa là:", "o": ["Nhiên liệu dạng khí dùng để đun nấu hoặc sản xuất", "Hơi nước tạo ra từ nồi hơi", "Không khí trong phòng kín"], "a": 0}, {"q": "“Tiêu tốn” được hiểu là:", "o": ["Dùng hết một lượng thời gian, tiền bạc hoặc năng lượng", "Thu lại lợi nhuận từ hoạt động nào đó", "Chia nhỏ tài nguyên để dự trữ"], "a": 0}, {"q": "“Nội đô” là khu vực:", "o": ["Khu vực trung tâm, thuộc phần bên trong của thành phố", "Vùng ngoại ô giáp ranh tỉnh khác", "Khu dân cư mới xây ở ngoại thành"], "a": 0}, {"q": "“Tình hình” là:", "o": ["Diễn biến, trạng thái của một sự việc tại thời điểm nhất định", "Kế hoạch dự kiến cho tương lai", "Quy định áp dụng cho một lĩnh vực"], "a": 0}]}, {"t": "tf", "title": "Bài 4. Đúng hay sai?", "items": [["Việc sử dụng quá nhiều túi ni-lông thiệt hại gây không nhỏ cho môi trường biển.", false], ["Học ngoại ngữ không chỉ giúp chúng ta giao tiếp với người nước ngoài mà còn mở rộng hiểu biết về văn hóa.", true], ["Không có gì lạ mà ngày càng nhiều người trẻ lựa chọn làm việc từ xa.", false], ["Ô nhiễm không khí không chỉ ảnh hưởng đến sức khỏe mà còn ảnh hưởng đến chất lượng cuộc sống của người dân.", true], ["Không có gì lạ khi ô nhiễm môi trường ngày càng trở thành vấn đề đáng lo ngại ở các thành phố lớn.", true], ["Việc khai thác tài nguyên quá mức gây thiệt hại không nhỏ về môi trường tự nhiên.", true], ["Công nghệ không chỉ giúp tiết kiệm thời gian, mà còn tạo điều kiện thuận lợi cho mọi người tiếp cận thông tin.", true]]}, {"t": "mcq", "title": "Bài 5. Chọn đáp án đúng", "items": [{"q": "Việc anh ấy quên gửi hàng cho khách đã ______ uy tín của công ty.", "o": ["không có gì lạ khi", "gây thiệt hại không nhỏ cho", "không chỉ mà còn"], "a": 1}, {"q": "Đi xe buýt ______ giúp giảm số lượng xe máy trên đường mà còn góp phần hạn chế ùn tắc giao thông.", "o": ["không chỉ", "không có gì lạ khi", "gây thiệt hại không nhỏ cho"], "a": 0}, {"q": "Vào giờ cao điểm, đường phố thường rất đông và xe cộ di chuyển chậm. Vì thế, ______ nhiều người mất khá nhiều thời gian để đến nơi làm việc.", "o": ["không chỉ", "không có gì lạ khi", "gây thiệt hại không nhỏ cho"], "a": 1}, {"q": "Chọn câu đúng:", "o": ["Không chỉ đi xe đạp tốt cho sức khỏe mà còn giúp bảo vệ môi trường.", "Đi xe đạp không chỉ tốt cho sức khỏe mà còn giúp bảo vệ môi trường.", "Đi xe đạp không chỉ tốt cho sức khỏe còn giúp bảo vệ môi trường."], "a": 1}, {"q": "Cơn bão vừa qua đã ______ những gia đình ở khu vực này.", "o": ["gây thiệt hại không nhỏ cho", "không có gì lạ khi", "không chỉ mà còn"], "a": 0}, {"q": "Nhiều người đi làm bằng ô tô cá nhân vào giờ cao điểm nên ______ đường phố thường xuyên xảy ra ùn tắc.", "o": ["gây thiệt hại không nhỏ cho", "không chỉ mà còn", "không có gì lạ khi"], "a": 2}, {"q": "Câu nào diễn đạt đúng và tự nhiên?", "o": ["Không có gì lạ khi nhiều người chọn xe buýt để tránh phải tự lái xe trong giờ cao điểm.", "Không có gì lạ mà nhiều người chọn xe buýt để tránh phải tự lái xe trong giờ cao điểm.", "Nhiều người không có gì lạ khi chọn xe buýt để tránh phải tự lái xe trong giờ cao điểm."], "a": 0}]}]}, {"id": 4, "vi": "Vui chơi giải trí", "en": "Entertainment", "it": "Intrattenimento", "page": 67, "tracks": [["Nghe 1", "Book3_Lesson4_Listening1_NorthSouth.mp3", "Bắc & Nam"], ["Nghe 2", "Book3_Lesson4_Listening2_North.mp3", "Bắc"]], "grammar": {"points": [{"h": "1. Đáng + verb — worth (doing)", "b": "<p>Emphasises the positive value of an action or thing.</p><p class='ex'>Những cái tên đáng để tham khảo.<br><span>Names worth considering.</span></p><p class='ex'>Cái đồng hồ này đáng mua vì chất lượng tốt mà giá phải chăng.<br><span>This watch is worth buying because of its good quality and affordable price.</span></p>"}, {"h": "2. Cả, tất cả, toàn thể, toàn bộ — all, whole", "b": "<ul><li><b>Cả</b> + collective noun: cả gia đình, cả làng, cả phố</li><li><b>Toàn bộ</b> + things: toàn bộ bàn ghế, toàn bộ sách vở</li><li><b>Toàn thể</b> + people: toàn thể nhân viên, toàn thể học sinh</li><li><b>Tất cả</b> + various nouns, often with <i>những / các</i>: tất cả các công ty, tất cả những giáo viên</li></ul>"}, {"h": "3. Dường như … — it seems that", "b": "<p>Expresses uncertainty or likelihood.</p><p class='ex'>Những ngày giáp Tết, chợ dường như họp cả ngày, luôn sôi động và sầm uất.<br><span>In the days before Tết, the market seems to be open all day, always lively and bustling.</span></p><p class='ex'>Cô ấy dường như đã quên lời hứa.<br><span>She seems to have forgotten her promise.</span></p>"}], "ex": [{"t": "fill", "title": "Bài 2. Điền từ thích hợp", "items": ["Mùa hè này, *cả/tất cả* gia đình em ấy quyết định đi du lịch Châu Âu trong 1 tuần.", "Đây là một nhà hàng Việt Nam *đáng* để tôi ăn mỗi cuối tuần vì giá cả phải chăng mà chất lượng rất tốt.", "Gần 1 tuần rồi nhưng anh ấy chưa trả tôi sách, *dường như* anh ấy đã quên rồi.", "*Toàn bộ/tất cả* đồ đạc của ngôi nhà mới đều do bố mẹ chị ấy mua tặng.", "Bà ấy thích *tất cả* những cây cầu bắc qua các sông ở thành phố Venice của nước Ý xinh đẹp.", "Tổng giám đốc đã gửi lời chúc mừng năm mới đến *toàn thể/tất cả* nhân viên của công ty.", "Đây là một khóa học *đáng* để đăng ký vì nó mang lại cả giá trị vật chất và tinh thần cho người học."]}]}, "vocab": [["Danh từ · Nouns", [["Cáp treo", "Cable car", "Funivia"], ["Nhà ma", "Haunted house", "Casa infestata"], ["Nhà vui nhộn", "Funhouse", "Casa degli specchi"], ["Hạn chế chiều cao", "Height restriction", "Limite di altezza"], ["Xe đụng", "Bumper cars", "Autoscontri"], ["Khí hậu", "Climate", "Clima"], ["Đĩa bay", "Flying saucer (ride)", "Disco volante (giostra)"], ["Cốc xoay", "Spinning cups", "Tazze rotanti"], ["Cối xay gió", "Windmill", "Mulino a vento"], ["Lâu đài", "Castle", "Castello"], ["Thủy cung", "Aquarium", "Acquario"], ["Đường trượt", "Slide", "Scivolo"], ["Lòng chảo", "Basin (valley)", "Conca"], ["San hô", "Coral", "Corallo"]]], ["Động từ · Verbs", [["Đu quay", "Ferris wheel / to ride the wheel", "Ruota panoramica"], ["Trượt nước", "To go down a waterslide", "Scivolare sull’acqua"], ["Lướt sóng", "To surf", "Fare surf"], ["Điểm danh", "To take the roll call", "Fare l’appello"]]], ["Tính từ · Adjectives", [["Mạo hiểm", "Adventurous", "Avventuroso"], ["Dạn dĩ", "Bold", "Coraggioso"], ["Hoành tráng", "Magnificent", "Grandioso"]]]], "practice": [{"t": "mcq", "title": "Bài 1. Nghe và chọn cụm từ đúng", "listen": 1, "items": [{"say": "cảm giác mạnh", "o": ["cảm giác mạnh", "cảm giát mạnh"], "a": 0}, {"say": "lâu đài cổ kính", "o": ["lâu đài cổ kính", "lâu đày cô kinh"], "a": 0}, {"say": "trò chơi mạo hiểm", "o": ["trồ chôi mạo hiểm", "trò chơi mạo hiểm"], "a": 1}, {"say": "hạn chế chiều cao", "o": ["hạn chế chiều cao", "hạng chê chiều cao"], "a": 0}, {"say": "hồ tạo sóng", "o": ["hồ tạo sống", "hồ tạo sóng"], "a": 1}, {"say": "đường trượt dài", "o": ["đường trượt dài", "đường trược dày"], "a": 0}, {"say": "xe điện ba bánh", "o": ["xe điện ba bánh", "xe điệng ba bắn"], "a": 0}]}, {"t": "match", "title": "Bài 2. Nối từ ngữ với phần giải thích nghĩa", "pairs": [["cáp treo", "Phương tiện di chuyển trên cao bằng cabin treo trên dây."], ["khí hậu", "Đặc điểm thời tiết ổn định của một vùng trong thời gian dài."], ["lâu đài", "Công trình lớn, cổ, thường gắn với vua chúa hoặc quý tộc."], ["thủy cung", "Nơi trưng bày sinh vật biển trong bể nước lớn."], ["san hô", "Sinh vật biển tạo thành khối nhiều màu sắc dưới đáy nước."], ["đu quay", "Trò chơi xoay vòng trên không trong khu vui chơi."], ["mạo hiểm", "Có tính rủi ro, đòi hỏi sự can đảm khi thực hiện."]]}, {"t": "mcq", "title": "Bài 3. Chọn đáp án đúng", "items": [{"q": "Khu trò chơi này có ___ khiến nhiều người hồi hộp khi bước vào.", "o": ["nhà ma", "khu nghỉ chân", "đường hầm tối"], "a": 0}, {"q": "Trò chơi này có ___, nên trẻ em phải được kiểm tra trước khi vào.", "o": ["khu vực chờ", "yêu cầu cân nặng", "hạn chế chiều cao"], "a": 2}, {"q": "Công viên nước vừa mở thêm một ___ cực dài, thu hút rất đông du khách.", "o": ["đường trượt", "hồ tạo sóng", "khu tắm bùn"], "a": 0}, {"q": "Bãi biển này nổi tiếng vì có sóng mạnh, rất phù hợp cho người thích ___.", "o": ["ngắm hoàng hôn", "lướt sóng", "chèo thuyền"], "a": 1}, {"q": "Sân khấu được dựng rất ___ với ánh sáng và âm thanh hiện đại.", "o": ["hoành tráng", "giản dị", "tạm bợ"], "a": 0}, {"q": "Khu vui chơi có trò ___, đó là trò các xe nhỏ va chạm nhẹ tạo cảm giác thích thú cho người chơi.", "o": ["xe điện ba bánh", "tàu lượn", "xe đụng"], "a": 2}, {"q": "Anh ấy thật ___ khi vừa đến đi thì trời đổ mưa lớn.", "o": ["xui xẻo", "thong thả", "may mắn"], "a": 0}]}, {"t": "tf", "title": "Bài 4. Đúng hay sai?", "items": [["Bộ phim này hay lắm, đáng đi xem đấy.", true], ["Cuối cùng, cả mọi người đều đã rời đi.", false], ["Muộn quá mà anh ấy chưa đến. Dường như anh ấy đã quên cuộc hẹn.", true], ["Tất cả chúng tôi đều rất kính trọng ông ấy.", true], ["Cái xe này đắt mà không tốt, đáng không mua đâu.", false], ["Sau khi dự án hoàn thành, cả nhóm đã quyết định đi chơi.", true], ["2 năm rồi cô ấy không liên lạc với chúng tôi. Cô ấy đã quên dường như chúng tôi rồi.", false]]}, {"t": "mcq", "title": "Bài 5. Chọn đáp án đúng", "items": [{"q": "Bài thuyết trình này có nhiều nội dung thú vị rất ___, bạn nên nghe thử đi.", "o": ["đáng đọc", "đáng nghe", "đáng chạy"], "a": 1}, {"q": "Ngày mai, ___ chúng ta đều phải có mặt trước 8 giờ.", "o": ["cả", "tất cả", "một vài"], "a": 1}, {"q": "Anh ấy không nộp sản phẩm, anh ấy ___ không muốn tham gia nữa.", "o": ["nghĩ là", "dường như", "hiểu rằng"], "a": 1}, {"q": "Cô ấy làm việc chăm chỉ đến mức ___ được khen thưởng.", "o": ["đáng", "không nên", "đáng mà"], "a": 0}, {"q": "Sau khi nghe cô giáo nói, ___ lớp đều đồng ý đổi lịch học.", "o": ["những", "một nửa", "cả"], "a": 2}, {"q": "Tôi vừa nghe dự báo thời tiết, ___ trời sẽ lạnh hơn vào tối nay.", "o": ["đáng", "dường như", "cả"], "a": 1}, {"q": "Quyển sách này ___ mua để tham khảo vì có nhiều thông tin hữu ích.", "o": ["đáng", "đáng mà", "đáng để"], "a": [0, 2]}]}]}, {"id": 5, "vi": "Ẩm thực ba miền", "en": "Cuisine from the three regions", "it": "Cucina delle tre regioni", "page": 84, "tracks": [["Nghe 1", "Book3_Lesson5_Nghe1_North.mp3", "Bắc"], ["Nghe 2", "Book3_Lesson5_Listening2_South.mp3", "Nam"]], "grammar": {"points": [{"h": "1. Ngay cả / kể cả — even", "b": "<p>Highlights an unexpected inclusion.</p><p class='ex'>Ngay cả màu sắc món ăn cũng thường thiên về màu đỏ và nâu sậm hiền lành.<br><span>Even the colours of the dishes tend towards gentle shades of red and dark brown.</span></p><p class='ex'>Kể cả những công việc nhỏ nhặt, anh ấy luôn hoàn thành đầy đủ.<br><span>Even the smallest tasks, he always completes them thoroughly.</span></p>"}, {"h": "2. Không thể không + verb — cannot help but, must", "b": "<p>Emphasises that one must do something, or that something is very likely to happen.</p><p class='ex'>Nhắc đến tính phong phú và đa dạng của ẩm thực Việt Nam không thể không nhắc đến ẩm thực miền Nam.<br><span>When talking about the richness of Vietnamese cuisine, you cannot help but mention Southern cuisine.</span></p><p class='ex'>Khi đến miền Trung tôi không thể không đến Hội An và thưởng thức cơm gà, cao lầu.<br><span>When I visit Central Vietnam, I can’t help but go to Hội An and enjoy chicken rice and cao lầu.</span></p>"}], "ex": [{"t": "open", "title": "Bài 2. Dùng các cấu trúc trên để viết lại câu", "items": [["Nếu đi du lịch ở Sài Gòn, chắc chắn bạn phải uống cà phê bệt và ăn cơm tấm.", "Nếu đi du lịch ở Sài Gòn, bạn không thể không uống cà phê bệt và ăn cơm tấm."], ["Lúc nào anh ấy cũng uống cà phê, thậm chí cả buổi tối trước khi đi ngủ.", "Anh ấy uống cà phê mọi lúc ngay cả trước khi đi ngủ."], ["Họ đúng là một đôi bạn thân. Cái gì cũng giống nhau từ quần áo đến mùi nước hoa.", "Họ đúng là một đôi bạn thân nên cái gì cũng giống nhau kể cả mùi nước hoa."], ["Khi học một ngoại ngữ bạn nhất định phải học bảng chữ cái đầu tiên để biết phát âm như thế nào.", "Khi học một ngoại ngữ bạn không thể không học bảng chữ cái đầu tiên."], ["Bất cứ lúc nào chị ấy cũng tự nấu ăn thậm chí chỉ ở nhà một mình.", "Ngay cả khi ở nhà một mình, chị ấy cũng tự nấu ăn."], ["Cô ấy luôn luôn ưu tiên phải thử món ăn của những nơi cô ấy đi du lịch hay công tác.", "Cô ấy không thể không thử món ăn của những nơi cô ấy đi du lịch hay công tác."], ["Em ấy không bao giờ ăn cháo, dù ốm cũng không ăn.", "Em ấy không bao giờ ăn cháo ngay cả khi bị ốm."]]}]}, "vocab": [["Danh từ · Nouns", [["Ẩm thực", "Cuisine", "Cucina"], ["Khẩu vị", "Taste", "Gusto"], ["Rau củ", "Vegetables", "Verdure"], ["Nông nghiệp lúa nước", "Wet-rice agriculture", "Risicoltura in acqua"], ["Thực đơn", "Menu", "Menu"], ["Nước cốt dừa", "Coconut milk", "Latte di cocco"], ["Gia vị", "Spice", "Spezia"], ["Lễ nghi", "Rituals", "Riti"], ["Hương vị", "Flavour", "Sapore"]]], ["Động từ · Verbs", [["Nêm nếm", "To season", "Insaporire"], ["Chế biến", "To cook, to process", "Cucinare"], ["Đan xen", "To blend", "Mescolare"], ["Hội tụ", "To converge", "Convergere"]]], ["Tính từ · Adjectives", [["Đặc trưng", "Characteristic", "Caratteristico"], ["Thanh đạm", "Light, simple", "Leggero"], ["Ẩm thực cung đình", "Royal cuisine", "Cucina reale"], ["Ẩm thực đường phố", "Street food", "Cibo di strada"], ["Tinh tế", "Delicate", "Delicato"], ["Trung tính", "Neutral", "Neutro"], ["Đậm đà", "Rich (in flavour)", "Saporito"]]]], "practice": [{"t": "mcq", "title": "Bài 1. Nghe và chọn cụm từ đúng", "listen": 1, "items": [{"say": "hương vị truyền thống", "o": ["hương vị truyền thống", "hương vi truyền thông"], "a": 0}, {"say": "sơ chế nguyên liệu", "o": ["sơ chế nguyên liệu", "sờ chê nguyên liều"], "a": 0}, {"say": "thực đơn đa dạng", "o": ["thựt đơn đa dạn", "thực đơn đa dạng"], "a": 1}, {"say": "trang trí đẹp mắt", "o": ["tran trí đẹp mắc", "trang trí đẹp mắt"], "a": 1}, {"say": "mùi vị dễ chịu", "o": ["mùi vị dễ chịu", "mui vì dế chịu"], "a": 0}, {"say": "dấu ấn đặc trưng", "o": ["dấu ẩn đặt trưng", "dấu ấn đặc trưng"], "a": 1}, {"say": "điều chỉnh gia vị", "o": ["điều chỉnh gia vị", "điệu chình gia vi"], "a": 0}]}, {"t": "mcq", "title": "Bài 2. Chọn nghĩa đúng", "items": [{"q": "Khẩu vị", "o": ["Cách phối hợp nguyên liệu trong nấu ăn", "Sở thích và mức độ cảm nhận vị của từng người", "Thói quen ăn uống theo mùa"], "a": 1}, {"q": "Rau củ", "o": ["Nhóm thực phẩm có nguồn gốc thực vật dùng để chế biến món ăn", "Các loại hạt khô để bảo quản lâu", "Thực phẩm giàu đạm từ động vật"], "a": 0}, {"q": "Thực đơn", "o": ["Bảng liệt kê nguyên liệu cần mua", "Danh sách món ăn được phục vụ tại một quán", "Cách trình bày món ăn trên bàn tiệc"], "a": 1}, {"q": "Lễ nghi", "o": ["Những quy tắc, cách thức ứng xử trong hoàn cảnh trang trọng", "Các món ăn truyền thống của một vùng", "Hoạt động giải trí trong cộng đồng"], "a": 0}, {"q": "Nêm nếm", "o": ["Trang trí món ăn cho đẹp mắt", "Điều chỉnh gia vị để món ăn vừa miệng", "Rửa sạch nguyên liệu trước khi nấu"], "a": 1}, {"q": "Thanh đạm", "o": ["Món ăn có vị cay nồng", "Ít dầu mỡ, nhẹ nhàng, dễ tiêu", "Món ăn nhiều đường và chất béo"], "a": 1}, {"q": "Bát", "o": ["Dụng cụ để thái và cắt nguyên liệu", "Vật trang trí trên bàn ăn", "Đồ dùng để đựng thức ăn"], "a": 2}]}, {"t": "mcq", "title": "Bài 3. Chọn đáp án đúng", "items": [{"q": "Văn hóa ___ Việt Nam phản ánh sự hòa quyện giữa truyền thống lâu đời và sự sáng tạo của thế hệ trẻ.", "o": ["phong tục", "ẩm thực", "nông nghiệp"], "a": 1}, {"q": "Món canh này trở nên hài hòa hơn khi người đầu bếp chỉ thêm một lượng nhỏ ___ để làm nổi bật vị ngọt tự nhiên của nguyên liệu.", "o": ["đặc trưng", "trung tính", "gia vị"], "a": 2}, {"q": "Nhiều món ăn truyền thống được hình thành từ nền ___, nơi người dân sống dựa vào ruộng đồng và nguồn nước quanh năm.", "o": ["chế biến", "nông nghiệp lúa nước", "tinh tế"], "a": 1}, {"q": "Để tạo ra hương vị cân bằng, người đầu bếp phải nắm rõ từng bước ___, từ sơ chế đến hoàn thiện món ăn.", "o": ["chế biến", "trung tính", "đặc trưng"], "a": 0}, {"q": "Mỗi vùng miền đều có những món ăn mang dấu ấn ___ riêng, phản ánh lịch sử và thói quen sinh hoạt của cộng đồng.", "o": ["tinh tế", "đặc trưng", "trung tính"], "a": 1}, {"q": "Cách trình bày món ăn của nhà hàng này rất ___, thể hiện sự chú ý đến từng chi tiết nhỏ.", "o": ["nông nghiệp lúa nước", "tinh tế", "trung tính"], "a": 1}, {"q": "Một số món ăn ở đây có vị khá ___, phù hợp với những người không thích hương vị quá mạnh.", "o": ["gia vị", "trung tính", "đặc trưng"], "a": 1}]}, {"t": "tf", "title": "Bài 4. Đúng hay sai?", "items": [["Ngay cả những người thận trọng nhất cũng bị bất ngờ trước quyết định đó.", true], ["Trời mưa kể cả, chúng tôi vẫn quyết định tổ chức buổi lễ.", false], ["Tôi không thể không thừa nhận rằng cô ấy đã làm rất tốt.", true], ["Kể cả những điều nhỏ nhất cũng được họ xem xét rất cẩn thận.", true], ["Chị ấy đã không thể không là suy nghĩ về chuyện hôm qua.", false], ["Khi đã chuẩn bị ngay cả kỹ, họ vẫn cảm thấy lo lắng.", false]]}, {"t": "mcq", "title": "Bài 5. Chọn đáp án đúng", "items": [{"q": "___ những người ít quan tâm nhất cũng bắt đầu chú ý đến vấn đề này.", "o": ["Ngay cả", "Không thể không", "Nếu"], "a": 0}, {"q": "Tôi ___ suy nghĩ về những điều cô ấy đã nói trong buổi họp.", "o": ["kể cả", "không thể không", "ngay cả"], "a": 1}, {"q": "___ trẻ em cũng bị thu hút bởi cách trình bày độc đáo của triển lãm.", "o": ["Kể cả", "Không thể không", "Không chỉ"], "a": 0}, {"q": "Anh ấy ___ thừa nhận rằng mình đã quá nóng nảy trong cuộc tranh luận.", "o": ["nghĩ là", "không thể không", "ngay cả"], "a": 1}, {"q": "___ những người từng phản đối mạnh mẽ cũng bắt đầu thay đổi quan điểm.", "o": ["Không thể không", "Ngay cả", "Không đâu"], "a": 1}, {"q": "Tôi ___ đồng ý rằng cách giải quyết này hợp lý hơn những phương án trước.", "o": ["kể cả", "không thể không", "ngay cả"], "a": 1}, {"q": "___ khi đã chuẩn bị đầy đủ, họ vẫn cảm thấy lo lắng trước buổi trình diễn.", "o": ["Không thể không", "Kể cả", "Mặc dù"], "a": 1}]}]}, {"id": 6, "vi": "Trang phục người H’Mông", "en": "H’Mong people’s clothing", "it": "L’abbigliamento del popolo H’Mong", "page": 102, "tracks": [["Nghe 1", "Book3_Lesson6_Listening1_North.mp3", "Bắc"], ["Nghe 2", "Book3_Lesson6_Listening2_South.mp3", "Nam"]], "grammar": {"points": [{"h": "1. … tạo cảm giác … — creates a feeling of", "b": "<p>Describes how something evokes a feeling or atmosphere.</p><p class='ex'>Họa tiết của trang phục đã tỏa ra muôn sắc màu, tạo cảm giác trầm ấm.<br><span>The patterns of the clothing radiate many colours, creating a feeling of warmth.</span></p><p class='ex'>Ánh nắng buổi sáng tạo cảm giác tươi mát.<br><span>The morning sunlight creates a refreshing feeling.</span></p>"}, {"h": "2. … là giao thoa giữa … — a blend / fusion of", "b": "<p>Something that combines elements from different sources.</p><p class='ex'>Tạp dề mang trước bụng phủ xuống chân là ‘giao thoa’ giữa miếng vải hình tam giác và chữ nhật.<br><span>The apron covering the front down to the legs is a fusion of a triangular and a rectangular piece of fabric.</span></p><p class='ex'>Công trình kiến trúc này là sự giao thoa giữa truyền thống và hiện đại.<br><span>This building is a blend of tradition and modernity.</span></p>"}, {"h": "3. Đậm đà + noun — rich in, strongly marked by", "b": "<p>Emphasises the strong or intense nature of something.</p><p class='ex'>Quần áo của người H’Mông chủ yếu may bằng vải tự dệt, đậm đà tính cách tộc người trong tạo hình.<br><span>H’Mong clothing is mostly made of self-woven fabric, strongly reflecting ethnic identity in its design.</span></p><p class='ex'>… một nền văn hóa đậm đà bản sắc dân tộc.<br><span>… a culture rich in national identity.</span></p>"}], "ex": [{"t": "open", "title": "Bài 2. Hoàn thành câu (gợi ý đáp án)", "items": [["Không gian của ngôi nhà tạo cảm giác …", "… ấm cúng và bình yên cho mỗi người ghé qua."], ["Các món ăn do mẹ tôi nấu đều đậm đà …", "… hương vị ẩm thực miền Trung."], ["Thiết kế của bảo tàng này là sự giao thoa giữa …", "… kiến trúc truyền thống Việt Nam và kiến trúc Pháp."], ["Trong văn hóa ẩm thực Việt Nam, bát nước chấm đậm đà …", "… vị cá biển luôn làm bữa cơm trở nên hấp dẫn hơn."], ["Ngồi giữa khu vườn của bà tạo cảm giác …", "… được trở về tuổi thơ của tôi từ 20 năm trước."], ["Các trò chơi trong lễ hội đều có sự giao thoa giữa …", "… truyền thống và hiện đại."], ["Những việc làm và lời nói của anh ấy tạo cảm giác …", "… tin tưởng cho người đối diện."]]}]}, "vocab": [["Danh từ · Nouns", [["Dân tộc", "Ethnic group", "Gruppo etnico"], ["Dân số", "Population", "Popolazione"], ["Vải tự dệt", "Self-woven fabric", "Tessuto tessuto a mano"], ["Kỹ thuật", "Technique", "Tecnica"], ["Họa tiết", "Pattern", "Motivo"], ["Áo bốn thân", "Four-panel tunic", "Tunica a quattro pannelli"], ["Gấu áo", "Hem", "Orlo"], ["Nếp gấp", "Pleat", "Piega"], ["Hoa văn", "Ornament", "Ornamento"], ["Áo cánh ngắn", "Short jacket", "Giacca corta"], ["Thân hẹp", "Narrow body (of a garment)", "Corpo stretto"], ["Ống tay", "Sleeve", "Manica"]]], ["Động từ · Verbs", [["Phân bố", "To be distributed", "Essere distribuito"], ["Sinh sống", "To reside", "Risiedere"], ["Cư trú", "To settle", "Stabilirsi"], ["Cài nút", "To button up", "Abbottonare"], ["Xòe ra", "To flare out", "Svasare"], ["Thêu", "To embroider", "Ricamare"], ["Chít khăn", "To wrap a headscarf", "Avvolgere il foulard"], ["Chạm khắc", "To carve", "Intagliare"]]], ["Tính từ · Adjectives", [["Duyên dáng", "Charming", "Affascinante"], ["Trầm ấm", "Warm and deep", "Caldo e profondo"]]]], "practice": [{"t": "mcq", "title": "Bài 1. Nghe và chọn cụm từ đúng", "listen": 1, "items": [{"say": "dân tộc thiểu số", "o": ["dân tốc thiêu số", "dân tộc thiểu số"], "a": 1}, {"say": "vải tự dệt", "o": ["vải tự dệt", "vảy tự dệc"], "a": 0}, {"say": "họa tiết sặc sỡ", "o": ["họa tiết sặc sỡ", "hoa tiếc sắc sớ"], "a": 0}, {"say": "hoa văn truyền thống", "o": ["hoa văng truyền thông", "hoa văn truyền thống"], "a": 1}, {"say": "phân bố rộng rãi", "o": ["phân bố rộng rãi", "phân bồ rống rái"], "a": 0}, {"say": "chạm khắc tinh tế", "o": ["chạm khắt tinh tề", "chạm khắc tinh tế"], "a": 1}, {"say": "kỹ thuật tinh xảo", "o": ["kỹ thuật tinh xảo", "kỹ thuật tình xào"], "a": 0}]}, {"t": "match", "title": "Bài 2. Nối từ ngữ với phần giải thích", "pairs": [["dân tộc", "Nhóm người có chung văn hóa, ngôn ngữ hoặc truyền thống."], ["kỹ thuật", "Cách thực hiện một thao tác sao cho đúng và hiệu quả."], ["họa tiết", "Mẫu trang trí lặp lại trên vải, đồ vật hoặc kiến trúc."], ["gấu áo", "Phần mép dưới cùng của áo, thường được may viền."], ["phân bố", "Sự sắp xếp, trải rộng hoặc xuất hiện ở các vị trí khác nhau."], ["thêu", "Dùng kim và chỉ tạo hình trang trí trên vải."], ["duyên dáng", "Có vẻ đẹp nhẹ nhàng, hài hòa, tạo cảm giác dễ chịu."]]}, {"t": "fill", "title": "Bài 3. Điền từ vào ô trống", "items": ["Bộ trang phục truyền thống này được làm từ *vải tự dệt*, mang lại cảm giác gần gũi và tự nhiên. Trên bề mặt, những *họa tiết* được bố trí tinh tế, thể hiện sự khéo léo của người thợ. Phần thân áo có các *nếp gấp* mềm, giúp dáng áo chuyển động nhẹ nhàng khi bước đi. *Ống tay* được may vừa vặn, tạo sự cân đối cho toàn bộ thân áo. Ở phía trước, người mặc chỉ cần *cài nút* là áo ôm vào cơ thể một cách gọn gàng. Khi di chuyển, phần váy *xòe ra*, tạo sự uyển chuyển, mềm mại. Nhờ chất liệu và thiết kế hợp lý, trang phục đem lại cảm giác rất *thoải mái* cho người mặc."], "bank": ["vải tự dệt", "họa tiết", "nếp gấp", "ống tay", "cài nút", "xòe ra", "thoải mái"]}, {"t": "tf", "title": "Bài 4. Đúng hay sai?", "items": [["Màu sắc nhẹ nhàng của căn phòng tạo cảm giác thư thái cho người bước vào.", true], ["Thiết kế này là giao thoa giữa hiện đại và truyền thống, tạo nên vẻ độc đáo riêng.", true], ["Cách trang trí tạo cảm giác là thoải mái hơn trước.", false], ["Món ăn này đậm đà vị và khiến người ta nhớ lâu.", true], ["Cách phối màu tạo cảm giác về sự chuyển động liên tục.", true], ["Bài hát này có sự giao thoa giữa cảm xúc mạnh và kỹ thuật tinh tế.", true]]}, {"t": "order", "title": "Bài 5. Sắp xếp các từ thành câu đúng", "items": [{"w": ["tạo cảm giác", "không gian", "rộng mở", "cách bố trí", "hơn", "."], "a": "Cách bố trí không gian tạo cảm giác rộng mở hơn."}, {"w": ["là giao thoa giữa", "phong cách", "bộ sưu tập", "tối giản", "và nghệ thuật thị giác", "."], "a": "Bộ sưu tập là giao thoa giữa phong cách tối giản và nghệ thuật thị giác."}, {"w": ["đậm đà", "món súp", "hương vị", "cách nấu chậm", "nhờ", "."], "a": "Món súp đậm đà hương vị nhờ cách nấu chậm."}, {"w": ["tạo cảm giác", "người xem", "chuyển động", "ánh sáng", "liên tục", "cho", "."], "a": "Ánh sáng tạo cảm giác chuyển động liên tục cho người xem."}, {"w": ["là giao thoa giữa", "truyền thống", "buổi biểu diễn", "và", "sân khấu", "kỹ thuật", "hiện đại", "."], "a": "Buổi biểu diễn là giao thoa giữa truyền thống và kỹ thuật sân khấu hiện đại."}, {"w": ["đậm đà", "vị ngọt", "món chè", "nguyên liệu", "nhờ", "tự nhiên", "."], "a": "Món chè đậm đà vị ngọt nhờ nguyên liệu tự nhiên."}, {"w": ["tạo cảm giác", "bản thiết kế", "tinh tế", "từng chi tiết", "người nhìn", "trong", "đối với", "."], "a": "Bản thiết kế tạo cảm giác tinh tế trong từng chi tiết đối với người nhìn."}]}]}, {"id": 7, "vi": "Đi xuyên Việt", "en": "Crossing Vietnam", "it": "Attraversare il Vietnam", "page": 131, "tracks": [["Nghe 1", "Book3_Lesson7_Listening1_NorthSouth.mp3", "Bắc & Nam"], ["Nghe 2", "Book3_Lesson7_Listening2_South.mp3", "Nam"]], "grammar": {"points": [{"h": "1. Gì … đó / nào … ấy — whatever … that", "b": "<p>Paired pronouns expressing correspondence between things, states or actions.</p><p class='ex'>Anh thích gì thì nên làm đó.<br><span>Do whatever you like.</span></p><p class='ex'>Cha nào con ấy.<br><span>Like father, like son.</span></p>"}, {"h": "2. Tận — not until / with one’s own …", "b": "<ul><li><b>Tận</b> + time: implies something is (too) late.</li><li><b>Tận</b> + tay / mắt / tai / nơi: a direct, personal experience.</li></ul><p class='ex'>Tận 12 giờ đêm anh ấy mới về nhà.<br><span>He didn’t come home until midnight.</span></p><p class='ex'>Cô ấy đã được nhìn tận mắt tổng thống Ý.<br><span>She saw the President of Italy with her own eyes.</span></p>"}, {"h": "3. Thường thì … — usually, typically", "b": "<p class='ex'>Thường thì chợ sẽ được họp vào buổi sáng sớm ở các ngã của các con kênh.<br><span>Usually, the market gathers early in the morning where the canals meet.</span></p><p class='ex'>Thường thì, mùa hè ở đây rất nóng.<br><span>Typically, summer here is very hot.</span></p>"}], "ex": [{"t": "open", "title": "Bài 2. Dùng các cấu trúc trên để viết lại câu", "items": [["Đây là bức thư quan trọng nên tôi muốn anh đưa trực tiếp cho cô Linh.", "Tôi muốn anh đưa bức thư quan trọng này đến tận tay cô Linh."], ["Chị làm được nhiều công việc như thế nào thì chị sẽ nhận được lương nhiều như vậy.", "Chị làm được lượng công việc như nào thì sẽ nhận được lương như thế."], ["Trừ chủ nhật, các ngày khác cửa hàng này đều mở bình thường nếu không có gì bất ngờ xảy ra.", "Thường thì, cửa hàng này sẽ mở cửa các ngày trừ chủ nhật."], ["Tôi không nhớ chính xác nhưng phải lâu nữa khoảng tháng 10 ông Gary mới quay lại Việt Nam.", "Tận tháng 10 ông Gary mới quay lại Việt Nam."], ["Em xem đi, thích sách lịch sử thì chọn sách lịch sử, thích sách văn học thì chọn sách văn học nhé.", "Em xem đi, thích sách nào thì chọn sách ấy."], ["Công việc của chúng tôi thông thường sẽ bận rộn nhất vào cuối năm vì phải chuẩn bị kế hoạch cho năm mới.", "Thường thì công việc của chúng tôi sẽ bận vào cuối năm."], ["Hôm qua, bà ấy đã được nhìn trực tiếp những màn pháo hoa đỉnh cao trong lễ hội pháo hoa Đà Nẵng 2023.", "Hôm qua, bà ấy đã được nhìn tận mắt những màn pháo hoa đỉnh cao trong lễ hội pháo hoa Đà Nẵng 2023."]]}]}, "vocab": [["Danh từ · Nouns", [["Hành trình", "Journey", "Viaggio"], ["Trung niên", "Middle-aged", "Di mezza età"], ["Thử thách", "Challenge", "Sfida"], ["Lời động viên", "Encouragement", "Incoraggiamento"], ["Sinh tử", "Life-or-death", "Di vita o di morte"], ["Thể lực", "Physical fitness", "Forma fisica"], ["Ý chí", "Willpower", "Forza di volontà"], ["Bạn đồng hành", "Companion", "Compagno di viaggio"]]], ["Động từ · Verbs", [["Đối mặt", "To confront", "Affrontare"], ["Vận chuyển", "To transport", "Trasportare"], ["Tâm sự", "To confide", "Confidare"], ["Bộc bạch", "To express candidly", "Esprimere sinceramente"], ["Quyết tâm", "To be determined", "Essere determinato"], ["Khuyên can", "To dissuade, to counsel", "Dissuadere"], ["Rùng mình", "To shudder", "Rabbrividire"], ["Xúc động", "To be moved", "Essere commosso"]]], ["Tính từ · Adjectives", [["Nắng rát", "Scorching sun", "Sole cocente"], ["Mưa tầm tã", "Pouring rain", "Pioggia battente"], ["Co ro", "Huddled, shivering", "Rannicchiato, tremante"], ["Hăm hở", "Eager", "Entusiasta"]]]], "practice": [{"t": "mcq", "title": "Bài 1. Nghe và chọn cụm từ đúng", "listen": 1, "items": [{"say": "hành trình vạn dặm", "o": ["hành trình vạn dặm", "hành trính vàn dặm"], "a": 0}, {"say": "thử thách bản thân", "o": ["thử thạch bạn thân", "thử thách bản thân"], "a": 1}, {"say": "rèn luyện thể lực", "o": ["rèn luyện thể lực", "rèng luyện thế lực"], "a": 0}, {"say": "độ tuổi trung niên", "o": ["độ tuổi trung niên", "đồ tuôi trung niêng"], "a": 0}, {"say": "người bạn đồng hành", "o": ["người bạng đông hanh", "người bạn đồng hành"], "a": 1}, {"say": "mưa rào tầm tã", "o": ["mưa rào tầm tã", "mua rao tầm tá"], "a": 0}, {"say": "đối mặt hiểm nguy", "o": ["đối mặt hiểm nguy", "đội mặc hiểm nguy"], "a": 0}]}, {"t": "match", "title": "Bài 2. Nối từ ngữ với phần giải thích", "pairs": [["hành trình", "Quãng đường hoặc quá trình di chuyển từ nơi này đến nơi khác."], ["trung niên", "Độ tuổi khoảng giữa thanh niên và cao tuổi, thường từ 40–60."], ["thể lực", "Sức khỏe và khả năng vận động của cơ thể."], ["bạn đồng hành", "Người cùng đi, cùng trải nghiệm một chuyến đi hay hoạt động."], ["quyết tâm", "Sự kiên định theo đuổi mục tiêu dù gặp khó khăn."], ["xúc động", "Cảm thấy bị tác động mạnh về mặt cảm xúc."], ["hăm hở", "Thể hiện sự háo hức, nhiệt tình muốn bắt đầu việc gì đó."]]}, {"t": "mcq", "title": "Bài 3. Chọn đáp án đúng", "items": [{"q": "Trong suốt hành trình dài, họ phải vượt qua nhiều ___ đến nỗi cả nhóm đôi lúc muốn bỏ cuộc.", "o": ["thử thách", "nắng rát", "co ro"], "a": 0}, {"q": "Những ___ chân thành từ bạn bè giúp cô ấy bình tĩnh hơn trước khi bắt đầu phần thi quan trọng.", "o": ["đối mặt", "lời động viên", "khuyên can"], "a": 1}, {"q": "Dù thời tiết khắc nghiệt, anh vẫn giữ vững ___ để đi đến cuối chặng đường.", "o": ["ý chí", "nắng rát", "thử thách"], "a": 0}, {"q": "Có một tình huống bất ngờ xảy ra mà họ không nghĩ phải ___ ngay giữa đoạn đường núi hiểm trở.", "o": ["đối mặt", "co ro", "khuyên can"], "a": 0}, {"q": "Bà ấy nhẹ nhàng ___ hai người hàng xóm đang cãi nhau vì một chuyện rất nhỏ.", "o": ["khuyên can", "thử thách", "ý chí"], "a": 0}, {"q": "Buổi trưa, cả đoàn phải đi dưới cái ___ khiến ai cũng mệt mỏi và khát nước.", "o": ["đối mặt", "nắng rát", "lời động viên"], "a": 1}, {"q": "Trời trở lạnh rất nhanh, khiến những người không mang áo khoác đang phải ___ trong gió.", "o": ["thử thách", "co ro", "ý chí"], "a": 1}]}, {"t": "tf", "title": "Bài 4. Đúng hay sai?", "items": [["Cô ấy chọn gì thì tôi làm theo đó, để tránh gây tranh cãi.", true], ["Tận 10 giờ tối anh ấy mới về nên cả nhà đã rất lo lắng.", true], ["Tôi không thường thì ăn sáng, nhưng hôm nay lại thấy đói.", false], ["Cô giáo đưa tận tay bài kiểm tra cho từng học sinh để tránh nhầm lẫn.", true], ["Họ ăn gì thì chúng tôi ăn đâu vì chúng tôi không thích sự khác biệt.", false], ["Thường thì mọi người đến sớm, nhưng hôm nay ai cũng bị kẹt xe nên đến muộn.", true], ["Ba ngày nữa tận cô Lan mới đi công tác về.", false]]}, {"t": "mcq", "title": "Bài 5. Chọn đáp án đúng", "items": [{"q": "Cô ấy chọn món gì thì tôi cũng gọi món ___ để dễ chia sẻ khi ăn chung.", "o": ["đó", "đâu", "nào"], "a": 0}, {"q": "Anh ấy phải làm việc ___ khuya mới xong, nên trông hôm nay rất mệt mỏi.", "o": ["tận", "chưa", "vừa"], "a": 0}, {"q": "Cô ấy muốn ___ đưa tài liệu quý giá này cho bạn của mình.", "o": ["tận mắt", "tận tay", "tận tai"], "a": 1}, {"q": "___ tôi không để ý đến chi tiết nhỏ, nhưng hôm nay lại thấy mọi thứ rất rõ ràng.", "o": ["Thường thì", "Dường như", "Miễn là"], "a": 0}, {"q": "Mùa hè năm nay, con trai tôi muốn đi ___ thì gia đình tôi sẽ đi đó.", "o": ["đâu", "ấy", "kia"], "a": 0}, {"q": "Cô ấy nghe ___ từng lời giải thích, nhưng vẫn cảm thấy chưa thật sự thuyết phục.", "o": ["tận tai", "tận mắt", "tận tay"], "a": 0}, {"q": "___ tôi hay dậy muộn, nhưng dạo này tôi cố gắng điều chỉnh lại thói quen để cải thiện sức khỏe của bản thân.", "o": ["Thường thì", "Miễn là", "Hình như"], "a": 0}]}]}, {"id": 8, "vi": "Nhà truyền thống của người Việt", "en": "Traditional Vietnamese houses", "it": "Le case tradizionali vietnamite", "page": 150, "tracks": [["Nghe 1", "Book3_Lesson8_Listening1_North.mp3", "Bắc"], ["Nghe 2", "Book3_Lesson8_Listening2_North.mp3", "Bắc"]], "grammar": {"points": [{"h": "1. Để, mà, bằng, cho — purpose words", "b": "<p class='ex'>Người Nam Bộ xây nhà sàn để chống ngập nước.<br><span>People in the South build stilt houses to protect against flooding.</span></p><p class='ex'>Anh cứ lấy máy tính của tôi mà dùng.<br><span>Just take my computer and use it.</span></p><p class='ex'>Việc này quan trọng nên tôi phải làm bằng xong.<br><span>This task is important, so I must keep going until it’s finished.</span></p><p class='ex'>Bác nhớ uống thuốc đều cho khỏe.<br><span>Remember to take your medicine regularly so you get well.</span></p>"}, {"h": "2. Đáng nói, … — notably", "b": "<p>Introduces an important or noteworthy point.</p><p class='ex'>Đáng nói, ngày nay, hơn một tỷ người trên thế giới không có quyền tiếp cận với nguồn nước sạch.<br><span>Notably, today over a billion people worldwide have no access to clean water.</span></p>"}, {"h": "3. Tin rằng, cho rằng, nghĩ rằng, nhận định rằng — expressing opinions", "b": "<p class='ex'>Chùa này rất linh thiêng nên người ta tin rằng xin điều gì cũng dễ trở thành sự thật.<br><span>This pagoda is very sacred, so people believe that whatever they pray for will come true.</span></p><p class='ex'>Các nhà khoa học nhận định nếu băng ở Bắc Cực tan nhanh hơn thì khí hậu trên trái đất sẽ gặp nhiều vấn đề bất thường.<br><span>Scientists believe that if Arctic ice melts faster, the Earth’s climate will face many abnormal problems.</span></p>"}], "ex": [{"t": "fill", "title": "Bài 2. Điền từ thích hợp", "items": ["Món này chị ấy nấu quá ngon nên dù hơi nhiều nhưng tôi phải ăn *bằng* hết.", "Chúng tôi không *nghĩ rằng/ngờ rằng* kỳ thi này lại gây nhiều áp lực cho các sinh viên như thế.", "*Đáng nói*, hiện nay ở các nước vẫn có khoảng cách lớn giữa người giàu và người nghèo.", "Nếu anh đi với cả gia đình thì cứ lấy xe ô tô của tôi *mà* đi *cho* tiện lợi.", "Những cư dân ở đây đều *cho rằng/tin rằng/nghĩ rằng* khu đô thị này thực sự là một nơi đáng sống.", "Em cần cố gắng hết mình trong đợt thi này *để* giành danh hiệu quán quân nhé."]}]}, "vocab": [["Danh từ · Nouns", [["Nhà ở", "Residential house", "Casa residenziale"], ["Mô hình nhà", "House model", "Modello di casa"], ["Nhà sàn", "Stilt house", "Casa su palafitte"], ["Mái che", "Roof canopy", "Tettoia"], ["Nhà trệt", "One-storey house", "Casa a un piano"], ["Hàng rào", "Fence", "Recinzione"], ["Sân hiên", "Veranda", "Veranda"], ["Nhà trình tường", "Rammed-earth house", "Casa in terra battuta"], ["Đất sét", "Clay", "Argilla"], ["Nhà lá", "Thatched house", "Casa col tetto di paglia"], ["Khung sườn (nhà)", "Framework (of a house)", "Struttura (di una casa)"], ["Cột kèo", "Support beam", "Trave di supporto"]]], ["Động từ · Verbs", [["Lợp (mái)", "To roof", "Coprire il tetto"], ["Đổ móng (nhà)", "To lay the foundations", "Gettare le fondamenta"], ["Chạm trổ", "To carve", "Intagliare"], ["Thờ cúng", "To worship", "Venerare"]]], ["Tính từ · Adjectives", [["Thoáng đãng", "Airy, spacious", "Arioso"], ["Gọn gàng", "Neat and tidy", "Ordinato"], ["Đơn sơ", "Simple", "Semplice"], ["Mát rượi", "Refreshingly cool", "Piacevolmente fresco"]]]], "practice": [{"t": "mcq", "title": "Bài 1. Nghe và chọn cụm từ đúng", "listen": 1, "items": [{"say": "nhà ở xã hội", "o": ["nhà ở xã hội", "nhà ở xá hội"], "a": 0}, {"say": "nhà sàn dân tộc", "o": ["nhà sàn dân tộc", "nhà sán dâng tộc"], "a": 0}, {"say": "nhà trệt phía trước", "o": ["nhà trết phía trướt", "nhà trệt phía trước"], "a": 1}, {"say": "sân hiên rộng rãi", "o": ["sân hiên rộng rãi", "sân hiên rộng rái"], "a": 0}, {"say": "đổ móng nhà", "o": ["đồ móng nhà", "đổ móng nhà"], "a": 1}, {"say": "không gian thoáng đãng", "o": ["không gian thoáng đãng", "không gian thoán đãn"], "a": 0}, {"say": "ngôi nhà đơn sơ", "o": ["ngôi nhà đân sơ", "ngôi nhà đơn sơ"], "a": 1}]}, {"t": "mcq", "title": "Bài 2. Chọn nghĩa đúng", "items": [{"q": "Nhà sàn", "o": ["Ngôi nhà dựng trên các cột cao, thường thấy ở vùng núi", "Ngôi nhà có mái vòm lớn", "Nhà xây hoàn toàn bằng gạch"], "a": 0}, {"q": "Mái che", "o": ["Phần trang trí trên tường", "Kết cấu che nắng mưa phía trên một khoảng không", "Sàn gỗ phía trước nhà"], "a": 1}, {"q": "Đất sét", "o": ["Loại đất mềm, có thể nặn và dùng làm gốm", "Đất pha cát dùng để xây nhà", "Đất màu đỏ thường gặp ở vùng cao"], "a": 0}, {"q": "Hàng rào", "o": ["Lối đi nhỏ giữa hai khu nhà", "Vật dựng lên để ngăn cách hoặc bảo vệ một khu vực", "Cột chống mái nhà"], "a": 1}, {"q": "Lợp mái", "o": ["Trang trí tường bằng hoa văn", "Che phủ phần mái bằng lá, ngói hoặc vật liệu khác", "Đào đất để làm nền nhà"], "a": 1}, {"q": "Thờ cúng", "o": ["Hoạt động vui chơi trong lễ hội", "Thực hành nghi lễ để tưởng nhớ tổ tiên hoặc thần linh", "Sửa chữa đồ vật trong nhà"], "a": 1}, {"q": "Chạm trổ", "o": ["Khắc hoặc tạo hình trang trí trên gỗ, đá, kim loại", "Đắp đất để tạo hình", "Sơn màu lên bề mặt"], "a": 0}]}, {"t": "mcq", "title": "Bài 3. Chọn đáp án đúng", "items": [{"q": "Ngôi ___ truyền thống này được xây bằng vật liệu tự nhiên, mang lại cảm giác gần gũi với môi trường xung quanh.", "o": ["nhà lá", "nhà ở", "sân hiên"], "a": 0}, {"q": "Trước khi dựng cột, họ phải ___ thật chắc để đảm bảo công trình không bị lún.", "o": ["thoáng đãng", "đổ móng", "gọn gàng"], "a": 1}, {"q": "Buổi chiều mùa hè ngồi ở ___ nhìn ra vườn, ai cũng thấy thư thái khi gió thổi nhẹ qua.", "o": ["sân hiên", "nhà ở", "mát rượi"], "a": 0}, {"q": "Không gian bên trong được sắp xếp rất ___, giúp việc sinh hoạt hằng ngày trở nên thuận tiện hơn.", "o": ["mát rượi", "gọn gàng", "nhà lá"], "a": 1}, {"q": "Nhờ nhiều cửa sổ và khoảng mở, ngôi nhà luôn ___ ngay cả trong những ngày nóng bức.", "o": ["thoáng đãng", "gọn gàng", "sân hiên"], "a": 0}, {"q": "Buổi sáng, gió từ hồ thổi vào khiến căn phòng trở nên ___.", "o": ["nhà lá", "mát rượi", "gọn gàng"], "a": 1}, {"q": "Khu ___ mới được xây theo hướng tận dụng ánh sáng tự nhiên, giúp tiết kiệm điện và tạo sự thoải mái.", "o": ["sân hiên", "nhà ở", "thoáng đãng"], "a": 1}]}, {"t": "tf", "title": "Bài 4. Đúng hay sai?", "items": [["Cô ấy phải làm thêm buổi tối để hoàn thành dự án đúng hạn.", true], ["Anh ấy đã cố gắng nói to hơn mà mọi người nghe rõ hơn.", false], ["Cuối cùng, nhóm nghiên cứu đã tìm ra hướng giải quyết mới cho vấn đề này.", true], ["Tôi tin rằng là kết quả sẽ tốt hơn nếu chúng ta kiên trì.", false], ["Em ấy dùng kính lúp bằng nhìn rõ chi tiết hơn.", false], ["Đáng nói, báo cáo lần này phản ánh đầy đủ hơn những khó khăn thực tế.", true], ["Chúng tôi cho rằng quyết định đó hợp lý trong hoàn cảnh hiện tại.", true]]}, {"t": "mcq", "title": "Bài 5. Chọn đáp án đúng nhất", "items": [{"q": "Cô ấy dành nhiều thời gian đọc tài liệu ___ hiểu rõ hơn về bối cảnh lịch sử của vấn đề đang nghiên cứu.", "o": ["mà", "để", "bằng"], "a": 1}, {"q": "___, việc thay đổi quy trình đã giúp giảm đáng kể thời gian xử lý.", "o": ["Cho rằng", "Đáng nói", "Nghĩ rằng"], "a": 1}, {"q": "Tôi ___ việc hợp tác với nhóm mới sẽ mở ra nhiều cơ hội hơn cho chúng tôi.", "o": ["đáng nói", "tin rằng", "bằng"], "a": 1}, {"q": "Hôm nay chị cứ lấy xe của tôi ___ đi cho kịp công việc. Đừng ngại.", "o": ["cho", "để", "mà"], "a": 2}, {"q": "Cô giáo ___ học sinh cần chủ động hơn trong việc chuẩn bị bài trước khi đến lớp để buổi học thực sự có hiệu quả cao.", "o": ["đáng nói", "bằng", "nói rằng"], "a": 2}, {"q": "___, kết quả khảo sát cho thấy người dân quan tâm nhiều hơn đến vấn đề môi trường.", "o": ["Cho rằng", "Đáng nói", "Nghĩ rằng"], "a": 1}, {"q": "Tôi ___ việc thay đổi kế hoạch vào phút cuối có thể gây nhiều rủi ro.", "o": ["cho rằng", "bằng", "mà"], "a": 0}]}]}, {"id": 9, "vi": "Dự báo lạm phát", "en": "Inflation forecast", "it": "Previsione dell’inflazione", "page": 168, "tracks": [["Nghe 1", "Book3_Lesson9_Listening1_North.mp3", "Bắc"], ["Nghe 2", "Book3_Lesson9_Listening2_North.mp3", "Bắc"]], "grammar": {"points": [{"h": "1. Một mặt là do …, mặt khác do … — on the one hand …, on the other hand …", "b": "<p>Explains reasons by dividing an issue into two aspects.</p><p class='ex'>Nguyên nhân chính khiến sản lượng nông sản giảm, một mặt là do hạn hán kéo dài khiến cây trồng chết khô, mặt khác do giá vận tải biển tăng đột ngột khiến việc xuất khẩu trở nên khó khăn.<br><span>Agricultural output fell, on the one hand because of a long drought, on the other hand because sea-freight prices suddenly rose, making exports difficult.</span></p>"}, {"h": "2. Với giả định … được dự báo — assuming …, it is forecast", "b": "<p>Makes predictions based on specific assumptions.</p><p class='ex'>Với giả định rằng tình hình thời tiết tiếp tục ổn định trong mùa mưa, sản lượng nông sản dự kiến sẽ tăng trong năm nay.<br><span>Assuming the weather stays stable in the rainy season, agricultural output is expected to rise this year.</span></p>"}, {"h": "3. Được gọi là / được xem là / được xem như / còn gọi là — is called, is considered", "b": "<p>Expresses a judgement or evaluation.</p><p class='ex'>Với người Việt Nam, Tết Nguyên Đán được xem là ngày lễ quan trọng nhất trong một năm.<br><span>For Vietnamese people, Lunar New Year is considered the most important festival of the year.</span></p><p class='ex'>Nguyễn Du được gọi là đại thi hào dân tộc.<br><span>Nguyễn Du is called the great national poet.</span></p>"}], "ex": [{"t": "open", "title": "Bài 2. Hoàn thành câu (gợi ý đáp án)", "items": [["Ở Trung Quốc, Hàn Quốc, Tết Trung thu còn gọi là …", "… tết đoàn viên vì mọi người đều trở về bên gia đình vào dịp này."], ["Với giả định số lượng sinh viên đăng ký tăng, …", "… dự báo sẽ có tình trạng thiếu lớp học trong học kỳ tới."], ["Nhiều sinh viên ra trường thất nghiệp bởi một mặt là do …", "… họ thiếu kinh nghiệm, mặt khác là do họ thường yêu cầu mức lương quá cao."], ["Những điều anh ấy nói được xem như …", "… một lời xin lỗi chân thành gửi tới chúng tôi."], ["Giá thuê nhà ở khu vực này đắt, một mặt là do …", "… khu này ở trung tâm thành phố, mặt khác do những tiện ích vượt trội ở đây làm cho cuộc sống của người dân rất thoải mái."], ["Với giả định nguồn cung lương thực đủ đến tháng 12 năm nay …", "… dự báo chúng ta sẽ phải tìm nguồn nhập khẩu lương thực vào năm sau."], ["Nhiều công ty nước ngoài muốn đầu tư vào tỉnh này một mặt là do …", "… có chính sách tốt, mặt khác do ở đây có nguồn nhân công trẻ mà chất lượng."]]}]}, "vocab": [["Danh từ · Nouns", [["Thị trường", "Market", "Mercato"], ["Lạm phát", "Inflation", "Inflazione"], ["Kinh tế", "Economy", "Economia"], ["Động lực", "Driving force, motivation", "Motore, motivazione"], ["Mục tiêu", "Goal", "Obiettivo"], ["Kim ngạch xuất khẩu", "Export turnover", "Fatturato delle esportazioni"], ["Tiền tệ", "Currency", "Valuta"], ["Lãi suất", "Interest rate", "Tasso di interesse"], ["Tỷ giá", "Exchange rate", "Tasso di cambio"]]], ["Động từ · Verbs", [["Kiềm chế", "To restrain", "Contenere"], ["Suy thoái", "To go into recession", "Entrare in recessione"], ["Tăng trưởng", "To grow", "Crescere"], ["Phục hồi", "To recover", "Riprendersi"], ["Kiểm soát", "To control", "Controllare"], ["Suy giảm", "To decline", "Diminuire"]]], ["Tính từ · Adjectives", [["Lao đao", "Struggling", "In difficoltà"], ["Chật vật", "Hard-pressed", "In affanno"], ["Khả quan", "Positive, encouraging", "Positivo"], ["Thận trọng", "Cautious", "Prudente"], ["Bình quân", "Average", "Medio"]]]], "practice": [{"t": "mcq", "title": "Bài 1. Nghe và chọn cụm từ đúng", "listen": 1, "items": [{"say": "thị trường biến động", "o": ["thị trường biến động", "thị trườn biến đông"], "a": 0}, {"say": "tăng trưởng kinh tế", "o": ["tăng trưởng kinh tế", "tăng trường kinh tế"], "a": 0}, {"say": "động lực phát triển", "o": ["đồng lựt phát triển", "động lực phát triển"], "a": 1}, {"say": "kim ngạch xuất khẩu", "o": ["kim ngạch xuất khẩu", "kim ngạt xuất khầu"], "a": 0}, {"say": "lãi suất tiền gửi", "o": ["lái suất tiền gửi", "lãi suất tiền gửi"], "a": 1}, {"say": "kiềm chế lạm phát", "o": ["kiềm chế lạm phát", "kiềm chê lạn phác"], "a": 0}, {"say": "thu nhập bình quân", "o": ["thu nhập bình quân", "thu nhật bình quân"], "a": 0}]}, {"t": "mcq", "title": "Bài 2. Chọn nghĩa đúng", "items": [{"q": "Thị trường", "o": ["Nơi diễn ra hoạt động mua bán hàng hóa và dịch vụ", "Khu vực sản xuất nguyên liệu", "Hệ thống vận chuyển hàng hóa"], "a": 0}, {"q": "Lạm phát", "o": ["Tình trạng giá hàng hóa giảm mạnh", "Hiện tượng giá cả tăng liên tục, làm giảm sức mua của tiền", "Sự mất cân đối giữa cung và cầu"], "a": 1}, {"q": "Động lực", "o": ["Sự cản trở khiến ai đó chậm lại", "Nguồn thúc đẩy khiến con người hành động hoặc cố gắng hơn", "Tác động bên ngoài làm thay đổi kế hoạch"], "a": 1}, {"q": "Tiền tệ", "o": ["Hệ thống đo lường hàng hóa", "Phương tiện trao đổi được dùng trong giao dịch kinh tế", "Công cụ quản lý doanh nghiệp"], "a": 1}, {"q": "Tỷ giá", "o": ["Mức quy đổi giữa hai loại tiền tệ khác nhau", "Giá bán của một loại hàng hóa", "Lợi nhuận thu được sau giao dịch"], "a": 0}, {"q": "Phục hồi", "o": ["Làm giảm tốc độ tăng trưởng", "Trở lại trạng thái ổn định hoặc phát triển sau thời gian suy giảm", "Ngừng hoạt động hoàn toàn"], "a": 1}, {"q": "Bình quân", "o": ["Mức cao nhất trong một nhóm số liệu", "Giá trị trung bình của một tập hợp dữ liệu", "Số liệu thấp nhất được ghi nhận"], "a": 1}]}, {"t": "mcq", "title": "Bài 3. Chọn đáp án đúng", "items": [{"q": "Trong bối cảnh toàn cầu biến động, nhiều quốc gia phải điều chỉnh chính sách ___ để giữ ổn định thị trường trong nước.", "o": ["kinh tế", "khả quan", "lãi suất"], "a": 0}, {"q": "Ngân hàng trung ương quyết định tăng ___ nhằm hạn chế tình trạng vay mượn quá mức.", "o": ["mục tiêu", "lãi suất", "tăng trưởng"], "a": 1}, {"q": "Chính phủ đặt ra ___ rõ ràng cho từng giai đoạn, giúp định hướng các chương trình phát triển dài hạn.", "o": ["mục tiêu", "mục đích", "kiềm chế"], "a": 0}, {"q": "Ông ấy đã phải ___ cơn giận vì muốn giữ thể diện cho các con.", "o": ["xúc động", "kiềm chế", "khả quan"], "a": 1}, {"q": "Sau thời gian suy giảm, nền kinh tế đã có dấu hiệu ___, khiến nhà đầu tư lạc quan hơn.", "o": ["lao đao", "khả quan", "kiềm chế"], "a": 1}, {"q": "Do ảnh hưởng của biến động giá nguyên liệu, không ít công ty rơi vào cảnh ___ và phải thu hẹp sản xuất.", "o": ["tăng trưởng", "lao đao", "mục tiêu"], "a": 1}, {"q": "Nhờ chính sách hỗ trợ kịp thời, tốc độ ___ của ngành dịch vụ đã phục hồi đáng kể.", "o": ["lãi suất", "kiềm chế", "tăng trưởng"], "a": 2}]}, {"t": "tf", "title": "Bài 4. Đúng hay sai?", "items": [["Một mặt là do thời tiết thay đổi thất thường, mặt khác do hệ thống thoát nước yếu nên khu vực này thường bị ngập.", true], ["Thị trường ổn định với giả định, giá cả được dự báo sẽ giảm nhẹ.", false], ["Là do anh ấy cố gắng một mặt, mặt khác là do anh ấy được giúp đỡ nên mới thành công.", false], ["Với giả định nhu cầu tăng mạnh, doanh thu quý sau được dự báo sẽ vượt mức trung bình.", true], ["Loại vật liệu này được xem như giải pháp bền vững cho các công trình hiện đại.", true], ["Khu vực này trung tâm thành phố còn gọi là vì có nhiều công trình quan trọng và luôn đông đúc, nhộn nhịp.", false]]}, {"t": "order", "title": "Bài 5. Sắp xếp các từ thành câu đúng", "items": [{"w": ["một mặt là do", "thiếu nhân lực", ",", "mặt khác do", "khối lượng", "quá lớn", "công việc", "."], "a": "Một mặt là do thiếu nhân lực, mặt khác do khối lượng công việc quá lớn."}, {"w": ["với giả định", "tiếp tục tăng", ",", "nhu cầu", "được dự báo", "giá cả", "nhích lên", "sẽ", "."], "a": "Với giả định nhu cầu tiếp tục tăng, giá cả được dự báo sẽ nhích lên."}, {"w": ["dự án này", "quan trọng", "được xem là", "bước tiến", "trong lĩnh vực", "công nghệ xanh", "."], "a": "Dự án này được xem là bước tiến quan trọng trong lĩnh vực công nghệ xanh."}, {"w": ["người dân", "một mặt là do", ",", "mặt khác là do", "thiếu thông tin", "thay đổi", "quy định", "liên tục", "."], "a": "Một mặt là do người dân thiếu thông tin, mặt khác là do quy định thay đổi liên tục."}, {"w": ["với giả định", "thuận lợi", ",", "thời tiết", "được dự báo", "mùa vụ", "năng suất cao", "sẽ đạt", "."], "a": "Với giả định thời tiết thuận lợi, mùa vụ được dự báo sẽ đạt năng suất cao."}, {"w": ["còn gọi là", "hiện tượng này", "sự phân tầng", "nhiệt độ", "thường xuất hiện", "và", "vào ban đêm", "."], "a": "Hiện tượng này còn gọi là sự phân tầng nhiệt độ và thường xuất hiện vào ban đêm."}, {"w": ["loại cây này", "biểu tượng", "được xem như", "của vùng", "nhờ", "lâu đời", "giá trị văn hóa", "."], "a": "Loại cây này được xem như biểu tượng của vùng nhờ giá trị văn hóa lâu đời."}]}]}, {"id": 10, "vi": "Đồng bằng sông Cửu Long bị ngập mặn", "en": "The Mekong Delta faces saltwater intrusion", "it": "Il delta del Mekong affronta l’intrusione di acqua salata", "page": 186, "tracks": [["Nghe 1", "Book3_Lesson10_Listening1_NorthSouth.mp3", "Bắc & Nam"], ["Nghe 2", "Book3_Lesson10_Listening2_North.mp3", "Bắc"]], "grammar": {"points": [{"h": "1. Cụ thể (là) … vs Nói chung … — specifically vs in general", "b": "<p><b>Cụ thể (là)</b> introduces specific details; <b>nói chung</b> makes a general statement.</p><p class='ex'>Cụ thể, hơn 16.600 hộ dân ở huyện Giồng Trôm, tỉnh Bến Tre phải trả tiền nước là 51.500 đồng/m³, tăng gấp 5 lần so với bình thường.<br><span>Specifically, more than 16,600 households in Giồng Trôm district, Bến Tre, have to pay 51,500 VND/m³ for water, five times the usual price.</span></p><p class='ex'>Nói chung, thời tiết mùa hè ở đây rất nóng và khô.<br><span>In general, summer here is very hot and dry.</span></p>"}, {"h": "2. Conditional sentences: A mới B · Nhỡ A thì B · Cứ A là B", "b": "<ul><li><b>A mới B</b>: A is a necessary condition for B.</li><li><b>Nhỡ A thì B</b>: in case of an unfavourable A.</li><li><b>Cứ A là B</b>: B always follows A.</li></ul><p class='ex'>Anh phải có chứng chỉ tiếng Việt B2 mới đủ điều kiện nhập học.<br><span>You must have a B2 Vietnamese certificate to be eligible to enrol.</span></p><p class='ex'>Anh mang áo mưa đi nhỡ trời mưa thì không bị ướt.<br><span>Take a raincoat in case it rains, so you won’t get wet.</span></p><p class='ex'>Cứ vào thời điểm mùa khô là nhiều địa phương thiếu nước sinh hoạt trầm trọng.<br><span>Every dry season, many areas suffer severe shortages of household water.</span></p>"}, {"h": "3. Theo …, từ góc độ của …, ý kiến của … — expressing opinions", "b": "<p class='ex'>Từ góc độ của các chuyên gia thì sự nóng lên của khí hậu trái đất có một phần nguyên nhân do băng tan ở Bắc Cực.<br><span>From the experts’ perspective, global warming is partly caused by melting Arctic ice.</span></p><p class='ex'>Ý kiến của chúng tôi về vấn đề này là các bạn nên thiết kế một lớp học có diện tích đủ với sĩ số.<br><span>Our opinion is that you should design a classroom large enough for the number of students.</span></p>"}], "ex": [{"t": "open", "title": "Bài 2. Hoàn thành câu (gợi ý đáp án)", "items": [["Nói chung, khủng hoảng kinh tế đang …", "… ảnh hưởng nghiêm trọng đến cuộc sống của người dân ở nước này."], ["Ở Hà Nội, cứ mưa lâu …", "… là các khu vực thấp chắc chắn sẽ rơi vào tình trạng ngập lụt."], ["Ý kiến của chuyên gia cho thấy nếu giá xăng tiếp tục tăng …", "… thì sẽ làm cho chỉ số lạm … thì …, … thì … — some …, others …", "b": "<p>Expresses contrasts or differences between two related actions or situations.</p><p class='ex'>Con trai và con gái ông, người thì làm công nhân trong khu chế xuất Tân Bình, người thì làm phiên dịch tiếng Hoa cho một công ty Đài Loan.<br><span>Of his son and daughter, one works in the Tân Bình export zone, the other as a Chinese interpreter for a Taiwanese company.</span></p><p class='ex'>Có ngày thì nắng to, có ngày thì mưa lớn.<br><span>Some days are very sunny, other days very rainy.</span></p>"}, {"h": "2. … nào … cũng … — every, any … (without exception)", "b": "<p class='ex'>Người nhập cư nào, sau những năm tháng sống, gắn bó với Sài Gòn cũng đã trở thành một phần của thành phố.<br><span>Every immigrant, after years of living in Saigon, has become part of the city.</span></p><p class='ex'>Người nào chịu khó làm việc cũng sẽ thành công.<br><span>Anyone who works hard will succeed.</span></p>"}, {"h": "3. Nói về …, có lẽ không gì khác ngoài … — speaking of …, it is above all …", "b": "<p>Sets the topic and says what most characterises it.</p><p class='ex'>Nói về ẩm thực Pháp, có lẽ không gì khác ngoài bánh mì và phô mai.<br><span>When it comes to French cuisine, it is above all bread and cheese.</span></p>"}], "ex": [{"t": "open", "title": "Bài 2. Hoàn thành câu (gợi ý đáp án)", "items": [["Đối với tôi, ở đây, nhà hàng nào …", "… cũng có không gian thoáng đãng và thái độ phục vụ tận tụy."], ["Về chính sách tăng lương cho nhân viên, có hai luồng ý kiến, một thì …", "… nên tăng lương để thúc đẩy năng suất lao động, một thì nên giữ nguyên mức lương hiện tại để tránh ảnh hưởng đến tài chính của doanh nghiệp."], ["Nói về Hà Nội, có lẽ không gì khác …", "… ngoài việc nó được xem là trung tâm văn hóa và lịch sử của Việt Nam."], ["Những vấn đề về bảo vệ môi trường cần chú ý như sau, về … thì …", "… về giảm thiểu rác thải thì cần có biện pháp kiểm soát sử dụng đồ nhựa và tăng cường công tác tái chế."], ["Người nào ở đây cũng "], ["thủ phủ", "Thành phố trung tâm, nơi tập trung cơ quan quan trọng của một vùng."], ["địa bàn", "Khu vực được xác định về mặt quản lý hoặc phạm vi hoạt động."], ["di cư", "Việc chuyển nơi sinh sống từ vùng này sang vùng khác."], ["kiến tạo", "Hình thành, tạo dựng nên một cấu trúc hoặc giá trị mới."], ["gắn bó", "Có sự liên hệ chặt chẽ, tình cảm hoặc sự trung thành với một nơi / điều gì đó."], ["thờ ơ", "Không quan tâm, không chú ý đến sự việc xung quanh."]]}, {"t": "mcq", "title": "Bài 3. Chọn đáp án đúng", "items": [{"q": "Khu vực này được xem là trung tâm ___ của tỉnh, nơi tập trung nhiều cơ quan quan trọng.", "o": ["buôn bán", "hành chính", "dân cư"], "a": 1}, {"q": "Thành phố này ngày càng thu hút lượng lớn người ___ nhờ cơ hội việc làm và môi trường sống ổn định.", "o": ["di chuyển", "nhập cư", "lưu trú"], "a": 1}, {"q": "Người dân nơi đây rất cởi mở, luôn ___ những giá trị văn hóa mới một cách tích cực.", "o": ["từ chối", "đón nhận", "dè dặt"], "a": 1}, {"q": "Nhờ sự ___ không ngừng của cộng đồng, khu vực này đã thay đổi đáng kể trong vài năm gần đây.", "o": ["suy nghĩ", "nỗ lực", "điều chỉnh"], "a": 1}, {"q": "Ông ấy đã dành cả đời để ___ cho sự phát triển của địa phương nên được mọi người kính trọng.", "o": ["phục vụ", "cống hiến", "tham gia"], "a": 1}, {"q": "Nhờ điều kiện tự nhiên thuận lợi, vùng này trở nên ___ và là nơi cung cấp nông sản cho nhiều tỉnh.", "o": ["khan hiếm", "trù phú", "thưa thớt"], "a": 1}, {"q": "Cộng đồng ở đây nổi tiếng là ___ và luôn sẵn sàng giúp đỡ những người gặp khó khăn.", "o": ["nghiêm khắc", "bao dung", "thận trọng"], "a": 1}]}, {"t": "tf", "title": "Bài 4. Đúng hay sai?", "items": [["Anh ấy chăm chỉ thì kết quả tốt, thì lại không được ghi nhận đúng mức.", false], ["Tài liệu nào cũng cần được kiểm tra kỹ trước khi gửi đi.", true], ["Nói về làng nghề này, có lẽ không gì khác ngoài sự đa dạng của sản phẩm.", true], ["Thời gian gần đây, cuộc họp nào cũng là diễn ra vào buổi tối.", false], ["Trời mưa thì đường trơn, thì việc di chuyển chắc chắn sẽ trở nên khó khăn hơn.", true], ["Anh ấy nói về thì có lẽ không gì khác ngoài sự kiên nhẫn và cẩn trọng trong công việc.", false]]}, {"t": "order", "title": "Bài 5. Sắp xếp các từ thành câu đúng", "items": [{"w": ["ở đây", "cũng", "tư liệu", "nào", "được", "hết sức", "lưu trữ", "cẩn thận", "."], "a": "Tư liệu nào ở đây cũng được lưu trữ hết sức cẩn thận."}, {"w": ["âm nhạc", ",", "nói về", "không gì khác", "sự sáng tạo", "có lẽ", "ngoài", "."], "a": "Nói về âm nhạc, có lẽ không gì khác ngoài sự sáng tạo."}, {"w": ["bận", "anh ấy", "tôi", "hỗ trợ", "thì", "thì", "dự án", "tiến độ", "đảm bảo", "vẫn được", "."], "a": "Anh ấy bận thì tôi hỗ trợ thì tiến độ dự án vẫn được đảm bảo."}, {"w": ["tham gia", "khi", "giao thông", ",", "phải", "người", "tuân thủ", "nào cũng", "quy định chung", "."], "a": "Khi tham gia giao thông, người nào cũng phải tuân thủ quy định chung."}, {"w": ["thành phố này", ",", "nói về", "không gì khác ngoài", "sự", "có lẽ", "nhộn nhịp", "."], "a": "Nói về thành phố này, có lẽ không gì khác ngoài sự nhộn nhịp."}, {"w": ["thì", "lạnh", "trời", "ít người", "thì", "ra đường", "vắng hơn", "quán xá", "."], "a": "Trời lạnh thì ít người ra đường thì quán xá vắng hơn."}]}]}, {"id": 12, "vi": "Công nghệ AI của hiện tại và tương lai", "en": "Current and future of AI technology", "it": "Tecnologia AI attuale e futura", "page": 225, "tracks": [["Nghe 1", "Book3_Lesson12_Listening1_North.mp3", "Bắc"], ["Nghe 2", "Book3_Lesson12_Listening2_South.mp3", "Nam"]], "grammar": {"points": [{"h": "1. Chứng tỏ (là) … — it shows / proves that", "b": "<p>Introduces evidence that supports a claim.</p><p class='ex'>Chứng tỏ, sự phát triển nhanh chóng của công nghệ trí tuệ nhân tạo đã thúc đẩy việc áp dụng hệ thống xe tự lái trên đường phố.<br><span>This shows that the rapid development of AI has driven the use of self-driving cars on the streets.</span></p>"}, {"h": "2. Điển hình là … — a typical example is", "b": "<p>Introduces an example that represents a larger category.</p><p class='ex'>Điển hình là việc ứng dụng AI vào hệ thống chatbot và trợ lý ảo tại các trung tâm hành chính.<br><span>A typical example is the use of AI in chatbots and virtual assistants at administrative centres.</span></p>"}, {"h": "3. … góp phần mang lại … — contributes to bringing", "b": "<p>Emphasises the role of something in achieving a result.</p><p class='ex'>Sự phát triển của trí tuệ nhân tạo góp phần mang lại sự tiện lợi và tiết kiệm thời gian trong việc tìm kiếm thông tin trực tuyến.<br><span>The development of AI contributes to convenience and time savings when searching for information online.</span></p>"}], "ex": [{"t": "fill", "title": "Bài 2. Hoàn thành câu với các cấu trúc trên", "items": ["Sử dụng máy tính và phần mềm hỗ trợ *góp phần mang lại* hiệu suất cao trong công việc và giảm thời gian hoàn thành các nhiệm vụ.", "Những ca thành công gần đây *chứng tỏ là/chứng tỏ* việc sử dụng trí tuệ nhân tạo trong y tế đã giúp chẩn đoán bệnh chính xác hơn và nhanh chóng hơn.", "*Điển hình là* việc áp dụng công nghệ blockchain trong lĩnh vực tài chính đã mở ra cơ hội chuyển đổi kỹ thuật số của hệ thống tài chính truyền thống.", "Công nghệ Internet đã *góp phần mang lại* sự kết nối toàn cầu và truy cập thông tin dễ dàng hơn cho mọi người trên khắp thế giới.", "Sự phát triển của công nghệ di động đã mang lại tiện ích và linh hoạt trong việc truy cập thông tin và giao tiếp, tuy nhiên, cũng gây ra những vấn đề xã hội, *điển hình là* những vấn đề về quyền riêng tư và an ninh thông tin.", "Công nghệ *góp phần mang lại* sự tiện lợi và tự động hóa trong cuộc sống hàng ngày, nhưng cũng đặt ra thách thức về quản lý dữ liệu cá nhân."]}]}, "vocab": [["Danh từ · Nouns", [["Khoa học máy tính", "Computer science", "Informatica"], ["Kỹ thuật số", "Digital technology", "Tecnologia digitale"], ["Trí thông minh", "Intelligence", "Intelligenza"], ["Dữ liệu", "Data", "Dati"], ["Thị giác", "Vision", "Visione"], ["Cách mạng 4.0", "Industry 4.0", "Industria 4.0"], ["Học máy", "Machine learning", "Apprendimento automatico"], ["Đỉnh cao", "Peak, apex", "Apice"]]], ["Động từ · Verbs", [["Chạy đua", "To race", "Gareggiare"], ["Phán đoán", "To predict, to judge", "Prevedere"], ["Xử lý", "To process", "Elaborare"], ["Sáng chế", "To invent", "Inventare"], ["Công bố", "To announce", "Annunciare"], ["Bảo hộ", "To protect", "Proteggere"], ["Cải tiến", "To improve", "Migliorare"], ["Cải cách", "To reform", "Riformare"], ["Nhận dạng", "To identify", "Identificare"], ["Tích hợp", "To integrate", "Integrare"]]], ["Tính từ · Adjectives", [["Rộng rãi", "Widespread", "Diffuso"], ["Tiên tiến", "Advanced", "Avanzato"], ["Đột phá", "Breakthrough", "Innovativo"]]]], "practice": [{"t": "mcq", "title": "Bài 1. Nghe và chọn cụm từ đúng", "listen": 1, "items": [{"say": "khoa học máy tính", "o": ["khoa học máy tính", "khoa họp mái tính"], "a": 0}, {"say": "trí tuệ nhân tạo", "o": ["trí tuề nhân tao", "trí tuệ nhân tạo"], "a": 1}, {"say": "cách mạng công nghệ", "o": ["cách mạng công nghệ", "cát mạng cồng nghệ"], "a": 0}, {"say": "bằng sáng chế", "o": ["bằng sáng chế", "bằn sán chế"], "a": 0}, {"say": "bảo hộ công dân", "o": ["báo hồ côn dân", "bảo hộ công dân"], "a": 1}, {"say": "cải tiến máy móc", "o": ["cải tiến máy móc", "cái tiên mái móc"], "a": 0}, {"say": "phán đoán tình huống", "o": ["phan đoan tình huông", "phán đoán tình huống"], "a": 1}]}, {"t": "fill", "title": "Bài 2. Điền từ vào đoạn văn", "items": ["Trong thời đại *kỹ thuật số*, các hệ thống nói chung ngày càng phụ thuộc vào lượng *dữ liệu* khổng lồ được thu thập từ nhiều nguồn khác nhau. Nhờ sự phát triển của *học máy*, các mô hình có thể tự động phân tích và *xử lý* thông tin với tốc độ vượt trội. Điều này không chỉ nâng cao mức độ *trí thông minh* của các ứng dụng mà còn thúc đẩy nhiều *cải tiến* quan trọng trong lĩnh vực công nghệ. Gần đây, một nghiên cứu được *công bố* đã cho thấy tiềm năng ứng dụng rộng rãi của các giải pháp này trong đời sống."], "bank": ["kỹ thuật số", "dữ liệu", "học máy", "xử lý", "trí thông minh", "cải tiến", "công bố"]}, {"t": "mcq", "title": "Bài 3. Chọn đáp án đúng", "items": [{"q": "Công nghệ mô phỏng hình ảnh giúp tăng cường khả năng ___ cho các thiết bị hỗ trợ người dùng.", "o": ["thị giác", "thính lực", "phản xạ"], "a": 0}, {"q": "Sau nhiều năm phát triển, sản phẩm này đã đạt đến ___ của hiệu suất và độ ổn định.", "o": ["mức trung bình", "giới hạn", "đỉnh cao"], "a": 2}, {"q": "Các tập đoàn lớn đang ___ trong lĩnh vực trí tuệ nhân tạo để giành lợi thế trên thị trường.", "o": ["trì hoãn", "chạy đua", "hợp tác"], "a": 1}, {"q": "Một số quốc gia áp dụng chính sách ___ để bảo vệ doanh nghiệp trong nước trước sự cạnh tranh quốc tế.", "o": ["phân phối", "mở cửa", "bảo hộ"], "a": 2}, {"q": "Chính phủ đang tiến hành nhiều cuộc ___ nhằm nâng cao hiệu quả quản lý và minh bạch thông tin.", "o": ["cải cách", "điều chỉnh", "bổ sung"], "a": 0}, {"q": "Hệ thống mới có khả năng ___ khuôn mặt với độ chính xác rất cao, ngay cả trong điều kiện ánh sáng yếu.", "o": ["mô phỏng", "phân tích", "nhận dạng"], "a": 2}, {"q": "Thiết bị này sử dụng công nghệ ___ giúp tối ưu hóa tốc độ xử lý và giảm tiêu thụ năng lượng.", "o": ["cơ bản", "tiên tiến", "truyền thống"], "a": 1}]}, {"t": "tf", "title": "Bài 4. Đúng hay sai?", "items": [["Hệ thống đã hoạt động tốt, chứng tỏ là hệ thống đã được xây dựng một cách bài bản.", true], ["Điển hình là của dự án này đã đạt được những thành tựu vượt mong đợi.", false], ["Nỗ lực của nhóm nghiên cứu góp phần mang lại những cải tiến quan trọng cho sản phẩm.", true], ["Chứng tỏ dữ liệu là đã được xử lý đúng quy trình.", false], ["Điển hình là nhiều công ty đã mở rộng quy mô nhờ chính sách mới.", true], ["Hoạt động này góp phần mang lại là hiệu quả kinh tế cao hơn cho công ty trong quý 3 năm nay.", false]]}, {"t": "order", "title": "Bài 5. Sắp xếp các từ thành câu đúng", "items": [{"w": ["khu vực này", "rất", "phát triển", "điển hình là", "nhanh", "gần đây", "trong", "vài năm", "."], "a": "Điển hình là khu vực này phát triển rất nhanh trong vài năm gần đây."}, {"w": ["người dùng", "sự hài lòng", "của", "hệ thống", "chứng tỏ là", "cải thiện", "đã được", "đáng kể", "."], "a": "Sự hài lòng của người dùng chứng tỏ là hệ thống đã được cải thiện đáng kể."}, {"w": ["đội ngũ giáo viên", "của", "góp phần", "nỗ lực", "hiệu quả", "nâng cao", "dạy học", "trường này", "ở", "."], "a": ["Nỗ lực của đội ngũ giáo viên ở trường này góp phần nâng cao hiệu quả dạy học.", "Nỗ lực của đội ngũ giáo viên góp phần nâng cao hiệu quả dạy học ở trường này."]}, {"w": ["hai bên", "sự hợp tác", "giữa", "mang lại", "góp phần", "lâu dài", "lợi ích", "."], "a": "Sự hợp tác giữa hai bên góp phần mang lại lợi ích lâu dài."}, {"w": ["sản phẩm", "điển hình là", "thị trường", "đã được", "rộng rãi", "đón nhận", "."], "a": "Điển hình là sản phẩm đã được thị trường đón nhận rộng rãi."}, {"w": ["tự giác", "người dân", "việc", "phân loại rác", "người dân", "chứng tỏ là", "quan tâm đến", "ngày càng", "môi trường", "bảo vệ", "."], "a": "Việc người dân tự giác phân loại rác chứng tỏ là người dân ngày càng quan tâm đến bảo vệ môi trường."}]}]}];
