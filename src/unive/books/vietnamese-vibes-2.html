ợt qua chính mình."]}, {"t": "tf", "title": "Bài 3. Đúng hay sai?", "items": [["Sau 6 năm, em ấy đã trở nên một bác sĩ đa khoa.", false], ["Tuy kỳ thi này rất khó nhưng bạn ấy vẫn đạt kết quả cao.", true], ["Trời hôm nay nóng khá là.", false], ["Cô ấy ngày càng trở nên dễ tính và hòa đồng.", true], ["Mặc dù trời mưa to nên bà ấy vẫn đi ra ngoài.", false], ["Nhà anh Nam có bao nhiêu là sách.", true], ["Theo cô ấy, giá cả ở Hà Nội tương đối rẻ.", true]]}, {"t": "mcq", "title": "Bài 4. Chọn đáp án đúng", "items": [{"q": "Đây là người sẽ biểu diễn trực tiếp ở một chương trình ca nhạc:", "o": ["Khán giả", "Ca sĩ", "Người dẫn chương trình", "Kênh"], "a": 1}, {"q": "Những người đến xem một buổi biểu diễn hoặc thi đấu được gọi là:", "o": ["Khán giả", "Nghệ sĩ", "Tài năng", "Nổi tiếng"], "a": 0}, {"q": "Người giới thiệu, dẫn dắt nội dung sự kiện trong một chương trình là:", "o": ["Nghệ sĩ", "Tài năng", "Người dẫn chương trình", "Kênh"], "a": 2}, {"q": "Từ này nói đến một người được nhiều người biết đến và yêu mến:", "o": ["Phát sóng", "Tài năng", "Nổi tiếng", "Kênh"], "a": 2}, {"q": "Hôm nay, kênh VTV3 sẽ …… trực tiếp trận thi đấu chung kết bóng chuyền.", "o": ["Phát sóng", "Nổi tiếng", "Nghệ sĩ", "Tài năng"], "a": 0}, {"q": "Nếu một người có khả năng hát hay, vẽ đẹp hoặc chơi đàn giỏi thì sẽ gọi họ là người:", "o": ["Khán giả", "Nổi tiếng", "Tài năng", "Kênh"], "a": 2}, {"q": "Ở Việt Nam, VTV3, HTV7 hay VTC1 được gọi là:", "o": ["Khán giả", "Kênh", "Nghệ sĩ", "Phát sóng"], "a": 1}]}, {"t": "mcq", "title": "Bài 5. Chọn đáp án đúng", "items": [{"q": "Hôm qua, bà Lan đi chợ và đã mua …… rau củ.", "o": ["khá là", "bao nhiêu là", "vài"], "a": 1}, {"q": "Anh Minh đã …… một phi công giỏi sau 10 năm học tập vất vả.", "o": ["trở nên", "trở thành", "mong muốn"], "a": 1}, {"q": "Dạo này, giá cả sinh hoạt ở thành phố này …… đắt hơn.", "o": ["rất", "trở nên", "trở thành"], "a": 1}, {"q": "…… em ấy không học nhiều lắm …… kết quả thi của em ấy khá tốt.", "o": ["Tuy … nhưng", "Vì … nên", "Nếu … thì"], "a": 0}, {"q": "Sau một tuần du lịch ở Hà Nội, tôi đã biết một số quán cà phê …… rẻ.", "o": ["lắm", "bao nhiêu là", "tương đối"], "a": 2}, {"q": "Em ấy vẫn ăn cá …… em ấy không thích lắm.", "o": ["vì", "mặc dù", "nên"], "a": 1}, {"q": "Hôm nay, trời …… đẹp nên tôi quyết định đi ra ngoài.", "o": ["khá là", "lắm", "nhiều"], "a": 0}]}]}, {"id": 4, "vi": "Game thủ già nhất thế giới", "en": "The oldest gamer in the world", "it": "La videogiocatrice più anziana del mondo", "page": 61, "tracks": [["Nghe 1", "Book2_Lesson4_Listening1_NorthSouth.mp3", "Bắc & Nam"], ["Nghe 2", "Book2_Lesson4_Listening2_South.mp3", "Nam"]], "grammar": {"points": [{"h": "1. Chỉ … thôi — only", "b": "<p>Emphasises uniqueness, excluding anything else.</p><p class='ex'>Hôm nay, lớp của chúng tôi chỉ học kĩ năng nghe thôi.<br><span>Today, our class only studied listening skills.</span></p><p class='ex'>Vào mùa hè, anh ấy chỉ thích uống nước mía.<br><span>In summer, he only likes to drink sugarcane juice.</span></p>"}, {"h": "2. Một trong những + noun + là — one of the …", "b": "<p class='ex'>Một trong những món ăn Việt Nam tôi thích là chả cá.<br><span>One of my favourite Vietnamese dishes is chả cá.</span></p><p class='ex'>Một trong những tựa game yêu thích nhất của cụ là “Grand Theft Auto”.<br><span>One of her favourite game titles is “Grand Theft Auto”.</span></p>"}, {"h": "3. Làm sao mà … được — how could (it’s impossible)", "b": "<p>Expresses the inability to do something.</p><p class='ex'>Bài đọc này khó quá nên tôi làm sao mà hiểu được.<br><span>This reading is too difficult — how could I understand it?</span></p><p class='ex'>Đường rất đông. Tôi làm sao đi xe máy được.<br><span>The road is very crowded. How could I ride a motorbike?</span></p>"}, {"h": "4. Càng ngày càng / ngày càng + adjective — more and more", "b": "<p class='ex'>Việt Nam ngày càng cởi mở hơn.<br><span>Vietnam is becoming increasingly open.</span></p><p class='ex'>Bà ấy càng ngày càng khỏe.<br><span>She is getting healthier and healthier.</span></p>"}], "ex": [{"t": "open", "title": "Bài 2. Tìm và sửa lỗi sai", "items": [["Buổi sáng, anh ấy thích uống cà phê chỉ với bạn.", "→ chỉ thích uống cà phê với bạn"], ["Món ăn này cay lắm. Tôi được làm sao mà ăn.", "→ Tôi làm sao mà ăn được."], ["Với chúng tôi, học kỹ năng nói khó ngày càng.", "→ ngày càng khó"], ["Đường đông quá. Ông ấy làm sao đi qua đường mà được.", "→ làm sao đi qua đường được"], ["Thành phố của tôi càng hiện đại ngày càng.", "→ càng ngày càng hiện đại"], ["Nếu có thời gian thì bác ấy muốn ở nhà với các con chỉ.", "→ chỉ muốn ở nhà với các con"], ["Trên internet có nhiều thông tin hay nên em ấy không xem được làm sao mà.", "→ làm sao mà không xem được"]]}]}, "vocab": [["Danh từ · Nouns", [["Bảng điều khiển", "Control panel", "Pannello di controllo"], ["Game thủ", "Gamer", "Giocatore"], ["Tựa game", "Game title", "Titolo del gioco"], ["Phiên bản", "Version", "Versione"], ["Game hành động", "Action game", "Gioco d’azione"], ["Số lượng", "Quantity", "Quantità"], ["Số tiền", "Amount of money", "Importo di denaro"], ["Kỷ lục thế giới", "World record", "Record mondiale"], ["Cảm xúc", "Emotion", "Emozione"], ["Thanh niên", "Youth", "Giovinezza"]]], ["Động từ · Verbs", [["Ghi danh", "To recognise", "Riconoscere"], ["Ra mắt", "To launch", "Lanciare"], ["Trình chiếu", "To show", "Mostrare"], ["Dẫn dắt", "To lead", "Condurre"], ["Nhập vai", "To role-play", "Recitare (nel ruolo di)"]]], ["Tính từ · Adjectives", [["Đúng đắn", "Righteous", "Giusto"], ["Rực rỡ", "Radiant", "Radiante"], ["Hài hước", "Humorous", "Umoristico"], ["Dí dỏm", "Witty", "Spiritoso"], ["Tươi trẻ", "Youthful", "Giovanile"]]]], "practice": [{"t": "mcq", "title": "Bài 1. Nghe và chọn từ đúng", "listen": 1, "items": [{"say": "đăng kí", "o": ["Đăng kí", "Đăn kí"], "a": 0}, {"say": "khả năng", "o": ["Khá năng", "Khả năng"], "a": 1}, {"say": "nhập vai", "o": ["Nhật vai", "Nhập vai"], "a": 1}, {"say": "phiên bản", "o": ["Phiên bản", "Phiên bán"], "a": 0}, {"say": "điều khiển", "o": ["Điếu khiến", "Điều khiển"], "a": 1}, {"say": "hành động", "o": ["Hành động", "Hàng đông"], "a": 0}, {"say": "người chơi", "o": ["Người chơi", "Ngươi chơi"], "a": 0}]}, {"t": "match", "title": "Bài 2. Nối từ ngữ với hình ảnh", "pairs": [["💻", "Máy tính"], ["🖥️", "Màn hình"], ["⌨️", "Bàn phím cơ"], ["📱🎮", "Máy chơi game cầm tay"], ["🎧", "Tai nghe gaming"], ["🦸", "Nhân vật trong game"], ["🎮", "Tay cầm chơi game"]]}, {"t": "tf", "title": "Bài 3. Đúng hay sai?", "items": [["Hôm qua, em ấy chơi game chỉ thôi.", false], ["Cô ấy là một trong những nhân viên giỏi của công ty.", true], ["Món này cay quá nên tôi làm sao mà được ăn.", false], ["Anh Minh ngày càng mê viết game cho trẻ con.", true], ["Mỗi buổi sáng, tôi chỉ thích uống cà phê thôi.", true], ["Khu vực này đang phát triển càng ngày càng.", false], ["Làm sao mà bà ấy làm được công việc này.", true]]}, {"t": "mcq", "title": "Bài 4. Chọn đáp án đúng", "items": [{"q": "Anh ấy là một …… nổi tiếng ở thành phố này.", "o": ["game thủ", "nhập vai", "tựa game"], "a": 0}, {"q": "Tôi vừa mới nâng cấp game này lên …… pro nên có nhiều tính năng thú vị lắm.", "o": ["giải trí", "phiên bản", "đăng kí"], "a": 1}, {"q": "Đường đông quá. Em ấy làm sao mà sang đường ……", "o": ["có thể", "không thể", "được"], "a": 2}, {"q": "Hôm qua, anh ấy …… nói chuyện với bạn khoảng 30 phút.", "o": ["chỉ", "sẽ", "vừa"], "a": 0}, {"q": "Bây giờ, nhiều trẻ em …… thích chơi game hơn đọc sách.", "o": ["ngày càng", "càng ngày", "không"], "a": 0}, {"q": "…… Youtube của họ đã đạt 100.000 người đăng kí nên nhận được nút bạc.", "o": ["phiên bản", "tựa game", "kênh"], "a": 2}, {"q": "Anh ấy nói tiếng Việt nhanh quá, …… mọi người nghe và hiểu hết được.", "o": ["làm sao", "làm sao mà", "có thể"], "a": 1}]}, {"t": "order", "title": "Bài 5. Sắp xếp các từ thành câu đúng", "items": [{"w": ["thích", "tôi", "cùng", "bạn", "chơi", "trò chơi", "điện tử", "."], "a": ["Tôi thích cùng bạn chơi trò chơi điện tử.", "Tôi thích chơi trò chơi điện tử cùng bạn."]}, {"w": ["điện thoại", "chơi", "trên", "tôi", "thường", "trò chơi", "giải trí", "."], "a": "Tôi thường chơi trò chơi giải trí trên điện thoại."}, {"w": ["bạn", "thể loại", "thích", "game", "nhất", "là", "gì", "?"], "a": "Thể loại game bạn thích nhất là gì?"}, {"w": ["game", "trước khi", "bài tập", "tôi", "làm", "chơi", "luôn", "."], "a": "Tôi luôn làm bài tập trước khi chơi game."}, {"w": ["cùng", "bạn bè", "cuối tuần", "chúng tôi", "chơi", "thường", "game online", "."], "a": ["Cuối tuần chúng tôi thường chơi game online cùng bạn bè.", "Cuối tuần chúng tôi thường cùng bạn bè chơi game online.", "Chúng tôi thường chơi game online cùng bạn bè cuối tuần."]}, {"w": ["quá", "ảnh hưởng", "chơi game", "nhiều", "đến", "sức khỏe", "sẽ", "."], "a": "Chơi game quá nhiều sẽ ảnh hưởng đến sức khỏe."}]}]}, {"id": 5, "vi": "Cách làm nem rán", "en": "How to make fried spring rolls", "it": "Come preparare gli involtini fritti", "page": 75, "tracks": [["Nghe 1", "Book2_Lesson5_Listening1_North.mp3", "Bắc"], ["Nghe 2", "Book2_Lesson5_Listening2_North.mp3", "Bắc"]], "grammar": {"points": [{"h": "1. Phải đến / đến + quantity — as much as, up to", "b": "<p>Estimates or emphasises a size or quantity that the speaker considers large.</p><p class='ex'>Tòa nhà này cao phải đến 20m.<br><span>This building is as high as 20 metres.</span></p><p class='ex'>Quả táo này nặng đến nửa cân.<br><span>This apple weighs as much as half a kilo.</span></p>"}, {"h": "2. Khi A thì B — when A, (then) B", "b": "<p>Two actions or states that happen one after the other or at the same time.</p><p class='ex'>Khi nem rán chuyển sang màu vàng đẹp mắt thì vớt ra để trên đĩa có lót sẵn giấy thấm dầu.<br><span>When the spring rolls turn golden, take them out and place them on a plate lined with paper towels.</span></p><p class='ex'>Khi tôi đang đi làm thì anh ấy đi chơi với bạn.<br><span>While I was working, he went out with his friends.</span></p>"}, {"h": "3. Verb + không xuể / không nổi — can’t manage", "b": "<ul><li><b>không xuể</b>: can’t do it because the <b>quantity</b> is too large.</li><li><b>không nổi</b>: can’t do it because it is too <b>difficult</b>.</li></ul><p class='ex'>Cô giáo cho nhiều bài tập quá nên chúng tôi làm không xuể.<br><span>The teacher gave us too many exercises, so we couldn’t finish them.</span></p><p class='ex'>Bài nghe rất khó nên các em ấy không nghe nổi.<br><span>The listening exercise was very difficult, so they couldn’t understand it.</span></p>"}, {"h": "4. Hẳn + noun — (no less than) the …", "b": "<p>Emphasises the importance of the person or thing.</p><p class='ex'>Cuối cùng, tôi đã gặp được hẳn hiệu trưởng của trường Ngoại ngữ.<br><span>In the end, I met the headmaster of the Foreign Language School himself.</span></p>"}], "ex": [{"t": "open", "title": "Bài 2. Dùng các cấu trúc trên để viết lại câu", "items": [["Anh trai của Hoa rất cao, khoảng 1m85.", "Anh trai của Hoa cao phải đến 1m85."], ["Sáng nay, tôi đi làm ở công ty còn con trai tôi đi học ở trung tâm tiếng Việt.", "Khi tôi đi làm ở công ty thì con trai tôi đi học ở trung tâm tiếng Việt."], ["Ở Hà Nội, đường hẹp và đông người nên tôi không lái xe ô tô được.", "Tôi lái xe ở Hà Nội không nổi vì đường hẹp và đông người."], ["Hôm nay anh ấy được đi gặp một người rất quan trọng là chủ tịch Quận.", "Anh ấy đi gặp hẳn chủ tịch Quận."], ["Giám đốc đưa nhiều báo cáo trong một ngày và anh ấy không đọc hết.", "Anh ấy đọc báo cáo không xuể."], ["Vợ của anh ấy đang nấu cơm. Anh ấy đang sửa cái ghế bị gãy.", "Khi vợ anh ấy nấu cơm thì anh ấy sửa cái ghế bị gãy."], ["Hồ Tây ở Hà Nội rộng lắm, gần 50 ha.", "Hồ Tây ở Hà Nội rộng đến gần 50 ha."]]}]}, "vocab": [["Danh từ · Nouns", [["Miến", "Vermicelli", "Vermicelli"], ["Hành", "Onion", "Cipolla"], ["Tỏi", "Garlic", "Aglio"], ["Nước mắm", "Fish sauce", "Salsa di pesce"], ["Tiêu", "Pepper", "Pepe"], ["Nhân nem", "Spring roll filling", "Ripieno per involtini"], ["Đường", "Sugar", "Zucchero"], ["Giấm", "Vinegar", "Aceto"], ["Dầu ăn", "Cooking oil", "Olio da cucina"]]], ["Động từ · Verbs", [["Cuốn", "To roll", "Arrotolare"], ["Pha", "To blend", "Mescolare"], ["Trộn", "To mix", "Mischiare"], ["Băm", "To mince", "Tritare"], ["Gọt", "To peel", "Sbucciare"], ["Ngâm", "To soak", "Mettere in ammollo"], ["Cắt", "To cut", "Tagliare"]]], ["Trạng từ / Tính từ · Adverbs / Adjectives", [["Khuấy đều", "Stir well", "Mescolare bene"], ["Rửa sạch", "Clean thoroughly", "Pulire accuratamente"], ["Chín đều", "Cook evenly", "Cuocere uniformemente"], ["Đẹp mắt", "Eye-catching", "Accattivante"]]]], "practice": [{"t": "mcq", "title": "Bài 1. Nghe và chọn từ đúng", "listen": 1, "items": [{"say": "thái", "o": ["Thái", "Thai"], "a": 0}, {"say": "nước mắm", "o": ["Nướt mắn", "Nước mắm"], "a": 1}, {"say": "luộc", "o": ["Luột", "Luộc"], "a": 1}, {"say": "nguyên liệu", "o": ["Nguyên liệu", "Nguyên liều"], "a": 0}, {"say": "trộn", "o": ["Trộn", "Trộm"], "a": 0}, {"say": "cuốn", "o": ["Cuộn", "Cuốn"], "a": 1}, {"say": "gọt", "o": ["Gọt", "Gọc"], "a": 0}]}, {"t": "match", "title": "Bài 2. Nối hình ảnh với từ", "pairs": [["🍳", "Chiên"], ["⚪📄", "Bánh đa nem"], ["🥩", "Thịt băm"], ["🌀🥤", "Xay"], ["🔪", "Băm"], ["🧄🥕🧅", "Nguyên liệu"], ["🏠🍽️", "Phòng bếp"]]}, {"t": "tf", "title": "Bài 3. Đúng hay sai?", "items": [["Món này cay quá, tôi ăn không xuể.", false], ["Phòng bếp là nơi bạn đón tiếp người khách đến nhà.", false], ["Anh ấy hẳn là một giám đốc rất giỏi.", true], ["Khi tôi đi học nên mẹ tôi cũng đi làm.", false], ["Từ nhà anh đến trung tâm thành phố phải đến 3 cây.", true], ["Chiên là cách nấu không cần sử dụng nhiều dầu mỡ.", false], ["Cô giáo cho nhiều bài tập quá nên chúng tôi làm không xuể.", true]]}, {"t": "mcq", "title": "Bài 4. Chọn đáp án đúng", "items": [{"q": "Từ trường của tôi đến bảo tàng khá xa, …… 10 cây đấy.", "o": ["phải đến", "chỉ", "mỗi"], "a": 0}, {"q": "Vấn đề này phức tạp hơn tôi nghĩ nên tôi giải quyết ……", "o": ["không xuể", "không nổi", "có thể"], "a": 1}, {"q": "Hôm qua, em ấy đã được gặp …… tổng giám đốc của công ty. Thật vinh dự!", "o": ["những", "mỗi", "hẳn"], "a": 2}, {"q": "Đây là một nguyên liệu không thể thiếu trong khi nấu ăn của người Việt.", "o": ["nước mắm", "nước ngọt", "nước suối"], "a": 0}, {"q": "…… chúng tôi ở nhà làm việc …… họ đang được đi du lịch Thái Lan.", "o": ["Vì … nên", "Nếu … thì", "Khi … thì"], "a": 2}, {"q": "Mẹ tôi luôn nấu rất nhiều món ăn nên cả nhà ăn ……", "o": ["không xuể", "không nổi", "không thể"], "a": 0}, {"q": "Đây là cách làm chín đồ ăn bằng cách nấu trong nước.", "o": ["Trộn", "Rán", "Luộc"], "a": 2}]}, {"t": "fill", "title": "Bài 5. Điền từ vào đoạn văn", "bank": ["Rửa", "Ninh", "Nguyên liệu", "Nêm", "Thưởng thức", "Chan", "Cho"], "items": ["Phở bò là món ăn nổi tiếng của Việt Nam. Đầu tiên, bạn chuẩn bị các *nguyên liệu* như bánh phở, thịt bò, xương bò, hành, gừng, quế và gia vị. Xương bò *rửa* sạch rồi *cho* vào nồi lớn để *ninh* nước dùng trong nhiều giờ. Khi nước dùng đã thơm và ngọt, *nêm* thêm muối, đường và các gia vị khác cho vừa miệng. Tiếp theo, *chan* nước dùng nóng vào bát bánh phở và thịt bò thái mỏng. Cuối cùng, rắc hành lá và rau thơm lên trên, rồi *thưởng thức* bát phở nóng hổi, đậm đà."]}]}, {"id": 6, "vi": "Dự báo thời tiết", "en": "Weather forecast", "it": "Previsioni del tempo", "page": 93, "tracks": [["Nghe 1", "Book2_Lesson6_Listening1_NorthSouth.mp3", "Bắc & Nam"], ["Nghe 2", "Book2_Lesson6_Listening2_North.mp3", "Bắc"]], "grammar": {"points": [{"h": "1. Nhiệt độ cao nhất / thấp nhất là bao nhiêu?", "b": "<p>Asks about the highest / lowest temperature of the day.</p><p class='ex'>Ngày mai nhiệt độ cao nhất dự kiến là bao nhiêu?<br><span>What’s the expected highest temperature for tomorrow?</span></p>"}, {"h": "2. Giá A thì B — if (only) A, then B", "b": "<p>A condition that is unlikely or hard to achieve, or regret about something that did not happen.</p><p class='ex'>Giá bây giờ tôi có đủ tiền thì tôi đã mua cái xe máy này.<br><span>If I had enough money now, I would buy this motorbike.</span></p><p class='ex'>Giá hôm qua anh ấy tham dự bữa tiệc cuối năm thì anh ấy sẽ gặp được ca sĩ nổi tiếng.<br><span>If he had attended the year-end party yesterday, he would have met the famous singer.</span></p>"}, {"h": "3. Verb + ra / thấy / được — result of an action", "b": "<ul><li>nghĩ ra, hiểu ra, nhận ra — think of, understand, realise</li><li>nhìn thấy, tìm thấy, nhận thấy — see, find, perceive</li><li>nói được, nghe được, hiểu được — manage to say, hear, understand</li></ul><p class='ex'>Tôi nghĩ ra một ý tưởng mới cho dự án của chúng ta.<br><span>I came up with a new idea for our project.</span></p><p class='ex'>Anh ấy đã nhìn thấy bạn mình ở sân bay.<br><span>He saw his friend at the airport.</span></p>"}, {"h": "4. Đã + time + rồi — already (too long)", "b": "<p class='ex'>Đã 11 giờ đêm rồi nhưng bà ấy vẫn chưa đi ngủ.<br><span>It’s already 11 p.m. but she still hasn’t gone to bed.</span></p><p class='ex'>Em ấy học tiếng Việt đã 5 năm rồi.<br><span>She has been studying Vietnamese for 5 years already.</span></p>"}], "ex": [{"t": "fill", "title": "Bài 2. Điền từ ngữ thích hợp", "items": ["Chú ấy sống ở Hà Nội *đã* 20 năm nên chú ấy biết tất cả mọi thứ về Hà Nội.", "Cuối cùng, tôi đã phát hiện *ra* bí mật của anh ấy.", "*Giá* em ấy học chăm chỉ *thì* em ấy đạt trình độ tiếng Việt C1.", "Chúng tôi nghe *thấy/được* có tiếng động lạ ở dưới tầng 1.", "*Đã* 9 giờ tối mà anh ấy vẫn đang ở công ty.", "Vào ngày sinh nhật, chị Linh nhận *được* một món quà giá trị từ bố mẹ.", "Họ sẽ đi du lịch vòng quanh thế giới *giá/nếu* họ có nhiều tiền."]}]}, "vocab": [["Danh từ · Nouns", [["Thời tiết", "Weather", "Tempo"], ["Mây", "Clouds", "Nuvole"], ["Mưa rào", "Rain showers", "Acquazzone"], ["Dông", "Thunderstorm", "Temporale"], ["Sét", "Lightning", "Fulmine"], ["Lốc", "Tornado", "Tornado"], ["Mưa đá", "Hail", "Grandine"], ["Nhiệt độ", "Temperature", "Temperatura"], ["Nắng nóng", "Heatwave", "Ondata di calore"], ["Vùng núi", "Mountainous area", "Zona montuosa"], ["Gió tây nam", "Southwest wind", "Vento da sud-ovest"], ["Gió đông nam", "Southeast wind", "Vento da sud-est"]]], ["Động từ · Verbs", [["Xảy ra", "To occur", "Accadere"], ["Giật (gió giật)", "Gust (wind gust)", "Raffica (raffica di vento)"], ["Rải rác", "Scattered", "Sparso"]]], ["Tính từ · Adjectives", [["Cao nhất", "Highest", "Massimo"], ["Thấp nhất", "Lowest", "Minimo"], ["Gay gắt", "Intense", "Intenso"]]]], "practice": [{"t": "mcq", "title": "Bài 1. Nghe và chọn từ đúng", "listen": 1, "items": [{"say": "mưa", "o": ["mua", "mưa"], "a": 1}, {"say": "bão", "o": ["bão", "báo"], "a": 0}, {"say": "chớp", "o": ["chớp", "chớt"], "a": 0}, {"say": "nhiệt độ", "o": ["nhiệp độ", "nhiệt độ"], "a": 1}, {"say": "rải rác", "o": ["rải rác", "rải rát"], "a": 0}, {"say": "gay gắt", "o": ["gay gắt", "gay gắc"], "a": 0}, {"say": "nắng", "o": ["nắn", "nắng"], "a": 1}]}, {"t": "match", "title": "Bài 2. Nối từ ngữ với phần giải thích", "pairs": [["Mưa", "Nước có dạng hạt nhỏ, rơi từ trên trời xuống."], ["Bão", "Gió rất mạnh, mưa lớn, có thể gây hỏng đồ vật."], ["Nắng", "Ánh sáng và sức nóng từ mặt trời."], ["Gió", "Không khí di chuyển từ nơi này sang nơi khác."], ["Nhiệt độ", "Lượng ấm hoặc lạnh trong không khí, đo bằng độ C."], ["Mưa đá", "Nước có hình khối, cứng, rơi từ trên trời xuống."], ["Sét", "Tia sáng mạnh kèm âm thanh, xuất hiện khi trời mưa to."]]}, {"t": "tf", "title": "Bài 3. Đúng hay sai?", "items": [["Tôi đã nghe ra bí mật của cô ấy.", false], ["Bão là hiện tượng gió mạnh, mưa lớn.", true], ["Cô ấy học tiếng Việt đã 3 năm rồi.", true], ["Giá em ấy học chăm chỉ nên em ấy đã thi đỗ.", false], ["Ở bên ngoài, gió đang rơi rất mạnh.", false], ["Giá tôi đến sớm thì tôi đã gặp cô ấy.", true], ["“Mưa rải rác” là mưa xuất hiện ở một số nơi.", true]]}, {"t": "mcq", "title": "Bài 4. Chọn đáp án đúng", "items": [{"q": "Từ chiều hôm qua, gió bắt đầu …… rất mạnh nên đừng ra ngoài nhé.", "o": ["trôi", "thổi", "rơi"], "a": 1}, {"q": "Bão đã …… và mọi người bắt đầu dọn dẹp vệ sinh nhà cửa.", "o": ["tan", "tạnh", "trôi"], "a": 0}, {"q": "Đây là dạng mưa rất to, thường bắt đầu và kết thúc rất nhanh.", "o": ["mưa rào", "mưa phùn", "mưa đá"], "a": 0}, {"q": "Cơn lốc …… đã làm cho nhiều nhà cửa, cây cối bị hư hỏng.", "o": ["gió", "xoáy", "rơi"], "a": 1}, {"q": "Đây là hiện tượng thời tiết đối lập với “lạnh”:", "o": ["mát mẻ", "ấm áp", "nóng"], "a": 2}, {"q": "“Nắng nóng gay gắt” có nghĩa là:", "o": ["Mức nóng cao", "Mức nóng trung bình", "Mức nóng thấp"], "a": 0}, {"q": "Ánh sáng hiện lên nhanh khi trời có mưa to hoặc bão. Đó là:", "o": ["sấm", "chớp", "mây"], "a": 1}]}, {"t": "mcq", "title": "Bài 5. Chọn đáp án đúng", "items": [{"q": "Cuối cùng, anh ấy đã tìm …… cái chìa khóa xe máy ở dưới gầm bàn.", "o": ["thấy", "xong", "nhanh"], "a": 0}, {"q": "Thomas Edison đã phát minh …… bóng đèn điện vào năm 1879.", "o": ["được", "thấy", "ra"], "a": 2}, {"q": "…… tôi chăm chỉ tập thể dục …… sức khỏe tôi đã tốt hơn rồi.", "o": ["Giá … thì", "Giá … khi", "Tuy … nhưng"], "a": 0}, {"q": "Ngày mai, nhiệt độ ở Hà Nội cao nhất là ……?", "o": ["mấy", "bao nhiêu", "gì"], "a": 1}, {"q": "Sau một thời gian, tôi đã nhận …… anh ấy là một người như thế nào.", "o": ["được", "xong", "ra"], "a": 2}, {"q": "Ông bà ấy ở Hà Nội …… 20 năm rồi nên Hà Nội trở nên rất quen thuộc.", "o": ["đã", "mỗi", "có"], "a": 0}, {"q": "Các anh có hiểu …… những gì tôi vừa nói không?", "o": ["thấy", "được", "thế nào"], "a": 1}]}]}, {"id": 7, "vi": "Khách sạn Majestic Sài Gòn", "en": "The Majestic Hotel in Saigon", "it": "L’hotel Majestic a Saigon", "page": 121, "tracks": [["Nghe 1", "Book2_Lesson7_Listening1_NorthSouth.mp3", "Bắc & Nam"], ["Nghe 2", "Book2_Lesson7_Listening2_North.mp3", "Bắc"]], "grammar": {"points": [{"h": "1. Đành / đành phải + verb — to have no choice but to", "b": "<p>An action done reluctantly, without any other option.</p><p class='ex'>Cuối tháng hết tiền nên tôi đành phải ăn mỳ tôm.<br><span>At the end of the month I ran out of money, so I had to eat instant noodles.</span></p><p class='ex'>Bây giờ muộn quá, không đặt được grab nên tôi đành đi bộ về nhà.<br><span>It’s too late to book a Grab, so I have to walk home.</span></p>"}, {"h": "2. Có + verb — did (confirming a past action)", "b": "<p class='ex'>Hôm qua, tôi có nhìn thấy anh Minh đi mua sách.<br><span>Yesterday, I did see Minh going to buy books.</span></p><p class='ex'>Tháng trước, gia đình ông ấy có đi du lịch ở Hàn Quốc.<br><span>Last month, his family did travel to Korea.</span></p>"}, {"h": "3. Mãi … mới — not until, only after a long time", "b": "<p>Highlights the duration or delay of an action.</p><p class='ex'>Mãi nửa đêm, chị ấy mới đi ngủ.<br><span>She didn’t go to sleep until midnight.</span></p><p class='ex'>Nó ăn chậm lắm, mãi mới xong.<br><span>He eats very slowly; it took ages to finish.</span></p>"}], "ex": [{"t": "open", "title": "Bài 2. Dùng các cấu trúc trên để viết lại câu", "items": [["Bài tập nhiều quá nên tôi cần nhiều thời gian để làm xong.", "Tôi làm mãi mới xong bài tập."], ["Tháng trước, chắc chắn tôi đã gặp anh ấy ở Đà Nẵng.", "Tháng trước, tôi có nói chuyện / có gặp anh ấy ở Đà Nẵng."], ["Vì ngày mai chúng tôi thi nên dù phim rất hay nhưng chúng tôi vẫn phải ở nhà để ôn tập.", "Chúng tôi đành phải ở nhà ôn tập vì ngày mai chúng tôi thi."], ["Hôm nay chị ấy ăn trưa rất muộn, lúc 2 giờ chiều.", "Mãi 2 giờ chiều chị ấy mới ăn trưa."], ["Anh ấy chắc chắn đọc bài báo đó nhưng không nhớ đọc ở đâu.", "Anh ấy có đọc bài báo đó nhưng không nhớ đọc ở đâu."], ["Em ấy muốn mua cái áo màu xanh nhưng đắt quá, không đủ tiền nên mua áo màu đỏ dù không thích lắm.", "Em ấy đành mua cái áo màu đỏ."], ["Anh ấy học tiếng Việt rất muộn khi anh ấy 35 tuổi.", "Mãi 35 tuổi anh ấy mới học tiếng Việt."]]}]}, "vocab": [["Danh từ · Nouns", [["Tiện nghi", "Amenities", "Servizi"], ["Vị trí", "Location", "Posizione"], ["Hướng nhìn", "View", "Vista"], ["Diện tích", "Area", "Superficie"], ["Bể bơi ngoài trời", "Outdoor swimming pool", "Piscina all’aperto"], ["Không gian", "Space", "Spazio"], ["Dịch vụ", "Services", "Servizi"], ["Két an toàn", "Safe deposit box", "Cassaforte"], ["Truyền hình vệ tinh", "Satellite television", "Televisione satellitare"], ["Sức chứa", "Capacity", "Capacità"]]], ["Động từ · Verbs", [["Thiết kế", "To design", "Progettare"], ["Tọa lạc", "To be located", "Essere situato"], ["Thưởng thức", "To enjoy", "Godere"], ["Phục vụ", "To serve", "Servire"], ["Cung cấp", "To provide", "Fornire"]]], ["Tính từ · Adjectives", [["Đẹp mắt", "Beautiful", "Bellissimo / bellissima"], ["Tận tình", "Attentive", "Attento / attenta"], ["Lý tưởng", "Ideal", "Ideale"], ["Thư giãn", "Relaxing", "Rilassante"], ["Riêng tư", "Private", "Privato"]]]], "practice": [{"t": "mcq", "title": "Bài 1. Nghe và chọn từ đúng", "listen": 1, "items": [{"say": "lễ tân", "o": ["Lế tân", "Lễ tân"], "a": 1}, {"say": "khăn tắm", "o": ["Khăn tắm", "Khăng tắn"], "a": 0}, {"say": "giường đôi", "o": ["Giương đồi", "Giường đôi"], "a": 1}, {"say": "tiện nghi", "o": ["Tiệm nghi", "Tiện nghi"], "a": 1}, {"say": "vị trí", "o": ["Vị trí", "Ví tri"], "a": 0}, {"say": "hiện đại", "o": ["Hiền đai", "Hiện đại"], "a": 1}, {"say": "đẹp mắt", "o": ["Đẹp mắt", "Đẹt mắc"], "a": 0}]}, {"t": "match", "title": "Bài 2. Nối từ ngữ với hình ảnh", "pairs": [["🛁🧺", "Khăn tắm"], ["🛏️", "Phòng đơn"], ["🛎️", "Quầy lễ tân"], ["🏊", "Bể bơi"], ["🛏️🛏️", "Phòng đôi"], ["💂", "Nhân viên bảo vệ"], ["💳🔑", "Thẻ phòng"]]}, {"t": "fill", "title": "Bài 3. Điền từ vào đoạn văn", "bank": ["Vị trí", "Giường đôi", "Thẻ phòng", "Quầy lễ tân", "Bể bơi", "Giá", "Thuận tiện", "Tiện nghi"], "items": ["Tuần trước, tôi đi du lịch Đà Nẵng và ở một khách sạn gần biển. Khách sạn này có *vị trí* rất đẹp, chỉ mất 5 phút đi bộ ra bãi biển, rất *thuận tiện* cho khách du lịch. Khi đến nơi, tôi làm thủ tục nhận phòng ở *quầy lễ tân*. Nhân viên rất thân thiện và đưa cho tôi một *thẻ phòng* để mở cửa.", "Phòng tôi đặt có một *giường đôi*, sạch sẽ và thoải mái. Khách sạn cũng có nhiều *tiện nghi* như wifi miễn phí, phòng tập gym và dịch vụ giặt là. Buổi chiều, tôi thường xuống *bể bơi* để bơi và nghỉ ngơi. So với các khách sạn khác trong khu vực, tôi thấy *giá* ở đây hợp lý."]}, {"t": "mcq", "title": "Bài 4. Chọn đáp án đúng nhất", "items": [{"q": "Tôi gọi điện cho khách sạn để __________ trước một tuần.", "o": ["đặt phòng", "trả phòng", "dịch vụ phòng", "hành lý"], "a": 0}, {"q": "Nếu bạn không thể ở khách sạn như kế hoạch, bạn nên __________ để không mất tiền.", "o": ["đặt phòng", "hủy phòng", "ăn sáng", "ban công"], "a": 1}, {"q": "Tôi gọi điện cho lễ tân để nhờ __________ mang đồ ăn lên phòng.", "o": ["ăn sáng", "hành lý", "nhân viên", "thang máy"], "a": 2}, {"q": "Khách sạn này có __________ miễn phí với nhiều món ăn Việt Nam.", "o": ["dịch vụ phòng", "ăn sáng", "bể bơi", "phòng tập gym"], "a": 1}, {"q": "Nhân viên khách sạn giúp tôi mang __________ lên phòng.", "o": ["hành lý", "đặt phòng", "ăn sáng", "thang máy"], "a": 0}, {"q": "Khách sạn cao tầng nên phải có __________ để khách đi lại dễ dàng.", "o": ["hành lý", "bể bơi", "thang máy", "ban công"], "a": 2}, {"q": "Tôi thích căn phòng này vì có __________ nhìn ra biển rất đẹp.", "o": ["ban công", "thang máy", "hành lý", "tiện nghi"], "a": 0}]}, {"t": "mcq", "title": "Bài 5. Chọn đáp án đúng nhất", "items": [{"q": "Tôi đã hết tiền, nên tôi …… ăn mỳ tôm dù không thích.", "o": ["đành phải", "không thể", "mua"], "a": 0}, {"q": "Anh chờ một chút nhé, …… 9 giờ sáng nay cô ấy …… đến văn phòng ạ.", "o": ["có … mới", "mãi … mới", "đã … mới"], "a": 1}, {"q": "Lúc 10 giờ đêm, chị ấy …… nhìn thấy anh Minh đi với một người đàn ông.", "o": ["mỗi", "những", "có"], "a": 2}, {"q": "Mùa hè năm nay cô ấy quá bận rộn nên …… chỉ đi du lịch ở gần Hà Nội vì không có đủ thời gian.", "o": ["không", "đành", "có"], "a": 1}, {"q": "Các phòng của khách sạn này đều có đầy đủ …… nên mọi người rất hài lòng.", "o": ["tiện nghi", "bể bơi", "nhân viên bảo vệ"], "a": 0}, {"q": "…… mùa thu sang năm, anh chị ấy mới tổ chức đám cưới.", "o": ["Những", "Đã", "Mãi"], "a": 2}, {"q": "Nhà hàng của khách sạn này có …… đến 70 người nên anh chị có thể yên tâm tổ chức tiệc cuối năm ở đây.", "o": ["bể bơi", "sức chứa", "tiện nghi"], "a": 1}]}]}, {"id": 8, "vi": "Các quán cafe sữa đá Sài Gòn", "en": "Famous Saigon iced milk coffee shops", "it": "Famosi caffè di Saigon con caffè al latte ghiacciato", "page": 137, "tracks": [["Nghe 1", "Book2_Lesson8_Listening1_NorthSouth.mp3", "Bắc & Nam"], ["Nghe 2", "Book2_Lesson8_Listening2_North.mp3", "Bắc"]], "grammar": {"points": [{"h": "1. Verb + phải + complement — (unluckily) end up with", "b": "<p>The subject receives something unfortunate, or worse than expected.</p><p class='ex'>Chị ấy mua phải cái điện thoại cũ.<br><span>She unfortunately bought an old phone.</span></p><p class='ex'>Sáng nay em ấy ăn phải bánh ngọt hết hạn sử dụng.<br><span>This morning she unfortunately ate an expired cake.</span></p>"}, {"h": "2. Không + verb / adjective + gì cả — not … at all", "b": "<p>Absolute negation of an action, state or characteristic.</p><p class='ex'>Anh ấy mệt nên không ăn gì cả.<br><span>He was tired, so he didn’t eat anything at all.</span></p><p class='ex'>Hôm nay, bài thi của trình độ B không khó gì cả.<br><span>Today, the B-level exam wasn’t difficult at all.</span></p>"}, {"h": "3. Mải + verb — so absorbed in … (that one forgets)", "b": "<p class='ex'>Anh ấy mải làm việc nên quên đón con ở trường.<br><span>He was so busy working that he forgot to pick up his child from school.</span></p><p class='ex'>Hai con trai của tôi mải xem phim nên quên nấu cơm.<br><span>My two sons were so absorbed in the film that they forgot to cook.</span></p>"}], "ex": [{"t": "open", "title": "Bài 2. Dùng các cấu trúc trên để viết lại câu", "items": [["Bài tập viết khó quá nên em ấy không thể làm được.", "Bài tập viết khó nên em ấy không làm gì cả."], ["Anh ấy chỉ tập trung xem điện thoại nên đã quên không nấu cơm.", "Anh ấy mải xem điện thoại nên quên nấu cơm."], ["Tôi nghĩ tôi mua được một cái áo chất lượng tốt nhưng không phải như vậy.", "Tôi mua phải cái áo chất lượng không tốt."], ["Chị Minh chăm chú đọc truyện nên không quan tâm đến thời gian.", "Chị Minh mải đọc truyện nên không quan tâm đến thời gian."], ["Bạn Liên không học bài nên đã không nhớ từ mới nào.", "Bạn Liên không nhớ từ vựng gì cả."], ["Bà ấy nghĩ cái bánh rất ngon nhưng khi ăn thì biết nó bị hỏng rồi.", "Bà ấy ăn phải cái bánh hỏng."], ["Em Linh chỉ tập trung phát triển sự nghiệp mà quên việc kết hôn.", "Em Linh mải phát triển sự nghiệp mà quên việc kết hôn."]]}]}, "vocab": [["Danh từ · Nouns", [["Thức uống / đồ uống", "Beverages / drinks", "Bevande"], ["Vị trí", "Location", "Posizione"], ["Không gian", "Space", "Spazio"], ["Cổ điển", "Classic", "Classico"], ["Vị thơm", "Aromatic flavour", "Sapore aromatico"], ["Mùi", "Scent", "Profumo"], ["Điểm đến", "Destination", "Destinazione"]]], ["Động từ · Verbs", [["Thiết kế", "To design", "Progettare"], ["Thưởng thức", "To enjoy", "Godere"], ["Tìm kiếm", "To search", "Cercare"]]], ["Tính từ · Adjectives", [["Đắng", "Bitter", "Amaro"], ["Ấm cúng", "Cozy", "Accogliente"], ["Thư giãn", "Relaxing", "Rilassante"], ["Hấp dẫn", "Tempting", "Allettante"], ["Tuyệt vời", "Excellent", "Eccellente"], ["Yên bình", "Peaceful", "Pacifico"], ["Nổi bật", "Outstanding", "Evidente"], ["Hài hòa", "Harmonious", "Armonioso"], ["Đặc biệt", "Special", "Speciale"], ["Ngạc nhiên", "Surprising", "Sorprendente"]]]], "practice": [{"t": "mcq", "title": "Bài 1. Nghe và chọn từ đúng", "listen": 1, "items": [{"say": "sữa", "o": ["Sữa", "Sứa"], "a": 0}, {"say": "hạt", "o": ["Hát", "Hạt"], "a": 1}, {"say": "đắng", "o": ["Đắng", "Đắn"], "a": 0}, {"say": "thưởng thức", "o": ["Thường thức", "Thưởng thức"], "a": 1}, {"say": "lựa chọn", "o": ["Lụa chọn", "Lựa chọn"], "a": 1}, {"say": "đậm vị", "o": ["Đậm vị", "Đận vị"], "a": 0}, {"say": "đồ uống", "o": ["Đồ uốn", "Đồ uống"], "a": 1}]}, {"t": "match", "title": "Bài 2. Nối từ ngữ với hình ảnh", "pairs": [["☕⬇️💧", "Pha cà phê"], ["☕🥛🧊", "Cà phê sữa đá"], ["🫘", "Hạt cà phê"], ["🏪☕", "Quán cà phê"], ["☕⚫", "Cà phê đen"], ["😖", "Đắng"], ["🥤", "Đồ uống"]]}, {"t": "fill", "title": "Bài 3. Điền từ vào câu", "bank": ["Pha cà phê", "Cà phê đen", "Thưởng thức", "Không gian", "Lựa chọn", "Cà phê sữa", "Đắng"], "items": ["Hãy bắt đầu một ngày mới với ly *cà phê đen* nóng nhé.", "Nhiều quán cà phê ở Hà Nội được thiết kế với *không gian* yên tĩnh, thích hợp để làm việc.", "Ở quán cà phê, bạn có thể *lựa chọn* nhiều loại đồ uống khác nhau như trà, sinh tố hay nước ép.", "Nhấp một ngụm cà phê phin, ai cũng cảm thấy vị thật *đắng* nhưng hấp dẫn.", "Nhiều bạn trẻ thích *cà phê sữa* vì có thêm vị ngọt của sữa đặc.", "Mỗi quán cà phê đều có cách riêng để *pha cà phê*, tạo hương vị khác nhau.", "*Thưởng thức* một tách cà phê nóng vào mỗi sáng là thói quen của anh ấy."]}, {"t": "tf", "title": "Bài 4. Đúng hay sai?", "items": [["Nếu bạn không thích ngọt thì nên uống cà phê đen.", true], ["Em ấy đang đi và vấp phải hòn đá.", true], ["Vì cô ấy học hành mải nên đã 30 tuổi nhưng chưa kết hôn.", false], ["Hôm nay, tôi muốn nói chuyện không gì cả vì tôi mệt quá.", false], ["“Phin” là dụng cụ pha cà phê truyền thống của người Việt.", true], ["Cà phê sữa thường rất đắng nên em ấy không thích uống.", false], ["Bà ấy mải nói chuyện điện thoại với bạn nên làm cháy nồi.", true]]}, {"t": "mcq", "title": "Bài 5. Chọn đáp án đúng nhất", "items": [{"q": "Cà phê đen thường có đặc điểm gì?", "o": ["Ngọt và béo", "Đậm vị và hơi đắng", "Nhiều sữa"], "a": 1}, {"q": "Khi muốn uống cà phê béo và ngọt hơn, bạn nên chọn loại nào?", "o": ["Cà phê đen", "Cà phê sữa", "Cà phê đá xay"], "a": 1}, {"q": "Khi nói “cà phê pha phin”, “phin” có nghĩa là gì?", "o": ["Cái cốc", "Cái ấm", "Dụng cụ nhỏ để pha cà phê"], "a": 2}, {"q": "Anh ấy không biết nên đã mua …… cái máy tính cũ.", "o": ["phải", "xong", "được"], "a": 0}, {"q": "Chị ấy …… làm việc nên đã quên cả giờ phải đi đón con.", "o": ["mãi", "mải", "đã"], "a": 1}, {"q": "Bà ấy quá mệt nên cả ngày nay …… ăn uống được ……", "o": ["đã … gì cả", "không … gì cả", "có thể … được"], "a": 1}, {"q": "Vào các ngày lễ, ngoài đường rất đông nên tôi không muốn đi ……", "o": ["đâu cả", "gì cả", "nơi cả"], "a": 0}]}]}, {"id": 9, "vi": "Chợ nổi", "en": "Floating markets", "it": "Mercati galleggianti", "page": 153, "tracks": [["Nghe 1", "Book2_Lesson9_Listening1_North.mp3", "Bắc"], ["Nghe 2", "Book2_Lesson9_Listening2_South.mp3", "Nam"]], "grammar": {"points": [{"h": "1. Hình như … thì phải — it seems that …", "b": "<p>Expresses uncertainty and conjecture.</p><p class='ex'>Hình như ngày mai trời lạnh thì phải.<br><span>It seems it will be cold tomorrow.</span></p><p class='ex'>Hình như anh ấy đã có gia đình.<br><span>It seems he is already married.</span></p>"}, {"h": "2. Adjective + ra / lên / đi / lại — increase or decrease", "b": "<p>Indicates that a quality or state increases or decreases.</p><p class='ex'>Dạo này, thời tiết bắt đầu ngày càng nóng lên.<br><span>Recently, the weather has been getting hotter and hotter.</span></p><p class='ex'>So với một năm trước, bây giờ chị ấy gầy đi nhiều.<br><span>Compared to a year ago, she has become much thinner.</span></p>"}, {"h": "3. Không những A mà còn B — not only A but also B", "b": "<p class='ex'>Anh ấy không những thích đọc sách mà còn thích xem phim.<br><span>He not only likes reading books but also enjoys watching films.</span></p><p class='ex'>Thành phố này không những hiện đại mà còn sạch sẽ.<br><span>This city is not only modern but also clean.</span></p>"}], "ex": [{"t": "open", "title": "Bài 2. Dùng các cấu trúc trên để viết lại câu", "items": [["Tôi không chắc chắn nhưng có lẽ bài thi viết ngày mai sẽ khó.", "Hình như bài thi viết ngày mai sẽ khó thì phải."], ["Tháng trước chị ấy 50kg nhưng tháng này chị ấy chỉ có 48kg.", "Chị ấy đã gầy đi."], ["Đối với bà ấy, chợ nổi là nơi mua bán và cũng là điểm du lịch ấn tượng.", "Chợ nổi không chỉ là nơi mua bán mà còn là điểm du lịch ấn tượng."], ["Năm ngoái em ấy cao 1m50 mà năm nay đã cao 1m58.", "Em ấy cao lên."], ["Ngôi nhà này có lẽ sẽ đắt vì nó đẹp lắm.", "Hình như ngôi nhà này đắt."], ["Sinh viên của trường này vừa thông minh vừa năng động.", "Sinh viên của trường này không những thông minh mà còn năng động."], ["Tuần trước giá 1 quả trứng gà là 3000 đồng mà tuần này giá là 3500 đồng.", "Giá của trứng gà đã tăng lên."]]}]}, "vocab": [["Danh từ · Nouns", [["Chợ nổi", "Floating market", "Mercato galleggiante"], ["Ghe thuyền", "Rowboat", "Barca a remi"], ["Lối sống", "Lifestyle", "Stile di vita"], ["Vùng sông nước", "Riverine region", "Regione fluviale"], ["Du khách", "Tourist", "Turista"], ["Nét nổi bật", "Feature", "Caratteristica"], ["Nông sản", "Agricultural products", "Prodotti agricoli"], ["Hàng rong", "Street vendors", "Venditori ambulanti"], ["Hàng hóa", "Commodities", "Merci"], ["Đặc sản", "Specialty products", "Prodotti tipici"]]], ["Động từ · Verbs", [["Họp chợ", "Market gathering", "Riunione di mercato"], ["Giao nhau", "To converge", "Convergere"], ["Thu hút", "To attract", "Attirare"], ["Buôn bán", "To trade", "Commerciare"], ["Vãn chợ", "End of the market day", "Chiudere il mercato"], ["Tận hưởng", "To enjoy", "Godere"]]], ["Tính từ · Adjectives", [["Sầm uất", "Bustling", "Affollato"], ["Nhộn nhịp", "Lively", "Animato"], ["Hoang sơ", "Untouched", "Incontaminato"], ["Yên bình", "Peaceful", "Tranquillo"]]]], "practice": [{"t": "mcq", "title": "Bài 1. Nghe và chọn đáp án đúng", "listen": 1, "items": [{"say": "họp chợ", "o": ["học chợ", "họp chợ"], "a": 1}, {"say": "lối sống", "o": ["lối sông", "lối sống"], "a": 1}, {"say": "ghe", "o": ["nghe", "ghe"], "a": 1}, {"say": "chợ nổi", "o": ["chợ nổi", "chợ nội"], "a": 0}, {"say": "giao nhau", "o": ["giao nhao", "giao nhau"], "a": 1}, {"say": "đồ gia dụng", "o": ["đồ gia dụng", "đồ già dung"], "a": 0}, {"say": "sầm uất", "o": ["sầm uất", "sầm ất"], "a": 0}]}, {"t": "fill", "title": "Bài 2. Điền từ vào đoạn văn", "bank": ["Họp", "Đồ gia dụng", "Trao đổi", "Nổi tiếng", "Tan", "Mua bán", "Nhộn nhịp", "Chợ nổi"], "items": ["Khi nhắc đến miền Tây, nhiều người nghĩ ngay đến những *chợ nổi* độc đáo trên sông. Trong đó, chợ nổi Cái Bè rất *nổi tiếng* vì có lịch sử lâu đời. Mỗi ngày, chợ sẽ *họp* từ lúc bình minh, khi các ghe thuyền tập trung đông đủ. Hàng hóa ở chợ rất phong phú: từ trái cây, rau củ đến quần áo đến *đồ gia dụng/hàng gia dụng*. Người dân vừa *trao đổi/mua bán*, vừa *mua bán/trao đổi*, tạo nên một không khí sôi động. Du khách thích thú khi nhìn thấy cảnh buôn bán *nhộn nhịp* trên mặt nước. Khoảng gần trưa, các ghe thuyền tản dần và chợ bắt đầu *tan*."]}, {"t": "tf", "title": "Bài 3. Đúng hay sai?", "items": [["Vào cuối năm nay, anh ấy sẽ chuyển đến Sài Gòn hình như.", false], ["Hàng hóa ở đây không những rẻ mà còn chất lượng.", true], ["Vào tháng 5, gia đình cô Lan sẽ đi Ý thì phải.", true], ["Sau một mùa hè, em Nam đã cao lên rất nhiều.", true], ["Bây giờ, khí hậu trên trái đất ngày càng trở nên nóng đi.", false], ["Anh Minh không những mà còn thích đọc sách.", false], ["Các chợ nổi thường bắt đầu họp chợ từ rất sớm.", true]]}, {"t": "mcq", "title": "Bài 4. Chọn đáp án đúng", "items": [{"q": "Vào sáng sớm, các chợ nổi bắt đầu …… trên sông.", "o": ["tan", "họp", "học"], "a": 1}, {"q": "Người dân trao đổi, buôn bán hàng hóa trên sông tạo nên một không khí ……", "o": ["nhộn nhịp", "nổi tiếng", "thuận tiện"], "a": 0}, {"q": "Khoảng 9 giờ sáng, chợ nổi Cái Răng sẽ …… nên bạn phải đi sớm.", "o": ["họp", "bán", "tan"], "a": 2}, {"q": "Ngoài trái cây, món ăn thì ở các chợ nổi, người ta cũng bán nhiều ……", "o": ["đồ điện tử", "đồ chơi", "đồ gia dụng"], "a": 2}, {"q": "Các chợ nổi nổi tiếng thường nằm ở vị trí là nơi …… của các con sông.", "o": ["giao nhau", "bên cạnh", "đối diện"], "a": 0}, {"q": "Ở chợ nổi, người dân thường dùng phương tiện gì để chở hàng hóa và đi lại?", "o": ["Xe đạp", "Ô tô", "Ghe"], "a": 2}, {"q": "Sau một ngày tham quan chợ nổi, du khách có thể ngắm …… rất đẹp trên sông.", "o": ["bình minh", "hoàng hôn", "mặt trăng"], "a": 1}]}, {"t": "mcq", "title": "Bài 5. Chọn đáp án đúng", "items": [{"q": "Tôi không biết nhưng …… ngày mai anh ấy sẽ đến sân bay lúc 9 giờ.", "o": ["được", "hình như", "thì phải"], "a": 1}, {"q": "Hôm nay, chị ấy trang điểm nên trông chị ấy xinh …… nhiều.", "o": ["đi", "lên", "lại"], "a": 1}, {"q": "Anh ấy không những giỏi chuyên môn …… nhiệt tình giúp đỡ đồng nghiệp.", "o": ["vừa", "vừa còn", "mà còn"], "a": 2}, {"q": "Vì ông ấy đã lớn tuổi nên sức khỏe ngày càng kém ……", "o": ["lên", "ra", "đi"], "a": 2}, {"q": "…… cô ấy đã đi du lịch ở Cần Thơ từ năm ngoái ……", "o": ["Đã … lại", "Hình như … thì phải", "Hình như … mà còn"], "a": 1}, {"q": "Nhờ kết bạn với người Việt nên khả năng nói của Henry ngày càng tiến bộ ……", "o": ["lên", "lại", "rất"], "a": 0}, {"q": "Năm nay, anh ấy …… mua căn hộ chung cư …… mua xe ô tô nữa.", "o": ["cả … lẫn", "không những … mà còn", "chỉ … còn"], "a": 1}]}]}, {"id": 10, "vi": "Tết Nguyên Đán", "en": "Lunar New Year", "it": "Capodanno lunare", "page": 169, "tracks": [["Nghe 1", "Book2_Lesson10_Listening1_NorthSouth.mp3", "Bắc & Nam"], ["Nghe 2", "Book2_Lesson10_Listening2_North.mp3", "Bắc"]], "grammar": {"points": [{"h": "1. Không / chẳng + verb / adjective + mấy — not much, hardly", "b": "<p>A low level of a state or quality, or a low frequency of action.</p><p class='ex'>Em ấy đã ăn kiêng và tập thể dục nhiều nhưng cân nặng không giảm mấy.<br><span>She has dieted and exercised a lot, but her weight hasn’t dropped much.</span></p><p class='ex'>Bài báo khó quá nên em ấy đọc nhưng không hiểu mấy.<br><span>The article was too difficult; she read it but didn’t understand much.</span></p>"}, {"h": "2. Đã A lại B — not only A, but also B", "b": "<p>Two similar actions or properties that add up.</p><p class='ex'>Ngôi nhà này đã xa trung tâm lại đắt nên không ai mua.<br><span>This house is far from the centre and expensive too, so nobody buys it.</span></p><p class='ex'>Anh ấy đã đi làm lại đi học nên bận lắm.<br><span>He both works and studies, so he is very busy.</span></p>"}, {"h": "3. Thế nào … cũng + verb / adjective — no matter what, surely", "b": "<p>Something that is certain to happen.</p><p class='ex'>Năm nay, thế nào anh ấy cũng về quê ăn Tết với bố mẹ.<br><span>This year, no matter what, he will go home to celebrate Tết with his parents.</span></p>"}], "ex": [{"t": "open", "title": "Bài 2. Dùng các cấu trúc trên để viết lại câu", "items": [["Ngày mai, chắc chắn anh ấy sẽ đón chị. Chị yên tâm nhé.", "Thế nào ngày mai anh ấy cũng đón chị."], ["Cái xe máy này đắt và màu xấu nên tôi không mua.", "Cái xe này đã đắt màu lại xấu nên tôi không mua."], ["Chị ấy bị viêm họng 3 ngày rồi nên không nói được nhiều.", "Chị ấy bị viêm họng nên không nói được mấy."], ["Khu vực này có không khí tốt và người dân thân thiện nên cô ấy muốn sống ở đây.", "Khu vực này đã có không khí tốt, người dân lại thân thiện nên cô ấy muốn sống ở đây."], ["Tôi biết chắc chắn em ấy sẽ trở thành một bác sĩ giỏi vì em ấy rất thông minh và chăm chỉ.", "Em ấy thế nào cũng trở thành một bác sĩ giỏi."], ["Lương của em Mai không cao và em ấy sống ở thành phố nên không tiết kiệm được nhiều tiền.", "Em Mai không tiết kiệm được mấy."], ["Cái máy tính này bền và giá cả phải chăng nên nhiều người muốn mua.", "Cái máy tính này đã bền lại có giá cả phải chăng nên nhiều người muốn mua."]]}]}, "vocab": [["Danh từ · Nouns", [["Âm lịch", "Lunar calendar", "Calendario lunare"], ["Dương lịch", "Solar calendar", "Calendario solare"], ["Năm nhuận", "Leap year", "Anno bisestile"], ["Nguồn gốc", "Origin", "Origine"], ["Sự tích", "Legend", "Leggenda"], ["Tâm thức", "Mindset", "Mentalità"], ["Ký ức", "Memories", "Ricordi"], ["Vụ mùa", "Harvest", "Raccolto"], ["Đêm giao thừa", "New Year’s Eve", "Vigilia di Capodanno"], ["Quan niệm", "Belief", "Credenza"], ["Lòng hiếu kính", "Filial piety", "Pietà filiale"], ["Tổ tiên", "Ancestors", "Antenati"], ["Bàn thờ", "Altar", "Altare"], ["Mâm ngũ quả", "Five-fruit tray", "Vassoio delle cinque frutta"]]], ["Động từ · Verbs", [["Ăn Tết", "To celebrate Tết", "Celebrare il Tết"], ["Sum họp", "To reunite", "Riunirsi"], ["Bày biện", "To arrange", "Organizzare"]]], ["Tính từ · Adjectives", [["Thiêng liêng", "Sacred", "Sacro"], ["Quây quần", "Gathered", "Riunito"]]]], "practice": [{"t": "mcq", "title": "Bài 1. Nghe và chọn đáp án đúng", "listen": 1, "items": [{"say": "Tết", "o": ["Tết", "Tếp"], "a": 0}, {"say": "dọn nhà", "o": ["Dọn ngà", "Dọn nhà"], "a": 1}, {"say": "chúc Tết", "o": ["Chút Tếp", "Chúc Tết"], "a": 1}, {"say": "hoa đào", "o": ["Hoa đào", "Hao đào"], "a": 0}, {"say": "quây quần", "o": ["Quây quầng", "Quây quần"], "a": 1}, {"say": "sum họp", "o": ["Sum học", "Sum họp"], "a": 1}, {"say": "nghỉ ngơi", "o": ["Nghỉ ngơi", "Nghí ngơi"], "a": 0}]}, {"t": "match", "title": "Bài 2. Nối từ ngữ với hình ảnh", "pairs": [["🧹", "Dọn dẹp"], ["📅", "Lịch"], ["🛕", "Đi chùa"], ["🛋️😌", "Nghỉ ngơi"], ["🪔", "Hương"], ["🌸", "Hoa đào"], ["🛍️", "Mua sắm"]]}, {"t": "match", "title": "Bài 3. Nối từ ngữ với phần giải thích", "pairs": [["Mừng tuổi", "Tặng tiền trong phong bao đỏ cho trẻ em hoặc người già vào dịp Tết."], ["Mua hoa", "Mua đào, quất, mai… để trang trí nhà cửa vào dịp Tết."], ["Gói bánh chưng", "Chuẩn bị món bánh truyền thống với gạo nếp, thịt, đỗ xanh, lá dong."], ["Đoàn tụ", "Mọi người trong gia đình từ nhiều nơi trở về, cùng ăn uống và ở bên nhau."], ["Cúng", "Làm lễ dâng hương, đồ ăn hoặc hoa quả để tưởng nhớ tổ tiên và cầu bình an."], ["Chúc Tết", "Nói lời tốt đẹp với nhau để cầu sức khỏe, hạnh phúc, thành công vào dịp Tết."], ["Năm mới", "Thời điểm bắt đầu một năm theo âm lịch, với nhiều phong tục truyền thống."]]}, {"t": "tf", "title": "Bài 4. Đúng hay sai?", "items": [["Người Việt Nam tính Tết Nguyên Đán theo lịch dương.", false], ["Hôm qua, tôi mệt nên tôi chẳng mấy ăn.", false], ["Bác cứ yên tâm, thế nào anh ấy cũng qua đón bác.", true], ["Khu chung cư này đã gần trường học lại gần chợ nên rất thuận tiện.", true], ["Bài này nhiều từ mới nên em ấy không hiểu mấy.", true], ["Anh đã lại đến muộn, không xin lỗi nên cô ấy buồn.", false], ["Thế nào cũng em ấy mời tôi đến đám cưới của em ấy.", false]]}, {"t": "mcq", "title": "Bài 5. Chọn đáp án đúng", "items": [{"q": "Người Việt Nam tính thời gian Tết Nguyên Đán theo ……", "o": ["lịch dương", "lịch âm", "lịch cuối tháng"], "a": 1}, {"q": "Bài thi viết khó lắm nên em Linh …… làm được ……", "o": ["có thể … mấy", "không … mấy", "sẽ … mấy"], "a": 1}, {"q": "Vào dịp Tết, người lớn thường mừng tuổi cho trẻ em bằng cách nào?", "o": ["Mua cho quần áo mới", "Tặng sách", "Tặng phong bao lì xì màu đỏ có tiền bên trong"], "a": 2}, {"q": "Anh ấy không bao giờ thất hứa nên anh ấy …… mua sách cho em. Em đừng lo.", "o": ["thế nào cũng", "thế nào", "không"], "a": 0}, {"q": "Cô ấy …… thông minh …… thích giúp người khác nên ai cũng yêu quý.", "o": ["cả … lẫn", "đã … lại", "vì … nên"], "a": 1}, {"q": "Năm nay, …… gia đình cô ấy …… sẽ đi du lịch Châu Âu cùng nhau.", "o": ["thế nào … đã", "thế nào cũng … vẫn", "thế nào … cũng"], "a": 2}, {"q": "Một loại bánh không thể thiếu trong các gia đình Việt Nam vào ngày Tết. Đó là:", "o": ["bánh bao", "bánh chưng", "bánh trung thu"], "a": 1}]}]}, {"id": 11, "vi": "Ngành nghề bị robot thay thế", "en": "Occupations replaced by robots", "it": "Le professioni sostituite dai robot", "page": 185, "tracks": [["Nghe 1", "Book2_Lesson11_Listening1_NorhtSouth.mp3", "Bắc & Nam"], ["Nghe 2", "Book2_Lesson11_Listening2_North.mp3", "Bắc"]], "grammar": {"points": [{"h": "1. Thậm chí … — even …", "b": "<p>Emphasises a point, often a surprising one.</p><p class='ex'>Thậm chí thời tiết lạnh vào mùa hè cũng là điều bình thường ở vùng cao nguyên này.<br><span>Even cold weather in summer is normal in this highland area.</span></p>"}, {"h": "2. Là / rằng — that", "b": "<p>Connects two clauses: the second clause is the complement of the verb in the first.</p><p class='ex'>Bạn tôi nói rằng ở Hà Nội nóng nhất là tháng 7.<br><span>My friend said that the hottest month in Hanoi is July.</span></p><p class='ex'>Anh ấy hứa là anh ấy sẽ đưa các con đi chơi vào cuối tuần.<br><span>He promised that he would take the kids out at the weekend.</span></p>"}, {"h": "3. A chứ không / chứ chưa B — A, not B", "b": "<p>Affirms A and negates B. <b>chứ chưa</b> = not yet.</p><p class='ex'>Mùa hè này, tôi đã đi du lịch ở Châu Âu chứ không đi Mỹ.<br><span>This summer, I travelled to Europe, not to the US.</span></p><p class='ex'>Ở Việt Nam, chúng tôi chỉ ăn phở chứ chưa ăn bún chả.<br><span>In Vietnam, we have only eaten phở, not bún chả yet.</span></p>"}], "ex": [{"t": "fill", "title": "Bài 2. Điền các cấu trúc ngữ pháp vào chỗ trống", "items": ["Em ấy mới chỉ làm bài tập 2 *chứ chưa* làm bài tập 5.", "Giám đốc thông báo *là/rằng* các nhân viên sẽ được tăng lương từ tháng sau.", "Anh ấy không liên lạc với bất cứ ai *thậm chí* cả vợ anh ấy.", "Cái máy tính của em Minh cũ *chứ không* hỏng.", "Tôi nghe nói *là/rằng* nhà cô Liên sẽ chuyển vào Đà Nẵng từ tháng sau.", "Chị ấy nói được nhiều ngoại ngữ *thậm chí* cả ngoại ngữ khó như Ả Rập, Nga, Nhật Bản…", "Tất cả học sinh lớp tôi đều thích đi vịnh Hạ Long *chứ không* thích đi Sa Pa."]}]}, "vocab": [["Danh từ · Nouns", [["Người máy", "Robot", "Robot"], ["Nguy cơ", "Risk", "Rischio"], ["Dây chuyền sản xuất", "Production line", "Linea di produzione"], ["Ngành nghề", "Industry / occupation", "Settore"], ["Mối đe dọa", "Threat", "Minaccia"], ["Khoa học công nghệ", "Science and technology", "Scienza e tecnologia"], ["Tự động hóa", "Automation", "Automazione"], ["Xu hướng", "Trend", "Tendenza"], ["Lực lượng lao động", "Workforce", "Forza lavoro"]]], ["Động từ · Verbs", [["Tác động", "To impact", "Impattare"], ["Thay thế", "To replace", "Sostituire"], ["Chịu ảnh hưởng", "To be affected", "Essere influenzato"], ["Ứng dụng", "To apply", "Applicare"], ["Đào tạo", "To train", "Addestrare"], ["Đối mặt", "To face", "Affrontare"], ["Cảnh báo", "To warn", "Avvertire"], ["Thích ứng", "To adapt", "Adattarsi"]]], ["Tính từ · Adjectives", [["Sáng tạo", "Creative", "Creativo / creativa"], ["Bùng nổ", "Explosive", "Esplosivo"], ["Dập khuôn", "Stereotyped, by rote", "Stereotipato"]]]], "practice": [{"t": "mcq", "title": "Bài 1. Nghe và chọn từ đúng", "listen": 1, "items": [{"say": "phục vụ", "o": ["phục vụ", "phụp vụ"], "a": 0}, {"say": "máy giặt", "o": ["máy giặt", "máy giặc"], "a": 0}, {"say": "tự động hóa", "o": ["Tư đông hoa", "Tự động hóa"], "a": 1}, {"say": "người máy", "o": ["Ngươi mái", "Người máy"], "a": 1}, {"say": "ứng dụng", "o": ["Ứng dụng", "Ứng dụn"], "a": 0}, {"say": "sáng tạo", "o": ["Sán tạo", "Sáng tạo"], "a": 1}, {"say": "đào thải", "o": ["Đào thải", "Đào thảy"], "a": 0}]}, {"t": "match", "title": "Bài 2. Nối từ ngữ với hình ảnh", "pairs": [["🤖", "Rô bốt"], ["♨️📦", "Lò vi sóng"], ["🧺🌀", "Máy giặt"], ["🏭⚙️", "Dây chuyền sản xuất"], ["🤖🧹", "Rô bốt hút bụi"], ["🤖🍽️", "Rô bốt phục vụ"], ["🧑‍🔧➡️🤖", "Thay thế"]]}, {"t": "fill", "title": "Bài 3. Điền từ vào đoạn văn", "bank": ["Sáng tạo", "Rô bốt phục vụ", "Nguy cơ", "Tự động hóa", "Thay thế", "Ứng dụng", "Đào thải"], "items": ["Trong cuộc sống hiện đại, rô bốt ngày càng được sử dụng rộng rãi. Nhiều nhà hàng đã dùng *rô bốt phục vụ* để mang đồ ăn cho khách. Nhờ công nghệ, rô bốt có thể *thay thế* con người trong một số công việc nặng nhọc hoặc nguy hiểm. Không chỉ vậy, rô bốt còn giúp con người có thêm thời gian để tập trung vào những công việc cần sự *sáng tạo*.", "Ngày nay, rô bốt có nhiều *ứng dụng* trong y tế, giáo dục và sản xuất. Nhiều nhà máy đã áp dụng hệ thống *tự động hóa* để làm việc nhanh và chính xác hơn. Tuy nhiên, sự phát triển của rô bốt cũng mang đến *nguy cơ* cho một số ngành nghề, công việc truyền thống có thể bị *đào thải*."]}, {"t": "tf", "title": "Bài 4. Đúng hay sai?", "items": [["Tháng trước, anh ấy đi công tác ở Mỹ không phải chứ ở Pháp.", false], ["Họ đã nói rằng khóa học này giúp sinh viên nâng cao kĩ năng nói rất tốt.", true], ["Em ấy không thể ăn được cá, thậm chí chỉ ăn một chút.", false], ["Chị ấy mới gặp trưởng phòng chứ chưa gặp giám đốc.", true], ["Cô giáo đã dặn là rằng tuần sau chúng tôi có bài kiểm tra giữa kỳ.", false], ["Em Linh không làm bài tập, cả bài dễ nhất thậm chí.", false]]}, {"t": "mcq", "title": "Bài 5. Chọn đáp án đúng", "items": [{"q": "Trong nhà hàng hiện đại, nhiều nơi đã sử dụng __________ để mang đồ ăn cho khách.", "o": ["rô bốt phục vụ", "rô bốt công nghiệp", "rô bốt hút bụi"], "a": 0}, {"q": "Rô bốt có thể __________ con người trong những công việc nguy hiểm như cứu hộ hoặc khai thác mỏ.", "o": ["học tập", "thay thế", "sáng tạo"], "a": 1}, {"q": "Sự phát triển mạnh của rô bốt cũng mang lại __________ một số nghề truyền thống bị thay thế.", "o": ["nguy cơ", "ứng dụng", "sáng tạo"], "a": 0}, {"q": "Anh ấy chỉ thích xem phim hành động …… thích xem phim hài.", "o": ["chứ chưa", "chứ không", "đã không"], "a": 1}, {"q": "Giám đốc thông báo …… nhà máy có kế hoạch đưa rô bốt tham gia vào một số khâu trong quy trình sản xuất sản phẩm mới.", "o": ["có", "sẽ", "là"], "a": 2}, {"q": "Vì không có thời gian nên em mới ăn thử chả cá Hà Nội …… ăn thử bún bò Huế.", "o": ["chứ chưa", "chứ không", "chứ còn"], "a": 0}, {"q": "Khi rô bốt làm việc hiệu quả hơn, một số nghề có thể bị __________.", "o": ["sáng tạo", "đào thải", "ứng dụng"], "a": 1}]}]}, {"id": 12, "vi": "ChatGPT có thể thay thế con người?", "en": "Can ChatGPT replace humans?", "it": "ChatGPT può sostituire gli esseri umani?", "page": 202, "tracks": [["Nghe 1", "Book2_Lesson12_Listening1_North.mp3", "Bắc"], ["Nghe 2", "Book2_Lesson12_Listening2_South.mp3", "Nam"]], "grammar": {"points": [{"h": "1. A, hơn nữa B — A; moreover B", "b": "<p>Adds a further idea in clause B to what was said in clause A.</p><p class='ex'>Công việc này khó, hơn nữa nơi làm việc xa nên tôi không nhận lời.<br><span>This job is difficult; moreover, the workplace is far, so I didn’t accept.</span></p>"}, {"h": "2. Cứ A là B — whenever A, B", "b": "<p>A consistent relationship between a condition (A) and a result (B).</p><p class='ex'>Cứ được dùng máy tính là em ấy sẽ chơi game.<br><span>Whenever she can us function pct(l){const k=scorable(l);if(!k.length)return 0;const done=k.filter(x=>S.get("s:"+x,null)).length;return Math.round(done/k.length*100)}

/* ---------- normalisation for typed answers ---------- */
const TONEFIX=[["oà","òa"],["oá","óa"],["oả","ỏa"],["oã","õa"],["oạ","ọa"],["oè","òe"],["oé","óe"],["oẻ","ỏe"],["oẽ","õe"],["oẹ","ọe"],["uỳ","ùy"],["uý","úy"],["uỷ","ủy"],["uỹ","ũy"],["uỵ","ụy"]];
function norm(s){
  s=String(s).normalize("NFC").toLowerCase().replace(/[“”"]/g,"").replace(/\s+/g," ").trim().replace(/[.,!?;:…]+$/,"").trim();
  for(const [a,b] of TONEFIX)s=s.replace(new RegExp(a+"(?=$|[^a-zà-ỹđ])","g"),b);
  return s.replace(/\s+([.,!?;:])/g,"$1");
}

/* ---------- clock svg ---------- */
function clock(t){const [h,m]=t.split(":").map(Number);const ma=m*6,ha=(h%12)*30+m*.5;
 let ticks="";for(let i=0;i<12;i++){const a=i*30*Math.PI/180;ticks+=`<line x1="${50+38*Math.sin(a)}" y1="${50-38*Math.cos(a)}" x2="${50+43*Math.sin(a)}" y2="${50-43*Math.cos(a)}" stroke="currentColor" stroke-width="${i%3?1.5:3}"/>`}
 return `<svg viewBox="0 0 100 100" width="84" height="84" role="img" aria-label="Đồng hồ"><circle cx="50" cy="50" r="47" fill="var(--surface)" stroke="currentColor" stroke-width="3"/>${ticks}<line x1="50" y1="50" x2="${50+24*Math.sin(ha*Math.PI/180)}" y2="${50-24*Math.cos(ha*Math.PI/180)}" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><line x1="50" y1="50" x2="${50+36*Math.sin(ma*Math.PI/180)}" y2="${50-36*Math.cos(ma*Math.PI/180)}" stroke="var(--lotus)" stroke-width="3" stroke-linecap="round"/><circle cx="50" cy="50" r="3.5" fill="currentColor"/></svg>`}

  } else if(e.t==="fill"){

    body=bank+`<ol class="items">${e.items.map((s,i)=>{

      const html=parts.map((p,k)=>k%2? `<input class="blank" data-a="${esc(p)}" size="${Math.max(4,Math.max(...p.split("/").map(x=>x.length))+1)}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Chỗ trống">`:esc(p)).join("");

  } else if(e.t==="match"){

  } else if(e.t==="odd"){

  } else if(e.t==="open"){

function exList(arr,prefix){if(!arr||!arr.length)return"";return `<div class="exs">${arr.map((e,i)=>exHTML(e,prefix+":"+i)).join("")}</div>`}

function findEx(key){const [id,sec,i]=key.split(":");let l=byId(id)||revById(id);if(!l)return null;
  const m={r:l.reading&&l.reading.ex,g:l.grammar&&l.grammar.ex,l:l.listening&&l.listening.ex,p:l.practice,x:l.ex}[sec];return m&&m[+i]}

function check(card,solve){
  const key=card.dataset.key,e=findEx(key),t=e.t;let ok=0,tot=0;
  if(t==="mcq"||t==="odd"||t==="tf"){
    card.querySelectorAll(".items>li").forEach(li=>{
      const i=+li.dataset.i,it=e.items[i];const ans=t==="tf"?[it[1]?1:0]:[].concat(it.a);tot++;
      const sel=li.querySelector('.opt[aria-checked="true"]');
      li.querySelectorAll(".opt").forEach(b=>b.classList.remove("right","wrong","sol"));
      if(solve){li.querySelectorAll(".opt").forEach(b=>{if(ans.includes(+b.dataset.j))b.classList.add("sol")})}
      else if(sel){if(ans.includes(+sel.dataset.j)){sel.classList.add("right");ok++}else sel.classList.add("wrong")}
      const fb=li.querySelector(".fb");if(fb){const txt=(it.why?"Nhóm: "+it.why:"")+(it.note?(it.why?" · ":"")+it.note:"");if(txt&&(solve||sel)){fb.textContent=txt;fb.hidden=false}}
    });
  } else if(t==="fill"){
    card.querySelectorAll(".blank").forEach(inp=>{tot++;const alts=inp.dataset.a.split("/").map(norm);inp.classList.remove("right","wrong");
      const nx=inp.nextElementSibling;if(nx&&nx.classList.contains("solw"))nx.remove();
      if(solve){inp.value=inp.dataset.a.split("/")[0];inp.classList.add("right");return}
      if(!inp.value.trim())return;if(alts.includes(norm(inp.value))){inp.classList.add("right");ok++}else{inp.classList.add("wrong")}});
  } else if(t==="match"){
    card.querySelectorAll("select").forEach(sel=>{const i=+sel.dataset.i;tot++;sel.classList.remove("right","wrong");const sm=sel.nextElementSibling;sm.hidden=true;
      if(solve){sel.value=e.pairs[i][1];sel.classList.add("right");return}
      if(!sel.value)return;if(sel.value===e.pairs[i][1]){sel.classList.add("right");ok++}else{sel.classList.add("wrong")}});
  } else if(t==="order"){
    card.querySelectorAll(".items>li").forEach(li=>{const i=+li.dataset.i,it=e.items[i];tot++;const box=li.querySelector(".ord-ans");box.classList.remove("right","wrong");const fb=li.querySelector(".fb");
      if(solve){fb.textContent="Đáp án · Answer: "+[].concat(it.a)[0];fb.hidden=false;return}
      const words=[...box.querySelectorAll(".chip")].map(c=>c.textContent);if(!words.length)return;
      const s=words.join(" ");if([].concat(it.a).some(x=>norm(x)===norm(s))){box.classList.add("right");ok++}else box.classList.add("wrong")});
  }
  const sc=card.querySelector(".score");
  if(solve){sc.innerHTML=`<span class="best">Đã hiện đáp án · Solution shown</span>`;track(key,"","","Xem đáp án · Showed solution");return}
  const p=tot?Math.round(ok/tot*100):0;
  sc.className="score"+(ok===tot?" good":"");
  sc.innerHTML=`<span>${ok}/${tot}</span><span class="bar" style="--p:${p}"><i></i></span>`;
  const prev=S.get("s:"+key,null);if(!prev||ok>=prev[0]){S.set("s:"+key,[ok,tot])}
  track(key,ok,tot,"Kiểm tra · Checked");
  refreshProgress();
}
function retry(card){
  const key=card.dataset.key,e=findEx(key);
  const fresh=document.createElement("div");fresh.innerHTML=exHTML(e,key);card.replaceWith(fresh.firstElementChild);
}

/* ---------- global click handling ---------- */
let lastBlank=null;
document.addEventListener("focusin",ev=>{if(ev.target.classList&&ev.target.classList.contains("blank"))lastBlank=ev.target});
document.addEventListener("click",ev=>{
  const t=ev.target.closest("button,a");if(!t)return;
  if(t.dataset.say!==undefined&&t.matches("[data-say]")){ev.stopPropagation();speak(t.dataset.say);return}
  const card=t.closest(".ex");
  if(t.classList.contains("opt")&&card){const grp=t.closest(".opts");grp.querySelectorAll(".opt").forEach(b=>{b.setAttribute("aria-checked","false");b.classList.remove("right","wrong","sol")});t.setAttribute("aria-checked","true");return}
  if(t.classList.contains("chip")&&card&&t.dataset.w!==undefined){
    let target=lastBlank&&card.contains(lastBlank)?lastBlank:[...card.querySelectorAll(".blank")].find(b=>!b.value.trim());
    if(target){const w=t.dataset.w;target.value=isStart(target)?w.charAt(0).toUpperCase()+w.slice(1):w.toLowerCase();target.classList.remove("right","wrong");card.querySelectorAll(".bank .chip").forEach(c=>c.classList.toggle("used",[...card.querySelectorAll(".blank")].some(b=>norm(b.value)===norm(c.dataset.w))));const all=[...card.querySelectorAll(".blank")];const nx=all.slice(all.indexOf(target)+1).find(b=>!b.value);if(nx)nx.focus();else target.focus()}
    return}
  if(t.classList.contains("chip")&&card&&t.dataset.k!==undefined){
    const li=t.closest("li");const box=li.querySelector(".ord-ans"),bank=li.querySelector(".ord-bank");box.classList.remove("right","wrong");
    if(t.parentElement===bank){const c=t.cloneNode(true);c.dataset.from=t.dataset.k;box.appendChild(c);t.hidden=true}
    else{const orig=bank.querySelector(`.chip[data-k="${t.dataset.from}"]`);if(orig)orig.hidden=false;t.remove()}
    return}
  if(t.classList.contains("reveal")){t.nextElementSibling.classList.toggle("show");return}
  if(t.dataset.act&&card){
    if(t.dataset.act==="check")check(card,false);
    else if(t.dataset.act==="solve")check(card,true);
    else if(t.dataset.act==="retry")retry(card);
    else if(t.dataset.act==="revealall")card.querySelectorAll(".open-a").forEach(a=>a.classList.add("show"));
    return}
  if(t.dataset.voice){voiceMode=t.dataset.voice;S.set("voice",voiceMode);$("#side").innerHTML=sideHTML(curView);speak("Xin chào");return}
  if(t.dataset.lang){lang=t.dataset.lang;S.set("lang",lang);render();return}
  if(t.dataset.theme!==undefined){const cur=document.documentElement.dataset.theme;const dark=cur?cur==="dark":matchMedia("(prefers-color-scheme: dark)").matches;document.documentElement.dataset.theme=dark?"light":"dark";S.set("theme",document.documentElement.dataset.theme);return}
  if(t.id==="menuBtn"){$("#side").classList.toggle("open");return}
});

  return `<header class="lh"><div class="lnum">${l.intro?"Bài mở đầu":"Bài "+l.id} · Sách tr. ${l.page}</div><h1>${esc(l.vi)}</h1><p class="sub">${esc(l.en)} · ${esc(l.it)}</p>
  ${l.tracks&&l.tracks.length?`<div class="audios"><span class="hint">File nghe của sách · Book audio:</span>${l.tracks.map(([lab,file,acc])=>`<a class="btn sm" href="${AUDIO_BASE+encodeURI(file)}" target="_blank" rel="noopener">${ICON.head}${esc(lab)} <span class="accent">${esc(acc)}</span>${ICON.ext}</a>`).join("")}</div>`:""}
  ${l.forms?`<details class="obj"><summary>Mục tiêu bài học · Lesson objectives</summary><div class="in"><div><h4>Cấu trúc · Forms</h4><ul>${l.forms.map(f=>`<li>${esc(f)}</li>`).join("")}</ul></div><div><h4>Chức năng · Functions</h4><ul>${l.functions.map(f=>`<li>${esc(f)}</li>`).join("")}</ul></div></div></details>`:""}</header>`;
}

function panel(l,tab){
  const id=l.id;
  if(tab==="doc"){const r=l.reading;let h=`<h2>${esc(r.title)}</h2>`;
    if(r.note)h+=`<p class="note"><b>Sách</b><span>${esc(r.note)}</span></p>`;
    if(r.text)h+=`<article class="reading vi">${r.text}</article>`;
    if(r.trans)h+=`<details class="tr"><summary>Bản dịch tiếng Anh · English translation</summary><div class="in">${r.trans}</div></details>`;
    if(r.card)h+=`<div class="tw"><table class="card-t"><caption>${esc(r.card.title)}</caption>${r.card.rows.map(x=>`<tr><td>${esc(x[0])}</td><td>${esc(x[1])}</td></tr>`).join("")}</table></div>`;
    return h+`<h3>Bài tập đọc hiểu · Reading activities</h3>`+exList(r.ex,id+":r")}
  if(tab==="ngu-phap"){const g=l.grammar;return `<h2>Ghi chú ngữ pháp · Grammatical notes</h2>${g.points.map(p=>`<section class="gp"><h3>${esc(p.h)}</h3>${p.b}</section>`).join("")}<h3>Bài tập ngữ pháp · Grammar exercises</h3>${exList(g.ex,id+":g")}<p class="hint" style="margin-top:14px">Thêm bài tập về các cấu trúc này ở phần <a href="#/bai/${id}/luyen-tap">Luyện tập</a>.</p>`}
  if(tab==="viet"){const w=l.writing;const draft=S.get("w:"+id,"");return `<h2>Phần viết · Writing</h2><h3>Dịch các cụm từ sau · Translate these phrases</h3><p class="hint">Tự dịch sang tiếng Anh hoặc tiếng Ý, rồi bấm để xem đáp án. · Translate first, then reveal.</p>
    <div class="ex"><ol class="items">${w.items.map(x=>`<li><div><div class="qtext">${esc(x[0])}</div><button class="btn sm ghost reveal">Xem bản dịch · Reveal</button><div class="open-a"><span>${esc(x[1])}</span><br><span style="font-family:var(--sans);font-size:14px;color:var(--muted)">${esc(x[2])}</span></div></div></li>`).join("")}</ol></div>
    <h3>Bài viết · Writing task</h3><div class="ex"><p class="qtext" style="margin-top:0">${esc(w.task)}</p><textarea rows="7" data-draft="${id}" placeholder="Viết ở đây… Bài viết được lưu tự động trên trình duyệt này. · Your draft is saved automatically in this browser.">${esc(draft)}</textarea></div>
    ${w.phrases?`<h3>Các cách viết hữu dụng · Useful expressions</h3><div class="tw"><table class="card-t">${w.phrases.map(p=>`<tr><td>${esc(p[0])}</td><td>${esc(p[1])}</td></tr>`).join("")}</table></div>`:""}`}
  if(tab==="nghe"){const ls=l.listening;return `<h2>Phần nghe · Listening</h2>${tracksHTML(ls.tracks)}${ls.ex.length?`<h3>Bài tập nghe · Listening exercises</h3>`+exList(ls.ex,id+":l"):""}${ls.tr?`<h3>Lời thoại · Transcripts</h3><p class="hint">Chỉ xem sau khi đã làm bài. · Check only after doing the exercises.</p>`+transcripts(ls.tr,ls.tracks.map(t=>t[0])):""}`}
  if(tab==="tu-vung"){return `<h2>Từ vựng theo chủ đề · Vocabulary by topic</h2><div class="cta-row" style="margin:0 0 18px"><a class="btn primary" href="#/the-tu/${id}">Học bằng flashcard</a><span class="hint" style="align-self:center">Hiển thị nghĩa: <button class="pill" data-lang="en" aria-pressed="${lang==="en"}">EN</button> <button class="pill" data-lang="it" aria-pressed="${lang==="it"}">IT</button></span></div>
    ${l.vocab.map((g,gi)=>`<section class="vgroup"><h3>${esc(g[0])} <a class="hint" href="#/the-tu/${id}/${gi}">· flashcard</a></h3><table class="vt show-${lang}"><tr><th></th><th>Tiếng Việt</th><th class="c-en">English</th><th class="c-it">Italiano</th></tr>${g[1].map(r=>`<tr><td style="width:40px">${sayBtn(r[0],true)}</td><td class="w">${esc(r[0])}</td><td class="c-en">${esc(r[1])}</td><td class="c-it">${esc(r[2])}</td></tr>`).join("")}</table></section>`).join("")}`}
  if(tab==="van-hoa"){return `<h2>Ghi chú văn hóa · Cultural note</h2><section class="culture"><h3>${esc(l.culture.h)}</h3>${l.culture.b}</section>
    <h2 style="margin-top:34px">Ghi chú phương ngữ · Dialectal note</h2><p class="hint">Cùng một nghĩa, người miền Bắc và miền Nam có thể dùng từ khác nhau. · Same meaning, different words in the North and the South.</p>
    <div class="vgroup"><table class="vt"><tr><th>Miền Bắc · North</th><th>Miền Nam · South</th><th>English</th><th>Italiano</th></tr>${l.dialect.map(d=>`<tr><td class="w">${esc(d[0])}</td><td class="w">${esc(d[1])}</td><td>${esc(d[2])}</td><td>${esc(d[3])}</td></tr>`).join("")}</table></div>`}
  if(tab==="luyen-tap"){return `<h2>Bài tập bổ trợ · Extra practice</h2><p class="hint">Các nút loa đọc bằng giọng đã chọn ở mục Giọng đọc (Máy hoặc Google). Câu có hình được minh họa bằng biểu tượng. · Speaker buttons use the voice chosen under “Giọng đọc”; pictures are shown as icons.</p>${exList(l.practice,id+":p")}`}
  if(tab==="phat-am"){return `<h2>Giới thiệu · About Vietnamese</h2><div class="gp" style="padding-top:12px">${l.about}</div>
    <h3>Bảng chữ cái · The alphabet (29 letters)</h3><p class="hint">Bấm vào chữ để nghe từ ví dụ. · Tap a letter to hear the example word.</p><div class="alpha">${l.alphabet.map(a=>`<button data-say="${esc(a[1])}"><span class="L">${a[0]}</span><span class="W">${esc(a[1])}</span><span class="G">${esc(a[2])}</span></button>`).join("")}</div>
    <h3>Sáu thanh điệu · The six tones</h3><div class="vgroup"><table class="vt"><tr><th></th><th>Tên thanh · Tone</th><th>Dấu</th><th>Mark</th><th>Description</th></tr>${l.tones.map(t=>`<tr><td>${sayBtn(t[4],true)}</td><td class="w">${esc(t[0])}</td><td class="w" style="font-size:22px">${esc(t[1])}</td><td>${esc(t[2])}</td><td>${esc(t[3])}</td></tr>`).join("")}</table></div>
    <h3>Luyện phát âm · Pronounce the combinations</h3><p class="hint">Đọc to từng âm tiết, bấm để so sánh. · Read each syllable aloud, then tap to compare.</p>${l.combos.map(c=>`<div class="combo">${c.split(" ").map(s=>`<button data-say="${esc(s.toLowerCase())}">${esc(s)}</button>`).join("")}</div>`).join("")}
    <h3>Chính tả · Spelling note</h3><div class="gp" style="padding-top:10px">${l.spelling}</div>`}
  return "";
}

function lesson(id,tab){
  const l=byId(id);if(!l)return home();
  const tabs=l.intro?TABS0:TABS;if(!tabs.some(t=>t[0]===tab))tab=tabs[0][0];
  S.set("last",{h:"#/bai/"+id+"/"+tab,t:(l.intro?"Bài 0":"Bài "+l.id)+" — "+l.vi});
  const i=ALL.indexOf(l),prev=ALL[i-1],next=ALL[i+1];
  return lessonHeader(l)+`<nav class="tabs" role="tablist">${tabs.map(t=>`<a role="tab" href="#/bai/${id}/${t[0]}" aria-selected="${t[0]===tab}">${t[1]}<small>${t[2]}</small></a>`).join("")}</nav><div class="panel" role="tabpanel">${panel(l,tab)}</div>
  <nav class="pager">${prev?`<a href="#/bai/${prev.id}"><small>Bài trước · Previous</small><span>${prev.id}. ${esc(prev.vi)}</span></a>`:"<span></span>"}${next?`<a href="#/bai/${next.id}" style="text-align:right"><small>Bài sau · Next</small><span>${next.id}. ${esc(next.vi)}</span></a>`:"<span></span>"}</nav>`;
}
function revision(id){
  const r=revById(id);if(!r)return home();
  S.set("last",{h:"#/on-tap/"+id,t:r.vi});
  return `<header class="lh"><div class="lnum">Ôn tập · Sách tr. ${r.page}</div><h1>${esc(r.vi)}</h1><p class="sub">${esc(r.en)} · ${esc(r.it)} — phần nghe · listening part</p></header>
  <div class="panel" style="margin-top:22px"><p class="note"><b>Sách</b><span>Phần đọc, viết và nói của bài ôn tập có trong sách (tr. ${r.page}). Ở đây bạn luyện phần nghe với file nghe của sách.</span></p>${tracksHTML(r.tracks)}<h3>Bài tập nghe · Listening exercises</h3>${exList(r.ex,r.id+":x")}<h3>Lời thoại · Transcripts</h3><p class="hint">Chỉ xem sau khi đã làm bài.</p>${transcripts(r.tr,r.tracks.map(t=>t[0]))}</div>`;
}

/* ---------- flashcards ---------- */
let deck=null;
function cardsPicker(){
  return `<header class="lh"><div class="lnum">Từ vựng</div><h1>Flashcard theo chủ đề</h1><p class="sub">Vocabulary flashcards by topic · Flashcard di vocabolario per argomento</p></header>
  <p class="hint" style="margin:18px 0">Chọn một chủ đề (cả bài) hoặc một nhóm từ. Lật thẻ, nghe phát âm, đánh dấu từ đã nhớ. · Pick a whole lesson or a word group.</p>
  <div class="deck-pick">${ALL.filter(l=>l.vocab).map(l=>{const n=l.vocab.reduce((a,g)=>a+g[1].length,0);const known=S.get("k:"+l.id+":a",[]).length;
   return `<div class="row"><b>${l.id}. ${esc(l.vi)}</b> <span class="hint">${esc(l.en)} · ${n} từ${known?` · đã nhớ ${known}`:""}</span><div class="chips"><a class="btn sm primary" href="#/the-tu/${l.id}">Cả bài · All</a>${l.vocab.map((g,gi)=>`<a class="btn sm" href="#/the-tu/${l.id}/${gi}">${esc(g[0])} (${g[1].length})</a>`).join("")}</div></div>`}).join("")}</div>`;
}
function startDeck(id,gi){
  const l=byId(id);if(!l||!l.vocab)return null;
  const words=gi==null?l.vocab.flatMap(g=>g[1]):(l.vocab[gi]||l.vocab[0])[1];
  const dkey=id+":"+(gi==null?"a":gi);
  const known=new Set(S.get("k:"+dkey,[]));
  let queue=words.filter(w=>!known.has(w[0]));
  return {l,gi,dkey,words,known,queue:shuffle(queue),flip:false,rev:S.get("fcrev",false),title:gi==null?"Cả bài":l.vocab[gi][0]};
}
function cardsView(id,gi){
  if(!deck||deck.l.id!==+id||String(deck.gi)!==String(gi==null?null:gi))deck=startDeck(+id,gi==null?null:+gi);
  if(!deck)return cardsPicker();
  S.set("last",{h:location.hash,t:"Flashcard — "+deck.l.vi});
  return `<header class="lh"><div class="lnum"><a href="#/the-tu">Flashcard</a> · Bài ${deck.l.id}</div><h1>${esc(deck.l.vi)}</h1><p class="sub">${esc(deck.title)} · ${esc(deck.l.en)}</p></header><div id="fc" class="fc-wrap" style="margin-top:22px"></div>`;
}
function drawCard(){
  const box=$("#fc");if(!box||!deck)return;
  const total=deck.words.length,kn=deck.known.size;
  const top=`<div class="fc-top"><span class="hint">Đã nhớ · Known <b>${kn}</b>/${total} · Còn lại · Left ${deck.queue.length}</span><span><button class="pill" id="fcDir" aria-pressed="${deck.rev}">${deck.rev?(lang==="it"?"IT":"EN")+" → VI":"VI → "+(lang==="it"?"IT":"EN")}</button> <button class="pill" id="fcShuf">Trộn · Shuffle</button> <button class="pill" id="fcReset">Bắt đầu lại · Reset</button></span></div><div class="bar" style="--p:${total?Math.round(kn/total*100):0};margin-bottom:16px"><i></i></div>`;
  if(!deck.queue.length){box.innerHTML=top+`<div class="fc-done"><b>Giỏi lắm!</b><p>Bạn đã nhớ hết ${total} từ trong nhóm này. · You know all the words in this set.</p><div class="cta-row" style="justify-content:center"><button class="btn primary" id="fcReset2">Học lại từ đầu · Start over</button><a class="btn" href="#/the-tu">Chọn chủ đề khác</a></div></div>`;return}
  const w=deck.queue[0];const tr=lang==="it"?w[2]:w[1],other=lang==="it"?w[1]:w[2];
  const front=deck.rev?`<span class="lab">${lang==="it"?"Italiano":"English"}</span><div class="tr2">${esc(tr)}</div><div class="tr3">${esc(other)}</div>`:`<span class="lab">Tiếng Việt</span><div class="big">${esc(w[0])}</div>${sayBtn(w[0])}`;
  const back=deck.rev?`<span class="lab">Tiếng Việt</span><div class="big">${esc(w[0])}</div>${sayBtn(w[0])}`:`<span class="lab">${lang==="it"?"Italiano":"English"}</span><div class="tr2">${esc(tr)}</div><div class="tr3">${esc(other)}</div>`;
  box.innerHTML=top+`<div class="fc${deck.flip?" flip":""}" id="fcCard" tabindex="0" role="button" aria-label="Lật thẻ · Flip card"><div class="fc-in"><div class="face front">${front}</div><div class="face back">${back}</div></div></div>
  <p class="hint" style="text-align:center;margin:10px 0 0">Bấm vào thẻ hoặc phím cách để lật · Tap or press Space to flip</p>
  <div class="fc-ctl"><button class="btn again" id="fcAgain">Chưa nhớ · Again</button><button class="btn know" id="fcKnow">Đã nhớ · Got it</button></div>`;
  if(!deck.rev&&!deck.flip&&S.get("autoSay",false))speak(w[0]);
}
document.addEventListener("click",ev=>{
  if(!deck)return;const t=ev.target;
  if(t.closest(".say"))return;
  if(t.closest("#fcCard")){deck.flip=!deck.flip;$("#fcCard").classList.toggle("flip",deck.flip);return}
  if(t.closest("#fcAgain")){const w=deck.queue.shift();const pos=Math.min(deck.queue.length,3+Math.floor(Math.random()*3));deck.queue.splice(pos,0,w);deck.flip=false;drawCard();return}
  if(t.closest("#fcKnow")){const w=deck.queue.shift();deck.known.add(w[0]);S.set("k:"+deck.dkey,[...deck.known]);deck.flip=false;drawCard();return}
  if(t.closest("#fcDir")){deck.rev=!deck.rev;S.set("fcrev",deck.rev);deck.flip=false;drawCard();return}
  if(t.closest("#fcShuf")){deck.queue=shuffle(deck.queue);deck.flip=false;drawCard();return}
  if(t.closest("#fcReset")||t.closest("#fcReset2")){deck.known.clear();S.set("k:"+deck.dkey,[]);deck.queue=shuffle(deck.words);deck.flip=false;drawCard();return}
});
document.addEventListener("keydown",ev=>{
  if(!$("#fcCard")||/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;
  if(ev.code==="Space"||ev.key==="Enter"&&document.activeElement.id==="fcCard"){ev.preventDefault();$("#fcCard").click()}
  else if(ev.key==="ArrowRight")$("#fcKnow").click(); else if(ev.key==="ArrowLeft")$("#fcAgain").click();
});
document.addEventListener("input",ev=>{const ta=ev.target;if(ta.dataset&&ta.dataset.draft){S.set("w:"+ta.dataset.draft,ta.value)}if(ta.classList.contains("blank"))ta.classList.remove("right","wrong")});
document.addEventListener("change",ev=>{if(ev.target.id==="voiceSel"){voiceName=ev.target.value;S.set("voiceName",voiceName);loadVoices();speak("Xin chào");return}if(ev.target.matches(".mt select"))ev.target.classList.remove("right","wrong")});

/* ---------- router ---------- */
function render(){
  const h=location.hash.replace(/^#\/?/,"").split("/").filter(Boolean);
  let html,cur="";
  if(h[0]==="bai"){html=lesson(h[1],h[2]);cur="L"+h[1];deck=null}
  else if(h[0]==="on-tap"){html=revision(h[1]);cur=h[1];deck=null}
  else if(h[0]==="the-tu"){html=h[1]!=null?cardsView(h[1],h[2]):cardsPicker();cur="cards";if(h[1]==null)deck=null}
  else {html=home();deck=null}
  $("#view").innerHTML=html+`<footer class="foot">Tài liệu luyện tập dùng kèm giáo trình <i>Vietnamese Vibes 2 – Intermediate Level</i> (Phan Trang, Chu Phong Lan, Cafoscarina, 2024). File nghe: <a href="${AUDIO_PAGE}" target="_blank" rel="noopener">cafoscarina.it</a>.</footer>`;
  curView=cur;$("#side").innerHTML=sideHTML(cur);$("#side").classList.remove("open");
  if(deck)drawCard();
  const title=$("#view h1");document.title=(title&&cur?title.textContent+" — ":"")+"Vietnamese Vibes 2";
}
let lastPath="";
window.addEventListener("hashchange",()=>{const p=location.hash.split("/").slice(0,3).join("/");const sameLesson=p===lastPath;lastPath=p;render();if(!sameLesson)window.scrollTo(0,0);else{const tb=$(".tabs");if(tb&&tb.getBoundingClientRect().top<0)tb.scrollIntoView()}});
try{const th=S.get("theme",null);if(th)document.documentElement.dataset.theme=th}catch(e){}
lastPath=location.hash.split("/").slice(0,3).join("/");
render();
})();

</script>
</body>
</html>
