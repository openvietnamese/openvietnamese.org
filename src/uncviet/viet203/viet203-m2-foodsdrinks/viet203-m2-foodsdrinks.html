.vocab-en{color:var(--text3)}
.grammar-box{background:var(--gbg);border-left:4px solid var(--gold);padding:0.6rem 0.9rem;border-radius:0 var(--rxs) var(--rxs) 0;font-size:0.8rem;color:var(--text2);line-height:1.6}

.question-block{margin-bottom:1.1rem;padding-bottom:1.1rem;border-bottom:1px solid var(--border)}
.question-block:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.q-number{font-size:0.66rem;font-weight:800;text-transform:uppercase;letter-spacing:0.05em;color:var(--text3);margin-bottom:0.3rem}
.q-text{font-size:0.9rem;font-weight:600;margin-bottom:0.6rem;line-height:1.5}
.options{display:grid;gap:0.45rem}
.opt-btn{width:100%;text-align:left;padding:0.6rem 0.85rem;border:1.5px solid var(--border);border-radius:var(--rxs);background:var(--surface);font-family:inherit;font-size:0.84rem;cursor:pointer;transition:all 0.15s;color:var(--text)}
.opt-btn:hover:not(:disabled){border-color:var(--flame);background:var(--fglow)}
.opt-btn:disabled{cursor:default}
.opt-btn.correct{border-color:var(--leaf);background:var(--lbg);color:var(--leaf);font-weight:700}
.opt-btn.wrong{border-color:var(--coral);background:var(--cbg);color:var(--coral)}
.q-feedback{font-size:0.78rem;font-weight:700;margin-top:0.45rem;min-height:1em}

.chat-log{display:flex;flex-direction:column;gap:0.6rem;margin-bottom:1rem}
.chat-msg{padding:0.6rem 0.9rem;border-radius:var(--rxs);max-width:85%;font-size:0.88rem;line-height:1.5}
.chat-msg.server{background:var(--surface2);align-self:flex-start}
.chat-msg.user{background:var(--fglow);align-self:flex-end;text-align:right}

.wsort-bank{display:flex;flex-wrap:wrap;gap:0.5rem;padding:0.9rem;background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);margin-bottom:0.9rem;min-height:2.6rem}
.wsort-word{padding:0.4rem 0.85rem;border:1.5px solid var(--border);border-radius:999px;background:var(--surface);font-family:inherit;font-size:0.84rem;cursor:pointer;transition:all 0.15s;color:var(--text)}
.wsort-word:hover{border-color:var(--flame);background:var(--fglow)}
.wsort-word.sel{border-color:var(--flame);background:var(--flame);color:#fff;font-weight:700}
.wsort-groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0.7rem}
.wsort-group{border:1.5px dashed var(--border);border-radius:var(--rs);padding:0.7rem;min-height:4rem;cursor:pointer;transition:all 0.15s}
.wsort-group:hover{border-color:var(--flame)}
.wsort-group.wsort-wrong-flash{border-color:var(--coral);background:var(--cbg)}
.wsort-group-title{font-weight:700;font-size:0.78rem;margin-bottom:0.5rem;color:var(--text2)}
.wsort-placed{display:inline-block;padding:0.3rem 0.65rem;border-radius:999px;font-size:0.78rem;margin:0.2rem 0.25rem 0 0;background:var(--lbg);color:var(--leaf);border:1px solid var(--leaf)}

.chipsel-row{display:flex;flex-wrap:wrap;gap:0.5rem;margin:0.6rem 0}
.chipsel{padding:0.45rem 0.85rem;border:1.5px solid var(--border);border-radius:999px;background:var(--surface);font-family:inherit;font-size:0.84rem;cursor:pointer;transition:all 0.15s;color:var(--text)}
.chipsel:hover:not(:disabled){border-color:var(--flame);background:var(--fglow)}
.chipsel.sel{border-color:var(--flame);background:var(--fglow);color:var(--flame2);font-weight:700}
.chipsel:disabled{cursor:default}
.chipsel.correct{border-color:var(--leaf);background:var(--lbg);color:var(--leaf);font-weight:700}
.chipsel.wrong{border-color:var(--coral);background:var(--cbg);color:var(--coral);font-weight:700}
.chipsel.missed{border-color:var(--leaf);background:transparent;color:var(--leaf);border-style:dashed}

.seq-list{display:flex;flex-direction:column;gap:0.5rem;margin:0.7rem 0}
.seq-item{display:flex;align-items:center;gap:0.7rem;padding:0.6rem 0.8rem;border:1.5px solid var(--border);border-radius:var(--rxs);background:var(--surface);font-size:0.86rem;line-height:1.5}
.seq-item.correct{border-color:var(--leaf);background:var(--lbg)}
.seq-item.wrong{border-color:var(--coral);background:var(--cbg)}
.seq-num{font-weight:800;color:var(--flame2);min-width:1.4rem}
.seq-text{flex:1}
.seq-move{display:flex;flex-direction:column;gap:0.15rem}
.seq-move button{border:1px solid var(--border);background:var(--surface2);border-radius:4px;width:1.6rem;height:1.3rem;font-size:0.7rem;cursor:pointer;color:var(--text2);line-height:1;font-family:inherit}
.seq-move button:disabled{opacity:0.3;cursor:default}
.seq-move button:hover:not(:disabled){border-color:var(--flame);color:var(--flame2)}

.recipe-card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin-bottom:1rem}
.recipe-card{border:1.5px solid var(--border);border-radius:var(--rs);background:var(--surface);cursor:pointer;overflow:hidden;transition:all 0.15s;text-align:left;font-family:inherit;padding:0;display:block;width:100%}
.recipe-card:hover{border-color:var(--flame)}
.recipe-card.open{border-color:var(--flame);box-shadow:0 0 0 1px var(--flame)}
.recipe-card-img{aspect-ratio:4/3;background:repeating-linear-gradient(45deg,var(--surface2),var(--surface2) 12px,var(--surface3) 12px,var(--surface3) 24px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.3rem;font-size:2.2rem;color:var(--text3)}
.recipe-card-img .ph-label{font-size:0.66rem;text-transform:uppercase;letter-spacing:0.05em;font-weight:700}
.recipe-card-body{padding:0.8rem 0.9rem}
.recipe-card-name{font-weight:700;font-size:0.95rem;margin-bottom:0.25rem;color:var(--text)}
.recipe-card-cta{font-size:0.76rem;color:var(--text3)}
.recipe-card.open .recipe-card-cta{color:var(--flame2);font-weight:600}

.lf-sentence{padding:0.55rem 0;border-bottom:1px dashed var(--border);font-size:0.88rem;line-height:1.8}
.lf-sentence:last-child{border-bottom:none}
.lf-blank{display:inline-flex;align-items:center;justify-content:center;min-width:5.5rem;padding:0.2rem 0.6rem;margin:0 0.2rem;border:1.5px dashed var(--border2);border-radius:var(--rxs);background:var(--surface2);font-weight:600;color:var(--text3);cursor:pointer;transition:all 0.15s}
.lf-blank.dragover{border-color:var(--flame);background:var(--fglow)}
.lf-blank.filled{border-style:solid;cursor:pointer}
.lf-blank.correct{border-color:var(--leaf);background:var(--lbg);color:var(--leaf)}
.lf-blank.wrong-flash{border-color:var(--coral);background:var(--cbg);color:var(--coral)}

.fill-table{width:100%;border-collapse:collapse}
.fill-table th{text-align:left;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--text3);padding:0.5rem 0.6rem;border-bottom:1px solid var(--border)}
.fill-table td{padding:0.65rem 0.6rem;border-bottom:1px solid var(--border);font-size:0.86rem;vertical-align:top}
.fill-table tr:last-child td{border-bottom:none}
.fill-table input.blank,.fill-table textarea.blank{background:var(--surface3);border:1px solid var(--border2);border-radius:var(--rxs);padding:0.3rem 0.5rem;color:var(--text);font-size:0.84rem;width:100%}
.fill-table input.blank:focus,.fill-table textarea.blank:focus{outline:none;border-color:var(--flame)}
.table-wrap{overflow-x:auto}

.tf-row{display:flex;align-items:center;gap:0.9rem;padding:0.75rem 0;border-bottom:1px solid var(--border)}
.tf-row:last-child{border-bottom:none}
.tf-text{flex:1;font-size:0.88rem}
.tf-btns{display:flex;gap:0.4rem;flex-shrink:0}
.tf-btn{width:42px;height:36px;border-radius:var(--rxs);border:1px solid var(--border);background:var(--surface2);color:var(--text2);font-weight:700;font-size:0.8rem;transition:all 0.15s}
.tf-btn:hover{border-color:var(--border2)}
.tf-btn.correct{background:var(--lbg);border-color:var(--leaf);color:var(--leaf)}
.tf-btn.wrong{background:var(--cbg);border-color:var(--coral);color:var(--coral)}
.tf-btn.sel{background:var(--fglow);border-color:var(--flame);color:var(--flame2)}
.tf-btn:disabled{cursor:default;opacity:0.9}
.check-btn{margin-top:1rem;background:var(--flame);color:#ffffff;border:none;border-radius:var(--rs);padding:0.6rem 1.2rem;font-size:0.84rem;font-weight:700}
.check-btn:hover{background:var(--flame2)}
.check-btn.secondary{background:var(--surface2);color:var(--text2);border:1px solid var(--border)}
.check-btn.secondary:hover{border-color:var(--border2)}

.ck-row{display:flex;align-items:center;gap:0.7rem;padding:0.6rem 0;border-bottom:1px solid var(--border)}
.ck-row:last-child{border-bottom:none}
.ck-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--flame);flex-shrink:0}
.ck-row label{font-size:0.88rem;cursor:pointer}
.honor-box{background:var(--gbg);border:1px solid var(--gold);border-radius:var(--rs);padding:0.9rem 1rem;margin-top:0.7rem}
.honor-box label{font-weight:700;font-size:0.88rem;cursor:pointer;color:#78350f}

.pair-table{width:100%;border-collapse:collapse}
.pair-table th{text-align:left;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--text3);padding:0.5rem 0.6rem;border-bottom:1px solid var(--border)}
.pair-table td{padding:0.5rem 0.6rem;border-bottom:1px solid var(--border);vertical-align:top}
.pair-table tr:last-child td{border-bottom:none}
.pair-table input{background:var(--surface3);border:1px solid var(--border2);border-radius:var(--rxs);padding:0.4rem 0.55rem;color:var(--text);font-size:0.84rem;width:100%}
.pair-table input:focus{outline:none;border-color:var(--flame)}

.link-btn{display:inline-flex;align-items:center;gap:0.5rem;background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);padding:0.6rem 1rem;font-size:0.86rem;color:var(--text);text-decoration:none;transition:all 0.15s}
.link-btn:hover{border-color:var(--flame);color:var(--flame2)}

.rubric-table{width:100%;border-collapse:collapse;font-size:0.82rem}
.rubric-table th{background:var(--surface2);text-align:left;padding:0.6rem 0.7rem;border:1px solid var(--border);font-size:0.72rem;text-transform:uppercase;letter-spacing:0.04em;color:var(--text3)}
.rubric-table td{padding:0.7rem;border:1px solid var(--border);vertical-align:top;line-height:1.5}
.rubric-table td:first-child{font-weight:700;color:var(--flame2)}

.gloss-search{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);padding:0.7rem 1rem;color:var(--text);font-size:0.9rem;margin-bottom:1.2rem}
.gloss-search:focus{outline:none;border-color:var(--flame)}
.gloss-cat{margin-bottom:1.3rem}
.gloss-cat h4{font-size:0.72rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--gold);margin-bottom:0.6rem;padding-bottom:0.4rem;border-bottom:1px solid var(--border)}
.gterm{display:flex;justify-content:space-between;gap:1rem;padding:0.5rem 0;border-bottom:1px dashed var(--border);font-size:0.86rem}
.gterm:last-child{border-bottom:none}
.gterm .vn{font-weight:600}
.gterm .en{color:var(--text3);font-style:italic;text-align:right}
.gterm.hide{display:none}

.xp-header{background:linear-gradient(135deg,#0f766e,#0d9488);color:#fff;padding:0.85rem 1.25rem;position:sticky;top:0;z-index:200;box-shadow:0 2px 10px rgba(15,118,110,0.25)}
.pcard.done{border-color:var(--leaf)}
.pc-done-badge{position:absolute;top:0.9rem;right:0.9rem;background:var(--lbg);color:var(--leaf);border:1px solid var(--leaf);font-size:0.66rem;font-weight:700;padding:2px 9px;border-radius:20px}
.pc-required-badge{position:absolute;top:0.9rem;right:0.9rem;background:var(--gbg);color:#b45309;border:1px solid var(--gold);font-size:0.66rem;font-weight:700;padding:2px 9px;border-radius:20px}
.pcard.core{border-width:2px}

#xp-pop{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%) scale(0);background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;padding:0.65rem 1.5rem;border-radius:30px;font-size:1.15rem;font-weight:800;z-index:9999;pointer-events:none;white-space:nowrap;transition:transform 0.22s,top 0.45s;letter-spacing:0.03em;box-shadow:0 8px 24px rgba(217,119,6,0.35)}
#xp-pop.show{transform:translate(-50%,-50%) scale(1);top:32%}
#milestone-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);background:linear-gradient(135deg,#0f766e,#0d9488);color:#fff;padding:0.9rem 1.75rem;border-radius:16px;font-size:0.92rem;font-weight:700;z-index:9998;pointer-events:none;transition:transform 0.4s cubic-bezier(.34,1.56,.64,1),opacity 0.5s;opacity:0;text-align:center;box-shadow:0 8px 28px rgba(0,0,0,0.22);min-width:200px}
#milestone-toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#milestone-toast .mt-emoji{font-size:1.6rem;display:block;margin-bottom:0.2rem}
#milestone-toast .mt-sub{font-size:0.7rem;opacity:0.85;font-weight:400;margin-top:0.2rem}

.credit-req-row{display:flex;align-items:center;gap:0.6rem;padding:0.5rem 0;border-bottom:1px solid var(--border);font-size:0.86rem}
.credit-req-row:last-child{border-bottom:none}
.credit-req-icon{font-size:1.1rem;flex-shrink:0}
.credit-grade-badge{display:inline-flex;align-items:center;gap:0.5rem;font-weight:800;font-size:1.1rem;padding:0.4rem 1rem;border-radius:20px;margin-top:0.8rem}

.report-name-row{display:flex;gap:0.6rem;flex-wrap:wrap;align-items:center;margin-bottom:1rem}
.report-name-row input{flex:1;min-width:200px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);padding:0.6rem 0.9rem;color:var(--text);font-size:0.9rem}
.report-name-row input:focus{outline:none;border-color:var(--flame)}
.checklist{list-style:none;display:flex;flex-direction:column;gap:0.5rem}
.checklist li{display:flex;align-items:center;gap:0.7rem;font-size:0.86rem;padding:0.65rem 0.9rem;border-radius:var(--rxs);border:1.5px solid var(--border);background:var(--surface2);flex-wrap:wrap}
.checklist li.cl-done{background:var(--lbg);border-color:var(--leaf);color:var(--leaf)}
.checklist li.cl-partial{background:var(--gbg);border-color:var(--gold);color:var(--gold)}
.checklist li.cl-missing{background:var(--surface2);border-color:var(--border);color:var(--text2)}
.cl-icon{font-size:1rem;flex-shrink:0}
.cl-text{flex:1;font-weight:600;color:var(--text)}
.cl-xp{font-size:0.72rem;font-weight:700;opacity:0.85;white-space:nowrap}
.cl-go-btn{font-size:0.72rem;padding:0.25rem 0.7rem;border:1.5px solid currentColor;border-radius:6px;cursor:pointer;background:transparent;color:inherit;font-weight:700;font-family:inherit;opacity:0.85;transition:opacity 0.2s;white-space:nowrap;flex-shrink:0}
.cl-go-btn:hover{opacity:1}
.reflect-counter{font-size:0.74rem;color:var(--text3)}
.reflect-counter.ok{color:var(--leaf);font-weight:700}
.code-box{background:linear-gradient(135deg,#0f766e,#0d9488);border-radius:var(--r);padding:1.4rem 1.6rem;text-align:center;margin:1rem 0}
.code-label{font-size:0.68rem;font-weight:700;letter-spacing:0.1em;color:rgba(255,255,255,0.75);text-transform:uppercase;margin-bottom:0.6rem}
.code-value{font-size:1.6rem;font-weight:800;color:#fff;letter-spacing:0.2em;font-family:'Lexend',monospace;margin-bottom:0.8rem;word-break:break-all}
.code-locked{background:var(--surface2);border:2px dashed var(--border);border-radius:var(--r);padding:1.2rem 1.4rem;color:var(--text2);font-size:0.86rem;line-height:1.7}
.code-locked strong{color:var(--text)}
.code-locked ul{margin:0.6rem 0 0 1.1rem}
.report-actions{display:flex;gap:0.6rem;flex-wrap:wrap;margin-top:1rem}
.sentence-box{background:var(--gbg);border:1px solid var(--gold);border-left:4px solid var(--gold);border-radius:0 var(--rxs) var(--rxs) 0;padding:0.75rem 1rem;font-size:0.85rem;line-height:1.65;color:var(--text)}

.sprint-card{background:linear-gradient(135deg,#faf5ff,#f3e8ff);border:1px solid #e9d5ff;border-radius:var(--r);padding:1.4rem;text-align:center}
.sprint-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.9rem}
.timer-pill{font-size:1rem;font-weight:800;padding:4px 12px;border-radius:20px;background:var(--cbg);color:var(--coral);font-variant-numeric:tabular-nums}
.sprint-prompt{background:var(--surface);border:2px solid var(--border);border-radius:var(--rs);padding:1.1rem;margin-bottom:1rem;font-size:1.3rem;font-weight:700;min-height:2rem}
.sprint-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.6rem;margin-bottom:0.9rem}
@media(max-width:520px){.sprint-grid{grid-template-columns:1fr}}
.time-rail{width:100%;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;margin-bottom:1rem}
.time-gauge{height:100%;width:100%;background:var(--coral);transition:width 0.05s linear}
.dict-input{width:80%;max-width:320px;padding:0.7rem 1rem;font-size:1.1rem;font-weight:600;text-align:center;border:2px solid var(--border);border-radius:var(--rs);outline:none}
.dict-input:focus{border-color:var(--flame)}
.dict-input.correct{border-color:var(--leaf);background:var(--lbg);color:var(--leaf)}
.dict-input.missed{border-color:var(--coral);background:var(--cbg);color:var(--coral)}
.vanish-box{min-height:90px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;padding:1.1rem;background:var(--surface2);border-radius:var(--rs);border:1px solid var(--border);margin-bottom:1rem}
.vanish-word{font-size:1.3rem;font-weight:700;color:var(--text)}
.vanish-word.gone{color:transparent;border-bottom:2px solid var(--border2);user-select:none;min-width:40px}
.ribbon-stage{position:relative;width:100%;height:120px;background:#0f172a;border-radius:var(--rs);overflow:hidden;margin-bottom:1rem}
.ribbon-gate{position:absolute;left:25%;top:0;bottom:0;width:2px;background:#38bdf8;box-shadow:0 0 10px #38bdf8;z-index:10}
.ribbon-gate-lbl{position:absolute;top:8px;left:calc(25% + 6px);color:#38bdf8;font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;z-index:10}
.ribbon-track{position:absolute;top:0;left:0;height:100%;display:flex;align-items:center;will-change:transform}
.ribbon-node{display:inline-flex;align-items:center;margin-right:110px;padding:0.6rem 1.1rem;background:#1e293b;border:1.5px solid #334155;border-radius:var(--rxs);color:#f8fafc;font-size:1.15rem;font-weight:600;white-space:nowrap;transition:border-color 0.2s,background-color 0.2s}
.ribbon-node.hi{border-color:#38bdf8;background:#0c4a6e;box-shadow:0 0 12px rgba(56,189,248,0.4)}
.ctest-passage{font-size:1.02rem;line-height:2.3}
.ctest-in{border:none;border-bottom:2px solid var(--border2);outline:none;font-family:inherit;font-size:0.98rem;text-align:center;padding:0 2px;background:transparent;width:44px}
.ctest-in:focus{border-bottom-color:var(--flame);background:var(--fglow)}
.ctest-in.correct{border-bottom-color:var(--leaf);color:var(--leaf);font-weight:700}
.ctest-in.incorrect{border-bottom-color:var(--coral);background:var(--cbg)}
.unscramble-bank{display:flex;flex-wrap:wrap;gap:0.5rem;margin-bottom:0.7rem;min-height:2.4rem;padding:0.6rem;background:var(--surface2);border-radius:var(--rxs)}
.unscramble-slot{display:flex;flex-wrap:wrap;gap:0.5rem;margin-bottom:0.9rem;min-height:2.4rem;padding:0.6rem;background:var(--fglow);border:1.5px dashed var(--flame);border-radius:var(--rxs)}
.uw-chip{background:var(--surface);border:1px solid var(--border2);border-radius:20px;padding:0.4rem 0.8rem;font-size:0.85rem;font-weight:600;cursor:pointer}
.uw-chip:hover{border-color:var(--flame)}
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media(max-width:560px){.match-grid{grid-template-columns:1fr}}
.match-col{display:flex;flex-direction:column;gap:0.5rem}
.match-btn{padding:0.55rem 0.8rem;border:1.5px solid var(--border);border-radius:var(--rxs);background:var(--surface);font-size:0.84rem;text-align:left;cursor:pointer;transition:all 0.15s}
.match-btn.sel{border-color:var(--flame);background:var(--fglow)}
.match-btn.matched{border-color:var(--leaf);background:var(--lbg);color:var(--leaf);cursor:default}
.match-btn.wrong-flash{border-color:var(--coral);background:var(--cbg)}

.memory-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0.7rem}
@media(max-width:640px){.memory-grid{grid-template-columns:repeat(2,1fr)}}
.mem-card{aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;text-align:center;padding:0.6rem;border:1.5px solid var(--border);border-radius:var(--rs);background:var(--surface2);cursor:pointer;transition:all 0.15s;font-family:inherit}
.mem-card:hover:not(:disabled){border-color:var(--flame);background:var(--fglow)}
.mem-card .mem-back{font-size:1.8rem;color:var(--text3)}
.mem-card .mem-face{display:none;font-size:1.35rem;font-weight:700;line-height:1.2;word-break:break-word}
.mem-card.face-up{background:var(--fglow);border-color:var(--flame)}
.mem-card.face-up .mem-back{display:none}
.mem-card.face-up .mem-face{display:block}
.mem-card.matched{background:var(--lbg);border-color:var(--leaf);color:var(--leaf);cursor:default}
.mem-card.wrong-flash{border-color:var(--coral);background:var(--cbg)}
.speed-ctrl{display:flex;gap:0.4rem;align-items:center;font-size:0.78rem;color:var(--text2);flex-wrap:wrap}
.library-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:0.7rem}

.reorder-placed{min-height:2.6rem;border:1.5px dashed var(--border2);border-radius:var(--rs);padding:0.5rem;display:flex;flex-direction:column;gap:0.4rem;margin-bottom:0.7rem;background:var(--surface2)}
.reorder-placed.has-items{border-style:solid;border-color:var(--flame);background:var(--surface)}
.reorder-item{padding:0.5rem 0.75rem;border-radius:var(--rxs);font-size:0.84rem;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:0.5rem;background:var(--surface3);transition:opacity 0.15s}
.reorder-item:hover{opacity:0.75}
.reorder-item .ri-num{font-size:0.7rem;font-weight:800;min-width:1.2rem;opacity:0.5}
.reorder-bank{display:flex;flex-direction:column;gap:0.4rem}
.reorder-btn{padding:0.5rem 0.75rem;border:1.5px solid var(--border);border-radius:var(--rxs);background:var(--surface);font-family:inherit;font-size:0.84rem;cursor:pointer;font-weight:600;text-align:left;transition:all 0.15s;color:var(--text)}
.reorder-btn:hover:not(:disabled){border-color:var(--flame);background:var(--fglow)}
.reorder-btn:disabled{opacity:0.3;cursor:default;text-decoration:line-through}

.integrity-toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-12px);background:var(--flame2);color:#fff;font-size:0.82rem;font-weight:600;padding:0.6rem 1.1rem;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,0.18);z-index:9999;opacity:0;pointer-events:none;transition:opacity 0.25s,transform 0.25s}
.integrity-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.no-copy{-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none}
.no-copy::selection,.no-copy *::selection{background:transparent}
.no-copy::-moz-selection,.no-copy *::-moz-selection{background:transparent}

.fsw-ref-row{padding:0.5rem 0;border-bottom:1px dashed var(--border);font-size:0.88rem}
.fsw-ref-row:last-child{border-bottom:none}
.fsw-num{font-variant-numeric:tabular-nums;color:var(--flame2);font-size:0.75rem;margin-right:0.4rem}

.survey-q{padding:0.9rem 0;border-bottom:1px solid var(--border)}
.survey-q:last-child{border-bottom:none;padding-bottom:0}
.survey-q:first-child{padding-top:0}
.survey-q-label{font-weight:600;font-size:0.92rem;margin-bottom:0.5rem;line-height:1.4}

.h5p-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--rs);border:1px solid var(--border);margin-bottom:0.8rem;background:#000}
.slide-img{width:100%;display:block;margin:0 auto 1rem;border-radius:var(--rs);border:1px solid var(--border)}
.h5p-wrap iframe{display:block;border:none;max-width:100%}

.yt-wrap{position:relative;width:100%;aspect-ratio:16/9;border-radius:var(--rs);overflow:hidden;border:1px solid var(--border);background:#000;margin-bottom:0.8rem}
.yt-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:none}

.fact-card{background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--rs);padding:1.1rem 1.3rem;font-size:0.98rem;cursor:pointer;transition:all 0.15s;margin-bottom:0.8rem}
.fact-card:hover{border-color:var(--flame)}
.fact-card .fc-front{font-weight:700;line-height:1.5}
.fact-card .fc-back{display:none;color:var(--flame2);margin-top:0.7rem;line-height:1.7;font-size:0.92rem}
.fact-card.flip .fc-back{display:block}
.fact-card.flip .fc-front{color:var(--text3)}
.fact-card .fc-share-btn{margin-top:0.8rem}
.opt-btn.sel{border-color:var(--flame);background:var(--fglow);color:var(--flame2);font-weight:700}
.trivia-result{background:linear-gradient(135deg,#0f766e,#0d9488);color:#fff;text-align:center;border-radius:var(--r);padding:1.5rem}
.trivia-result .tr-emoji{font-size:2.2rem}
.trivia-result .tr-title{font-weight:800;font-size:1.15rem;margin-top:0.5rem}
.trivia-result .tr-desc{font-size:0.86rem;opacity:0.9;margin-top:0.4rem;max-width:480px;margin-left:auto;margin-right:auto}
.trivia-result .tr-score{font-size:1.4rem;font-weight:800;margin-top:0.7rem;font-variant-numeric:tabular-nums}

@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="xp-pop"></div>
<div id="milestone-toast"><span class="mt-emoji"></span><span id="mt-msg"></span><div class="mt-sub" id="mt-sub"></div></div>

<script>

const STRANDS = {
  input:   {vn:'Tiếp Nhận Ý Nghĩa',       en:'Meaning-Focused Input',     emoji:'📥', color:'#0d9488'},
  output:  {vn:'Tạo Ra Ý Nghĩa',          en:'Meaning-Focused Output',    emoji:'📤', color:'#e11d48'},
  language:{vn:'Học Ngôn Ngữ Có Chủ Đích',en:'Language-Focused Learning', emoji:'🔍', color:'#b45309'},
  fluency: {vn:'Phát Triển Trôi Chảy',    en:'Fluency Development',       emoji:'⚡', color:'#a855f7'},
};

const PARTS = [
  {id:'p1', num:'Khởi động', emoji:'🍽️', title:'Gọi Tên Món Ăn & Nguyên Liệu', meta:'Gọi Tên Món Ăn & Nguyên Liệu · Khảo Sát Ẩm Thực Lớp Học', tag:'Lead-in', strand:'output', warmup:true, where:'home'},
  {id:'p1sc', num:'Khởi động', emoji:'✅', title:'Self-Assessment (PRE)', meta:'Thang tự đánh giá 4 mức + Đọc Hiểu (bài đọc + 5 dạng câu hỏi kỹ thuật số) + Nghe Hiểu (sắp xếp quy trình nấu ăn + ghép âm thanh với hình ảnh món ăn + hội thoại gọi món 4 lượt)', tag:'Diagnostic', strand:'output', warmup:true, where:'home'}, // renamed from Tự Đánh Giá "Tôi Có Thể" 2026-09-17, label-only; meta updated same-day follow-up pass ("Chẩn Đoán Nhanh" archived, "Đọc Hiểu" tab added); "Nghe Hiểu" tab added 2026-09-18 (3 activities same day), meta updated to match
  {id:'p2', num:'T1', emoji:'📖', title:'Đi Chợ & Vào Bếp', meta:'Chọn công thức · Danh sách đi chợ · Đúng/Sai · Nghe', tag:'Interpretive', strand:'input', core:'T1', where:'mixed'},
  {id:'p3', num:'T2', emoji:'🥘', title:'Gọi Món & Dùng Đũa', meta:'Gọi Món Cơ Bản · Tùy Chỉnh Món Ăn · Đóng Vai Gọi Món', tag:'Interpersonal', strand:'output', core:'T2', where:'mixed'},
  {id:'p5', num:'T3', emoji:'✍️', title:'Chia Sẻ & Nhận Xét', meta:'Viết đánh giá nhà hàng · Kể chuyện món ăn · Video đánh giá món ăn', tag:'Presentational', strand:'output', core:'T3', where:'mixed'},

  {id:'fb', num:'Hỗ trợ', emoji:'⚡', title:'Fluency Boost', sub:'Trạm Phản Xạ', meta:'Thư Viện Đọc/Nghe/Xem (Truyện Vui · Đọc Thêm · Nghe/Xem) · Mở Lời (4/3/2 · Nhại Giọng · Ghép Cụm Từ · Tháp Câu · Kịch Bản Mờ Dần) · Chắp Bút (Mở Rộng Câu · Dictogloss · Viết Tiếp Sức · Viết 4/3/2 · Viết Tự Do) · Luyện Tốc Độ (Meaning-Recall Sprint · Rapid Dictation · Line Chunker · Decaying Speed Reader)', tag:'Fluency Boost', strand:'fluency', where:'home'},
  {id:'gl', num:'Hỗ trợ', emoji:'🔍', title:'Language Lab', sub:'Phòng Học Tiếng', meta:'📖 Từ Vựng (Từ Vựng & Quiz · Ghép Nghĩa · Dị Ứng & Ăn Chay · Kết Cấu Món Ăn · Điền Từ Theo Ngữ Cảnh · Chọn Từ Viết Đúng · H5P Từ Vựng) · 📐 Ngữ Pháp (Bảng Mẫu Câu · Sắp Xếp Từ · Gọi Món · Trang Trọng/Bình Dân · Khung Câu Đa Mệnh Đề · Xếp Vế Câu) · 🗣️ Phát Âm (Phân Biệt Cặp Từ · Nhịp Ngắt Nghỉ) · ✍️ Chính Tả (C-Test · Phục Hồi Dấu · Sao Chép Trì Hoãn · Âm Cuối & Phụ Âm Đôi)', tag:'Language Lab', strand:'language', where:'home'},
  {id:'pextra', num:'Hỗ trợ', emoji:'🌟', title:'Culture Bag', sub:'Túi Văn Hoá', meta:'🎮 Trò Chơi & Đố Vui (3 Trò Chơi H5P · Đố Vui Văn Hóa · Bạn Là Món Gì? · Đố Bạn · Bạn Có Biết?) · 🏮 Văn Hóa & Ngôn Ngữ (Thành Ngữ "Ăn" · Mâm Cơm & Đũa · Văn Hóa Thanh Toán · Tiếng Lóng · Thanh Toán & Tiền Boa)', tag:'Enrichment', strand:'output', where:'home'}, // renamed "Mở Rộng"→"Learn More" 2026-09-17, then "Learn More"→"Culture Bag" + sub "Túi Văn Hoá" 2026-09-18 — all label-only, id/award keys unchanged; 10→3 top-level tabs 2026-09-18, then 3→2 same day (Trò Chơi renamed "& Đố Vui" + moved first, Thanh Toán & Tiền Boa folded into Văn Hóa & Ngôn Ngữ), meta updated to match
  {id:'report', num:'Nộp bài', emoji:'🏆', title:'Báo Cáo Hoàn Thành', meta:'XP · Checklist · Tải nộp qua Canvas', tag:'Report', where:'home'},
  {id:'wrapsc', num:'Tổng kết', emoji:'✅', title:'Self-Assessment (POST)', meta:'Thang tự đánh giá 4 mức, đối chiếu với Khởi Động + Đọc Hiểu (bài đọc thứ 2 + 5 dạng câu hỏi kỹ thuật số)', tag:'Self-Check', strand:'output', submit:true, where:'home'}, // renamed from Can-Do Sau Module 2026-09-17, label-only; meta updated twice more same-day ("Chẩn Đoán Lại" archived, then "Đọc Hiểu" tab added)
  {id:'wraprefl', num:'Tổng kết', emoji:'✍️', title:'Suy Ngẫm Của Bạn', meta:'Hoạt động thú vị/khó nhất · Điều gì giúp bạn học tốt hơn', tag:'Self-Reflection', strand:'output', submit:true, where:'home'},
];

const PART_MAX_XP = {p1:14, p1sc:20, p2:61, p3:43, p5:43, fb:129, gl:99, pextra:53, wrapsc:8, wraprefl:3};

const CORE_IDS = PARTS.filter(p=>p.core).map(p=>p.id);
const CREDIT_FLOOR_PCT = 70;
const TOTAL_MAX_XP = Object.values(PART_MAX_XP).reduce((a,b)=>a+b,0);
const XP_PART_COUNT = Object.keys(PART_MAX_XP).length;
function isPartDone(id){ return partXP(id) >= PART_MAX_XP[id]; }

const COURSE_XP_ESTIMATE = 800;
const TRAU_STAGES = [
  {min:0,    emoji:'🐮', label:'Nghé Con',      sub:'mới bắt đầu, chưa quen việc đồng áng'},
  {min:0.10, emoji:'🐃', label:'Trâu Tơ',        sub:'đã quen việc, đang lấy đà'},
  {min:0.45, emoji:'🐃', label:'Trâu Đầu Đàn',   sub:'bền bỉ, dẫn đầu cả đàn'},
];

const NS = 'viet203-m4::';
const NS_TRAU = 'viet203-trau::v1';
function save(key,val){ localStorage.setItem(NS+key, typeof val==='string'?val:JSON.stringify(val)); }
function load(key,fallback){ const v=localStorage.getItem(NS+key); if(v===null) return fallback; try{return JSON.parse(v);}catch(e){return v;} }
function saveRaw(key,val){ localStorage.setItem(key, typeof val==='string'?val:JSON.stringify(val)); }
function loadRaw(key,fallback){ const v=localStorage.getItem(key); if(v===null) return fallback; try{return JSON.parse(v);}catch(e){return v;} }
function trackedKeysWithPrefix(prefix){ return Object.keys(localStorage).filter(k=>k.startsWith(NS+prefix)); }

function flagIntegrity(type, detail){
  const flags = load('integrity::flags', []);
  flags.push({type, at:new Date().toISOString(), detail:detail||'', view:currentView});
  save('integrity::flags', flags);
  if(type==='paste_blocked'||type==='drop_blocked') save('integrity::pasteAttempts', load('integrity::pasteAttempts',0)+1);
  showIntegrityToast(type);
}
function showIntegrityToast(type){
  const msgs = {
    paste_blocked:'⚠ Dán văn bản đã bị chặn ở ô này.',
    drop_blocked:'⚠ Kéo-thả văn bản đã bị chặn ở ô này.',
    devtools_shortcut:'ℹ Đã ghi nhận thao tác phím tắt.',
  };
  let el = document.getElementById('integrity-toast');
  if(!el){
    el = document.createElement('div');
    el.id = 'integrity-toast'; el.className = 'integrity-toast';
    document.body.appendChild(el);
  }
  el.textContent = msgs[type] || 'ℹ Hoạt động đã được ghi nhận.';
  el.classList.add('show');
  clearTimeout(window._integrityToastT);
  window._integrityToastT = setTimeout(()=>el.classList.remove('show'), 2600);
}
function blockPaste(e){ e.preventDefault(); flagIntegrity('paste_blocked'); return false; }
function blockDrop(e){ e.preventDefault(); flagIntegrity('drop_blocked'); return false; }

document.addEventListener('paste', function(e){
  const t = e.target;
  if(t && (t.tagName==='TEXTAREA' || (t.tagName==='INPUT' && (t.type==='text'||t.type===undefined)))) blockPaste(e);
}, true);
document.addEventListener('drop', function(e){
  const t = e.target;
  if(t && (t.tagName==='TEXTAREA' || (t.tagName==='INPUT' && (t.type==='text'||t.type===undefined)))) blockDrop(e);
}, true);

function integrityActive(){ return typeof currentView!=='undefined' && currentView && currentView!=='home' && currentView!=='report'; }
document.addEventListener('keydown', function(e){
  if(!integrityActive()) return;
  const k = (e.key||'').toLowerCase();
  const blockCombo = (e.ctrlKey||e.metaKey) && (k==='p' || k==='u' || (e.shiftKey && ['i','j','c'].includes(k)));
  if(blockCombo || k==='f12'){ e.preventDefault(); flagIntegrity('devtools_shortcut', e.key); }
});
document.addEventListener('contextmenu', function(e){
  if(integrityActive()) e.preventDefault();
});

document.addEventListener('copy', function(e){
  const sel = window.getSelection();
  if(!sel || sel.isCollapsed) return;
  let node = sel.anchorNode;
  while(node){
    if(node.classList && node.classList.contains('no-copy')){ e.preventDefault(); return; }
    node = node.parentElement;
  }
});

function trauLoad(){ return loadRaw(NS_TRAU, {xp:0, last:0, fired:[]}); }
function trauSave(s){ saveRaw(NS_TRAU, s); }
function trauStage(xp){
  let st = TRAU_STAGES[0];
  const frac = xp/COURSE_XP_ESTIMATE;
  TRAU_STAGES.forEach(s=>{ if(frac>=s.min) st=s; });
  return st;
}
function trauCondition(lastTs){
  if(!lastTs) return {emoji:'😴', label:'đang chờ bạn'};
  const days = (Date.now()-lastTs)/86400000;
  return days<=3 ? {emoji:'💪', label:'đang hăng hái'} : {emoji:'😴', label:'đang nghỉ ngơi'};
}
function growBuffalo(amount){
  const s = trauLoad();
  const prevStage = trauStage(s.xp);
  s.xp += amount;
  s.last = Date.now();
  const newStage = trauStage(s.xp);
  s.fired = s.fired || [];
  if(newStage.label !== prevStage.label && !s.fired.includes(newStage.label)){
    s.fired.push(newStage.label);
    trauSave(s);
    showMilestone(newStage.emoji, 'Trâu của bạn lên bậc: '+newStage.label+'!', newStage.sub);
    launchConfetti();
  } else {
    trauSave(s);
  }
  renderTrauCompanion();
}
function renderTrauCompanion(){
  const el = document.getElementById('trau-companion');
  if(!el) return;
  const s = trauLoad();
  const stage = trauStage(s.xp);
  const cond = trauCondition(s.last);
  el.innerHTML = `<span class="tc-emoji">${stage.emoji}</span>
    <span class="tc-text"><span>${stage.label} <span class="tc-sub">· ${cond.emoji} ${cond.label}</span></span><span class="tc-sub">${stage.sub} — ${s.xp} XP cả khóa học</span></span>`;
  el.title = 'Chú trâu này sẽ theo bạn qua mọi mô-đun của VIET 203 trong học kỳ.';
}
function resetTrau(){
  if(confirm('Đặt lại chú trâu của cả khóa học (XP tích lũy qua mọi mô-đun)? Không thể hoàn tác.')){
    localStorage.removeItem(NS_TRAU);
    renderTrauCompanion();
    updateXPHeader();
  }
}

function renderField(){
  const wrap = document.getElementById('field-strip');
  if(!wrap) return;
  wrap.innerHTML = Object.keys(PART_MAX_XP).map(id=>{
    const p = PARTS.find(x=>x.id===id);
    const done = isPartDone(id);
    return `<div class="field-tile${done?' tilled':''}" title="${p.title}">
      <span class="ft-icon">${done?'🌾':'🟫'}</span>
      <span class="ft-label">${p.num}</span>
    </div>`;
  }).join('');
}

function renderStrandBalance(hostId){
  const host = document.getElementById(hostId||'strand-balance');
  if(!host) return;
  const totals = strandTotals();
  const sum = Object.values(totals).reduce((a,b)=>a+b,0);
  const order = ['input','output','language','fluency'];
  if(sum===0){
    host.innerHTML = `<p class="instr" style="margin:0">Bắt đầu làm bài để xem 4 trụ cột học ngôn ngữ của bạn cân bằng ra sao — mục tiêu lý tưởng là chia đều 25% cho mỗi trụ cột (Nation, 2007).</p>`;
    return;
  }
  const bar = order.map(s=>{
    const pct = Math.round(totals[s]/sum*100);
    return pct>0 ? `<div style="width:${pct}%;background:${STRANDS[s].color}" title="${STRANDS[s].en}: ${pct}%"></div>` : '';
  }).join('');
  const legend = order.map(s=>{
    const pct = sum? Math.round(totals[s]/sum*100) : 0;
    return `<div class="strand-leg-item">
      <span class="strand-dot" style="background:${STRANDS[s].color}"></span>
      <span>${STRANDS[s].emoji} ${STRANDS[s].en}</span>
      <strong>${pct}%</strong>
    </div>`;
  }).join('');
  host.innerHTML = `<div class="strand-bar">${bar}</div><div class="strand-legend">${legend}</div>`;
}

function xpAwarded(){ return load('xp-awarded', {}); }
function xpTotal(){ const a=xpAwarded(); return Object.values(a).reduce((s,v)=>s+v,0); }
function partXP(partId){
  const a=xpAwarded();
  return Object.keys(a).filter(k=>k.startsWith(partId+':')).reduce((s,k)=>s+a[k],0);
}

function xpStrand(key){
  if(key.startsWith('fb:extview')) return 'input'; // Extensive Listening/Viewing shelf lives inside Fluency Boost but is Meaning-Focused Input per its own Kỹ năng×Nhánh line
  if(key.startsWith('fb:linked-')) return 'fluency'; // the 4 "⚡ Luyện Tốc Độ" sprints (recall/dictation/chunker/decay) — kept their fb:linked- prefix and 'fluency' classification when "🔗 Liên Kỹ Năng" was removed and they were promoted to their own tab, 2026-09-17 follow-up pass. (The 2 rules that used to sit here for "📖 Chuỗi Công Thức"'s fb:linked-write/read/listen keys were removed along with it — those keys no longer exist.)

  if(key.startsWith('p1:foodguess-name')) return 'input'; // drag/tap-to-match a dish name from a word bank onto a photo — meaning-focused recognition, not self-generated content (converted from free-text guess to self-graded matching 2026-09-18)

function coreTasksDone(){ return CORE_IDS.every(id=>partXP(id)>=PART_MAX_XP[id]); }
function xpPct(){ return TOTAL_MAX_XP ? Math.round(xpTotal()/TOTAL_MAX_XP*100) : 0; }
function creditGrade(){
  const pct = xpPct(), allCore = coreTasksDone();
  if(allCore && pct>=90) return {pct, allCore, grade:'A', eligible:true};
  if(allCore && pct>=80) return {pct, allCore, grade:'B', eligible:true};
  if(allCore && pct>=CREDIT_FLOOR_PCT) return {pct, allCore, grade:'C', eligible:true};
  return {pct, allCore, grade:null, eligible:false};
}

function normalizeVN(s){ return (s||'').trim().replace(/\s+/g,' ').toLowerCase().normalize('NFC'); }

function stripDiacriticsVN(s){
  return (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D');
}
function lenientMatchVN(guess, answers){
  const g = stripDiacriticsVN(normalizeVN(guess));
  if(!g) return false;
  return answers.some(a=>{
    const an = stripDiacriticsVN(normalizeVN(a));
    return g===an || (g.length>=3 && (an.includes(g) || g.includes(an)));
  });
}

function copyToClipboard(text, onDone){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(()=>{ if(onDone) onDone(true); }).catch(()=>{ if(onDone) onDone(false); });
    } else if(onDone) onDone(false);
  }catch(e){ if(onDone) onDone(false); }
}

function speakTTS(text, rate, onEnd){
  if(!('speechSynthesis' in window)){ if(onEnd) onEnd(); return; }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'vi-VN';
  u.rate = rate || 0.95;
  const voices = window.speechSynthesis.getVoices();
  const viVoice = voices.find(v=>v.lang && v.lang.startsWith('vi'));

}

const AUDIO_DIR = 'viet203-m4-foodsdrinks/';
function playAudioOrTTS(key, text, onDone, rateOverride){
  let settled = false, fallbackStarted = false;
  const finish = ()=>{ if(!settled){ settled = true; if(onDone) onDone(); } };
  const fallback = ()=>{ if(fallbackStarted) return; fallbackStarted = true; speakTTS(text, rateOverride, finish); };
  const audio = new Audio(AUDIO_DIR+key+'.mp3');
  audio.addEventListener('ended', finish);
  audio.addEventListener('error', fallback);
  let playPromise;
  try{ playPromise = audio.play(); }catch(e){ fallback(); return audio; }
  if(playPromise && typeof playPromise.catch==='function') playPromise.catch(fallback);
  return audio;
}

let FBSPEAK_432_RECORDINGS = [null, null, null]; // one Blob (or null) per 4/3/2 round
let FBSPEAK_432_TRANSCRIPTS = ['', '', '']; // matching auto-transcript per round
let FBSPEAK_SHADOW_RECORDINGS = [null, null, null, null, null]; // one Blob (or null) per shadowing sentence
let FBSPEAK_SHADOW_TRANSCRIPTS = ['', '', '', '', ''];

let FBSPEAK_CHUNK_RECORDING = null, FBSPEAK_CHUNK_TRANSCRIPT = '';
let FBSPEAK_PYRAMID_RECORDING = null, FBSPEAK_PYRAMID_TRANSCRIPT = '';
let FBSPEAK_VANISH_RECORDING = null, FBSPEAK_VANISH_TRANSCRIPT = '';
let FBSPEAK_STREAM = null;
async function askMicSpeak(){
  if(FBSPEAK_STREAM) return true;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return false;
  try{ FBSPEAK_STREAM = await navigator.mediaDevices.getUserMedia({audio:true}); return true; }
  catch(e){ return false; } // denied / no mic — every sub-activity still completes via the honor-check-only path below
}

function startClipRecording(onStop){
  const mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '';
  const recorder = mimeType ? new MediaRecorder(FBSPEAK_STREAM, {mimeType}) : new MediaRecorder(FBSPEAK_STREAM);
  const chunks = [];
  let finalTr = '', curTr = '', recog = null;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(SR){
    recog = new SR();
    recog.continuous = true; recog.interimResults = true; recog.lang = 'vi-VN';
    recog.onresult = e=>{
      let fin = '', int = '';
      for(let i=e.resultIndex; i<e.results.length; i++){
        if(e.results[i].isFinal) fin += e.results[i][0].transcript + ' ';
        else int += e.results[i][0].transcript;
      }
      finalTr += fin; curTr = finalTr + int;
    };
    recog.onerror = ()=>{};
    try{ recog.start(); }catch(e){ recog = null; }
  }
  recorder.ondataavailable = e=>{ if(e.data.size>0) chunks.push(e.data); };
  recorder.onstop = ()=>{
    if(recog){ try{ recog.stop(); }catch(e){} }
    onStop(new Blob(chunks, {type: mimeType||'audio/webm'}), (curTr||finalTr).trim());
  };
  recorder.start();
  return recorder;
}
function stopClipRecording(recorder){
  if(recorder && recorder.state!=='inactive') recorder.stop();
}

function wireSingleSlotRecorder(btnId, playerId, statusId, onSaved){
  const btn = document.getElementById(btnId);
  const playerEl = document.getElementById(playerId);
  const statusEl = statusId ? document.getElementById(statusId) : null;
  let micAsked = false, recorder = null, recording = false;
  function renderPlayer(blob, transcript){
    playerEl.innerHTML = blob ? `<audio controls src="${URL.createObjectURL(blob)}" style="width:100%;height:36px"></audio>${transcript?`<div style="font-size:0.78rem;color:var(--text3);margin-top:0.3rem"><em>Bản chép lời (tự động, có thể có lỗi): ${escapeHtml(transcript)}</em></div>`:''}` : '';
  }
  btn.addEventListener('click', async ()=>{
    if(recording){
      stopClipRecording(recorder); recorder = null; recording = false;
      btn.textContent = '🎙️ Ghi Âm Đọc To'; btn.style.background = '';
      return;
    }
    if(!micAsked){
      micAsked = true;
      if(statusEl) statusEl.textContent = '🎙️ Đang xin quyền micrô...';
      const ok = await askMicSpeak();
      if(statusEl) statusEl.textContent = ok
        ? '🎙️ Đã cấp quyền micrô — ghi âm chỉ lưu trong phiên làm việc này.'
        : '🔇 Không có quyền micrô (hoặc trình duyệt không hỗ trợ) — không sao, hoạt động vẫn hoàn thành bình thường qua honor-check.';
    }
    if(!FBSPEAK_STREAM) return;
    recording = true;
    btn.textContent = '⏹ Dừng Ghi Âm'; btn.style.background = 'var(--danger, #dc2626)';
    recorder = startClipRecording((blob, transcript)=>{
      onSaved(blob, transcript);
      renderPlayer(blob, transcript);
    });
  });
  return { renderPlayer };
}

    });

function renderPairsMatch(host, pairs, storageKey, xpKey, xpAmount){
  host.innerHTML = `<div class="match-grid"><div class="match-col" id="${storageKey}-w"></div><div class="match-col" id="${storageKey}-d"></div></div>`;
  const words = pairs.map(p=>p[0]);
  const defs = [...pairs.map(p=>p[1])].sort(()=>Math.random()-0.5);
  let selWord=null;
  const matched = load(storageKey, []);
  const wCol = document.getElementById(`${storageKey}-w`), dCol = document.getElementById(`${storageKey}-d`);
  wCol.innerHTML = words.map(w=>`<button class="match-btn${matched.includes(w)?' matched':''}" data-w="${w}">${w}</button>`).join('');
  dCol.innerHTML = defs.map(d=>`<button class="match-btn${matched.some(w=>pairs.find(p=>p[0]===w)[1]===d)?' matched':''}" data-d="${d}">${d}</button>`).join('');
  function checkDone(){ if(matched.length>=pairs.length && xpKey) awardXP(xpKey, xpAmount); }
  checkDone();
  wCol.querySelectorAll('.match-btn').forEach(b=>b.addEventListener('click', ()=>{
    if(b.classList.contains('matched')) return;
    wCol.querySelectorAll('.match-btn').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel'); selWord = b.dataset.w;
  }));
  dCol.querySelectorAll('.match-btn').forEach(b=>b.addEventListener('click', ()=>{
    if(b.classList.contains('matched') || !selWord) return;
    const correct = pairs.find(p=>p[0]===selWord)[1] === b.dataset.d;
    if(correct){
      matched.push(selWord); save(storageKey, matched);
      wCol.querySelector(`[data-w="${CSS.escape(selWord)}"]`).classList.add('matched');
      b.classList.add('matched');
      checkDone();
    } else {
      b.classList.add('wrong-flash'); setTimeout(()=>b.classList.remove('wrong-flash'), 500);
    }
    wCol.querySelectorAll('.match-btn').forEach(x=>x.classList.remove('sel'));
    selWord = null;
  }));
}

    host.querySelectorAll('.lf-blank.filled').forEach(el=>{
      el.addEventListener('click', ()=>{
        const p = load(storageKey, {});
        delete p[parseInt(el.dataset.i,10)];
        save(storageKey, p);
        render();
      });
    });
  }
  const checkComplete = ()=>{
    const p = load(storageKey, {});
    if(Object.keys(p).length===n && xpKey) awardXP(xpKey, xpAmount);
  };
  render();
  checkComplete();
}

function renderHonorCheck(host, key, label, xp, exclusiveWithKey){
  const box = document.createElement('div');
  box.className = 'honor-box';
  const checked = load(key, false);
  box.innerHTML = `<div class="ck-row" style="border:none;padding:0"><input type="checkbox" id="${key.replace(/[:.]/g,'-')}" ${checked?'checked':''}><label for="${key.replace(/[:.]/g,'-')}">✅ ${label}</label></div>`;
  host.appendChild(box);
  const cb = box.querySelector('input');
  cb.addEventListener('change', ()=>{
    save(key, cb.checked);
    // exclusiveWithKey: an async self-written alternative to this same activity
    // (e.g. p2:exchange) — never award both paths for the same conceptual task.
    if(cb.checked && exclusiveWithKey && xpAwarded()[exclusiveWithKey]!==undefined) return;
    if(cb.checked) awardXP(key+':xp', xp);
  });
}

function renderChipPick(host, items, storageKey, labelFn, onChange){
  const render = ()=>{
    const sel = load(storageKey, null);
    host.innerHTML = `<div class="chip-row">${items.map((it,i)=>`<button type="button" class="opt-btn${sel===i?' sel':''}" data-i="${i}">${labelFn(it,i)}</button>`).join('')}</div>`;
    host.querySelectorAll('.opt-btn').forEach(b=>b.addEventListener('click', ()=>{
      save(storageKey, parseInt(b.dataset.i,10));
      render();
      if(onChange) onChange();
    }));
  };
  render();
}

function renderFlashcards(host, list){
  host.innerHTML = `<div class="chip-row">${list.map((v,i)=>`<div class="vchip" data-i="${i}"><div class="vn">${v[0]}</div><div class="en">${v[1]}</div></div>`).join('')}</div>`;
  host.querySelectorAll('.vchip').forEach(c=>c.addEventListener('click',()=>c.classList.toggle('flip')));
}

function vanishScriptHideIndices(n, pct){
  const k = Math.round(n*pct/100);
  if(k<=0) return new Set();
  const idxs = new Set();
  for(let i=0;i<k;i++) idxs.add(Math.min(n-1, Math.floor((i+0.5)*n/k)));
  return idxs;
}

  const fgStep1Complete = ()=>Object.keys(load('p1::fgname-placed', {})).length===T1_NAMEGUESS.length;
  const renderFgSteps = ()=>{
    const unlocked = fgStep1Complete();
    fgStepsHost.innerHTML =
      `<button class="mtab${fgStep==='step1'?' active':''}" data-step="step1">Bước 1 · Gọi Tên</button>` +
      `<button class="mtab${fgStep==='step2'?' active':''}" data-step="step2"${unlocked?'':' disabled'} style="opacity:${unlocked?'1':'0.4'};cursor:${unlocked?'pointer':'not-allowed'}">Bước 2 · Thực Đơn & Nguyên Liệu</button>`;
    fgStepsHost.querySelectorAll('button').forEach(b=>b.addEventListener('click', ()=>{
      if(b.disabled) return;
      fgStep = b.dataset.step;
      fgStep1El.hidden = fgStep!=='step1';
      fgStep2El.hidden = fgStep!=='step2';
      renderFgSteps();
    }));
  };
  renderFgSteps();

  const fgBankHost = document.getElementById('p1-fg-bank');
  const fgNameHost = document.getElementById('p1-fg-name');
  let fgBankOrder = load('p1::fgname-bank', null);
  if(!fgBankOrder || fgBankOrder.length!==T1_NAMEGUESS.length){ fgBankOrder = T1_NAMEGUESS.map((_,i)=>i).sort(()=>Math.random()-0.5); save('p1::fgname-bank', fgBankOrder); }
  let fgSelected = null;
  const renderFgName = ()=>{
    const placed = load('p1::fgname-placed', {});
    const placedWordIdxs = new Set(Object.values(placed));
    fgBankHost.innerHTML = fgBankOrder.filter(wi=>!placedWordIdxs.has(wi)).map(wi=>
      `<button type="button" class="wsort-word${fgSelected===wi?' sel':''}" draggable="true" data-wi="${wi}">${T1_NAMEGUESS[wi].name}</button>`
    ).join('') || '<span style="color:var(--text3);font-size:0.85rem">Đã dùng hết từ trong ngân hàng! 🎉</span>';
    fgNameHost.innerHTML = T1_NAMEGUESS.map((_,i)=>{
      const wi = placed[i];
      const filled = wi!==undefined;
      const blankCls = 'lf-blank' + (filled ? ' filled correct' : '');
      const blankInner = filled ? T1_NAMEGUESS[wi].name : '_____';
      return `<div class="lf-sentence"><span class="fsw-num">Món ăn ${i+1}</span> <span class="${blankCls}" data-i="${i}">${blankInner}</span></div>`;
    }).join('');
    fgBankHost.querySelectorAll('.wsort-word').forEach(b=>{
      b.addEventListener('click', ()=>{
        const wi = parseInt(b.dataset.wi,10);
        fgSelected = fgSelected===wi ? null : wi;
        renderFgName();
      });
      b.addEventListener('dragstart', e=>{ e.dataTransfer.setData('text/plain', b.dataset.wi); });
    });
    const tryPlaceFgName = (i, wi)=>{
      const blankEl = fgNameHost.querySelector(`.lf-blank[data-i="${i}"]`);
      if(wi===i){
        const p = load('p1::fgname-placed', {});
        p[i] = wi;
        save('p1::fgname-placed', p);
        fgSelected = null;
        renderFgName();
        if(fgStep1Complete()) awardXP('p1:foodguess-name', 2);
        renderFgSteps();
      } else if(blankEl){
        blankEl.classList.add('wrong-flash');
        setTimeout(()=>blankEl.classList.remove('wrong-flash'), 550);
      }
    };
    fgNameHost.querySelectorAll('.lf-blank:not(.filled)').forEach(el=>{
      el.addEventListener('click', ()=>{ if(fgSelected!==null) tryPlaceFgName(parseInt(el.dataset.i,10), fgSelected); });
      el.addEventListener('dragover', e=>{ e.preventDefault(); el.classList.add('dragover'); });
      el.addEventListener('dragleave', ()=>el.classList.remove('dragover'));
      el.addEventListener('drop', e=>{
        e.preventDefault();
        el.classList.remove('dragover');
        const wi = parseInt(e.dataTransfer.getData('text/plain'),10);
        if(!isNaN(wi)) tryPlaceFgName(parseInt(el.dataset.i,10), wi);
      });
    });
  };
  renderFgName();
  if(fgStep1Complete()) awardXP('p1:foodguess-name', 2);

  const fgIngrHost = document.getElementById('p1-fg-ingr');
  const fgIngrShuffled = T1_STEP2_INGR.map(d=>[...d.correct, ...d.distractors].sort(()=>Math.random()-0.5));
  const renderFgIngr = ()=>{
    fgIngrHost.innerHTML = T1_STEP2_INGR.map((d,di)=>{
      const checked = load('p1::fgingr-checked-'+di, false);
      const sel = load('p1::fgingr-sel-'+di, []);
      const chips = fgIngrShuffled[di].map(opt=>{
        const isSel = sel.includes(opt);
        const isCorrect = d.correct.includes(opt);
        let cls = 'chipsel';
        if(checked){
          if(isCorrect && isSel) cls += ' correct';
          else if(!isCorrect && isSel) cls += ' wrong';
          else if(isCorrect && !isSel) cls += ' missed';
        } else if(isSel) cls += ' sel';
        return `<button class="${cls}" data-di="${di}" data-opt="${escapeHtmlG(opt)}"${checked?' disabled':''}>${opt}</button>`;
      }).join('');
      return `<div class="block-sub" style="margin-top:${di===0?'0':'1rem'}">${d.name}</div>
        <div class="chipsel-row">${chips}</div>
        ${checked ? `<button class="check-btn secondary" data-redo="${di}">🔁 Làm lại</button>` : `<button class="check-btn" data-check="${di}">✓ Kiểm Tra</button>`}`;
    }).join('');
    fgIngrHost.querySelectorAll('.chipsel:not(:disabled)').forEach(b=>b.addEventListener('click', ()=>{
      const di = parseInt(b.dataset.di,10);
      const opt = b.dataset.opt;
      const sel = load('p1::fgingr-sel-'+di, []);
      const idx = sel.indexOf(opt);
      if(idx===-1) sel.push(opt); else sel.splice(idx,1);
      save('p1::fgingr-sel-'+di, sel);
      renderFgIngr();
    }));
    fgIngrHost.querySelectorAll('[data-check]').forEach(b=>b.addEventListener('click', ()=>{
      save('p1::fgingr-checked-'+b.dataset.check, true);
      renderFgIngr();
      checkFgIngr();
    }));
    fgIngrHost.querySelectorAll('[data-redo]').forEach(b=>b.addEventListener('click', ()=>{
      save('p1::fgingr-checked-'+b.dataset.redo, false);
      save('p1::fgingr-sel-'+b.dataset.redo, []);
      renderFgIngr();
    }));
  };
  const checkFgIngr = ()=>{
    if(T1_STEP2_INGR.every((_,di)=>load('p1::fgingr-checked-'+di, false))) awardXP('p1:foodguess-ingr', 4);
  };
  renderFgIngr();
  checkFgIngr();

  const surveyQHost = document.getElementById('p1-survey-qs');
  surveyQHost.innerHTML = SURVEY_QUESTIONS.map((q,i)=>`<div class="survey-q"><div class="survey-q-label"><span class="fsw-num">${i+1}.</span>${q}</div></div>`).join('');
  const surveySummaryArea = host.querySelector('[data-key="p1::survey-summary"]');
  const surveyWcEl = document.getElementById('p1-survey-wc');
  const checkSurvey = ()=>{
    const n = surveySummaryArea.value.trim() ? surveySummaryArea.value.trim().split(/\s+/).filter(w=>w).length : 0;
    surveyWcEl.textContent = n;
    if(n>=60) awardXP('p1:survey', 8);
  };
  surveySummaryArea.addEventListener('input', checkSurvey);
  checkSurvey();
  renderHonorCheck(document.getElementById('p1-survey-honor'), 'p1:survey-honor', 'Tôi đã hỏi ít nhất 3 bạn cùng lớp/bạn bè những câu hỏi này', 0);
}

      server:'Vâng ạ. Anh chị dùng thịt bò tái nạm chín hẳn hay tái thôi ạ?',

        'Cho tôi thêm một đĩa nem rán nữa.',
        'Bàn bên cạnh ăn gì mà nhìn ngon quá vậy.',
        'Cho tôi tái thôi nhé, đừng chín quá.',
        'Tôi muốn đổi sang phở gà xé được không?'
      ], correct:2, userReply:'Cho tôi tái thôi nhé, đừng chín quá.'},
    {key:'gomon-turn3',
      server:'Anh chị có dùng thêm rau sống, chanh, hay ớt không ạ?',
      opts:[
        'Có, cho tôi thêm rau sống với một quả chanh ạ.',
        'Trời hôm nay nóng quá anh nhỉ.',
        'Không, tôi ăn phở không cần bát đâu.',
        'Bao giờ thì có bàn trống vậy?'
      ], correct:0, userReply:'Có, cho tôi thêm rau sống với một quả chanh ạ.'},
    {key:'gomon-turn4',
      server:'Anh chị dùng gì để uống ạ? Quán em có trà đá, nước ngọt, và cà phê.',
      opts:[
        'Cho tôi mượn cái remote tivi được không?',
        'Nhà vệ sinh ở đâu vậy ạ?',
        'Tôi không khát, cảm ơn nhà hàng nhiều.',
        'Cho tôi một cốc trà đá nhé, cảm ơn.'
      ], correct:3, userReply:'Cho tôi một cốc trà đá nhé, cảm ơn.'}

  const listenHost = document.getElementById('mv-p1sc-listen');
  listenHost.innerHTML = `
    <div class="block">
      <div class="block-title">🎧 Nghe Và Sắp Xếp — Quy Trình Nấu Canh Chua</div>
      <p class="instr">Nghe đầu bếp hướng dẫn cách nấu món canh chua, rồi dùng ▲/▼ để đưa 4 bước dưới đây về đúng thứ tự thời gian. Chú ý các từ nối trình tự: "Trước hết", "Khi... mới", "Đợi... thì", "Cuối cùng".</p>
      <button class="btn-tts" id="p1sc-listen-play" style="margin-bottom:0.9rem">🔊 Nghe hướng dẫn</button>
      <div id="p1sc-listen-seq"></div>
    </div>
    <div class="block">
      <div class="block-title">🖼️ Ghép Đoạn Miêu Tả Với Hình Ảnh Món Ăn</div>
      <p class="instr">Nghe 3 đoạn ghi âm ngắn mô tả cách bày biện món ăn, rồi chọn đoạn tương ứng (Đoạn 1/2/3) cho mỗi món bên dưới.</p>
      <div style="display:flex;flex-direction:column;gap:0.5rem;margin-bottom:1.2rem">
        ${P1SC_MATCH_CLIPS.map(c=>`<div style="display:flex;align-items:center;gap:0.7rem;padding:0.5rem 0.8rem;border:1px solid var(--border);border-radius:var(--rxs)"><strong>${c.label}:</strong><button class="btn-tts" data-clip="${c.key}" style="margin:0">🔊 Nghe</button></div>`).join('')}
      </div>
      <div class="recipe-card-grid">
        ${P1SC_MATCH_ORDER.map(d=>`<div class="recipe-card" style="cursor:default">
          <div class="recipe-card-img">${d.img?`<img src="${d.img}" alt="${d.name}" style="width:100%;height:100%;object-fit:cover">`:`<span>🍽️</span><span class="ph-label">[Ảnh minh họa]</span>`}</div>
          <div class="recipe-card-body">
            <div class="recipe-card-name">${d.name}</div>
            ${d.attrib?`<div style="font-size:0.68rem;color:var(--text3);margin-bottom:0.4rem">${d.attrib}</div>`:''}
            <select id="p1sc-match-${d.id}" style="width:100%;margin-top:0.5rem;padding:0.4rem;font-size:0.85rem;border-radius:var(--rxs);border:1px solid var(--border)">
              <option value="">-- Khớp với --</option>
              <option value="1">Đoạn 1</option>
              <option value="2">Đoạn 2</option>
              <option value="3">Đoạn 3</option>
            </select>
          </div>
        </div>`).join('')}
      </div>
      <button type="button" class="check-btn" id="p1sc-match-check" style="margin-top:1rem">✓ Chấm Điểm</button>
      <div id="p1sc-match-fb" style="margin-top:0.6rem;font-weight:700"></div>
    </div>
    <div class="block">
      <div class="block-title">💬 Luyện Nghe Tương Tác — Gọi Món Tại Quán Phở</div>
      <p class="instr">Nghe nhân viên phục vụ nói (bấm 🔊), rồi chọn câu phản hồi tự nhiên, phù hợp nhất. Chọn sai vẫn có thể thử lại; hội thoại tiếp tục sau mỗi lượt trả lời đúng — 4 lượt trong suốt bữa ăn.</p>
      <div class="chat-log" id="p1sc-dialogue-chat"></div>
      <div class="options" id="p1sc-dialogue-opts"></div>
      <div class="q-feedback" id="p1sc-dialogue-fb"></div>
    </div>`;

  (()=>{
    const btn = document.getElementById('p1sc-listen-play');
    const renderPlayBtn = ()=>{
      const plays = load('p1sc::listen-plays-canhchua', 0);
      const remaining = P1SC_MAX_LISTENS - plays;
      if(remaining<=0){ btn.disabled = true; btn.textContent = '🔇 Hết lượt nghe'; }
      else { btn.textContent = `🔊 Nghe hướng dẫn (còn ${remaining} lần)`; }
    };
    renderPlayBtn();
    btn.addEventListener('click', ()=>{
      const plays = load('p1sc::listen-plays-canhchua', 0);
      if(plays>=P1SC_MAX_LISTENS) return;
      save('p1sc::listen-plays-canhchua', plays+1);
      playAudioOrTTS('canh-chua-ca-loc', P1SC_LISTEN_SCRIPT, null, 0.9);
      renderPlayBtn();
    });
  })();
  renderStepSequence(document.getElementById('p1sc-listen-seq'), P1SC_LISTEN_STEPS, 'p1sc::listen-seq', 'p1sc:listening', 4);

  listenHost.querySelectorAll('[data-clip]').forEach(b=>{
    const renderPlayBtn = ()=>{
      const plays = load('p1sc::match-plays-'+b.dataset.clip, 0);
      const remaining = P1SC_MAX_LISTENS - plays;
      if(remaining<=0){ b.disabled = true; b.textContent = '🔇 Hết lượt nghe'; }
      else { b.textContent = `🔊 Nghe (còn ${remaining} lần)`; }
    };
    renderPlayBtn();
    b.addEventListener('click', ()=>{
      const plays = load('p1sc::match-plays-'+b.dataset.clip, 0);
      if(plays>=P1SC_MAX_LISTENS) return;
      save('p1sc::match-plays-'+b.dataset.clip, plays+1);
      const clip = P1SC_MATCH_CLIPS.find(c=>c.key===b.dataset.clip);
      playAudioOrTTS(clip.key, clip.text, null, 0.9);
      renderPlayBtn();
    });
  });
  document.getElementById('p1sc-match-check').addEventListener('click', ()=>{
    let allCorrect = true;
    P1SC_MATCH_CARDS.forEach(d=>{
      const sel = document.getElementById('p1sc-match-'+d.id);
      save('p1sc::match-'+d.id, sel.value);
      if(sel.value!==d.ans) allCorrect = false;
    });
    const fb = document.getElementById('p1sc-match-fb');
    if(allCorrect){
      fb.style.color = 'var(--leaf)';
      fb.textContent = 'Chính xác cả 3! Bạn nhận diện rất tốt các tính từ miêu tả thị giác và khứu giác.';
      awardXP('p1sc:listen-match', 4);
    } else {
      fb.style.color = 'var(--coral)';
      fb.textContent = 'Chưa hoàn toàn đúng. Hãy chú ý các từ khóa: "bát nước mắm" (bún chả), "bát nước nóng" (cà phê trứng), "vỏ vàng giòn" (bánh mì).';
    }
  });
  P1SC_MATCH_CARDS.forEach(d=>{
    const saved = load('p1sc::match-'+d.id, '');
    if(saved) document.getElementById('p1sc-match-'+d.id).value = saved;
  });

  const dialogueChat = document.getElementById('p1sc-dialogue-chat');
  const dialogueOpts = document.getElementById('p1sc-dialogue-opts');
  const dialogueFb = document.getElementById('p1sc-dialogue-fb');

  const renderDialoguePlayBtn = (i)=>{
    const t = P1SC_DIALOGUE_TURNS[i];
    const btn = document.getElementById('p1sc-dialogue-play-'+i);
    const plays = load('p1sc::dialogue-plays-'+t.key, 0);
    const remaining = P1SC_MAX_LISTENS - plays;
    if(remaining<=0){ btn.disabled = true; btn.textContent = '🔇 Hết lượt nghe'; }
    else { btn.textContent = `🔊 Nghe (còn ${remaining} lần)`; }
  };
  const renderDialogue = ()=>{
    const done = load('p1sc::dialogue-turn', 0);
    let chatHTML = '';
    for(let i=0;i<=done && i<P1SC_DIALOGUE_TURNS.length;i++){
      chatHTML += `<div class="chat-msg server"><strong>Nhân viên:</strong> <button class="btn-tts" id="p1sc-dialogue-play-${i}" style="margin-left:0.4rem">🔊 Nghe</button></div>`;
      if(i<done) chatHTML += `<div class="chat-msg user">${P1SC_DIALOGUE_TURNS[i].userReply}</div>`;
    }
    dialogueChat.innerHTML = chatHTML;
    dialogueFb.textContent = '';
    for(let i=0;i<=done && i<P1SC_DIALOGUE_TURNS.length;i++){
      renderDialoguePlayBtn(i);
      document.getElementById('p1sc-dialogue-play-'+i).addEventListener('click', ()=>{
        const t = P1SC_DIALOGUE_TURNS[i];
        const plays = load('p1sc::dialogue-plays-'+t.key, 0);
        if(plays>=P1SC_MAX_LISTENS) return;
        save('p1sc::dialogue-plays-'+t.key, plays+1);
        playAudioOrTTS(t.key, t.server, null, 0.9);
        renderDialoguePlayBtn(i);
      });
    }
    if(done >= P1SC_DIALOGUE_TURNS.length){
      dialogueOpts.innerHTML = '';
      dialogueFb.style.color = 'var(--leaf)';
      dialogueFb.textContent = '🎉 Hoàn thành cả 4 lượt hội thoại!';
      awardXP('p1sc:listen-dialogue', 4);
      return;
    }
    const t = P1SC_DIALOGUE_TURNS[done];
    dialogueOpts.innerHTML = t.opts.map((o,oi)=>`<button class="opt-btn" data-oi="${oi}">${String.fromCharCode(65+oi)}. ${o}</button>`).join('');
    dialogueOpts.querySelectorAll('.opt-btn').forEach(b=>b.addEventListener('click', ()=>{
      const oi = parseInt(b.dataset.oi,10);
      if(oi===t.correct){
        save('p1sc::dialogue-turn', done+1);
        renderDialogue();
      } else {
        dialogueFb.style.color = 'var(--coral)';
        dialogueFb.textContent = 'Chưa chính xác hoặc không phù hợp với ngữ cảnh — nghe lại câu hỏi rồi thử lại.';
      }
    }));
  };
  renderDialogue();
}

function initP2(){
  PARTS.find(p=>p.id==='p2').tabs = [
    {id:'p2-pre', label:'Trước Khi Đọc'},
    {id:'p2-main', label:'Chọn Công Thức'},
    {id:'p2-post', label:'Sau Khi Đọc & Xem'},
    {id:'p2-listen', label:'Nghe Thêm'},
    {id:'p2-lang', label:'Language Focus'},
    {id:'p2-exit', label:'Exit Task'},
  ];
  const shell = buildPartShell(PARTS.find(p=>p.id==='p2'));
  document.getElementById('content-area').innerHTML = shell;
  wireTabs();

  const preHost = document.getElementById('mv-p2-pre');
  preHost.innerHTML = `
    <div class="block">
      <div class="block-title">1. Kích Hoạt Từ Vựng — Phân Loại</div>
      <p class="instr">Bấm 1 từ trong ngân hàng từ, rồi bấm nhóm đúng để xếp nó vào — xếp đúng sẽ khóa lại (màu xanh); xếp sai từ sẽ quay lại ngân hàng để bạn thử lại.</p>
      <div class="wsort-bank" id="p2-vsort-bank"></div>
      <div class="wsort-groups" id="p2-vsort-groups"></div>
      <p class="instr" style="margin-top:1rem">🎮 Phiên bản khác (H5P) — làm thêm để luyện lại:</p>
      <div class="h5p-wrap"><iframe src="https://pressbooks.cal.msu.edu/vietnameseint/wp-admin/admin-ajax.php?action=h5p_embed&id=68" width="1309" height="1456" frameborder="0" allowfullscreen="allowfullscreen" title="M4_T1_A1: Vocabulary Activation"></iframe></div>
    </div>
    <div class="block">
      <div class="block-title">2. Nhìn Tranh, Đoán Nguyên Liệu</div>
      <p class="instr">Nhìn ảnh bên dưới, rồi với mỗi món, bấm chọn TẤT CẢ nguyên liệu đúng trong ngân hàng từ — bấm "Kiểm Tra" để xem đáp án (có thể làm lại nếu sai).</p>
      <img class="slide-img" src="VIET203-M2-FoodDrink-2.png" alt="Thực Đơn & Nguyên Liệu — Gỏi cuốn, Cơm tấm và 2 món khác" loading="lazy">
      <div id="p2-ingr-match"></div>
      <p class="instr" style="margin-top:1rem">🎮 Phiên bản khác (H5P) — nhìn tranh và đoán nguyên liệu:</p>
      <div class="h5p-wrap"><iframe src="https://pressbooks.cal.msu.edu/vietnameseint/wp-admin/admin-ajax.php?action=h5p_embed&id=75" width="1309" height="1238" frameborder="0" allowfullscreen="allowfullscreen" title="M4_T1_A.2: Vocabulary Activation"></iframe></div>
    </div>`;

  const vsBankHost = document.getElementById('p2-vsort-bank');
  const vsGroupsHost = document.getElementById('p2-vsort-groups');
  let vsSelected = null;
  const renderVocabSort = ()=>{
    const placed = load('p2::vsort-placed', {});
    vsBankHost.innerHTML = T1_VOCAB_SORT.bank.map((w,i)=>i in placed ? '' : `<button class="wsort-word${vsSelected===i?' sel':''}" data-i="${i}">${w}</button>`).join('')
      || '<span style="color:var(--text3);font-size:0.85rem">Đã phân loại hết! 🎉</span>';
    vsGroupsHost.innerHTML = T1_VOCAB_SORT.groups.map((g,gi)=>{
      const items = Object.entries(placed).filter(([,grp])=>grp===gi).map(([wi])=>T1_VOCAB_SORT.bank[wi]);
      return `<div class="wsort-group" data-g="${gi}"><div class="wsort-group-title">${g}</div>${items.map(w=>`<span class="wsort-placed">${w}</span>`).join('')}</div>`;
    }).join('');
    vsBankHost.querySelectorAll('.wsort-word').forEach(b=>b.addEventListener('click', ()=>{
      const i = parseInt(b.dataset.i,10);
      vsSelected = vsSelected===i ? null : i;
      renderVocabSort();
    }));
    vsGroupsHost.querySelectorAll('.wsort-group').forEach(gEl=>gEl.addEventListener('click', ()=>{
      if(vsSelected===null) return;
      const gi = parseInt(gEl.dataset.g,10);
      if(T1_VOCAB_SORT.ans[vsSelected]===gi){
        const p = load('p2::vsort-placed', {});
        p[vsSelected] = gi;
        save('p2::vsort-placed', p);
        vsSelected = null;
        renderVocabSort();
        checkVocabSort();
      } else {
        gEl.classList.add('wsort-wrong-flash');
        setTimeout(()=>{ vsSelected = null; renderVocabSort(); }, 550);
      }
    }));
  };
  const checkVocabSort = ()=>{
    const placed = load('p2::vsort-placed', {});
    if(Object.keys(placed).length===T1_VOCAB_SORT.bank.length) awardXP('p2:vocab-sort', 4);
  };
  renderVocabSort();
  checkVocabSort();

  const imHost = document.getElementById('p2-ingr-match');
  const shuffledOpts = T1_INGR_MATCH.map(d=>[...d.correct, ...d.distractors].sort(()=>Math.random()-0.5));
  const renderIngrMatch = ()=>{
    imHost.innerHTML = T1_INGR_MATCH.map((d,di)=>{
      const checked = load('p2::ingr-checked-'+di, false);
      const sel = load('p2::ingr-sel-'+di, []);
      const chips = shuffledOpts[di].map(opt=>{
        const isSel = sel.includes(opt);
        const isCorrect = d.correct.includes(opt);
        let cls = 'chipsel';
        if(checked){
          if(isCorrect && isSel) cls += ' correct';
          else if(!isCorrect && isSel) cls += ' wrong';
          else if(isCorrect && !isSel) cls += ' missed';
        } else if(isSel) cls += ' sel';
        return `<button class="${cls}" data-di="${di}" data-opt="${escapeHtmlG(opt)}"${checked?' disabled':''}>${opt}</button>`;
      }).join('');
      return `<div class="block-sub" style="margin-top:${di===0?'0':'1rem'}">${d.name}</div>
        <div class="chipsel-row">${chips}</div>
        ${checked ? `<button class="check-btn secondary" data-redo="${di}">🔁 Làm lại</button>` : `<button class="check-btn" data-check="${di}">✓ Kiểm Tra</button>`}`;
    }).join('');
    imHost.querySelectorAll('.chipsel:not(:disabled)').forEach(b=>b.addEventListener('click', ()=>{
      const di = parseInt(b.dataset.di,10);
      const opt = b.dataset.opt;
      const sel = load('p2::ingr-sel-'+di, []);
      const idx = sel.indexOf(opt);
      if(idx===-1) sel.push(opt); else sel.splice(idx,1);
      save('p2::ingr-sel-'+di, sel);
      renderIngrMatch();
    }));
    imHost.querySelectorAll('[data-check]').forEach(b=>b.addEventListener('click', ()=>{
      save('p2::ingr-checked-'+b.dataset.check, true);
      renderIngrMatch();
      checkIngrMatch();
    }));
    imHost.querySelectorAll('[data-redo]').forEach(b=>b.addEventListener('click', ()=>{
      save('p2::ingr-checked-'+b.dataset.redo, false);
      save('p2::ingr-sel-'+b.dataset.redo, []);
      renderIngrMatch();
    }));
  };
  const checkIngrMatch = ()=>{
    const allExact = T1_INGR_MATCH.every((d,di)=>{
      const sel = load('p2::ingr-sel-'+di, []);
      return sel.length===d.correct.length && d.correct.every(c=>sel.includes(c));
    });
    if(allExact) awardXP('p2:pic-id', 3);
  };
  renderIngrMatch();
  checkIngrMatch();

  const mainHost = document.getElementById('mv-p2-main');
  mainHost.innerHTML = `
    <div class="block">
      <div class="block-title">📖 Chọn Công Thức Của Bạn <span style="font-weight:400;color:var(--text3);font-size:0.8rem">bài đọc + video thật từ monngonmoingay.com</span></div>
      <p class="instr">🎬 <strong>Tình huống:</strong> Cuối tuần này, bạn và một người bạn thân quyết định cùng nấu một bữa tối kiểu Việt Nam cho 2 người, gồm 2 món: Cơm Chiên Dương Châu và Cà Ri Gà. Vì cả hai đều bận, mỗi người chỉ có thời gian nghiên cứu kỹ MỘT công thức trước khi gặp nhau đi chợ — người kia sẽ phải dựa vào lời bạn giải thích lại để biết cách nấu món còn lại.<br><br>🏫 <strong>Trên lớp:</strong> đóng đúng vai này theo cặp — mỗi cặp bấm chọn MỘT thẻ công thức để đọc + xem thật kỹ (công thức kia để dành cho lúc bạn "báo lại" cho người bạn nấu cùng, ở phần Sau Khi Đọc & Xem). 🏠 <strong>Tự học:</strong> bạn đóng cả 2 vai một mình — bấm chọn <strong>ít nhất 1</strong> thẻ trước (khuyến khích cả 2, vì phần sau có bài luyện riêng cho công thức bạn chưa làm sâu). Vừa đọc/xem vừa ghi chú vào bảng tóm tắt, như thể bạn sắp phải giải thích lại cho người bạn nấu cùng — ghi càng rõ, bữa tối càng thành công!</p>
      <div class="recipe-card-grid" id="p2-cards"></div>
      <div id="p2-recipes"></div>
    </div>
    <div class="block">
      <div class="block-title">Danh Sách Đi Chợ</div>
      <p class="instr">Sau khi đã đọc/xem và trao đổi (hoặc tự làm cả 2), cùng quyết định (một mình hoặc với bạn) danh sách đi chợ ĐẦY ĐỦ cho CẢ 2 món, kèm số lượng.</p>
      <textarea class="freewrite" id="p2-grocery" data-key="p2::grocery" placeholder="Ví dụ: Cơm trắng 4 chén, trứng gà 2 quả, đùi gà 6 cái, dừa nạo 600g..."></textarea>
    </div>
    <div class="block">
      <div class="block-title">Đúng / Sai</div>
      <div id="p2-tf"></div>
    </div>`;
  const cardsHost = document.getElementById('p2-cards');
  const recHost = document.getElementById('p2-recipes');
  const renderCards = ()=>{
    cardsHost.innerHTML = T1_RECIPES.map(r=>{
      const isOpen = load('p2::card-open-'+r.id, false);
      return `<button type="button" class="recipe-card${isOpen?' open':''}" data-r="${r.id}">
        <div class="recipe-card-img">${r.img?`<img src="${r.img}" alt="${r.name}" style="width:100%;height:100%;object-fit:cover">`:`<span>🍽️</span><span class="ph-label">[Ảnh minh họa]</span>`}</div>
        <div class="recipe-card-body">
          <div class="recipe-card-name">${r.name}</div>
          <div class="recipe-card-cta">${isOpen?'✓ Đang mở — bấm để đóng':'Bấm để chọn công thức này →'}</div>
        </div>

      const roundEl=document.getElementById('fbl-dict-round'), secEl=document.getElementById('fbl-dict-sec'), gaugeEl=document.getElementById('fbl-dict-gauge');

      function speakCur(){ speakTTS(FB_DICTATION_ITEMS[round].text, 1.0); }

          <button class="mtab" data-s="3.2">Nhanh</button>
        </div>`}
        <div class="ribbon-stage" id="${uid}-stage">
          <div class="ribbon-gate"></div><span class="ribbon-gate-lbl">Cổng đọc to</span>
          <div class="ribbon-track" id="${uid}-track"></div>
        </div>
        <button class="check-btn" id="${uid}-toggle">Bắt đầu cuộn</button>
        <span id="${uid}-counter" style="font-size:0.8rem;color:var(--text2);margin-left:0.6rem"></span>`;
      const stage = document.getElementById(uid+'-stage'), track = document.getElementById(uid+'-track');
      const toggleBtn = document.getElementById(uid+'-toggle'), counter = document.getElementById(uid+'-counter');
      let isRunning=false, speed=decaying?0.8:1.2, posX=0, animId=null, startTs=0, passedCount=0;
      function buildTrack(){
        track.innerHTML='';
        posX = stage.clientWidth;
        track.style.transform = `translateX(${posX}px)`;
        phrases.forEach((ph,i)=>{ const n=document.createElement('div'); n.className='ribbon-node'; n.id=uid+'-n'+i; n.textContent=ph; track.appendChild(n); });
        counter.textContent = `Tổng: ${phrases.length} cụm từ`;
      }
      function loop(ts){
        if(!isRunning) return;
        if(decaying){
          const elapsed = (ts-startTs)/1000;
          speed = Math.min(4.5, 0.8 + Math.floor(elapsed/8)*0.6); // ramps every ~8s
        }
        posX -= speed;
        track.style.transform = `translateX(${posX}px)`;
        const gateOffset = stage.clientWidth*0.25;
        track.querySelectorAll('.ribbon-node').forEach(n=>{
          const r = n.getBoundingClientRect(), sr = stage.getBoundingClientRect();
          const left = r.left-sr.left, right = r.right-sr.left;
          n.classList.toggle('hi', left<=gateOffset && right>=gateOffset);
        });
        if(posX < -track.scrollWidth){
          stop();
          posX = stage.clientWidth;
          track.style.transform = `translateX(${posX}px)`;
          toggleBtn.textContent='Chạy lại';
          passedCount++;
          save(uid+'::runs', passedCount);
          awardXP(xpKey, xpAmt);
          return;
        }
        animId = requestAnimationFrame(loop);
      }
      function start(){ isRunning=true; startTs=performance.now(); toggleBtn.textContent='Tạm dừng'; animId=requestAnimationFrame(loop); }
      function stop(){ isRunning=false; cancelAnimationFrame(animId); toggleBtn.textContent='Tiếp tục cuộn'; }
      toggleBtn.addEventListener('click', ()=> isRunning ? stop() : start());
      if(!decaying){
        document.getElementById(uid+'-speedctrl').querySelectorAll('button').forEach(b=>b.addEventListener('click', ()=>{
          document.getElementById(uid+'-speedctrl').querySelectorAll('button').forEach(x=>x.classList.remove('active'));
          b.classList.add('active'); speed = parseFloat(b.dataset.s);
        }));
      }
      buildTrack();
    }
  })();
}

function renderPxSubnav(navHost, subtabs, initial){
  let active = load(navHost.id+'::active', initial);
  if(!subtabs.some(t=>t.id===active)) active = initial;
  const render = ()=>{
    navHost.innerHTML = subtabs.map(t=>`<button type="button" class="mtab${active===t.id?' active':''}" data-sub="${t.id}">${t.label}</button>`).join('');
    navHost.querySelectorAll('button').forEach(b=>b.addEventListener('click', ()=>{
      active = b.dataset.sub;
      save(navHost.id+'::active', active);
      subtabs.forEach(t=>{ document.getElementById('mv-'+t.id).hidden = t.id!==active; });
      render();
    }));
  };
  render();
  subtabs.forEach(t=>{ document.getElementById('mv-'+t.id).hidden = t.id!==active; });
}

      const answered = WHICHFOOD_QUESTIONS.map((_,qi)=>load('pextra::whichfood'+qi,null));

      const counts = {spicy:0,light:0,hearty:0,sweet:0};
      let lastCat = null;
      answered.forEach((oi,qi)=>{ const cat = WHICHFOOD_QUESTIONS[qi].opts[oi].c; counts[cat]++; lastCat = cat; });
      const maxN = Math.max(...Object.values(counts));
      const tied = Object.keys(counts).filter(c=>counts[c]===maxN);

      const winner = computeResult();

    slDCol.innerHTML = slDefs.map(d=>`<button class="match-btn${slMatched.some(w=>CN_SLANG_MATCH.find(m=>m.w===w).def===d)?' matched':''}" data-d="${d}">${d}</button>`).join('');
    function checkSlang(){
      const matchDone = slMatched.length>=CN_SLANG_MATCH.length;
      const honorDone = load('pextra:slang-honor', false);
      if(matchDone && honorDone) awardXP('pextra:slang-honor', 3);
    }
    checkSlang();
    slWCol.querySelectorAll('.match-btn').forEach(b=>b.addEventListener('click', ()=>{
      if(b.classList.contains('matched')) return;
      slWCol.querySelectorAll('.match-btn').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel'); slSel = b.dataset.w;
    }));
    slDCol.querySelectorAll('.match-btn').forEach(b=>b.addEventListener('click', ()=>{
      if(b.classList.contains('matched') || !slSel) return;
      const correct = CN_SLANG_MATCH.find(m=>m.w===slSel).def === b.dataset.d;
      if(correct){
        slMatched.push(slSel); save('pextra::slang-match-done', slMatched);
        slWCol.querySelector(`[data-w="${slSel}"]`).classList.add('matched');
        b.classList.add('matched');
        checkSlang();
      } else {
        b.classList.add('wrong-flash'); setTimeout(()=>b.classList.remove('wrong-flash'), 500);
      }
      slWCol.querySelectorAll('.match-btn').forEach(x=>x.classList.remove('sel'));
      slSel = null;
    }));
    const slHonorHost = document.getElementById('px-cn-sl-honor');
    renderHonorCheck(slHonorHost, 'pextra:slang-honor', 'Tôi đã đọc đoạn hội thoại và hiểu nghĩa của 6 từ lóng trên.', 0);
    slHonorHost.querySelector('input').addEventListener('change', checkSlang);
  })();
}

function reflectionWordCount(){
  const t = load('report::reflection','');
  return t.trim() ? t.trim().split(/\s+/).filter(w=>w.length>0).length : 0;

function doneParts(){ return Object.keys(PART_MAX_XP).filter(isPartDone); }
function isReportReady(){
  const hasName = !!(load('report::name','')||'').trim();
  return coreTasksDone() && reflectionWordCount()>=20 && hasName;
}
function generateCode(score){
  const d = new Date(); const day=d.getDate(); const month=d.getMonth()+1;
  const seed = (score*31 + day*7 + month*13) % 4096;
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const c1 = chars[seed%32], c2 = chars[Math.floor(seed/32)%32], c3 = chars[(score*3+day+month)%32];
  return 'VS203M2-'+String(score).padStart(3,'0')+'-'+c1+c2+c3;
}

function t1SummaryText(){
  for(const r of T1_RECIPES){
    const parts = T1_SUMMARY_ROWS.map(row=>{
      const v = (load('p2::sumtbl-'+r.id+'-'+row.key,'')||'').trim();
      return v ? `${row.label}: ${v}` : null;
    }).filter(Boolean);
    if(parts.length) return `[${r.name}] ` + parts.join(' · ');
  }
  return '';
}
function buildChecklistHTML(){
  return Object.keys(PART_MAX_XP).map(id=>{
    const earned=partXP(id), max=PART_MAX_XP[id];

    const icon = {done:'✅',partial:'🔸',missing:'⭕'}[st];
