    const goBtn = st!=='done' ? `<button class="cl-go-btn" onclick="openPart('${id}')">Đi tới →</button>` : '';
    return `<li class="${cls}"><span class="cl-icon">${icon}</span><span class="cl-text">${REPORT_PART_LABELS[id]}</span><span class="cl-xp">${earned} / ${max} XP</span>${goBtn}</li>`;

function escapeHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function fbExpandSampleText(si){
  const hist = load('fb::expand-hist-'+si, []);
  return hist.length ? hist.map((t,i)=>`Bước ${i+1}: ${t}`).join(' → ') : '';
}
function fbChainSampleText(){
  const rec = load('fb::chain-sentences', null);
  if(!rec || !rec.sentences || !rec.sentences.length) return '';
  return `Mở đầu: ${rec.starter} | ` + rec.sentences.map((s,i)=>`Bạn (${i+1}): ${s}`).join(' ');
}

function buildSpeakAudioHTML(){
  // Inline-styled (not app-only CSS classes) so this renders correctly both
  // inside the live app AND inside buildReportDoc()'s standalone export doc.
  // Extended 2026-09-17 12th pass to also show each clip's auto-transcript
  // (captured by startClipRecording()'s SpeechRecognition pass) and to cover
  // Chunk Chaining/Pyramid Stories/Vanishing Script's single-slot clips, not
  // just 4/3/2 and Shadowing — "recordings for each activity they complete."
  const rowStyle = 'display:flex;align-items:center;gap:0.6rem;padding:0.5rem 0;border-bottom:1px solid #e2e8f0;font-size:0.86rem';
  function clipHTML(b, tr){
    const url = URL.createObjectURL(b);
    return `<div style="margin-bottom:0.6rem"><audio controls src="${url}" style="width:100%;height:36px"></audio>${tr?`<div style="font-size:0.78rem;color:#94a3b8;margin-top:0.3rem"><em>Bản chép lời (tự động, có thể có lỗi): ${escapeHtml(tr)}</em></div>`:''}</div>`;
  }
  const section432 = FBSPEAK_432_RECORDINGS.map((b,i)=>{
    if(!b) return `<div style="${rowStyle}"><span>⭕</span><span>Vòng ${i+1} (${FB_432_ROUNDS[i]}s) — chưa có bản ghi âm</span></div>`;
    return `<div style="font-size:0.8rem;color:#94a3b8;margin-bottom:0.2rem">Vòng ${i+1} (${FB_432_ROUNDS[i]}s)</div>${clipHTML(b, FBSPEAK_432_TRANSCRIPTS[i])}`;
  }).join('');
  const sectionShadow = FBSPEAK_SHADOW_RECORDINGS.map((b,i)=>{
    if(!b) return `<div style="${rowStyle}"><span>⭕</span><span>Câu ${i+1} — chưa có bản ghi âm</span></div>`;
    return `<div style="font-size:0.8rem;color:#94a3b8;margin-bottom:0.2rem">Câu ${i+1}</div>${clipHTML(b, FBSPEAK_SHADOW_TRANSCRIPTS[i])}`;
  }).join('');
  const sectionChunk = FBSPEAK_CHUNK_RECORDING ? clipHTML(FBSPEAK_CHUNK_RECORDING, FBSPEAK_CHUNK_TRANSCRIPT)
    : `<div style="${rowStyle}"><span>⭕</span><span>Chưa có bản ghi âm</span></div>`;
  const sectionPyramid = FBSPEAK_PYRAMID_RECORDING ? clipHTML(FBSPEAK_PYRAMID_RECORDING, FBSPEAK_PYRAMID_TRANSCRIPT)
    : `<div style="${rowStyle}"><span>⭕</span><span>Chưa có bản ghi âm</span></div>`;
  const sectionVanish = FBSPEAK_VANISH_RECORDING ? clipHTML(FBSPEAK_VANISH_RECORDING, FBSPEAK_VANISH_TRANSCRIPT)
    : `<div style="${rowStyle}"><span>⭕</span><span>Chưa có bản ghi âm</span></div>`;
  const hasAny = FBSPEAK_432_RECORDINGS.some(b=>b) || FBSPEAK_SHADOW_RECORDINGS.some(b=>b)
    || FBSPEAK_CHUNK_RECORDING || FBSPEAK_PYRAMID_RECORDING || FBSPEAK_VANISH_RECORDING;
  if(!hasAny){
    return `<p style="font-size:0.86rem;color:#64748b;font-style:italic;margin:0">Chưa có bản ghi âm nào cho Mở Lời (Speak It) trong phiên làm việc này (micrô có thể chưa được cấp quyền, hoặc bạn chưa bắt đầu hoạt động — không sao, mọi hoạt động vẫn tính hoàn thành qua honor-check).</p>`;
  }
  return `<div style="font-size:0.8rem;font-weight:600;color:#334155;margin-bottom:0.4rem">🎯 4/3/2</div>${section432}
    <div style="font-size:0.8rem;font-weight:600;color:#334155;margin:0.8rem 0 0.4rem">🎧 Nhại Giọng (Shadowing)</div>${sectionShadow}
    <div style="font-size:0.8rem;font-weight:600;color:#334155;margin:0.8rem 0 0.4rem">🔗 Ghép Cụm Từ (Chunk Chaining)</div>${sectionChunk}
    <div style="font-size:0.8rem;font-weight:600;color:#334155;margin:0.8rem 0 0.4rem">🔺 Tháp Câu (Pyramid Stories)</div>${sectionPyramid}
    <div style="font-size:0.8rem;font-weight:600;color:#334155;margin:0.8rem 0 0.4rem">📉 Kịch Bản Mờ Dần (Vanishing Script)</div>${sectionVanish}`;
}

  <div class="section"><div class="section-title">Suy ngẫm của sinh viên</div><div class="reflect-box">${reflection}</div></div>

}
function downloadReport(){
  const html = buildReportDoc();
  const name = (load('report::name','')||'Student').replace(/[^a-zA-Z0-9]/g,'_');
  const blob = new Blob([html], {type:'text/html'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `VIET203_M4_FoodsReport_${name}.html`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}
function printReport(){
  const html = buildReportDoc();
  const w = window.open('', '_blank');
  if(!w){ alert('Trình duyệt đã chặn cửa sổ mới. Vui lòng cho phép popup, hoặc dùng nút "Tải Báo Cáo" rồi in file đó.'); return; }
  w.document.open(); w.document.write(html); w.document.close();
}

function bindPersist(scope){
  scope.querySelectorAll('input[data-key], textarea[data-key]').forEach(el=>{
    const saved = load(el.dataset.key, null);
    if(saved!==null){
      if(el.type==='checkbox') el.checked = saved===true || saved==='true';
      else el.value = saved;
    }
    const evt = el.type==='checkbox' ? 'change' : 'input';
    el.addEventListener(evt, ()=>{ save(el.dataset.key, el.type==='checkbox' ? el.checked : el.value); });
  });
}

if(!load('report::started-at', null)) save('report::started-at', Date.now());
renderDashboard();
</script>
