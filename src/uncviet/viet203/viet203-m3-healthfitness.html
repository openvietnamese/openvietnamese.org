}

/* ===================== GENERIC STEP-SEQUENCE (tap ▲▼ to reorder, self-graded) =====================
   steps: array in the CORRECT order (index = correct position). Shuffles once, persists the
   current order as an array of original indices, lets the student reorder with ▲▼ (no native
   drag-and-drop needed), then "Kiểm Tra" locks and colors each row correct/wrong by position;
   "Làm lại" reshuffles for another attempt. Added 2026-09-15 for T1's video-based step-recall
   task (see initP2's Sau Khi Đọc & Xem block) but written generically for reuse elsewhere. */
function renderStepSequence(host, steps, storageKey, xpKey, xpAmount){
  const n = steps.length;
  let order = load(storageKey, null);
  if(!order || order.length!==n) order = steps.map((_,i)=>i).sort(()=>Math.random()-0.5);
  let checked = load(storageKey+'-checked', false);
  const render = ()=>{
    save(storageKey, order);
    host.innerHTML = `<div class="seq-list">${order.map((origIdx,pos)=>{
      const cls = 'seq-item' + (checked ? (origIdx===pos ? ' correct' : ' wrong') : '');
      return `<div class="${cls}"><span class="seq-num">${pos+1}</span><span class="seq-text">${steps[origIdx]}</span>
        <span class="seq-move">
          <button data-dir="up" data-pos="${pos}"${checked||pos===0?' disabled':''}>▲</button>
          <button data-dir="down" data-pos="${pos}"${checked||pos===n-1?' disabled':''}>▼</button>
        </span></div>`;
    }).join('')}</div>
    ${checked ? `<button class="check-btn secondary" id="${storageKey}-redo">🔁 Làm lại</button>` : `<button class="check-btn" id="${storageKey}-check">✓ Kiểm Tra Thứ Tự</button>`}`;
    host.querySelectorAll('.seq-move button:not(:disabled)').forEach(b=>b.addEventListener('click', ()=>{
      const pos = parseInt(b.dataset.pos,10);
      const swapWith = b.dataset.dir==='up' ? pos-1 : pos+1;
      [order[pos], order[swapWith]] = [order[swapWith], order[pos]];
      render();
    }));
    const checkBtn = document.getElementById(storageKey+'-check');
    if(checkBtn) checkBtn.addEventListener('click', ()=>{
      checked = true;
      save(storageKey+'-checked', true);
      render();
      if(order.every((oi,pos)=>oi===pos) && xpKey) awardXP(xpKey, xpAmount);
    });
    const redoBtn = document.getElementById(storageKey+'-redo');
    if(redoBtn) redoBtn.addEventListener('click', ()=>{
      checked = false;
      order = steps.map((_,i)=>i).sort(()=>Math.random()-0.5);
      save(storageKey+'-checked', false);
      render();
    });
  };
  render();
}

/* ===================== GENERIC WORD-BANK SENTENCE FILL (drag or tap word → tap blank) =====================
   items: [{sentence, a}], sentence containing exactly one "_____" placeholder. The bank is
   built from each item's own `a` (shuffled), one word per sentence, each used exactly once —
   supports real HTML5 drag-and-drop (desktop) AND tap-word-then-tap-blank (touch, since
   dragstart doesn't fire reliably on mobile) on the same elements. A correct drop/tap locks
   that blank green; an incorrect one flashes coral and the word stays in the bank instead of
   placing. Added 2026-09-15 for T1's Language Focus (see initP2), written generically for
   reuse — same self-graded philosophy as renderStepSequence(). */
function renderWordBankFill(host, items, storageKey, xpKey, xpAmount){
  const n = items.length;
  let bankOrder = load(storageKey+'-bank', null);
  if(!bankOrder || bankOrder.length!==n){ bankOrder = items.map((_,i)=>i).sort(()=>Math.random()-0.5); save(storageKey+'-bank', bankOrder); }
  let selected = null;
  const render = ()=>{
    const placed = load(storageKey, {});
    const placedWordIdxs = new Set(Object.values(placed));
    const bankHTML = bankOrder.filter(wi=>!placedWordIdxs.has(wi)).map(wi=>
      `<button type="button" class="wsort-word${selected===wi?' sel':''}" draggable="true" data-wi="${wi}">${items[wi].a}</button>`
    ).join('') || '<span style="color:var(--text3);font-size:0.85rem">Đã dùng hết từ trong ngân hàng! 🎉</span>';
    const sentencesHTML = items.map((it,i)=>{
      const wi = placed[i];
      const filled = wi!==undefined;
      const blankCls = 'lf-blank' + (filled ? ' filled correct' : '');
      const blankInner = filled ? items[wi].a : '_____';
      return `<div class="lf-sentence"><span class="fsw-num">${i+1}.</span>${it.sentence.replace('_____', `<span class="${blankCls}" data-i="${i}">${blankInner}</span>`)}</div>`;
    }).join('');
    host.innerHTML = `<div class="wsort-bank">${bankHTML}</div><div>${sentencesHTML}</div>`;
    const bankHost = host.querySelector('.wsort-bank');
    bankHost.querySelectorAll('.wsort-word').forEach(b=>{
      b.addEventListener('click', ()=>{
        const wi = parseInt(b.dataset.wi,10);
        selected = selected===wi ? null : wi;
        render();
      });
      b.addEventListener('dragstart', e=>{ e.dataTransfer.setData('text/plain', b.dataset.wi); });
    });
    const tryPlace = (i, wi)=>{
      const blankEl = host.querySelector(`.lf-blank[data-i="${i}"]`);
      if(items[wi].a === items[i].a){
        const p = load(storageKey, {});
        p[i] = wi;
        save(storageKey, p);
        selected = null;
        render();
        checkComplete();
      } else if(blankEl){
        blankEl.classList.add('wrong-flash');
        setTimeout(()=>blankEl.classList.remove('wrong-flash'), 550);
      }
    };
    host.querySelectorAll('.lf-blank:not(.filled)').forEach(el=>{
      el.addEventListener('click', ()=>{ if(selected!==null) tryPlace(parseInt(el.dataset.i,10), selected); });
      el.addEventListener('dragover', e=>{ e.preventDefault(); el.classList.add('dragover'); });
      el.addEventListener('dragleave', ()=>el.classList.remove('dragover'));
      el.addEventListener('drop', e=>{
        e.preventDefault();
        el.classList.remove('dragover');
        const wi = parseInt(e.dataTransfer.getData('text/plain'),10);
        if(!isNaN(wi)) tryPlace(parseInt(el.dataset.i,10), wi);
      });
    });
    host.querySelectorAll('.lf-blank.filled').forEach(el=>{
      el.addEventListener('click', ()=>{
        const p = load(storageKey, {});
        delete p[parseInt(el.dataset.i,10)];
        save(storageKey, p);
        render();
      });
    });
  };
  const checkComplete = ()=>{
    const p = load(storageKey, {});
    if(Object.keys(p).length===n && xpKey) awardXP(xpKey, xpAmount);
  };
  render();
  checkComplete();
}

/* ===================== STORY BANK ACTIVITIES (Truyện Vui sub-tab) =====================
   Three self-graded mini-games per story, added 2026-09-17 for STORY_BANK, mirroring
   VIET102_Reading-Marathon-#2.html's Tap-the-pairs / Sắp xếp câu / Điền vào chỗ trống —
   reimplemented against this file's own persistence (save/load/awardXP) and CSS. */

/* Tap the pairs: reuses the existing .match-grid/.match-col/.match-btn tap-to-match
   mechanic (already used inline 4x elsewhere in this file, e.g. T3's langfocus-match) —
   generalized into one function instead of a 5th copy-pasted instance. */
function renderPairsMatch(host, pairs, storageKey, xpKey, xpAmount){
  host.innerHTML = `<div class="match-grid"><div class="match-col" id="${storageKey}-w"></div><div class="match-col" id="${storageKey}-d"></div></div>`;
  const words = pairs.map(p=>p[0]);
  const defs = [...pairs.map(p=>p[1])].sort(()=>Math.random()-0.5);
  let selWord=null;
  const matched = load(storageKey, []);
  const wCol = document.getElementById(`${storageKey}-w`), dCol = document.getElementById(`${storageKey}-d`);
  wCol.innerHTML = words.map(w=>`<button class="match-btn${matched.includes(w)?' matched':''}" data-w="${w}">${w}</button>`).join('');
  dCol.innerHTML = defs.map(d=>`<button class="match-btn${matched.some(w=>pairs.find(p=>p[0]===w)[1]===d)?' matched':''}" data-d="${d}">${d}</button>`).join('');
  function checkDone(){ if(matched.length>=pairs.length && xpKey) awardXP(xpKey, xpAmount); }
  checkDone();
  wCol.querySelectorAll('.match-btn').forEach(b=>b.addEventListener('click', ()=>{
    if(b.classList.contains('matched')) return;
    wCol.querySelectorAll('.match-btn').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel'); selWord = b.dataset.w;
  }));
  dCol.querySelectorAll('.match-btn').forEach(b=>b.addEventListener('click', ()=>{
    if(b.classList.contains('matched') || !selWord) return;
    const correct = pairs.find(p=>p[0]===selWord)[1] === b.dataset.d;
    if(correct){
      matched.push(selWord); save(storageKey, matched);
      wCol.querySelector(`[data-w="${CSS.escape(selWord)}"]`).classList.add('matched');
      b.classList.add('matched');
      checkDone();
    } else {
      b.classList.add('wrong-flash'); setTimeout(()=>b.classList.remove('wrong-flash'), 500);
    }
    wCol.querySelectorAll('.match-btn').forEach(x=>x.classList.remove('sel'));
    selWord = null;
  }));
}

/* Sắp xếp câu đúng: tap a bank sentence to place it next (in click order) into the
   placed list; tap a placed sentence to send it back to the bank. "Kiểm Tra" locks and
   colors each placed slot by whether it matches `sentences`' correct order. */
function renderReorderActivity(host, sentences, storageKey, xpKey, xpAmount){
  const n = sentences.length;
  let bankOrder = load(storageKey+'-bank', null);
  if(!bankOrder || bankOrder.length!==n){ bankOrder = sentences.map((_,i)=>i).sort(()=>Math.random()-0.5); save(storageKey+'-bank', bankOrder); }
  function render(){
    const placed = load(storageKey, []); // array of sentence-indexes, in the order the student placed them
    const checked = load(storageKey+'-checked', false);
    const placedHTML = placed.map((si,pos)=>{
      const cls = checked ? (si===pos ? ' correct' : ' wrong') : '';
      return `<div class="reorder-item${cls}" data-si="${si}"><span class="ri-num">${pos+1}.</span>${sentences[si]}</div>`;
    }).join('') || '<span style="color:var(--text3);font-size:0.82rem">Bấm câu bên dưới để bắt đầu sắp xếp...</span>';
    const bankHTML = bankOrder.filter(si=>!placed.includes(si)).map(si=>
      `<button type="button" class="reorder-btn" data-si="${si}">${sentences[si]}</button>`).join('');
    host.innerHTML = `
      <div class="reorder-placed${placed.length?' has-items':''}">${placedHTML}</div>
      <div class="reorder-bank">${bankHTML}</div>
      <div class="act-actions" style="margin-top:0.7rem;display:flex;gap:0.6rem;flex-wrap:wrap">
        <button class="check-btn" id="${storageKey}-check" ${placed.length<n?'disabled':''}>Kiểm Tra</button>
        <button class="check-btn secondary" id="${storageKey}-reset">Đặt lại</button>
      </div>`;
    host.querySelectorAll('.reorder-btn').forEach(b=>b.addEventListener('click', ()=>{
      const p = load(storageKey, []);
      p.push(parseInt(b.dataset.si,10));
      save(storageKey, p);
      save(storageKey+'-checked', false);
      render();
    }));
    host.querySelectorAll('.reorder-item').forEach(el=>el.addEventListener('click', ()=>{
      if(load(storageKey+'-checked', false)) return; // locked after checking
      const p = load(storageKey, []).filter(si=>si!==parseInt(el.dataset.si,10));
      save(storageKey, p);
      render();
    }));
    const checkBtn = document.getElementById(storageKey+'-check');
    if(checkBtn) checkBtn.addEventListener('click', ()=>{
      save(storageKey+'-checked', true);
      const p = load(storageKey, []);
      if(p.every((si,pos)=>si===pos) && xpKey) awardXP(xpKey, xpAmount);
      render();
    });
    const resetBtn = document.getElementById(storageKey+'-reset');
    if(resetBtn) resetBtn.addEventListener('click', ()=>{
      save(storageKey, []); save(storageKey+'-checked', false); render();
    });
  }
  render();
}

/* Điền vào chỗ trống: one cloze paragraph with `fill.text`'s {0}..{n-1} placeholders,
   a shared word bank (fill.bank, includes distractors beyond fill.answers), tap-word-
   then-tap-blank placement — reuses .wsort-word/.wsort-bank (bank chips) and .lf-blank
   (blank slots) styling, but unlike renderWordBankFill (one bank word per sentence, no
   distractors) this is one paragraph with several blanks sharing one bank that has extra
   (wrong) words, so it's a separate renderer rather than a reuse. */
function renderStoryCloze(host, fill, storageKey, xpKey, xpAmount){
  const n = fill.answers.length;
  let selected = null;
  function render(){
    const placed = load(storageKey, {}); // {blankIndex: bankWordIndex}
    const placedWordIdxs = new Set(Object.values(placed));
    const bankHTML = fill.bank.map((w,wi)=>placedWordIdxs.has(wi) ? '' :
      `<button type="button" class="wsort-word${selected===wi?' sel':''}" data-wi="${wi}">${w}</button>`).join('');
    let bi = -1;
    const textHTML = fill.text.replace(/\{(\d+)\}/g, (m,idx)=>{
      bi++;
      const wi = placed[bi];
      const filled = wi!==undefined;
      const cls = 'lf-blank' + (filled ? ' filled correct' : '');
      return `<span class="${cls}" data-i="${bi}">${filled ? fill.bank[wi] : '_____'}</span>`;
    });
    host.innerHTML = `<div class="wsort-bank">${bankHTML}</div><div class="fsw-ref-row" style="border:none;line-height:2.2">${textHTML}</div>`;
    host.querySelectorAll('.wsort-word').forEach(b=>b.addEventListener('click', ()=>{
      const wi = parseInt(b.dataset.wi,10);
      selected = selected===wi ? null : wi;
      render();
    }));
    const tryPlace = (blankI, wi)=>{
      const blankEl = host.querySelector(`.lf-blank[data-i="${blankI}"]`);
      if(fill.bank[wi] === fill.answers[blankI]){
        const p = load(storageKey, {});
        p[blankI] = wi;
        save(storageKey, p);
        selected = null;
        render();
        checkComplete();
      } else if(blankEl){
        blankEl.classList.add('wrong-flash');
        setTimeout(()=>blankEl.classList.remove('wrong-flash'), 550);
      }
    };
    host.querySelectorAll('.lf-blank:not(.filled)').forEach(el=>{
      el.addEventListener('click', ()=>{ if(selected!==null) tryPlace(parseInt(el.dataset.i,10), selected); });
    });
    host.querySelectorAll('.lf-blank.filled').forEach(el=>{
      el.addEventListener('click', ()=>{
        const p = load(storageKey, {});
        delete p[parseInt(el.dataset.i,10)];
        save(storageKey, p);
        render();
      });
    });
  }
  const checkComplete = ()=>{
    const p = load(storageKey, {});
    if(Object.keys(p).length===n && xpKey) awardXP(xpKey, xpAmount);
  };
  render();
  checkComplete();
}

/* ===================== HONOR-SYSTEM SELF-CHECK (in-person activities) ===================== */
function renderHonorCheck(host, key, label, xp, exclusiveWithKey){
  const box = document.createElement('div');
  box.className = 'honor-box';
  const checked = load(key, false);
  box.innerHTML = `<div class="ck-row" style="border:none;padding:0"><input type="checkbox" id="${key.replace(/[:.]/g,'-')}" ${checked?'checked':''}><label for="${key.replace(/[:.]/g,'-')}">✅ ${label}</label></div>`;
  host.appendChild(box);
  const cb = box.querySelector('input');
  cb.addEventListener('change', ()=>{
    save(key, cb.checked);
    // exclusiveWithKey: an async self-written alternative to this same activity
    // (e.g. p2:exchange) — never award both paths for the same conceptual task.
    if(cb.checked && exclusiveWithKey && xpAwarded()[exclusiveWithKey]!==undefined) return;
    if(cb.checked) awardXP(key+':xp', xp);
  });
}

/* ===================== GENERIC NEUTRAL SINGLE-SELECT CHIP PICKER =====================
   Persists the selected index (not a correct/wrong judgment — reuses .opt-btn.sel's

function escapeHtmlG(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ===================== M3 HELPERS =====================
   Small helpers used across Bài 3's parts, on top of the shared components above
   (which are copied unchanged from M2 except renderStoryCloze's placeholder regex,
   widened from \d to \d+ so a cloze can have 10+ blanks — T1's Hoạt động 7 has 12). */
function loadStr(key){ const v = load(key,''); return v==null ? '' : String(v); }
function wordCount(s){ s=String(s==null?'':s).trim(); return s ? s.split(/\s+/).filter(w=>w).length : 0; }
function wcOf(key){ return wordCount(load(key,'')); }
function filledOf(key, minLen){ return loadStr(key).trim().length >= (minLen||1); }
/* Self-write half of an honor-check ↔ self-write pair: never award if the honor-check
   path already earned the same conceptual credit (renderHonorCheck's exclusiveWithKey
   guards the other direction). Honor-check award keys are `<key>:xp`. */
function awardExclusive(key, amount, otherAwardKey){
  if(xpAwarded()[otherAwardKey]!==undefined) return;
  awardXP(key, amount);
}
function safeId(key){ return key.replace(/[^a-zA-Z0-9]/g,'-'); }
/* Textarea with a live word counter (wired by wireWordCounters after bindPersist). */
function twc(key, placeholder, target, minH){
  const id = 'wc-'+safeId(key);
  return `<textarea class="freewrite" data-key="${key}" data-wc="${id}"${minH?` style="min-height:${minH}px"`:''} placeholder="${placeholder||''}"></textarea>
    <div class="wc-row"><span>Số từ: <span class="n" id="${id}">0</span></span><span>${target||''}</span></div>`;
}
function wireWordCounters(scope){
  scope.querySelectorAll('textarea[data-wc]').forEach(el=>{
    const out = document.getElementById(el.dataset.wc);
    const upd = ()=>{ if(out) out.textContent = wordCount(el.value); };
    el.addEventListener('input', upd); upd();
  });
}
function onAnyInput(scope, fn){
  scope.querySelectorAll('input, textarea, select').forEach(el=>{
    el.addEventListener(el.type==='checkbox'||el.tagName==='SELECT' ? 'change' : 'input', fn);
  });
}
/* Real human audio lives on Google Drive (links from the original M6 worksheets) —
   embedded through Drive's /preview player, plus a plain link as a fallback for
   browsers/accounts that block the embed. */
function driveAudioHTML(id, title){

    <a class="drive-link" href="https://drive.google.com/file/d/${id}/view" target="_blank" rel="noopener">🎧 Mở audio "${title}" trong Google Drive ↗</a>`;
}
function revealHTML(id, btnLabel, inner){
  return `<button type="button" class="check-btn secondary" onclick="document.getElementById('${id}').classList.toggle('show')">${btnLabel}</button><div class="reveal-box" id="${id}">${inner}</div>`;
}
const _countdowns = [];
function renderCountdown(host, secs, label){
  let left = secs, t = null;
  const fmt = s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
  host.innerHTML = `<div class="countdown-row"><span class="timer-pill">${fmt(left)}</span><button type="button" class="check-btn secondary cd-start">▶ ${label||'Bắt đầu'}</button><button type="button" class="check-btn secondary cd-reset" title="Đặt lại">↺</button></div>`;
  const pill = host.querySelector('.timer-pill'), bStart = host.querySelector('.cd-start'), bReset = host.querySelector('.cd-reset');
  const stop = ()=>{ clearInterval(t); t = null; bStart.textContent = '▶ '+(label||'Bắt đầu'); };
  bStart.addEventListener('click', ()=>{
    if(t){ stop(); return; }
    if(left<=0) left = secs;
    bStart.textContent = '⏸ Tạm dừng';
    t = setInterval(()=>{
      left--;
      if(!document.body.contains(pill)){ stop(); return; } // part was closed
      pill.textContent = fmt(Math.max(0,left));
      if(left<=0){ stop(); pill.textContent = '⏰ Hết giờ!'; }
    }, 1000);
    _countdowns.push(()=>clearInterval(t));
  });
  bReset.addEventListener('click', ()=>{ stop(); left = secs; pill.textContent = fmt(left); });
}
function supportBoxHTML(){
  return `<div class="support-box">💚 <strong>Nếu bạn đang thấy căng thẳng:</strong> bạn không cô đơn. Sinh viên UNC có thể liên hệ <strong>UNC CAPS</strong> (Counseling and Psychological Services) — 919-966-3658, 24/7. Ở Mỹ, gọi hoặc nhắn tin <strong>988</strong> (Suicide &amp; Crisis Lifeline) bất cứ lúc nào.</div>`;

const CANDOS = [

];
const CANDO_LEGEND = `<strong>1</strong> = Tôi chưa làm được việc này. <em>(I cannot do this yet.)</em><br>
  <strong>2</strong> = Tôi có thể làm được nhưng cần nhiều sự giúp đỡ. <em>(I can do this with much help.)</em><br>
  <strong>3</strong> = Tôi có thể làm được với một chút giúp đỡ. <em>(I can do this with some help.)</em><br>
  <strong>4</strong> = Tôi có thể tự làm tốt việc này một mình. <em>(I can do this well by myself.)</em>`;
function renderCandos(host, keyPrefix, xpKey, compareKeyPrefix){
  host.innerHTML = `<div class="table-wrap">` + CANDOS.map((c,i)=>{
    const pre = compareKeyPrefix ? load(compareKeyPrefix+i, null) : null;
    const preLine = compareKeyPrefix ? `<br><span style="font-size:0.74rem;color:var(--flame2)">Lúc đầu module: ${pre!==null ? 'mức '+(pre+1) : 'chưa chọn'}</span>` : '';
    return `<div class="tf-row"><div class="tf-text">${c.vn}<br><span style="font-size:0.78rem;color:var(--text3)">${c.en}</span>${preLine}</div>
      <div class="tf-btns">${[1,2,3,4].map(n=>`<button class="tf-btn" data-v="${n-1}">${n}</button>`).join('')}</div></div>`;
  }).join('') + `</div>`;
  const check = ()=>{ if(CANDOS.every((_,i)=>load(keyPrefix+i,null)!==null)) awardXP(xpKey, 4); };
  host.querySelectorAll('.tf-row').forEach((row,i)=>{
    const paint = v=>row.querySelectorAll('.tf-btn').forEach(b=>b.classList.toggle('sel', parseInt(b.dataset.v,10)===v));
    const saved = load(keyPrefix+i, null);
    if(saved!==null) paint(saved);
    row.querySelectorAll('.tf-btn').forEach(b=>b.addEventListener('click', ()=>{
      const v = parseInt(b.dataset.v,10);
      save(keyPrefix+i, v); paint(v); check();
    }));
  });
  check();
}

function renderMiniReading(host, R, kp, xpKey, introNote){
  const posBtn = p=>`<button class="opt-btn ins-btn" data-pos="${p}">[${p}]</button>`;
  host.innerHTML = `
    <div class="block">
      <div class="block-title">📖 ${R.title}</div>
      <p class="instr">${introNote}</p>
      ${audioTtsBarHTML(safeId(kp)+'-tts', [])}
      <div class="reading-card no-copy">${R.para.map(p=>`<p>${p}</p>`).join('')}</div>
    </div>
    <div class="block"><div class="block-title">1️⃣ Đúng hay Sai?</div><div id="${safeId(kp)}-tf"></div></div>
    <div class="block"><div class="block-title">2️⃣ Chọn câu trả lời đúng</div><div id="${safeId(kp)}-mcq"></div></div>
    <div class="block">
      <div class="block-title">3️⃣ Chèn câu đúng vị trí</div>
      <p class="instr">Câu văn dưới đây phù hợp nhất ở vị trí nào: [A], [B] hay [C]?</p>
      <p style="font-style:italic;font-weight:600;margin-bottom:0.6rem">"${R.insert.target}"</p>
      <div class="reading-card no-copy ins-card">${R.insert.segs[0]} ${posBtn('A')} ${R.insert.segs[1]} ${posBtn('B')} ${R.insert.segs[2]} ${posBtn('C')} ${R.insert.segs[3]||''}</div>
      <div class="q-feedback" id="${safeId(kp)}-ins-fb"></div>
    </div>`;
  /* Recording key: p1sc-reading / wrapsc-reading (kp is 'p1sc:rd' / 'wrapsc:rd'). */
  registerAudioTtsTarget(safeId(kp)+'-tts', kp.split(':')[0]+'-reading', R.para.map(stripForTTS).join(' '));
  renderTF(document.getElementById(safeId(kp)+'-tf'), R.tf, kp+'-tf-', 0);
  renderMCQ(document.getElementById(safeId(kp)+'-mcq'), R.mcq, kp+'-mcq-', 0);
  const btns = host.querySelectorAll('.ins-btn'), fb = document.getElementById(safeId(kp)+'-ins-fb');
  const lock = chosen=>{
    btns.forEach(b=>{ b.disabled = true; if(b.dataset.pos===R.insert.ans) b.classList.add('correct'); else if(b.dataset.pos===chosen) b.classList.add('wrong'); });
    fb.textContent = chosen===R.insert.ans ? '✅ Chính xác!' : '❌ Chưa đúng — vị trí đúng đã tô xanh.';
    fb.style.color = chosen===R.insert.ans ? 'var(--leaf)' : 'var(--coral)';
  };
  const saved = load(kp+'-ins', null);
  if(saved) lock(saved);
  btns.forEach(b=>b.addEventListener('click', ()=>{ save(kp+'-ins', b.dataset.pos); lock(b.dataset.pos); }));
  const check = ()=>{
    const done = R.tf.every((_,i)=>load(kp+'-tf-'+i,null)!==null) && R.mcq.every((_,i)=>load(kp+'-mcq-'+i,null)!==null) && load(kp+'-ins',null)!==null;
    if(done) awardXP(xpKey, 6);
  };
  host.addEventListener('click', check);
  check();
}

/* Answer always listed first in the source table — shuffle each question's options
   once per student (persisted) so the correct choice isn't always (a). */
function shuffledMCQ(items, storageKey){
  let orders = load(storageKey, null);
  if(!orders || orders.length!==items.length){
    orders = items.map(it=>it.opts.map((_,i)=>i).sort(()=>Math.random()-0.5));
    save(storageKey, orders);
  }
  return items.map((it,qi)=>({q:it.q, opts:orders[qi].map(oi=>it.opts[oi]), ans:orders[qi].indexOf(it.ans)}));
}

/* ===================== SUPPORT EXPANSION (2026-10-11, 2nd pass) =====================
   Support parts rebuilt with M2's nested pattern (top tab → chip row of sub-activities)
   and 24 new activities, transcribed from Module-Source/04, 05, 06 ("MỞ RỘNG" sections).
   Every pre-existing activity keeps its original data/award keys, so progress carries over.
   Sub-tab chips use .subtab (not .mtab) so wireTabs()'s global .mtab handler can't
   strip their active state. */
function renderSubnav(host, navId, subtabs){
  host.innerHTML = `<div class="chip-row subnav" id="${navId}"></div>` + subtabs.map(t=>`<div id="mv-${t.id}"></div>`).join('');
  const nav = document.getElementById(navId);
  let active = load(navId+'::active', subtabs[0].id);
  if(!subtabs.some(t=>t.id===active)) active = subtabs[0].id;
  const show = ()=>{
    nav.innerHTML = subtabs.map(t=>`<button type="button" class="subtab${t.id===active?' active':''}" data-sub="${t.id}">${t.label}</button>`).join('');
    subtabs.forEach(t=>{ document.getElementById('mv-'+t.id).hidden = t.id!==active; });
    nav.querySelectorAll('button').forEach(b=>b.addEventListener('click', ()=>{ active = b.dataset.sub; save(navId+'::active', active); show(); }));
  };
  show();
}
function cmpNorm(s){ return normalizeVN(String(s||'')).replace(/[.,!?;:"“”]/g,'').replace(/\s+/g,' ').trim(); }
function renderTFAggregate(host, items, keyPrefix, xpKey, xpAmount){
  renderTF(host, items, keyPrefix, 0);
  const check = ()=>{ if(items.every((_,i)=>load(keyPrefix+i,null)!==null)) awardXP(xpKey, xpAmount); };
  host.addEventListener('click', check);
  check();
}
/* Type-and-check rows (dictation, diacritic restore, delayed copy): one input + check
   button per item; result 'ok' | 'near' (right letters, wrong/missing tone marks) | 'no'. */
function renderTypeCheck(host, items, keyPrefix, xpKey, xpAmount, rowHTML){
  host.innerHTML = items.map((it,i)=>`<div class="survey-q">${rowHTML(it,i)}
      <div style="display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap;margin-top:0.4rem">
        <input type="text" class="text-in" style="flex:1;min-width:200px" data-key="${keyPrefix}in${i}" placeholder="Gõ ở đây...">
        <button type="button" class="check-btn" style="margin-top:0" data-chk="${i}">Kiểm tra</button>
      </div><div class="q-feedback" id="${safeId(keyPrefix)}fb${i}"></div></div>`).join('') +
    `<div class="wc-row"><span>Đúng: <span class="n" id="${safeId(keyPrefix)}score">0</span> / ${items.length}</span></div>`;
  bindPersist(host);
  const paint = i=>{
    const r = load(keyPrefix+'res'+i, null), fb = document.getElementById(safeId(keyPrefix)+'fb'+i);
    if(!r){ fb.textContent=''; return; }
    const target = items[i].text || items[i];
    fb.innerHTML = r==='ok' ? '✅ Chính xác!' : (r==='near' ? `🟡 Gần đúng — kiểm tra lại dấu: <strong>${target}</strong>` : `❌ Đáp án: <strong>${target}</strong>`);
    fb.style.color = r==='ok' ? 'var(--leaf)' : (r==='near' ? '#b45309' : 'var(--coral)');
  };
  const score = ()=>{
    document.getElementById(safeId(keyPrefix)+'score').textContent = items.filter((_,i)=>load(keyPrefix+'res'+i,null)==='ok').length;
    if(items.every((_,i)=>load(keyPrefix+'res'+i,null)!==null)) awardXP(xpKey, xpAmount);
  };
  host.querySelectorAll('[data-chk]').forEach(b=>b.addEventListener('click', ()=>{
    const i = parseInt(b.dataset.chk,10), it = items[i], target = it.text || it;
    const guess = loadStr(keyPrefix+'in'+i);
    const ok = [target, ...(it.alt||[])].some(t=>cmpNorm(t)===cmpNorm(guess));
    const near = !ok && [target, ...(it.alt||[])].some(t=>stripDiacriticsVN(cmpNorm(t))===stripDiacriticsVN(cmpNorm(guess)));
    save(keyPrefix+'res'+i, ok?'ok':(near?'near':'no'));
    paint(i); score();
  }));
  items.forEach((_,i)=>paint(i));
  score();
}

   still decide credit (creditGrade), they just don't block the download. */
function hasReportName(){ return !!loadStr('report::name').trim(); }

  return missing;
}

function generateCode(score){
  const d = new Date(); const day=d.getDate(); const month=d.getMonth()+1;
  const seed = (score*31 + day*7 + month*13) % 4096;
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const c1 = chars[seed%32], c2 = chars[Math.floor(seed/32)%32], c3 = chars[(score*3+day+month)%32];
  return 'VS203M3-'+String(score).padStart(3,'0')+'-'+c1+c2+c3;
}

    const icon = {done:'✅',partial:'🔸',missing:'⭕'}[st];
    const cls  = {done:'cl-done',partial:'cl-partial',missing:'cl-missing'}[st];
    const goBtn = st!=='done' ? `<button class="cl-go-btn" onclick="openPart('${id}')">Đi tới →</button>` : '';
    return `<li class="${cls}"><span class="cl-icon">${icon}</span><span class="cl-text">${REPORT_PART_LABELS[id]}</span><span class="cl-xp">${earned} / ${max} XP</span>${goBtn}</li>`;
  }).join('');
}

/* ===================== PERSIST HELPER ===================== */
function bindPersist(scope){
  scope.querySelectorAll('input[data-key], textarea[data-key]').forEach(el=>{
    const saved = load(el.dataset.key, null);
    if(saved!==null){
      if(el.type==='checkbox') el.checked = saved===true || saved==='true';
      else el.value = saved;
    }
    const evt = el.type==='checkbox' ? 'change' : 'input';
    el.addEventListener(evt, ()=>{ save(el.dataset.key, el.type==='checkbox' ? el.checked : el.value); });
  });
}
