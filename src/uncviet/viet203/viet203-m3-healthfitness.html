<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sức Khỏe & Cân Bằng · VIET 203</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f8fafc;--surface:#ffffff;--surface2:#f1f5f9;--surface3:#e8eef4;
  --border:#e2e8f0;--border2:#cbd5e1;
  --text:#1e293b;--text2:#64748b;--text3:#94a3b8;
  --flame:#0d9488;--flame2:#0f766e;--fglow:rgba(13,148,136,0.12);
  --leaf:#15803d;--lbg:rgba(21,128,61,0.09);
  --coral:#e11d48;--cbg:rgba(225,29,72,0.09);
  --lotus:#a855f7;--lobg:rgba(168,85,247,0.09);
  --gold:#b45309;--gbg:rgba(234,179,8,0.14);
  --r:16px;--rs:10px;--rxs:6px;
}
html{font-size:16px;scroll-behavior:smooth}
body{font-family:'Lexend',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.65}
h1,h2,h3,.display{font-family:'Lexend',sans-serif;font-weight:700}
button{font-family:'Lexend',sans-serif;cursor:pointer}
input,textarea{font-family:'Lexend',sans-serif}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
a{color:var(--flame2)}
::selection{background:var(--fglow);color:var(--text)}

/* ---------- APP SHELL ---------- */
#app{display:flex;min-height:100vh}
#sidebar{width:264px;background:linear-gradient(180deg,#0f766e,#0c5f59);color:#fff;display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;overflow-y:auto;z-index:100;transition:transform 0.3s}
#main{margin-left:264px;flex:1;min-height:100vh;display:flex;flex-direction:column}
#content-area{flex:1}

.sidebar-header{padding:1.1rem 1.1rem 0.8rem}
.sidebar-logo{font-size:1.05rem;font-weight:800;display:flex;align-items:center;gap:0.5rem}
.sidebar-logo .logo-icon{font-size:1.35rem}
.sidebar-logo .logo-icon img{width:1.9rem;height:1.9rem;border-radius:50%;object-fit:cover;object-position:center;display:block;border:1.5px solid rgba(255,255,255,0.35);background:#fff}
.sidebar-sub{font-size:0.66rem;opacity:0.72;margin-top:0.25rem;letter-spacing:0.01em}

.sidebar-trau{margin:0 1.1rem 0.9rem;padding:0.7rem 0.8rem;border-radius:var(--rs);background:rgba(255,255,255,0.08);display:flex;align-items:center;gap:0.6rem;cursor:default}
.sidebar-trau .tc-emoji{font-size:1.55rem;line-height:1}
.sidebar-trau .tc-text{display:flex;flex-direction:column;line-height:1.35}
.sidebar-trau .tc-sub{font-size:0.62rem;opacity:0.78;font-weight:400}

.sidebar-progress{padding:0 1.1rem 0.9rem}
.sp-label{font-size:0.6rem;text-transform:uppercase;letter-spacing:0.07em;opacity:0.6;margin-bottom:0.4rem}
.sp-bar{height:7px;background:rgba(255,255,255,0.18);border-radius:4px;overflow:hidden}
.sp-fill{height:100%;background:linear-gradient(90deg,#fbbf24,#f59e0b);border-radius:4px;transition:width 0.5s}
.sp-text{font-size:0.66rem;margin-top:0.4rem;opacity:0.85}

.sidebar-nav{flex:1;padding:0.5rem 0;overflow-y:auto;border-top:1px solid rgba(255,255,255,0.13)}
.nav-group-label{font-size:0.6rem;font-weight:800;letter-spacing:0.07em;text-transform:uppercase;opacity:0.55;padding:0.7rem 1.1rem 0.3rem}
.nav-item{display:flex;align-items:center;gap:0.6rem;padding:0.6rem 1.1rem;cursor:pointer;font-size:0.82rem;transition:background 0.15s}
.nav-item:hover{background:rgba(255,255,255,0.08)}
.nav-item.active{background:rgba(255,255,255,0.16)}
.nav-item.core{border-left:3px solid #fbbf24}
.ni-icon{font-size:1rem;width:1.15rem;text-align:center;flex-shrink:0}
.ni-title{flex:1;font-weight:600;line-height:1.3}
.ni-meta{font-size:0.62rem;opacity:0.65;font-weight:400}
.ni-badge{font-size:0.62rem;font-weight:700;background:rgba(255,255,255,0.18);border-radius:10px;padding:2px 7px;flex-shrink:0;white-space:nowrap}
.ni-badge.done{background:#fff;color:#0f766e}

.sidebar-footer{padding:0.9rem 1.1rem 1.1rem;border-top:1px solid rgba(255,255,255,0.13);display:flex;flex-direction:column;gap:0.45rem}
.btn-report-sb{background:#fbbf24;color:#0f4c46;border:none;border-radius:var(--rs);padding:0.6rem;font-family:inherit;font-weight:800;font-size:0.8rem;cursor:pointer;transition:opacity 0.15s}
.btn-report-sb:hover{opacity:0.88}
.btn-reset-sb{background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.72);border:1px solid rgba(255,255,255,0.2);border-radius:var(--rs);padding:0.4rem;font-family:inherit;font-size:0.68rem;cursor:pointer;transition:all 0.15s}
.btn-reset-sb:hover{background:rgba(225,29,72,0.25);color:#fff;border-color:rgba(225,29,72,0.4)}

#topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 1.25rem;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:60}
.tag-athome,.tag-inclass{font-size:0.64rem;font-weight:700;letter-spacing:0.02em;border-radius:20px;padding:2px 9px;margin-left:0.5rem;vertical-align:middle;white-space:nowrap}
.tag-athome{background:var(--fglow);color:var(--flame2);border:1px solid var(--flame)}
.tag-inclass{background:var(--gbg);color:#b45309;border:1px solid var(--gold)}
#menu-toggle{display:none;background:none;border:none;font-size:1.3rem;cursor:pointer;color:var(--text);padding:0 0.3rem 0 0}
.tb-title{font-family:'Lora',serif;font-size:0.92rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-left{display:flex;align-items:center;gap:0.7rem;min-width:0}
.tb-badge{font-size:0.68rem;font-weight:700;padding:3px 10px;border-radius:20px;background:var(--fglow);color:var(--flame2);white-space:nowrap}

@media(max-width:860px){
  #sidebar{transform:translateX(-100%)}
  #sidebar.open{transform:translateX(0)}
  #main{margin-left:0}
  #menu-toggle{display:block}
}

/* ---------- CONFETTI ---------- */
.confetti-piece{position:fixed;width:9px;height:9px;border-radius:2px;animation:fall 1.7s ease-in forwards;pointer-events:none;z-index:9997}
@keyframes fall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(680deg);opacity:0}}

/* ---------- HOME ---------- */
.home-hero{padding:3.5rem 1.5rem 1.5rem;text-align:center;position:relative;overflow:hidden}
.home-hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 75% 50% at 50% -10%,rgba(13,148,136,0.14),transparent);pointer-events:none}
.home-kicker{font-size:0.72rem;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:var(--flame2);position:relative}
.home-title{font-family:'Lora',serif;font-weight:700;font-size:clamp(2.1rem,6vw,3.4rem);letter-spacing:-0.01em;margin-top:0.5rem;position:relative;text-wrap:balance}
.home-title em{font-style:italic;color:var(--flame)}
.home-sub{font-size:0.95rem;color:var(--text2);margin-top:0.6rem;max-width:560px;margin-left:auto;margin-right:auto;position:relative}
.home-body{max-width:920px;margin:0 auto;padding:0 1.25rem 3.5rem}

.field-strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:0.5rem;margin-bottom:0.4rem}
.field-tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);padding:0.65rem 0.3rem;text-align:center;transition:all 0.3s}
.field-tile.tilled{background:var(--lbg);border-color:var(--leaf)}
.ft-icon{font-size:1.3rem;display:block}
.ft-label{font-size:0.62rem;color:var(--text3);margin-top:2px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:520px){.field-strip{grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:0.3rem}.ft-icon{font-size:1.1rem}}

.strand-bar{display:flex;height:14px;border-radius:8px;overflow:hidden;background:var(--surface2);border:1px solid var(--border)}
.strand-bar div{transition:width 0.5s}
.strand-legend{display:flex;flex-wrap:wrap;gap:0.5rem 1.1rem;margin-top:0.7rem;font-size:0.76rem;color:var(--text2)}
.strand-leg-item{display:flex;align-items:center;gap:0.35rem}
.strand-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.strand-badge{font-size:0.6rem;font-weight:700;padding:1px 7px;border-radius:10px;white-space:nowrap;display:inline-block}

.harvest-panel{background:linear-gradient(135deg,#0f766e,#0d9488);color:#fff;text-align:center;border-radius:var(--r);padding:1.5rem}
.harvest-panel .hp-emoji{font-size:2.2rem}
.harvest-panel .hp-title{font-weight:700;margin-top:0.5rem;font-size:1.02rem}
.harvest-panel .hp-poem{font-size:0.8rem;opacity:0.85;font-style:italic;margin-top:0.5rem}
.harvest-panel .hp-note{font-size:0.84rem;margin-top:0.7rem}

.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:0.75rem;margin:1.75rem 0}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);padding:1rem;text-align:center}
.stat-card .n{font-variant-numeric:tabular-nums;font-size:1.6rem;font-weight:500;color:var(--flame2)}
.stat-card .l{font-size:0.66rem;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;margin-top:2px}

.sec-title{font-size:0.7rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--text3);margin:2rem 0 1rem;padding-bottom:0.6rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.reset-link{font-size:0.7rem;font-weight:500;letter-spacing:0.02em;text-transform:none;color:var(--text3);background:none;border:none;text-decoration:underline;text-underline-offset:2px}
.reset-link:hover{color:var(--coral)}

.parts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:0.9rem}
.pcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1.3rem;cursor:pointer;transition:all 0.18s;position:relative;overflow:hidden;text-align:left}
.pcard::after{content:'';position:absolute;inset:0;background:var(--fglow);opacity:0;transition:opacity 0.18s}
.pcard:hover{border-color:var(--flame);transform:translateY(-2px)}.pcard:hover::after{opacity:1}
.pc-num{font-variant-numeric:tabular-nums;font-size:0.7rem;font-weight:500;letter-spacing:0.08em;color:var(--flame2);margin-bottom:0.5rem;position:relative}
.pc-emoji{font-size:1.6rem;display:block;margin-bottom:0.5rem;position:relative}
.pc-title{font-family:'Lora',serif;font-size:1.05rem;font-weight:600;color:var(--text);line-height:1.3;position:relative}
/* Vietnamese sublabel under a card's English title (PARTS' optional `sub`, added
   2026-09-18) — italic serif so it reads as the same name in the other language, not as
   another line of metadata like .pc-meta below it. */
.pc-sub{font-family:'Lora',serif;font-style:italic;font-size:0.82rem;color:var(--text2);line-height:1.3;margin-top:0.1rem;position:relative}
.pc-meta{font-size:0.76rem;color:var(--text3);margin-top:0.4rem;position:relative}
.pc-bar{height:3px;background:var(--border);border-radius:2px;margin-top:0.85rem;overflow:hidden;position:relative}
.pc-fill{height:100%;background:var(--flame);border-radius:2px;transition:width 0.4s}

/* ---------- LESSON HEADER / NAV ---------- */
.lhdr{background:var(--surface);border-bottom:1px solid var(--border);padding:0.85rem 1.25rem;display:flex;align-items:center;gap:0.875rem;position:sticky;top:52px;z-index:55}
.back-btn{background:none;border:1px solid var(--border);color:var(--text2);border-radius:var(--rs);padding:0.4rem 0.9rem;font-size:0.8rem;transition:all 0.15s;white-space:nowrap}
.back-btn:hover{border-color:var(--flame);color:var(--flame2)}
.lhdr-title{font-family:'Lora',serif;font-size:0.98rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lhdr-tag{margin-left:auto;background:var(--fglow);border:1px solid var(--flame);color:var(--flame2);font-size:0.66rem;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;padding:3px 10px;border-radius:20px;white-space:nowrap;flex-shrink:0}

.mode-tabs{display:flex;gap:0.5rem;padding:1.1rem 1.25rem;max-width:900px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
.mode-tabs::-webkit-scrollbar{display:none}
.mtab{display:flex;align-items:center;gap:0.4rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);padding:0.5rem 1rem;font-size:0.8rem;font-weight:500;color:var(--text2);white-space:nowrap;transition:all 0.15s;flex-shrink:0}
.mtab:hover{border-color:var(--border2);color:var(--text)}
.mtab.active{background:var(--flame);border-color:var(--flame);color:#ffffff}
.lbody{max-width:900px;margin:0 auto;padding:0 1.25rem 4rem}
.mview{display:none}.mview.active{display:block}

/* ---------- SHARED CONTENT BLOCKS ---------- */
.block{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1.4rem;margin-bottom:1.1rem}
.block-title{font-family:'Lora',serif;font-size:1.1rem;font-weight:600;margin-bottom:0.4rem;display:flex;align-items:center;gap:0.5rem}
.block-sub{font-size:0.82rem;color:var(--text3);margin-bottom:1rem}
.meta-row{display:flex;gap:0.6rem;flex-wrap:wrap;font-size:0.72rem;color:var(--text3);margin-bottom:0.9rem}
.meta-row span{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:0.25rem 0.65rem}

.instr{background:var(--surface2);border-left:3px solid var(--flame);border-radius:var(--rxs);padding:0.8rem 1rem;font-size:0.86rem;color:var(--text2);font-style:italic;margin-bottom:1.1rem}
.tag-inperson{font-size:0.66rem;font-weight:700;letter-spacing:0.03em;background:var(--gbg);color:#b45309;border:1px solid var(--gold);border-radius:20px;padding:2px 10px;margin-left:0.6rem;vertical-align:middle}

.vocab-group{margin-bottom:1.1rem}
.vocab-group h4{font-size:0.72rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--text3);margin-bottom:0.6rem}
.chip-row{display:flex;flex-wrap:wrap;gap:0.5rem}
.vchip{background:var(--surface2);border:1px solid var(--border);border-radius:var(--rxs);padding:0.5rem 0.75rem;font-size:0.84rem;cursor:pointer;transition:all 0.15s}
.vchip:hover{border-color:var(--flame)}
.vchip .vn{font-weight:600}
.vchip .en{display:none;color:var(--flame2);font-style:italic;font-size:0.8rem;margin-top:2px}
.vchip.flip .en{display:block}
.vchip.flip .vn{color:var(--text3)}

.pattern-box{display:grid;gap:0.5rem}
.pattern-box p{font-size:0.88rem;padding:0.5rem 0.75rem;background:var(--surface2);border-radius:var(--rxs)}

.freewrite{width:100%;min-height:110px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);color:var(--text);padding:0.9rem;font-size:0.9rem;resize:vertical;line-height:1.6}
textarea.freewrite:focus{outline:none;border-color:var(--flame)}
.wc-row{display:flex;justify-content:space-between;align-items:center;margin-top:0.5rem;font-size:0.74rem;color:var(--text3)}
.wc-row .n{font-variant-numeric:tabular-nums;color:var(--flame2)}

.reading-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);padding:1.2rem;font-size:0.92rem;line-height:1.85}
.reading-card p{margin-bottom:0.85rem}
.reading-card p:last-child{margin-bottom:0}
.reading-card strong{color:var(--flame2)}
.reading-card .cite{font-size:0.78rem;color:var(--text3);font-style:italic;display:block;margin-bottom:0.6rem}

.vt{position:relative;border-bottom:2px dotted var(--flame);cursor:help;font-weight:700;color:var(--flame2);border-radius:2px;padding:0 1px}
.vt:hover,.vt:focus{background:var(--fglow)}
.vt-tip{visibility:hidden;opacity:0;position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#1e293b;color:#fbbf24;padding:5px 10px;border-radius:8px;font-size:0.74rem;font-weight:700;white-space:nowrap;pointer-events:none;z-index:120;transition:opacity 0.15s,visibility 0.15s;box-shadow:0 4px 14px rgba(0,0,0,0.28)}
.vt-tip::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:#1e293b}
.vt:hover .vt-tip,.vt:focus .vt-tip,.vt-tip.show{visibility:visible;opacity:1}

.tts-bar{display:flex;align-items:center;gap:0.6rem;flex-wrap:wrap;margin-bottom:0.9rem}
.btn-tts{display:flex;align-items:center;gap:0.4rem;padding:0.45rem 0.9rem;background:var(--flame);color:#fff;border:none;border-radius:20px;font-family:inherit;font-weight:700;font-size:0.78rem;cursor:pointer;transition:all 0.15s}
.btn-tts:hover{background:var(--flame2)}
.btn-tts.playing{background:var(--leaf)}
.tts-rate{padding:0.4rem 0.6rem;border:1px solid var(--border);border-radius:16px;font-family:inherit;font-size:0.74rem;background:var(--surface);cursor:pointer;color:var(--text)}
.tts-hint{font-size:0.72rem;color:var(--text3);font-style:italic}

.mini-story-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:0.6rem;margin-top:0.3rem}
.mini-story-tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);padding:0.85rem 0.7rem;text-align:left;transition:all 0.15s;cursor:pointer;font-family:inherit}
.mini-story-tile:hover{border-color:var(--flame);transform:translateY(-1px)}
.mini-story-tile.done{border-color:var(--leaf);background:var(--lbg)}
.mst-icon{font-size:1.2rem;display:block;margin-bottom:0.35rem}
.mst-title{font-size:0.82rem;font-weight:600;line-height:1.3;display:block;color:var(--text)}
.story-link-tag{background:var(--gbg);border-left:3px solid var(--gold);border-radius:0 var(--rxs) var(--rxs) 0;padding:0.5rem 0.8rem;font-size:0.78rem;color:var(--text2);margin-bottom:0.9rem}

.vocab-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.4rem}
.vocab-item{display:flex;gap:0.5rem;padding:0.4rem 0.6rem;border-radius:var(--rxs);background:var(--surface2);font-size:0.8rem}
.vocab-vn{font-weight:700;min-width:100px}
.vocab-en{color:var(--text3)}
.grammar-box{background:var(--gbg);border-left:4px solid var(--gold);padding:0.6rem 0.9rem;border-radius:0 var(--rxs) var(--rxs) 0;font-size:0.8rem;color:var(--text2);line-height:1.6}
@media(max-width:560px){.vocab-grid{grid-template-columns:1fr}}

.question-block{margin-bottom:1.1rem;padding-bottom:1.1rem;border-bottom:1px solid var(--border)}
.question-block:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.q-number{font-size:0.66rem;font-weight:800;text-transform:uppercase;letter-spacing:0.05em;color:var(--text3);margin-bottom:0.3rem}
.q-text{font-size:0.9rem;font-weight:600;margin-bottom:0.6rem;line-height:1.5}
.options{display:grid;gap:0.45rem}
.opt-btn{width:100%;text-align:left;padding:0.6rem 0.85rem;border:1.5px solid var(--border);border-radius:var(--rxs);background:var(--surface);font-family:inherit;font-size:0.84rem;cursor:pointer;transition:all 0.15s;color:var(--text)}
.opt-btn:hover:not(:disabled){border-color:var(--flame);background:var(--fglow)}
.opt-btn:disabled{cursor:default}
.opt-btn.correct{border-color:var(--leaf);background:var(--lbg);color:var(--leaf);font-weight:700}
.opt-btn.wrong{border-color:var(--coral);background:var(--cbg);color:var(--coral)}
.q-feedback{font-size:0.78rem;font-weight:700;margin-top:0.45rem;min-height:1em}

/* ---------- CHAT-STYLE DIALOGUE LOG (multi-turn listen-and-respond, added 2026-09-18
   for p1sc's "🎧 Nghe Hiểu" tab, 3rd activity — ported from Activities-Snippets/
   listen-do-tasks/gemini-code-1789741054497.html's .chat-box/.message pattern, recolored
   to this file's own theme variables instead of the snippet's hardcoded blue/green) ---- */
.chat-log{display:flex;flex-direction:column;gap:0.6rem;margin-bottom:1rem}
.chat-msg{padding:0.6rem 0.9rem;border-radius:var(--rxs);max-width:85%;font-size:0.88rem;line-height:1.5}
.chat-msg.server{background:var(--surface2);align-self:flex-start}
.chat-msg.user{background:var(--fglow);align-self:flex-end;text-align:right}

/* ---------- WORD-SORT (tap word → tap group), self-graded like an H5P drag-sort ----------
   Used by T1's "Kích Hoạt Từ Vựng — Phân Loại" (p2, added 2026-09-15). Tap a bank word to
   select it, then tap a group to place it — correct placements lock in green; a wrong
   placement flashes coral and returns the word to the bank instead of locking. */
.wsort-bank{display:flex;flex-wrap:wrap;gap:0.5rem;padding:0.9rem;background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);margin-bottom:0.9rem;min-height:2.6rem}
.wsort-word{padding:0.4rem 0.85rem;border:1.5px solid var(--border);border-radius:999px;background:var(--surface);font-family:inherit;font-size:0.84rem;cursor:pointer;transition:all 0.15s;color:var(--text)}
.wsort-word:hover{border-color:var(--flame);background:var(--fglow)}
.wsort-word.sel{border-color:var(--flame);background:var(--flame);color:#fff;font-weight:700}
.wsort-groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0.7rem}
.wsort-group{border:1.5px dashed var(--border);border-radius:var(--rs);padding:0.7rem;min-height:4rem;cursor:pointer;transition:all 0.15s}
.wsort-group:hover{border-color:var(--flame)}
.wsort-group.wsort-wrong-flash{border-color:var(--coral);background:var(--cbg)}
.wsort-group-title{font-weight:700;font-size:0.78rem;margin-bottom:0.5rem;color:var(--text2)}
.wsort-placed{display:inline-block;padding:0.3rem 0.65rem;border-radius:999px;font-size:0.78rem;margin:0.2rem 0.25rem 0 0;background:var(--lbg);color:var(--leaf);border:1px solid var(--leaf)}

/* ---------- MULTI-SELECT CHIP CHECK (tap-toggle chips → "Kiểm Tra" reveals colors) ----------
   Used by T1's "Nhìn Tranh, Đoán Nguyên Liệu" (p2, added 2026-09-15) — pick all correct
   ingredients from a mixed bank, self-graded on demand rather than instantly per-tap,
   since the target is a whole set, not one answer. */
.chipsel-row{display:flex;flex-wrap:wrap;gap:0.5rem;margin:0.6rem 0}
.chipsel{padding:0.45rem 0.85rem;border:1.5px solid var(--border);border-radius:999px;background:var(--surface);font-family:inherit;font-size:0.84rem;cursor:pointer;transition:all 0.15s;color:var(--text)}
.chipsel:hover:not(:disabled){border-color:var(--flame);background:var(--fglow)}
.chipsel.sel{border-color:var(--flame);background:var(--fglow);color:var(--flame2);font-weight:700}
.chipsel:disabled{cursor:default}
.chipsel.correct{border-color:var(--leaf);background:var(--lbg);color:var(--leaf);font-weight:700}
.chipsel.wrong{border-color:var(--coral);background:var(--cbg);color:var(--coral);font-weight:700}
.chipsel.missed{border-color:var(--leaf);background:transparent;color:var(--leaf);border-style:dashed}

/* ---------- STEP-SEQUENCE (tap ▲▼ to reorder, self-graded) ----------
   Used by T1's video-based step-recall task (added 2026-09-15, see renderStepSequence()). */
.seq-list{display:flex;flex-direction:column;gap:0.5rem;margin:0.7rem 0}
.seq-item{display:flex;align-items:center;gap:0.7rem;padding:0.6rem 0.8rem;border:1.5px solid var(--border);border-radius:var(--rxs);background:var(--surface);font-size:0.86rem;line-height:1.5}
.seq-item.correct{border-color:var(--leaf);background:var(--lbg)}
.seq-item.wrong{border-color:var(--coral);background:var(--cbg)}
.seq-num{font-weight:800;color:var(--flame2);min-width:1.4rem}
.seq-text{flex:1}
.seq-move{display:flex;flex-direction:column;gap:0.15rem}
.seq-move button{border:1px solid var(--border);background:var(--surface2);border-radius:4px;width:1.6rem;height:1.3rem;font-size:0.7rem;cursor:pointer;color:var(--text2);line-height:1;font-family:inherit}
.seq-move button:disabled{opacity:0.3;cursor:default}
.seq-move button:hover:not(:disabled){border-color:var(--flame);color:var(--flame2)}

/* ---------- RECIPE PICTURE CARDS (tap to open/close, added 2026-09-15) ----------
   Used by T1's "Chọn Công Thức Của Bạn" (p2) so students choose which recipe to read/view
   before its content appears, instead of both recipes dumped on screen at once. Image is a
   placeholder pattern until real dish photos are supplied. Cards toggle independently (not
   a single-select) so a solo learner can open both while an in-class pair can each open
   just their assigned one. */
.recipe-card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin-bottom:1rem}
.recipe-card{border:1.5px solid var(--border);border-radius:var(--rs);background:var(--surface);cursor:pointer;overflow:hidden;transition:all 0.15s;text-align:left;font-family:inherit;padding:0;display:block;width:100%}
.recipe-card:hover{border-color:var(--flame)}
.recipe-card.open{border-color:var(--flame);box-shadow:0 0 0 1px var(--flame)}
.recipe-card-img{aspect-ratio:4/3;background:repeating-linear-gradient(45deg,var(--surface2),var(--surface2) 12px,var(--surface3) 12px,var(--surface3) 24px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.3rem;font-size:2.2rem;color:var(--text3)}
.recipe-card-img .ph-label{font-size:0.66rem;text-transform:uppercase;letter-spacing:0.05em;font-weight:700}
.recipe-card-body{padding:0.8rem 0.9rem}
.recipe-card-name{font-weight:700;font-size:0.95rem;margin-bottom:0.25rem;color:var(--text)}
.recipe-card-cta{font-size:0.76rem;color:var(--text3)}
.recipe-card.open .recipe-card-cta{color:var(--flame2);font-weight:600}

/* ---------- WORD-BANK SENTENCE FILL (drag or tap word → tap blank) ----------
   Used by T1's Language Focus (added 2026-09-15, see renderWordBankFill()). Reuses
   .wsort-word/.wsort-bank (defined above) for the bank chips. */
.lf-sentence{padding:0.55rem 0;border-bottom:1px dashed var(--border);font-size:0.88rem;line-height:1.8}
.lf-sentence:last-child{border-bottom:none}
.lf-blank{display:inline-flex;align-items:center;justify-content:center;min-width:5.5rem;padding:0.2rem 0.6rem;margin:0 0.2rem;border:1.5px dashed var(--border2);border-radius:var(--rxs);background:var(--surface2);font-weight:600;color:var(--text3);cursor:pointer;transition:all 0.15s}
.lf-blank.dragover{border-color:var(--flame);background:var(--fglow)}
.lf-blank.filled{border-style:solid;cursor:pointer}
.lf-blank.correct{border-color:var(--leaf);background:var(--lbg);color:var(--leaf)}
.lf-blank.wrong-flash{border-color:var(--coral);background:var(--cbg);color:var(--coral)}

/* fill-in table */
.fill-table{width:100%;border-collapse:collapse}
.fill-table th{text-align:left;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--text3);padding:0.5rem 0.6rem;border-bottom:1px solid var(--border)}
.fill-table td{padding:0.65rem 0.6rem;border-bottom:1px solid var(--border);font-size:0.86rem;vertical-align:top}
.fill-table tr:last-child td{border-bottom:none}
.fill-table input.blank,.fill-table textarea.blank{background:var(--surface3);border:1px solid var(--border2);border-radius:var(--rxs);padding:0.3rem 0.5rem;color:var(--text);font-size:0.84rem;width:100%}
.fill-table input.blank:focus,.fill-table textarea.blank:focus{outline:none;border-color:var(--flame)}
.table-wrap{overflow-x:auto}

/* true/false */
.tf-row{display:flex;align-items:center;gap:0.9rem;padding:0.75rem 0;border-bottom:1px solid var(--border)}
.tf-row:last-child{border-bottom:none}
.tf-text{flex:1;font-size:0.88rem}
.tf-btns{display:flex;gap:0.4rem;flex-shrink:0}
.tf-btn{width:42px;height:36px;border-radius:var(--rxs);border:1px solid var(--border);background:var(--surface2);color:var(--text2);font-weight:700;font-size:0.8rem;transition:all 0.15s}
.tf-btn:hover{border-color:var(--border2)}
.tf-btn.correct{background:var(--lbg);border-color:var(--leaf);color:var(--leaf)}
.tf-btn.wrong{background:var(--cbg);border-color:var(--coral);color:var(--coral)}
.tf-btn.sel{background:var(--fglow);border-color:var(--flame);color:var(--flame2)}
.tf-btn:disabled{cursor:default;opacity:0.9}
.check-btn{margin-top:1rem;background:var(--flame);color:#ffffff;border:none;border-radius:var(--rs);padding:0.6rem 1.2rem;font-size:0.84rem;font-weight:700}
.check-btn:hover{background:var(--flame2)}
.check-btn.secondary{background:var(--surface2);color:var(--text2);border:1px solid var(--border)}
.check-btn.secondary:hover{border-color:var(--border2)}

/* generic checklist / honor-check */
.ck-row{display:flex;align-items:center;gap:0.7rem;padding:0.6rem 0;border-bottom:1px solid var(--border)}
.ck-row:last-child{border-bottom:none}
.ck-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--flame);flex-shrink:0}
.ck-row label{font-size:0.88rem;cursor:pointer}
.honor-box{background:var(--gbg);border:1px solid var(--gold);border-radius:var(--rs);padding:0.9rem 1rem;margin-top:0.7rem}
.honor-box label{font-weight:700;font-size:0.88rem;cursor:pointer;color:#78350f}

.pair-table{width:100%;border-collapse:collapse}
.pair-table th{text-align:left;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--text3);padding:0.5rem 0.6rem;border-bottom:1px solid var(--border)}
.pair-table td{padding:0.5rem 0.6rem;border-bottom:1px solid var(--border);vertical-align:top}
.pair-table tr:last-child td{border-bottom:none}
.pair-table input{background:var(--surface3);border:1px solid var(--border2);border-radius:var(--rxs);padding:0.4rem 0.55rem;color:var(--text);font-size:0.84rem;width:100%}
.pair-table input:focus{outline:none;border-color:var(--flame)}

.link-btn{display:inline-flex;align-items:center;gap:0.5rem;background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);padding:0.6rem 1rem;font-size:0.86rem;color:var(--text);text-decoration:none;transition:all 0.15s}
.link-btn:hover{border-color:var(--flame);color:var(--flame2)}

.rubric-table{width:100%;border-collapse:collapse;font-size:0.82rem}
.rubric-table th{background:var(--surface2);text-align:left;padding:0.6rem 0.7rem;border:1px solid var(--border);font-size:0.72rem;text-transform:uppercase;letter-spacing:0.04em;color:var(--text3)}
.rubric-table td{padding:0.7rem;border:1px solid var(--border);vertical-align:top;line-height:1.5}
.rubric-table td:first-child{font-weight:700;color:var(--flame2)}

.gloss-search{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);padding:0.7rem 1rem;color:var(--text);font-size:0.9rem;margin-bottom:1.2rem}
.gloss-search:focus{outline:none;border-color:var(--flame)}
.gloss-cat{margin-bottom:1.3rem}
.gloss-cat h4{font-size:0.72rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--gold);margin-bottom:0.6rem;padding-bottom:0.4rem;border-bottom:1px solid var(--border)}
.gterm{display:flex;justify-content:space-between;gap:1rem;padding:0.5rem 0;border-bottom:1px dashed var(--border);font-size:0.86rem}
.gterm:last-child{border-bottom:none}
.gterm .vn{font-weight:600}
.gterm .en{color:var(--text3);font-style:italic;text-align:right}
.gterm.hide{display:none}

/* GAMIFICATION: XP HEADER */
.xp-header{background:linear-gradient(135deg,#0f766e,#0d9488);color:#fff;padding:0.85rem 1.25rem;position:sticky;top:0;z-index:200;box-shadow:0 2px 10px rgba(15,118,110,0.25)}
.pcard.done{border-color:var(--leaf)}
.pc-done-badge{position:absolute;top:0.9rem;right:0.9rem;background:var(--lbg);color:var(--leaf);border:1px solid var(--leaf);font-size:0.66rem;font-weight:700;padding:2px 9px;border-radius:20px}
.pc-required-badge{position:absolute;top:0.9rem;right:0.9rem;background:var(--gbg);color:#b45309;border:1px solid var(--gold);font-size:0.66rem;font-weight:700;padding:2px 9px;border-radius:20px}
.pcard.core{border-width:2px}

#xp-pop{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%) scale(0);background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;padding:0.65rem 1.5rem;border-radius:30px;font-size:1.15rem;font-weight:800;z-index:9999;pointer-events:none;white-space:nowrap;transition:transform 0.22s,top 0.45s;letter-spacing:0.03em;box-shadow:0 8px 24px rgba(217,119,6,0.35)}
#xp-pop.show{transform:translate(-50%,-50%) scale(1);top:32%}
#milestone-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);background:linear-gradient(135deg,#0f766e,#0d9488);color:#fff;padding:0.9rem 1.75rem;border-radius:16px;font-size:0.92rem;font-weight:700;z-index:9998;pointer-events:none;transition:transform 0.4s cubic-bezier(.34,1.56,.64,1),opacity 0.5s;opacity:0;text-align:center;box-shadow:0 8px 28px rgba(0,0,0,0.22);min-width:200px}
#milestone-toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#milestone-toast .mt-emoji{font-size:1.6rem;display:block;margin-bottom:0.2rem}
#milestone-toast .mt-sub{font-size:0.7rem;opacity:0.85;font-weight:400;margin-top:0.2rem}

.credit-req-row{display:flex;align-items:center;gap:0.6rem;padding:0.5rem 0;border-bottom:1px solid var(--border);font-size:0.86rem}
.credit-req-row:last-child{border-bottom:none}
.credit-req-icon{font-size:1.1rem;flex-shrink:0}
.credit-grade-badge{display:inline-flex;align-items:center;gap:0.5rem;font-weight:800;font-size:1.1rem;padding:0.4rem 1rem;border-radius:20px;margin-top:0.8rem}

/* COMPLETION REPORT */
.report-name-row{display:flex;gap:0.6rem;flex-wrap:wrap;align-items:center;margin-bottom:1rem}
.report-name-row input{flex:1;min-width:200px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);padding:0.6rem 0.9rem;color:var(--text);font-size:0.9rem}
.report-name-row input:focus{outline:none;border-color:var(--flame)}
/* 2026-10-12: report is no longer locked — the name is the only requirement, so it gets a
   highlighted box at the top (gold while empty, green once filled), plus a "download often" bar. */
.report-name-box{border:2px solid var(--gold);background:var(--gbg);border-radius:var(--r);padding:0.9rem 1rem 0.4rem;margin-bottom:1rem;transition:border-color .2s,background .2s}
.report-name-box.filled{border-color:var(--leaf);background:var(--lbg)}
.report-name-box.flash{animation:nameFlash .5s ease 3}
@keyframes nameFlash{50%{box-shadow:0 0 0 6px var(--gbg)}}
.report-name-label{display:block;font-weight:800;font-size:0.95rem;color:var(--text);margin-bottom:0.5rem}
.report-name-box .report-name-row{margin-bottom:0.5rem}
.report-name-box .report-name-row input{font-size:1rem;font-weight:600;background:var(--surface)}
.report-name-hint{font-size:0.8rem;color:var(--text2);margin-bottom:0.5rem}
.report-dl-bar{display:flex;flex-wrap:wrap;gap:0.6rem;align-items:center;border-top:1px dashed var(--border);padding:0.7rem 0 0.5rem}
.report-dl-bar .check-btn{margin-top:0}
.report-dl-bar .check-btn:disabled{opacity:0.5;cursor:not-allowed}
.report-dl-note{font-size:0.8rem;color:var(--text2);flex-basis:100%}
.checklist{list-style:none;display:flex;flex-direction:column;gap:0.5rem}
.checklist li{display:flex;align-items:center;gap:0.7rem;font-size:0.86rem;padding:0.65rem 0.9rem;border-radius:var(--rxs);border:1.5px solid var(--border);background:var(--surface2);flex-wrap:wrap}
.checklist li.cl-done{background:var(--lbg);border-color:var(--leaf);color:var(--leaf)}
.checklist li.cl-partial{background:var(--gbg);border-color:var(--gold);color:var(--gold)}
.checklist li.cl-missing{background:var(--surface2);border-color:var(--border);color:var(--text2)}
.cl-icon{font-size:1rem;flex-shrink:0}
.cl-text{flex:1;font-weight:600;color:var(--text)}
.cl-xp{font-size:0.72rem;font-weight:700;opacity:0.85;white-space:nowrap}
.cl-go-btn{font-size:0.72rem;padding:0.25rem 0.7rem;border:1.5px solid currentColor;border-radius:6px;cursor:pointer;background:transparent;color:inherit;font-weight:700;font-family:inherit;opacity:0.85;transition:opacity 0.2s;white-space:nowrap;flex-shrink:0}
.cl-go-btn:hover{opacity:1}
.reflect-counter{font-size:0.74rem;color:var(--text3)}
.reflect-counter.ok{color:var(--leaf);font-weight:700}
.code-box{background:linear-gradient(135deg,#0f766e,#0d9488);border-radius:var(--r);padding:1.4rem 1.6rem;text-align:center;margin:1rem 0}
.code-label{font-size:0.68rem;font-weight:700;letter-spacing:0.1em;color:rgba(255,255,255,0.75);text-transform:uppercase;margin-bottom:0.6rem}
.code-value{font-size:1.6rem;font-weight:800;color:#fff;letter-spacing:0.2em;font-family:'Lexend',monospace;margin-bottom:0.8rem;word-break:break-all}
.code-locked{background:var(--surface2);border:2px dashed var(--border);border-radius:var(--r);padding:1.2rem 1.4rem;color:var(--text2);font-size:0.86rem;line-height:1.7}
.code-locked strong{color:var(--text)}
.code-locked ul{margin:0.6rem 0 0 1.1rem}
.report-actions{display:flex;gap:0.6rem;flex-wrap:wrap;margin-top:1rem}
.sentence-box{background:var(--gbg);border:1px solid var(--gold);border-left:4px solid var(--gold);border-radius:0 var(--rxs) var(--rxs) 0;padding:0.75rem 1rem;font-size:0.85rem;line-height:1.65;color:var(--text)}

/* ---------- NEW M4 WIDGETS: sprint/dictation/ribbon/diacritic/c-test ---------- */
.sprint-card{background:linear-gradient(135deg,#faf5ff,#f3e8ff);border:1px solid #e9d5ff;border-radius:var(--r);padding:1.4rem;text-align:center}
.sprint-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.9rem}
.timer-pill{font-size:1rem;font-weight:800;padding:4px 12px;border-radius:20px;background:var(--cbg);color:var(--coral);font-variant-numeric:tabular-nums}
.sprint-prompt{background:var(--surface);border:2px solid var(--border);border-radius:var(--rs);padding:1.1rem;margin-bottom:1rem;font-size:1.3rem;font-weight:700;min-height:2rem}
.sprint-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.6rem;margin-bottom:0.9rem}
@media(max-width:520px){.sprint-grid{grid-template-columns:1fr}}
.time-rail{width:100%;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;margin-bottom:1rem}
.time-gauge{height:100%;width:100%;background:var(--coral);transition:width 0.05s linear}
.dict-input{width:80%;max-width:320px;padding:0.7rem 1rem;font-size:1.1rem;font-weight:600;text-align:center;border:2px solid var(--border);border-radius:var(--rs);outline:none}
.dict-input:focus{border-color:var(--flame)}
.dict-input.correct{border-color:var(--leaf);background:var(--lbg);color:var(--leaf)}
.dict-input.missed{border-color:var(--coral);background:var(--cbg);color:var(--coral)}
.vanish-box{min-height:90px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;padding:1.1rem;background:var(--surface2);border-radius:var(--rs);border:1px solid var(--border);margin-bottom:1rem}
.vanish-word{font-size:1.3rem;font-weight:700;color:var(--text)}
.vanish-word.gone{color:transparent;border-bottom:2px solid var(--border2);user-select:none;min-width:40px}
.ribbon-stage{position:relative;width:100%;height:120px;background:#0f172a;border-radius:var(--rs);overflow:hidden;margin-bottom:1rem}
.ribbon-gate{position:absolute;left:25%;top:0;bottom:0;width:2px;background:#38bdf8;box-shadow:0 0 10px #38bdf8;z-index:10}
.ribbon-gate-lbl{position:absolute;top:8px;left:calc(25% + 6px);color:#38bdf8;font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;z-index:10}
.ribbon-track{position:absolute;top:0;left:0;height:100%;display:flex;align-items:center;will-change:transform}
.ribbon-node{display:inline-flex;align-items:center;margin-right:110px;padding:0.6rem 1.1rem;background:#1e293b;border:1.5px solid #334155;border-radius:var(--rxs);color:#f8fafc;font-size:1.15rem;font-weight:600;white-space:nowrap;transition:border-color 0.2s,background-color 0.2s}
.ribbon-node.hi{border-color:#38bdf8;background:#0c4a6e;box-shadow:0 0 12px rgba(56,189,248,0.4)}
.ctest-passage{font-size:1.02rem;line-height:2.3}
.ctest-in{border:none;border-bottom:2px solid var(--border2);outline:none;font-family:inherit;font-size:0.98rem;text-align:center;padding:0 2px;background:transparent;width:44px}
.ctest-in:focus{border-bottom-color:var(--flame);background:var(--fglow)}
.ctest-in.correct{border-bottom-color:var(--leaf);color:var(--leaf);font-weight:700}
.ctest-in.incorrect{border-bottom-color:var(--coral);background:var(--cbg)}
.unscramble-bank{display:flex;flex-wrap:wrap;gap:0.5rem;margin-bottom:0.7rem;min-height:2.4rem;padding:0.6rem;background:var(--surface2);border-radius:var(--rxs)}
.unscramble-slot{display:flex;flex-wrap:wrap;gap:0.5rem;margin-bottom:0.9rem;min-height:2.4rem;padding:0.6rem;background:var(--fglow);border:1.5px dashed var(--flame);border-radius:var(--rxs)}
.uw-chip{background:var(--surface);border:1px solid var(--border2);border-radius:20px;padding:0.4rem 0.8rem;font-size:0.85rem;font-weight:600;cursor:pointer}
.uw-chip:hover{border-color:var(--flame)}

.mem-card .mem-face{display:none;font-size:1.35rem;font-weight:700;line-height:1.2;word-break:break-word}
.mem-card.face-up{background:var(--fglow);border-color:var(--flame)}

   No sentence-reorder component existed in this file before (tap-to-match already covers

.reorder-btn:hover:not(:disabled){border-color:var(--flame);background:var(--fglow)}

.integrity-toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-12px);background:var(--flame2);color:#fff;font-size:0.82rem;font-weight:600;padding:0.6rem 1.1rem;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,0.18);z-index:9999;opacity:0;pointer-events:none;transition:opacity 0.25s,transform 0.25s}

.no-copy{-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none}
.no-copy::selection,.no-copy *::selection{background:transparent}

/* ---------- FILL-IN-BLANK REFERENCE ROWS (Language Focus / Dietary fill-ins) ----------

<script>
/* ===================== FOUR STRANDS (Paul Nation) ===================== */
const STRANDS = {
  input:   {vn:'Tiếp Nhận Ý Nghĩa',       en:'Meaning-Focused Input',     emoji:'📥', color:'#0d9488'},

/* ===================== DATA MODEL =====================
   Bài 3 — Sức Khỏe & Cân Bằng Cuộc Sống (Health & Fitness), built 2026-10-11 from
   the three M6 worksheets (M6_T1/T2/T3) in this folder, using the same shell/engine as
   viet203-m2-foodsdrinks.html. Content source of truth: Module-Source/*.md — this file
   is a transcription of those files (edit the MD first, then this HTML).
   Same Dashboard layout as M2: Khởi Động (p1, p1sc) → 3 CORE (p2/p3/p5 = T1/T2/T3)
   → 3 SUPPORT (fb, gl, pextra) → Tổng Kết (wrapsc, wraprefl); `report` is the pinned
   sidebar button only. Part ids deliberately match M2's so the shared engine code
   (credit panel, report, dispatch) carries over unchanged. */
const PARTS = [
  {id:'p1', num:'Khởi động', emoji:'💪', title:'Thói Quen Sức Khỏe', meta:'Gọi Tên Thói Quen · Lành Mạnh Hay Không? · Khảo Sát Sức Khỏe Lớp Học', tag:'Lead-in', strand:'output', warmup:true, where:'home'},
  {id:'p1sc', num:'Khởi động', emoji:'✅', title:'Self-Assessment (PRE)', meta:'Thang tự đánh giá 4 mức + Đọc Hiểu (Sinh Viên Và Giấc Ngủ)', tag:'Diagnostic', strand:'output', warmup:true, where:'home'},
  {id:'p2', num:'T1', emoji:'📖', title:'Áp Lực & Cảm Xúc', meta:'Đọc bài báo về trầm cảm ở giới trẻ · Ghi nhớ & tóm tắt · Nghe hội thoại · Ghi chép thông tin 3 bệnh nhân', tag:'Interpretive', strand:'input', core:'T1', where:'mixed'},
  {id:'p3', num:'T2', emoji:'⚖️', title:'Cân Bằng Công Việc & Cuộc Sống', meta:'Tìm người mà... · Thiết kế mô hình cân bằng · Poster · Phỏng vấn du học sinh', tag:'Interpersonal', strand:'output', core:'T2', where:'mixed'},
  {id:'p5', num:'T3', emoji:'🏃', title:'Vận Động Nhiều, Ngồi Ít', meta:'Viết chuyên mục lời khuyên cho Gen Z · Nhận xét 3-2-1 · Nghe hiểu · Thư động viên', tag:'Presentational', strand:'output', core:'T3', where:'mixed'},
  {id:'fb', num:'Hỗ trợ', emoji:'⚡', title:'Fluency Boost', sub:'Trạm Phản Xạ', meta:'📚 Thư Viện (Truyện Vui · Đọc Thêm) · 🎙️ Mở Lời (4/3/2 · Nhại Giọng · Ghép Cụm Từ · Tháp Câu · Kịch Bản Mờ Dần) · ⌨️ Chắp Bút (Viết Tự Do · Viết Lại Nhanh · Mở Rộng Câu · Viết 4/3/2 · Dictogloss · Viết Tiếp Sức) · ⚡ Luyện Tốc Độ (Sprint · Chính Tả Nhanh)', tag:'Fluency Boost', strand:'fluency', where:'home'},
  {id:'gl', num:'Hỗ trợ', emoji:'🔍', title:'Language Lab', sub:'Phòng Học Tiếng', meta:'📖 Từ Vựng (Thẻ & Quiz · Triệu Chứng & Đi Khám · Điền Từ Theo Ngữ Cảnh · Chọn Từ Viết Đúng) · 📐 Ngữ Pháp (Sắp Xếp Từ · Khiến cho/Dẫn đến · Đủ/Thiếu/Thừa · Miễn Là · Bảng Mẫu Câu · Xếp Vế Câu · Trang Trọng/Thân Mật) · 🗣️ Phát Âm & Phương Ngữ (Phân Biệt Cặp Từ · Bắc ↔ Nam) · ✍️ Chính Tả (C-Test · Phục Hồi Dấu · Sao Chép Trì Hoãn)', tag:'Language Lab', strand:'language', where:'home'},
  {id:'pextra', num:'Hỗ trợ', emoji:'🌟', title:'Culture Bag', sub:'Túi Văn Hoá', meta:'🎮 Trò Chơi & Đố Vui (H5P · Đố Vui Văn Hóa · Bạn Xả Stress Kiểu Gì? · Đố Bạn · Bạn Có Biết?) · 🏮 Văn Hóa & Ngôn Ngữ (3 Ghi Chú · So Sánh · Thành Ngữ · Hỏi Thăm & Ngoại Hình · Đi Khám Bệnh · Tiếng Lóng Gen Z)', tag:'Enrichment', strand:'output', where:'home'},
  {id:'report', num:'Nộp bài', emoji:'🏆', title:'Báo Cáo Hoàn Thành', meta:'XP · Checklist · Tải nộp qua Canvas', tag:'Report', where:'home'},
  {id:'wrapsc', num:'Tổng kết', emoji:'✅', title:'Self-Assessment (POST)', meta:'Thang tự đánh giá 4 mức, đối chiếu với Khởi Động + Đọc Hiểu (Chuyên Mục "Sống Khỏe")', tag:'Self-Check', strand:'output', submit:true, where:'home'},
  {id:'wraprefl', num:'Tổng kết', emoji:'✍️', title:'Suy Ngẫm Của Bạn', meta:'Hoạt động thú vị/khó nhất · Thói quen bạn muốn thay đổi', tag:'Self-Reflection', strand:'output', submit:true, where:'home'},
];

/* Per-activity breakdown lives in each Module-Source file's "Tổng XP" table.
   Core (p2+p3+p5) = 185 · Support (fb+gl+pextra) = 77 · Khởi Động + Tổng Kết = 37.
   Total 299. Core/(Core+Support) = 185/262 ≈ 70.6% (first build; see the 2nd-pass note below) — set deliberately core-heavy
   per the build pattern's "core tasks collectively weighted heavier than combined
   support" rule (M2 drifted below 50% over many revisions; M3 starts from the rule). */
const PART_MAX_XP = {p1:14, p1sc:10, p2:57, p3:63, p5:65, fb:76, gl:60, pextra:36, wrapsc:10, wraprefl:3};
/* 2026-10-11 (2nd pass): Support expanded with 24 new activities modeled on M2's support
   activity types — fb 31→71, gl 27→60, pextra 19→36. Total 299→389. Core/(Core+Support) =
   185/352 ≈ 52.6% — core still the majority, reported as-is.
   2026-10-11 (3rd pass): Truyện Vui replaced by the 10-story STORY_BANK (M2 format) — the 4
   multiple-choice stories' fb:story-0..3 (8 XP) retired; fb:story-item-1..10 (1 each) +
   fb:story-bonus (3) = 13 XP. fb 71→76, total 389→394, core share 185/357 ≈ 51.8%. */

const CORE_IDS = PARTS.filter(p=>p.core).map(p=>p.id);
const CREDIT_FLOOR_PCT = 70;
const TOTAL_MAX_XP = Object.values(PART_MAX_XP).reduce((a,b)=>a+b,0);
const XP_PART_COUNT = Object.keys(PART_MAX_XP).length;
function isPartDone(id){ return partXP(id) >= PART_MAX_XP[id]; }

/* Con trâu companion — shared across ALL VIET 203 modules (same NS_TRAU key,
   same origin). COURSE_XP_ESTIMATE / TRAU_STAGES kept identical to M1 so the
   same buffalo continues its arc; still provisional until M2/M3/M5 exist. */
const COURSE_XP_ESTIMATE = 800;
const TRAU_STAGES = [
  {min:0,    emoji:'🐮', label:'Nghé Con',      sub:'mới bắt đầu, chưa quen việc đồng áng'},
  {min:0.10, emoji:'🐃', label:'Trâu Tơ',        sub:'đã quen việc, đang lấy đà'},
  {min:0.45, emoji:'🐃', label:'Trâu Đầu Đàn',   sub:'bền bỉ, dẫn đầu cả đàn'},
];

/* ===================== STORAGE ===================== */
const NS = 'viet203-m3::';
const NS_TRAU = 'viet203-trau::v1';
function save(key,val){ localStorage.setItem(NS+key, typeof val==='string'?val:JSON.stringify(val)); }
function load(key,fallback){ const v=localStorage.getItem(NS+key); if(v===null) return fallback; try{return JSON.parse(v);}catch(e){return v;} }
function saveRaw(key,val){ localStorage.setItem(key, typeof val==='string'?val:JSON.stringify(val)); }
function loadRaw(key,fallback){ const v=localStorage.getItem(key); if(v===null) return fallback; try{return JSON.parse(v);}catch(e){return v;} }
function trackedKeysWithPrefix(prefix){ return Object.keys(localStorage).filter(k=>k.startsWith(NS+prefix)); }

/* ===================== ACADEMIC INTEGRITY (non-gating) =====================
   Ported from ipa-203-a.html's exam tool. This is a SELF-PACED PRACTICE module,
   not a timed exam — there is NO pledge checkbox and nothing is blocked from
   being submitted. The logging exists to (a) gently discourage pasting answers
   from an outside source into free-response fields, and (b) give the student
   (and instructor, via the completion report) a transparent, honest record of
   how the session went — never a punitive score. Flags are persisted to
   localStorage (small JSON, unlike audio blobs) so they survive a reload and
   show up correctly in the report. */
function flagIntegrity(type, detail){
  const flags = load('integrity::flags', []);
  flags.push({type, at:new Date().toISOString(), detail:detail||'', view:currentView});
  save('integrity::flags', flags);
  if(type==='paste_blocked'||type==='drop_blocked') save('integrity::pasteAttempts', load('integrity::pasteAttempts',0)+1);
  showIntegrityToast(type);
}
function showIntegrityToast(type){
  const msgs = {
    paste_blocked:'⚠ Dán văn bản đã bị chặn ở ô này.',
    drop_blocked:'⚠ Kéo-thả văn bản đã bị chặn ở ô này.',
    devtools_shortcut:'ℹ Đã ghi nhận thao tác phím tắt.',
  };
  let el = document.getElementById('integrity-toast');
  if(!el){
    el = document.createElement('div');
    el.id = 'integrity-toast'; el.className = 'integrity-toast';
    document.body.appendChild(el);
  }
  el.textContent = msgs[type] || 'ℹ Hoạt động đã được ghi nhận.';
  el.classList.add('show');
  clearTimeout(window._integrityToastT);
  window._integrityToastT = setTimeout(()=>el.classList.remove('show'), 2600);
}
function blockPaste(e){ e.preventDefault(); flagIntegrity('paste_blocked'); return false; }
function blockDrop(e){ e.preventDefault(); flagIntegrity('drop_blocked'); return false; }
/* Delegated (capture-phase) listeners cover every textarea/text-input in the
   module, including ones rendered later by initP1/initP2/.../initReport —
   no need to wire blockPaste/blockDrop onto each element individually. */
document.addEventListener('paste', function(e){
  const t = e.target;
  if(t && (t.tagName==='TEXTAREA' || (t.tagName==='INPUT' && (t.type==='text'||t.type===undefined)))) blockPaste(e);
}, true);
document.addEventListener('drop', function(e){
  const t = e.target;
  if(t && (t.tagName==='TEXTAREA' || (t.tagName==='INPUT' && (t.type==='text'||t.type===undefined)))) blockDrop(e);
}, true);
/* Devtools / right-click detection is scoped to when a graded or text-entry
   part is actually open (currentView is a part id, not 'home' or 'report')
   so it never fires on the dashboard or while just browsing the report.
   Tab-switch detection was removed by request (2026-09-14) — switching tabs
   (e.g. to look up a word) is no longer flagged or recorded at all. */
function integrityActive(){ return typeof currentView!=='undefined' && currentView && currentView!=='home' && currentView!=='report'; }
document.addEventListener('keydown', function(e){
  if(!integrityActive()) return;
  const k = (e.key||'').toLowerCase();
  const blockCombo = (e.ctrlKey||e.metaKey) && (k==='p' || k==='u' || (e.shiftKey && ['i','j','c'].includes(k)));
  if(blockCombo || k==='f12'){ e.preventDefault(); flagIntegrity('devtools_shortcut', e.key); }
});
document.addEventListener('contextmenu', function(e){
  if(integrityActive()) e.preventDefault();
});
/* Anti-copy: block the copy event specifically inside .no-copy passage blocks
   (reading-card / ctest-passage). Typing/select-all in textareas is untouched. */
document.addEventListener('copy', function(e){
  const sel = window.getSelection();
  if(!sel || sel.isCollapsed) return;
  let node = sel.anchorNode;
  while(node){
    if(node.classList && node.classList.contains('no-copy')){ e.preventDefault(); return; }
    node = node.parentElement;
  }
});

/* ===================== CON TRÂU COMPANION ===================== */
function trauLoad(){ return loadRaw(NS_TRAU, {xp:0, last:0, fired:[]}); }
function trauSave(s){ saveRaw(NS_TRAU, s); }
function trauStage(xp){
  let st = TRAU_STAGES[0];
  const frac = xp/COURSE_XP_ESTIMATE;
  TRAU_STAGES.forEach(s=>{ if(frac>=s.min) st=s; });
  return st;
}
function trauCondition(lastTs){
  if(!lastTs) return {emoji:'😴', label:'đang chờ bạn'};
  const days = (Date.now()-lastTs)/86400000;
  return days<=3 ? {emoji:'💪', label:'đang hăng hái'} : {emoji:'😴', label:'đang nghỉ ngơi'};
}
function growBuffalo(amount){
  const s = trauLoad();
  const prevStage = trauStage(s.xp);
  s.xp += amount;
  s.last = Date.now();
  const newStage = trauStage(s.xp);
  s.fired = s.fired || [];
  if(newStage.label !== prevStage.label && !s.fired.includes(newStage.label)){
    s.fired.push(newStage.label);
    trauSave(s);
    showMilestone(newStage.emoji, 'Trâu của bạn lên bậc: '+newStage.label+'!', newStage.sub);
    launchConfetti();
  } else {
    trauSave(s);
  }
  renderTrauCompanion();
}
function renderTrauCompanion(){
  const el = document.getElementById('trau-companion');
  if(!el) return;
  const s = trauLoad();
  const stage = trauStage(s.xp);
  const cond = trauCondition(s.last);
  el.innerHTML = `<span class="tc-emoji">${stage.emoji}</span>
    <span class="tc-text"><span>${stage.label} <span class="tc-sub">· ${cond.emoji} ${cond.label}</span></span><span class="tc-sub">${stage.sub} — ${s.xp} XP cả khóa học</span></span>`;
  el.title = 'Chú trâu này sẽ theo bạn qua mọi mô-đun của VIET 203 trong học kỳ.';
}
function resetTrau(){
  if(confirm('Đặt lại chú trâu của cả khóa học (XP tích lũy qua mọi mô-đun)? Không thể hoàn tác.')){
    localStorage.removeItem(NS_TRAU);
    renderTrauCompanion();
    updateXPHeader();
  }
}

function renderField(){
  const wrap = document.getElementById('field-strip');
  if(!wrap) return;
  wrap.innerHTML = Object.keys(PART_MAX_XP).map(id=>{
    const p = PARTS.find(x=>x.id===id);

      <span class="ft-icon">${done?'🌾':'🟫'}</span>

  }).join('');
}

function renderStrandBalance(hostId){
  const host = document.getElementById(hostId||'strand-balance');
  if(!host) return;
  const totals = strandTotals();
  const sum = Object.values(totals).reduce((a,b)=>a+b,0);
  const order = ['input','output','language','fluency'];
  if(sum===0){
    host.innerHTML = `<p class="instr" style="margin:0">Bắt đầu làm bài để xem 4 trụ cột học ngôn ngữ của bạn cân bằng ra sao — mục tiêu lý tưởng là chia đều 25% cho mỗi trụ cột (Nation, 2007).</p>`;
    return;
  }
  const bar = order.map(s=>{
    const pct = Math.round(totals[s]/sum*100);
    return pct>0 ? `<div style="width:${pct}%;background:${STRANDS[s].color}" title="${STRANDS[s].en}: ${pct}%"></div>` : '';
  }).join('');
  const legend = order.map(s=>{
    const pct = sum? Math.round(totals[s]/sum*100) : 0;
    return `<div class="strand-leg-item">
      <span class="strand-dot" style="background:${STRANDS[s].color}"></span>
      <span>${STRANDS[s].emoji} ${STRANDS[s].en}</span>
      <strong>${pct}%</strong>
    </div>`;
  }).join('');
  host.innerHTML = `<div class="strand-bar">${bar}</div><div class="strand-legend">${legend}</div>`;
}

/* ===================== XP / GAMIFICATION ===================== */
function xpAwarded(){ return load('xp-awarded', {}); }
function xpTotal(){ const a=xpAwarded(); return Object.values(a).reduce((s,v)=>s+v,0); }
function partXP(partId){
  const a=xpAwarded();
  return Object.keys(a).filter(k=>k.startsWith(partId+':')).reduce((s,k)=>s+a[k],0);
}
/* Tagged at the award-key level (not the part level) since several parts mix
   strands — e.g. p2 (T1) is mostly input, but p2:exchange is the student
   producing their own summary, so it's tagged output. */
function xpStrand(key){
  if(key.startsWith('fb:')) return 'fluency';
  if(key.startsWith('gl:')) return 'language';
  if(key.startsWith('pextra:compare')||key.startsWith('pextra:riddle-write')||key.startsWith('pextra:stresstype')) return 'output'; // written comparison, own riddle, personality self-report
  if(key.startsWith('pextra:idioms')||key.startsWith('pextra:clinic')||key.startsWith('pextra:slang')) return 'language'; // word↔meaning matching
  if(key.startsWith('pextra:')) return 'input'; // H5P games, trivia, culture-note comprehension
  if(key.startsWith('p1:survey')) return 'output'; // own survey answers + summary
  if(key.startsWith('p1:')) return 'input'; // habits match/sort — recognition
  if(key.startsWith('p1sc:reading')||key.startsWith('wrapsc:reading')) return 'input';
  if(key.startsWith('p2:emotions')||key.startsWith('p2:antonyms')||key.startsWith('p2:fill')) return 'language';
  if(key.startsWith('p2:recall')||key.startsWith('p2:summary')||key.startsWith('p2:share-honor')||key.startsWith('p2:discuss')||key.startsWith('p2:reasons')||key.startsWith('p2:translate')||key.startsWith('p2:situations')) return 'output';
  if(key.startsWith('p2:')) return 'input'; // reading, prediction check, MCQ, listening, exit-task note-taking from audio
  if(key.startsWith('p3:colloc')||key.startsWith('p3:para-fill')||key.startsWith('p3:advice')) return 'language';
  if(key.startsWith('p3:')) return 'output';
  if(key.startsWith('p5:listen')||key.startsWith('p5:review321')||key.startsWith('p5:peer-honor')) return 'input'; // listening MCQ; reading the model column for 3-2-1
  if(key.startsWith('p5:connectors')) return 'language';
  if(key.startsWith('p5:')) return 'output';
  return 'output'; // p1sc:candos / wrapsc:candos / wraprefl:reflection — self-assessment & reflection
}
function strandTotals(){
  const totals = {input:0, output:0, language:0, fluency:0};
  const a = xpAwarded();
  Object.entries(a).forEach(([k,v])=>{ const s=xpStrand(k); if(s) totals[s] += v; });
  return totals;
}

/* ===================== CREDIT / GRADING ===================== */
function coreTasksDone(){ return CORE_IDS.every(id=>partXP(id)>=PART_MAX_XP[id]); }
function xpPct(){ return TOTAL_MAX_XP ? Math.round(xpTotal()/TOTAL_MAX_XP*100) : 0; }
function creditGrade(){
  const pct = xpPct(), allCore = coreTasksDone();
  if(allCore && pct>=90) return {pct, allCore, grade:'A', eligible:true};
  if(allCore && pct>=80) return {pct, allCore, grade:'B', eligible:true};
  if(allCore && pct>=CREDIT_FLOOR_PCT) return {pct, allCore, grade:'C', eligible:true};
  return {pct, allCore, grade:null, eligible:false};
}
function renderCreditPanel(hostId){
  const host = document.getElementById(hostId||'credit-panel');
  if(!host) return;
  const g = creditGrade();
  const rows = PARTS.filter(p=>p.core).map(p=>{
    const earned = partXP(p.id), max = PART_MAX_XP[p.id];
    const done = isPartDone(p.id);
    const goBtn = done ? '' : `<button class="cl-go-btn" onclick="openPart('${p.id}')">Đi tới →</button>`;
    return `<div class="credit-req-row"><span class="credit-req-icon">${done?'✅':'⭕'}</span><span style="flex:1">${p.core} — ${p.title} <span style="color:var(--text3);font-size:0.78rem">(${earned} / ${max} XP)</span></span>${goBtn}</div>`;
  }).join('');
  const xpRow = `<div class="credit-req-row"><span class="credit-req-icon">${g.pct>=CREDIT_FLOOR_PCT?'✅':'⭕'}</span><span>Tổng XP ≥ ${CREDIT_FLOOR_PCT}% <span style="color:var(--text3)">(hiện tại: ${g.pct}%)</span></span></div>`;
  const badgeColor = g.grade==='A' ? 'var(--lbg);color:var(--leaf)' : g.grade==='B' ? 'var(--fglow);color:var(--flame2)' : g.grade==='C' ? 'var(--gbg);color:#b45309' : 'var(--cbg);color:var(--coral)';
  const badgeText = g.eligible ? `🎓 Đủ điều kiện lấy tín chỉ — Hạng ${g.grade}` : (g.allCore ? `Cần thêm XP để đạt ${CREDIT_FLOOR_PCT}% (còn thiếu ${Math.max(0,CREDIT_FLOOR_PCT-g.pct)}%)` : 'Chưa đủ điều kiện — còn thiếu nhiệm vụ chính');
  host.innerHTML = rows + xpRow + `<div class="credit-grade-badge" style="background:${badgeColor}">${badgeText}</div>`;
}
function awardXP(key, amount, silent){
  const a = xpAwarded();
  if(a[key]!==undefined) return false; // idempotent
  a[key]=amount;
  save('xp-awarded', a);
  if(!silent){ showXPPopup(amount); growBuffalo(amount); }
  updateXPHeader();
  refreshLiveUI();
  return true;
}
function refreshLiveUI(){
  buildSidebarNav();
  renderField();
  renderStrandBalance();
  renderCreditPanel();
}
function showXPPopup(amount){
  const pop = document.getElementById('xp-pop');
  if(!pop) return;
  pop.textContent = '+'+amount+' XP';
  pop.classList.remove('show'); void pop.offsetWidth;
  pop.classList.add('show');
  clearTimeout(pop._t);
  pop._t = setTimeout(()=>pop.classList.remove('show'), 1300);
}
function showMilestone(emoji, msg, sub){
  const t = document.getElementById('milestone-toast');
  if(!t) return;
  t.querySelector('.mt-emoji').textContent = emoji;
  document.getElementById('mt-msg').textContent = msg;
  document.getElementById('mt-sub').textContent = sub||'';
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(()=>t.classList.remove('show'), 3200);
}
function launchConfetti(){
  const colors=['#0d9488','#fbbf24','#15803d','#e11d48','#a855f7'];
  for(let i=0;i<50;i++){
    setTimeout(()=>{
      const el=document.createElement('div'); el.className='confetti-piece';
      el.style.left=Math.random()*100+'vw';
      el.style.background=colors[Math.floor(Math.random()*colors.length)];
      el.style.animationDuration=(1.1+Math.random()*0.8)+'s';
      el.style.width=el.style.height=(7+Math.random()*7)+'px';
      document.body.appendChild(el);
      setTimeout(()=>el.remove(),2200);
    },i*22);
  }
}
function updateXPHeader(){
  const total = xpTotal();
  const frac = TOTAL_MAX_XP ? Math.min(1,total/TOTAL_MAX_XP) : 0;
  const fillEl = document.getElementById('xp-track-fill');
  const lvlEl = document.getElementById('xp-level-lbl');
  const countEl = document.getElementById('xp-count-lbl');
  if(fillEl) fillEl.style.width = (frac*100)+'%';
  if(lvlEl){
    const s = trauLoad();
    const stage = trauStage(s.xp);
    const cond = trauCondition(s.last);
    lvlEl.innerHTML = `${stage.emoji} ${stage.label} <span style="opacity:.75;font-weight:500">· ${cond.emoji} ${cond.label}</span>`;
  }
  if(countEl) countEl.textContent = total+' / '+TOTAL_MAX_XP+' XP · Bài 3';
  const statXp = document.getElementById('stat-xp');
  if(statXp) statXp.textContent = total;
}

function parseVocabTooltips(html){
  return html.replace(/\|([^|]+)\|([^|]+)\|/g, (m,word,gloss)=>`<span class="vt" tabindex="0">${word}<span class="vt-tip">${gloss}</span></span>`);
}
function stripForTTS(html){
  return html.replace(/\|([^|]+)\|([^|]+)\|/g,'$1').replace(/<[^>]+>/g,'');
}

    el.addEventListener('click', e=>{ e.stopPropagation(); el.querySelector('.vt-tip').classList.toggle('show'); });
  });

function normalizeVN(s){ return (s||'').trim().replace(/\s+/g,' ').toLowerCase().normalize('NFC'); }
/* Diacritic-insensitive layer on top of normalizeVN() — used by the Riddle
   Game's lenient guess-matching (10-Support-EngagementActivities.md #5, "gõ
   không dấu cũng được chấp nhận"). Reuses normalizeVN() rather than
   reinventing case/whitespace handling. */
function stripDiacriticsVN(s){
  return (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D');
}
function lenientMatchVN(guess, answers){
  const g = stripDiacriticsVN(normalizeVN(guess));
  if(!g) return false;
  return answers.some(a=>{
    const an = stripDiacriticsVN(normalizeVN(a));
    return g===an || (g.length>=3 && (an.includes(g) || g.includes(an)));
  });
}
/* Clipboard copy for every "share result"/"share fact" button across the 5
   engagement activities — feature-detected and wrapped so a restricted or
   headless environment (no navigator.clipboard, or a permission denial)
   never throws and never blocks the activity itself. */
function copyToClipboard(text, onDone){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(()=>{ if(onDone) onDone(true); }).catch(()=>{ if(onDone) onDone(false); });
    } else if(onDone) onDone(false);
  }catch(e){ if(onDone) onDone(false); }
}

let _currentUtterance = null;
function stopAnyAudio(){
  if('speechSynthesis' in window) window.speechSynthesis.cancel();
}
function speakTTS(text, rate, onEnd){
  if(!('speechSynthesis' in window)){ if(onEnd) onEnd(); return; }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'vi-VN';
  u.rate = rate || 0.95;
  const voices = window.speechSynthesis.getVoices();
  const viVoice = voices.find(v=>v.lang && v.lang.startsWith('vi'));
  if(viVoice) u.voice = viVoice;
  if(onEnd) u.onend = onEnd;
  _currentUtterance = u;
  window.speechSynthesis.speak(u);
}

/* ===================== AUDIO-FILE-FIRST, TTS-FALLBACK PLAYBACK =====================
   Same mechanism as M2: try a recorded mp3 in AUDIO_DIR first, fall back to TTS if it's
   missing. Recorded so far: the 10 Truyện Vui stories (fb-story-1..10.mp3, Dr. Phung,
   2026-10-12). Wired file-first, awaiting recordings (filenames are listed in each
   Module-Source section): fb-shadow-1..5, fb-dictogloss-m3, p1sc-reading, wrapsc-reading,
   p2-passage, p5-model-column, fb-readmore-1..4, fb-pyramid-{1,2}-{1..4}, fb-vanish-1..2,
   fb-dict-1..6, gl-doctor, gl-minpair-{1..6}{a,b}, gl-dialect-1..6, px-greeting, px-clinic.
   Ghép Cụm Từ stays TTS-only (80 generated combinations).
   All other real human audio in this module is on Google Drive (see driveAudioHTML). */
const AUDIO_DIR = 'viet203-m3-healthfitness/';
let _lastPlayedAudio = null;
function playAudioOrTTS(key, text, onDone, rateOverride){
  /* 2026-10-12: stop whatever was playing first, so tapping a second 🔊 button doesn't
     layer two recordings (speakTTS already cancels its own previous utterance). */
  if(_lastPlayedAudio){ try{ _lastPlayedAudio.pause(); }catch(e){} }
  stopAnyAudio();
  let settled = false, fallbackStarted = false;
  const finish = ()=>{ if(!settled){ settled = true; if(onDone) onDone(); } };
  const fallback = ()=>{ if(fallbackStarted) return; fallbackStarted = true; speakTTS(text, rateOverride, finish); };
  const audio = new Audio(AUDIO_DIR+key+'.mp3');
  _lastPlayedAudio = audio;
  audio.addEventListener('ended', finish);
  audio.addEventListener('error', fallback);
  let playPromise;
  try{ playPromise = audio.play(); }catch(e){ fallback(); return audio; }
  if(playPromise && typeof playPromise.catch==='function') playPromise.catch(fallback);
  return audio;
}
/* Audio-or-TTS listen bar — same look/behavior as ttsBarHTML's rate-selectable
   button, but tries a recorded file first and only falls back to the TTS
   engine (honoring the chosen rate) if the file is missing/errors. */
const _audioTtsTargets = {};
/* 2026-09-18: `keyOrVariants` accepts either a single string key (original shape) or an
   array of {key,label} when one passage has SEVERAL recordings — Đọc Thêm's readings are
   recorded in more than one voice (Northern vs Southern accent, female vs male), and the
   student picks which to hear. A bare string is normalized to a 1-variant array so both
   call shapes flow through the same playback path below. */
function registerAudioTtsTarget(id, keyOrVariants, text){
  const variants = Array.isArray(keyOrVariants) ? keyOrVariants : [{key:keyOrVariants, label:''}];
  _audioTtsTargets[id] = {variants, text};
}
function audioTtsBarHTML(id, variants){
  const list = variants && variants.length ? variants : [];
  const voicePicker = list.length>1
    ? `<select class="tts-rate" id="voice-${id}" title="Chọn giọng đọc">${list.map((v,i)=>`<option value="${i}">🗣️ ${v.label}</option>`).join('')}</select>`
    : '';
  const hint = list.length
    ? (list.length>1 ? 'Bản ghi âm giọng người thật — chọn giọng và tốc độ bạn muốn nghe' : 'Bản ghi âm giọng người thật — chọn tốc độ bạn muốn nghe')
    : 'Phát bản ghi âm nếu có sẵn — nếu chưa có, tự động chuyển sang giọng máy (text-to-speech)';
  return `<div class="tts-bar">
    <button class="btn-tts" id="btn-tts-${id}" onclick="toggleAudioTTS('${id}')">🔊 Nghe đọc</button>
    ${voicePicker}
    <select class="tts-rate" id="rate-${id}">
      <option value="0.75">🐢 Chậm</option>
      <option value="1" selected>🚶 Vừa</option>
      <option value="1.25">🏃 Nhanh</option>
    </select>
    <span class="tts-hint">${hint}</span>
  </div>`;
}
let _currentAudioEl = null;
function toggleAudioTTS(id){
  const btn = document.getElementById('btn-tts-'+id);
  if(!btn) return;
  if(btn.classList.contains('playing')){
    stopAnyAudio();
    if(_currentAudioEl){ try{ _currentAudioEl.pause(); }catch(e){} _currentAudioEl = null; }
    btn.classList.remove('playing'); btn.textContent = '🔊 Nghe đọc';
    return;
  }
  document.querySelectorAll('.btn-tts.playing').forEach(b=>{ b.classList.remove('playing'); b.textContent = '🔊 Nghe đọc'; });
  const target = _audioTtsTargets[id];
  if(!target) return;
  const rate = parseFloat((document.getElementById('rate-'+id)||{}).value || 1);
  const vi = parseInt((document.getElementById('voice-'+id)||{}).value || 0, 10);
  const variant = target.variants[vi] || target.variants[0];

  _currentAudioEl = playAudioOrTTS(variant.key, target.text, ()=>{ btn.classList.remove('playing'); btn.textContent = '🔊 Nghe đọc'; _currentAudioEl = null; }, rate);
  /* The rate <select> is applied to a REAL recording here (not just to the TTS fallback,
     which playAudioOrTTS already handles) so the speed control isn't dead UI once a
     human recording exists. Set only from this bar — playAudioOrTTS's other callers pass
     a rate meaning "TTS speaking rate" and must keep playing recordings at natural pace. */
  if(_currentAudioEl && 'playbackRate' in _currentAudioEl){ try{ _currentAudioEl.playbackRate = rate; }catch(e){} }
}

/* ===================== SPEAK IT RECORDING (ported from ipa-203-a.html; generalized
   2026-09-17 10th pass when 4/3/2 merged with Shadowing into "🗣️ Speak It" — both sub-
   activities need the exact same "cache a stream once, spin up a MediaRecorder per clip"
   logic, so it's one shared helper now instead of a 2nd copy-pasted instance, matching
   this file's own precedent for generalizing on 2nd use (see renderPairsMatch's comment).
   ===================== */
/* Module-scoped (top-level) so recordings survive navigating away from and
   back to the Fluency Boost part within the same browser session, and so the
   completion report (a different function) can read them. Blobs are NOT
   written to localStorage — they only need to survive the current session,
   per the workspace's own audio-blobs-don't-belong-in-localStorage rule. */
let FBSPEAK_432_RECORDINGS = [null, null, null]; // one Blob (or null) per 4/3/2 round
let FBSPEAK_432_TRANSCRIPTS = ['', '', '']; // matching auto-transcript per round
let FBSPEAK_SHADOW_RECORDINGS = [null, null, null, null, null]; // one Blob (or null) per shadowing sentence
let FBSPEAK_SHADOW_TRANSCRIPTS = ['', '', '', '', ''];
/* Chunk Chaining/Pyramid Stories/Vanishing Script each keep just ONE clip+transcript for
   the whole activity (not per generated sentence / per tier / per passage) — added 2026-
   09-17 12th pass, by direct request ("recordings for each activity they complete"). One
   slot is enough evidence for these open-ended/multi-stage drills without a much bigger
   per-item UI; 4/3/2 and Shadowing keep their existing per-round/per-sentence slots since
   those were already built that way. */
let FBSPEAK_CHUNK_RECORDING = null, FBSPEAK_CHUNK_TRANSCRIPT = '';
let FBSPEAK_PYRAMID_RECORDING = null, FBSPEAK_PYRAMID_TRANSCRIPT = '';
let FBSPEAK_VANISH_RECORDING = null, FBSPEAK_VANISH_TRANSCRIPT = '';
let FBSPEAK_STREAM = null;
async function askMicSpeak(){
  if(FBSPEAK_STREAM) return true;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return false;
  try{ FBSPEAK_STREAM = await navigator.mediaDevices.getUserMedia({audio:true}); return true; }
  catch(e){ return false; } // denied / no mic — every sub-activity still completes via the honor-check-only path below
}
/* Starts a MediaRecorder on the shared stream, plus (when the browser supports it) a
   SpeechRecognition instance run in parallel to auto-transcribe the same clip — ported
   from ipa-203-a.html's Part 2 recording flow (accumulate final results, fall back
   silently when unsupported). onStop(blob, transcript) fires when stopClipRecording() is
   called; transcript is '' if SpeechRecognition is unavailable or produced nothing.
   Returns the recorder so the caller can hold a handle to stop it later. */
function startClipRecording(onStop){
  const mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '';
  const recorder = mimeType ? new MediaRecorder(FBSPEAK_STREAM, {mimeType}) : new MediaRecorder(FBSPEAK_STREAM);
  const chunks = [];
  let finalTr = '', curTr = '', recog = null;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(SR){
    recog = new SR();
    recog.continuous = true; recog.interimResults = true; recog.lang = 'vi-VN';
    recog.onresult = e=>{
      let fin = '', int = '';
      for(let i=e.resultIndex; i<e.results.length; i++){
        if(e.results[i].isFinal) fin += e.results[i][0].transcript + ' ';
        else int += e.results[i][0].transcript;
      }
      finalTr += fin; curTr = finalTr + int;
    };
    recog.onerror = ()=>{};
    try{ recog.start(); }catch(e){ recog = null; }
  }
  recorder.ondataavailable = e=>{ if(e.data.size>0) chunks.push(e.data); };
  recorder.onstop = ()=>{
    if(recog){ try{ recog.stop(); }catch(e){} }
    onStop(new Blob(chunks, {type: mimeType||'audio/webm'}), (curTr||finalTr).trim());
  };
  recorder.start();
  return recorder;
}
function stopClipRecording(recorder){
  if(recorder && recorder.state!=='inactive') recorder.stop();
}
/* Generic single-slot record/stop toggle button, shared by Chunk Chaining/Pyramid
   Stories/Vanishing Script (see the one-clip-per-activity note above). Wires up mic
   permission (asked once, shared FBSPEAK_STREAM), the record/stop button, and a player
   div that shows the clip + its auto-transcript. Returns {renderPlayer} so the caller can
   redraw a previously-saved clip when the sub-tab is revisited. */
function wireSingleSlotRecorder(btnId, playerId, statusId, onSaved){
  const btn = document.getElementById(btnId);
  const playerEl = document.getElementById(playerId);
  const statusEl = statusId ? document.getElementById(statusId) : null;
  let micAsked = false, recorder = null, recording = false;
  function renderPlayer(blob, transcript){
    playerEl.innerHTML = blob ? `<audio controls src="${URL.createObjectURL(blob)}" style="width:100%;height:36px"></audio>${transcript?`<div style="font-size:0.78rem;color:var(--text3);margin-top:0.3rem"><em>Bản chép lời (tự động, có thể có lỗi): ${escapeHtml(transcript)}</em></div>`:''}` : '';
  }
  btn.addEventListener('click', async ()=>{
    if(recording){
      stopClipRecording(recorder); recorder = null; recording = false;
      btn.textContent = '🎙️ Ghi Âm Đọc To'; btn.style.background = '';
      return;
    }
    if(!micAsked){
      micAsked = true;
      if(statusEl) statusEl.textContent = '🎙️ Đang xin quyền micrô...';
      const ok = await askMicSpeak();
      if(statusEl) statusEl.textContent = ok
        ? '🎙️ Đã cấp quyền micrô — ghi âm chỉ lưu trong phiên làm việc này.'
        : '🔇 Không có quyền micrô (hoặc trình duyệt không hỗ trợ) — không sao, hoạt động vẫn hoàn thành bình thường qua honor-check.';
    }
    if(!FBSPEAK_STREAM) return;
    recording = true;
    btn.textContent = '⏹ Dừng Ghi Âm'; btn.style.background = 'var(--danger, #dc2626)';
    recorder = startClipRecording((blob, transcript)=>{
      onSaved(blob, transcript);
      renderPlayer(blob, transcript);
    });
  });
  return { renderPlayer };
}

/* ===================== GENERIC MCQ (instant-feedback opt-btn pattern) =====================
   items: [{q, opts:[...], ans:index}]. keyPrefix e.g. 'p2:tf-'. xpEach = XP per
   correct-first-attempt question (awarded once, idempotent via localStorage). */
function renderMCQ(host, items, keyPrefix, xpEach){
  host.innerHTML = items.map((it,i)=>`
    <div class="question-block">
      <div class="q-number">Câu ${i+1}</div>
      <div class="q-text">${it.q}</div>
      <div class="options" id="${keyPrefix}${i}-opts">
        ${it.opts.map((o,oi)=>`<button class="opt-btn" data-oi="${oi}">${o}</button>`).join('')}
      </div>
      <div class="q-feedback" id="${keyPrefix}${i}-fb"></div>
    </div>`).join('');
  items.forEach((it,i)=>{
    const saved = load(keyPrefix+i, null);
    const optsWrap = document.getElementById(`${keyPrefix}${i}-opts`);
    const fb = document.getElementById(`${keyPrefix}${i}-fb`);
    const lock = (chosen)=>{
      optsWrap.querySelectorAll('.opt-btn').forEach((b,oi)=>{
        b.disabled = true;
        if(oi===it.ans) b.classList.add('correct');
        else if(oi===chosen) b.classList.add('wrong');
      });
      fb.textContent = chosen===it.ans ? '✅ Chính xác!' : '❌ Chưa đúng — đáp án đúng đã tô xanh.';
      fb.style.color = chosen===it.ans ? 'var(--leaf)' : 'var(--coral)';
    };
    if(saved!==null){ lock(saved); }
    optsWrap.querySelectorAll('.opt-btn').forEach(b=>{
      b.addEventListener('click', ()=>{
        const chosen = parseInt(b.dataset.oi,10);
        save(keyPrefix+i, chosen);
        lock(chosen);
        if(xpEach) awardXP(keyPrefix+'xp'+i, xpEach);
      });
    });
  });
}

function renderTF(host, items, keyPrefix, xpEach){

  items.forEach((it,i)=>{

      row.querySelectorAll('.tf-btn').forEach(b=>{
