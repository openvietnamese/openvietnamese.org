<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f8fafc;--surface:#ffffff;--surface2:#f1f5f9;--surface3:#e8eef4;
  --border:#e2e8f0;--border2:#cbd5e1;
  --text:#1e293b;--text2:#64748b;--text3:#94a3b8;
  --flame:#0d9488;--flame2:#0f766e;--fglow:rgba(13,148,136,0.12);
  --leaf:#15803d;--lbg:rgba(21,128,61,0.09);
  --coral:#e11d48;--cbg:rgba(225,29,72,0.09);
  --lotus:#a855f7;--lobg:rgba(168,85,247,0.09);
  --gold:#b45309;--gbg:rgba(234,179,8,0.14);
  --r:16px;--rs:10px;--rxs:6px;
}
html{font-size:16px;scroll-behavior:smooth}
body{font-family:'Lexend',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.65}
h1,h2,h3,.display{font-family:'Lexend',sans-serif;font-weight:700}
button{font-family:'Lexend',sans-serif;cursor:pointer}
input,textarea{font-family:'Lexend',sans-serif}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
a{color:var(--flame2)}
::selection{background:var(--fglow);color:var(--text)}

/* ---------- APP SHELL (sidebar layout) ---------- */
#app{display:flex;min-height:100vh}
#sidebar{width:264px;background:linear-gradient(180deg,#0f766e,#0c5f59);color:#fff;display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;overflow-y:auto;z-index:100;transition:transform 0.3s}
#main{margin-left:264px;flex:1;min-height:100vh;display:flex;flex-direction:column}
#content-area{flex:1}

.sidebar-header{padding:1.1rem 1.1rem 0.8rem}
.sidebar-logo{font-size:1.05rem;font-weight:800;display:flex;align-items:center;gap:0.5rem}
.sidebar-logo .logo-icon{font-size:1.35rem}
.sidebar-logo .logo-icon img{width:1.9rem;height:1.9rem;border-radius:50%;object-fit:cover;object-position:center;display:block;border:1.5px solid rgba(255,255,255,0.35);background:#fff}
.sidebar-sub{font-size:0.66rem;opacity:0.72;margin-top:0.25rem;letter-spacing:0.01em}

.sidebar-trau{margin:0 1.1rem 0.9rem;padding:0.7rem 0.8rem;border-radius:var(--rs);background:rgba(255,255,255,0.08);display:flex;align-items:center;gap:0.6rem;cursor:default}
.sidebar-trau .tc-emoji{font-size:1.55rem;line-height:1}
.sidebar-trau .tc-text{display:flex;flex-direction:column;line-height:1.35}
.sidebar-trau .tc-sub{font-size:0.62rem;opacity:0.78;font-weight:400}

.sidebar-progress{padding:0 1.1rem 0.9rem}
.sp-label{font-size:0.6rem;text-transform:uppercase;letter-spacing:0.07em;opacity:0.6;margin-bottom:0.4rem}
.sp-bar{height:7px;background:rgba(255,255,255,0.18);border-radius:4px;overflow:hidden}
.sp-fill{height:100%;background:linear-gradient(90deg,#fbbf24,#f59e0b);border-radius:4px;transition:width 0.5s}
.sp-text{font-size:0.66rem;margin-top:0.4rem;opacity:0.85}

.sidebar-nav{flex:1;padding:0.5rem 0;overflow-y:auto;border-top:1px solid rgba(255,255,255,0.13)}
.nav-group-label{font-size:0.6rem;font-weight:800;letter-spacing:0.07em;text-transform:uppercase;opacity:0.55;padding:0.7rem 1.1rem 0.3rem}
.nav-item{display:flex;align-items:center;gap:0.6rem;padding:0.6rem 1.1rem;cursor:pointer;font-size:0.82rem;transition:background 0.15s}
.nav-item:hover{background:rgba(255,255,255,0.08)}
.nav-item.active{background:rgba(255,255,255,0.16)}
.nav-item.core{border-left:3px solid #fbbf24}
.ni-icon{font-size:1rem;width:1.15rem;text-align:center;flex-shrink:0}
.ni-title{flex:1;font-weight:600;line-height:1.3}
.ni-meta{font-size:0.62rem;opacity:0.65;font-weight:400}
.ni-badge{font-size:0.62rem;font-weight:700;background:rgba(255,255,255,0.18);border-radius:10px;padding:2px 7px;flex-shrink:0;white-space:nowrap}
.ni-badge.done{background:#fff;color:#0f766e}

.sidebar-footer{padding:0.9rem 1.1rem 1.1rem;border-top:1px solid rgba(255,255,255,0.13);display:flex;flex-direction:column;gap:0.45rem}
.btn-report-sb{background:#fbbf24;color:#0f4c46;border:none;border-radius:var(--rs);padding:0.6rem;font-family:inherit;font-weight:800;font-size:0.8rem;cursor:pointer;transition:opacity 0.15s}
.btn-report-sb:hover{opacity:0.88}
.btn-reset-sb{background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.72);border:1px solid rgba(255,255,255,0.2);border-radius:var(--rs);padding:0.4rem;font-family:inherit;font-size:0.68rem;cursor:pointer;transition:all 0.15s}
.btn-reset-sb:hover{background:rgba(225,29,72,0.25);color:#fff;border-color:rgba(225,29,72,0.4)}

#topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 1.25rem;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:60}
.v2-badge{font-size:0.68rem;font-weight:800;letter-spacing:0.04em;background:#78350f;color:#fef3c7;border-radius:20px;padding:3px 10px;white-space:nowrap}
.tag-athome,.tag-inclass{font-size:0.64rem;font-weight:700;letter-spacing:0.02em;border-radius:20px;padding:2px 9px;margin-left:0.5rem;vertical-align:middle;white-space:nowrap}
.tag-athome{background:var(--fglow);color:var(--flame2);border:1px solid var(--flame)}
.tag-inclass{background:var(--gbg);color:#b45309;border:1px solid var(--gold)}
.cosmetic-row{display:flex;gap:0.3rem;margin-top:0.3rem;font-size:1.1rem}
.cosmetic-row span{opacity:0.35}
.cosmetic-row span.unlocked{opacity:1}
#menu-toggle{display:none;background:none;border:none;font-size:1.3rem;cursor:pointer;color:var(--text);padding:0 0.3rem 0 0}
.tb-title{font-family:'Lora',serif;font-size:0.92rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-left{display:flex;align-items:center;gap:0.7rem;min-width:0}
.tb-badge{font-size:0.68rem;font-weight:700;padding:3px 10px;border-radius:20px;background:var(--fglow);color:var(--flame2);white-space:nowrap}

@media(max-width:860px){
  #sidebar{transform:translateX(-100%)}
  #sidebar.open{transform:translateX(0)}
  #main{margin-left:0}
  #menu-toggle{display:block}
}

/* ---------- CONFETTI ---------- */
.confetti-piece{position:fixed;width:9px;height:9px;border-radius:2px;animation:fall 1.7s ease-in forwards;pointer-events:none;z-index:9997}
@keyframes fall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(680deg);opacity:0}}

/* ---------- HOME ---------- */
.home-hero{padding:3.5rem 1.5rem 1.5rem;text-align:center;position:relative;overflow:hidden}
.home-hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 75% 50% at 50% -10%,rgba(13,148,136,0.14),transparent);pointer-events:none}
.home-kicker{font-size:0.72rem;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:var(--flame2);position:relative}
.home-title{font-family:'Lora',serif;font-weight:700;font-size:clamp(2.1rem,6vw,3.4rem);letter-spacing:-0.01em;margin-top:0.5rem;position:relative;text-wrap:balance}
.home-title em{font-style:italic;color:var(--flame)}
.home-sub{font-size:0.95rem;color:var(--text2);margin-top:0.6rem;max-width:520px;margin-left:auto;margin-right:auto;position:relative}
.home-body{max-width:920px;margin:0 auto;padding:0 1.25rem 3.5rem}

.trau-companion{margin-top:0.9rem;display:inline-flex;align-items:center;gap:0.55rem;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:0.45rem 1rem 0.45rem 0.6rem;font-size:0.82rem;font-weight:600;position:relative}
.trau-companion .tc-emoji{font-size:1.5rem;line-height:1}
.trau-companion .tc-text{display:flex;flex-direction:column;align-items:flex-start;line-height:1.25}
.trau-companion .tc-sub{font-weight:400;color:var(--text3);font-size:0.7rem}
.trau-reset{font-size:0.66rem;color:var(--text3);background:none;border:none;text-decoration:underline;text-underline-offset:2px;margin-top:0.4rem;display:block}
.trau-reset:hover{color:var(--coral)}

.field-strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:0.5rem;margin-bottom:0.4rem}
.field-tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);padding:0.65rem 0.3rem;text-align:center;transition:all 0.3s}
.field-tile.tilled{background:var(--lbg);border-color:var(--leaf)}
.ft-icon{font-size:1.3rem;display:block}
.ft-label{font-size:0.62rem;color:var(--text3);margin-top:2px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:520px){.field-strip{grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:0.3rem}.ft-icon{font-size:1.1rem}}

/* four-strands balance meter */
.strand-bar{display:flex;height:14px;border-radius:8px;overflow:hidden;background:var(--surface2);border:1px solid var(--border)}
.strand-bar div{transition:width 0.5s}
.strand-legend{display:flex;flex-wrap:wrap;gap:0.5rem 1.1rem;margin-top:0.7rem;font-size:0.76rem;color:var(--text2)}
.strand-leg-item{display:flex;align-items:center;gap:0.35rem}
.strand-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.strand-badge{font-size:0.6rem;font-weight:700;padding:1px 7px;border-radius:10px;white-space:nowrap;display:inline-block}

.harvest-panel{background:linear-gradient(135deg,#0f766e,#0d9488);color:#fff;text-align:center;border-radius:var(--r);padding:1.5rem}
.harvest-panel .hp-emoji{font-size:2.2rem}
.harvest-panel .hp-title{font-weight:700;margin-top:0.5rem;font-size:1.02rem}
.harvest-panel .hp-poem{font-size:0.8rem;opacity:0.85;font-style:italic;margin-top:0.5rem}
.harvest-panel .hp-note{font-size:0.84rem;margin-top:0.7rem}

.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:0.75rem;margin:1.75rem 0}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);padding:1rem;text-align:center}
.stat-card .n{font-variant-numeric:tabular-nums;font-size:1.6rem;font-weight:500;color:var(--flame2);font-variant-numeric:tabular-nums}
.stat-card .l{font-size:0.66rem;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;margin-top:2px}

.sec-title{font-size:0.7rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--text3);margin:2rem 0 1rem;padding-bottom:0.6rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.reset-link{font-size:0.7rem;font-weight:500;letter-spacing:0.02em;text-transform:none;color:var(--text3);background:none;border:none;text-decoration:underline;text-underline-offset:2px}
.reset-link:hover{color:var(--coral)}

.parts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:0.9rem}
.pcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1.3rem;cursor:pointer;transition:all 0.18s;position:relative;overflow:hidden;text-align:left}
.pcard::after{content:'';position:absolute;inset:0;background:var(--fglow);opacity:0;transition:opacity 0.18s}
.pcard:hover{border-color:var(--flame);transform:translateY(-2px)}.pcard:hover::after{opacity:1}
.pc-num{font-variant-numeric:tabular-nums;font-size:0.7rem;font-weight:500;letter-spacing:0.08em;color:var(--flame2);margin-bottom:0.5rem;position:relative}
.pc-emoji{font-size:1.6rem;display:block;margin-bottom:0.5rem;position:relative}
.pc-title{font-family:'Lora',serif;font-size:1.05rem;font-weight:600;color:var(--text);line-height:1.3;position:relative}
.pc-meta{font-size:0.76rem;color:var(--text3);margin-top:0.4rem;position:relative}
.pc-bar{height:3px;background:var(--border);border-radius:2px;margin-top:0.85rem;overflow:hidden;position:relative}
.pc-fill{height:100%;background:var(--flame);border-radius:2px;transition:width 0.4s}

.region-strip{display:flex;gap:0.6rem;flex-wrap:wrap;margin-top:0.5rem}
.region-tag{font-size:0.72rem;font-weight:600;padding:0.32rem 0.7rem;border-radius:20px;border:1px solid var(--border)}
.region-tag.bac{color:var(--leaf);border-color:var(--leaf)}
.region-tag.trung{color:var(--gold);border-color:var(--gold)}
.region-tag.nam{color:var(--lotus);border-color:var(--lotus)}

/* ---------- LESSON HEADER / NAV ---------- */
.lhdr{background:var(--surface);border-bottom:1px solid var(--border);padding:0.85rem 1.25rem;display:flex;align-items:center;gap:0.875rem;position:sticky;top:52px;z-index:55}
.back-btn{background:none;border:1px solid var(--border);color:var(--text2);border-radius:var(--rs);padding:0.4rem 0.9rem;font-size:0.8rem;transition:all 0.15s;white-space:nowrap}
.back-btn:hover{border-color:var(--flame);color:var(--flame2)}
.lhdr-title{font-family:'Lora',serif;font-size:0.98rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lhdr-tag{margin-left:auto;background:var(--fglow);border:1px solid var(--flame);color:var(--flame2);font-size:0.66rem;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;padding:3px 10px;border-radius:20px;white-space:nowrap;flex-shrink:0}

.mode-tabs{display:flex;gap:0.5rem;padding:1.1rem 1.25rem;max-width:900px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
.mode-tabs::-webkit-scrollbar{display:none}
.mtab{display:flex;align-items:center;gap:0.4rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);padding:0.5rem 1rem;font-size:0.8rem;font-weight:500;color:var(--text2);white-space:nowrap;transition:all 0.15s;flex-shrink:0}
.mtab:hover{border-color:var(--border2);color:var(--text)}
.mtab.active{background:var(--flame);border-color:var(--flame);color:#ffffff}
.lbody{max-width:900px;margin:0 auto;padding:0 1.25rem 4rem}
.mview{display:none}.mview.active{display:block}

/* ---------- SHARED CONTENT BLOCKS ---------- */
.block{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1.4rem;margin-bottom:1.1rem}
.block-title{font-family:'Lora',serif;font-size:1.1rem;font-weight:600;margin-bottom:0.4rem;display:flex;align-items:center;gap:0.5rem}
.block-sub{font-size:0.82rem;color:var(--text3);margin-bottom:1rem}
.meta-row{display:flex;gap:0.6rem;flex-wrap:wrap;font-size:0.72rem;color:var(--text3);margin-bottom:0.9rem}
.meta-row span{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:0.25rem 0.65rem}

.instr{background:var(--surface2);border-left:3px solid var(--flame);border-radius:var(--rxs);padding:0.8rem 1rem;font-size:0.86rem;color:var(--text2);font-style:italic;margin-bottom:1.1rem}

/* find-someone-who */
.fsw-row{display:grid;grid-template-columns:2fr 1fr 1.3fr;gap:0.6rem;padding:0.7rem 0;border-bottom:1px solid var(--border);align-items:center}
.fsw-row:last-child{border-bottom:none}
.fsw-num{font-variant-numeric:tabular-nums;color:var(--flame2);font-size:0.75rem;margin-right:0.4rem}
.fsw-q{font-size:0.9rem}
.fsw-row input{background:var(--surface2);border:1px solid var(--border);border-radius:var(--rxs);padding:0.45rem 0.6rem;color:var(--text);font-size:0.85rem;width:100%}
.fsw-row input:focus{outline:none;border-color:var(--flame)}
.fsw-row.done{background:linear-gradient(90deg,var(--lbg),transparent);border-radius:var(--rxs)}
@media(max-width:640px){.fsw-row{grid-template-columns:1fr}}
.fsw-ref-row{padding:0.5rem 0;border-bottom:1px dashed var(--border);font-size:0.88rem}
.fsw-ref-row:last-child{border-bottom:none}
.tag-inperson{font-size:0.66rem;font-weight:700;letter-spacing:0.03em;background:var(--gbg);color:#b45309;border:1px solid var(--gold);border-radius:20px;padding:2px 10px;margin-left:0.6rem;vertical-align:middle}

/* vocab chips */
.vocab-group{margin-bottom:1.1rem}
.vocab-group h4{font-size:0.72rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--text3);margin-bottom:0.6rem}
.chip-row{display:flex;flex-wrap:wrap;gap:0.5rem}
.vchip{background:var(--surface2);border:1px solid var(--border);border-radius:var(--rxs);padding:0.5rem 0.75rem;font-size:0.84rem;cursor:pointer;transition:all 0.15s;perspective:600px}
.vchip:hover{border-color:var(--flame)}
.vchip .vn{font-weight:600}
.vchip .en{display:none;color:var(--flame2);font-style:italic;font-size:0.8rem;margin-top:2px}
.vchip.flip .en{display:block}
.vchip.flip .vn{color:var(--text3)}

.pattern-box{display:grid;gap:0.5rem}
.pattern-box p{font-size:0.88rem;padding:0.5rem 0.75rem;background:var(--surface2);border-radius:var(--rxs)}

textarea.freewrite{width:100%;min-height:110px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);color:var(--text);padding:0.9rem;font-size:0.9rem;resize:vertical;line-height:1.6}
textarea.freewrite:focus{outline:none;border-color:var(--flame)}
.wc-row{display:flex;justify-content:space-between;align-items:center;margin-top:0.5rem;font-size:0.74rem;color:var(--text3)}
.wc-row .n{font-variant-numeric:tabular-nums;color:var(--flame2)}

/* reading tabs */
.level-tabs{display:flex;gap:0.5rem;margin-bottom:1rem;flex-wrap:wrap}
.ltab{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:0.4rem 0.9rem;font-size:0.78rem;font-weight:600;color:var(--text2);transition:all 0.15s}
.ltab.active{background:var(--flame);border-color:var(--flame);color:#ffffff}
.pre-read-img{width:100%;max-width:480px;display:block;margin:0.9rem auto 0;border-radius:var(--rs);border:1px solid var(--border)}
.reading-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);padding:1.2rem;font-size:0.92rem;line-height:1.85}
.reading-card p{margin-bottom:0.85rem}
.reading-card p:last-child{margin-bottom:0}
.reading-card strong{color:var(--flame2)}
.reading-card .cite{font-size:0.78rem;color:var(--text3);font-style:italic;display:block;margin-bottom:0.6rem}

/* inline vocab tooltip (tap/hover a highlighted word in a reading) */
.vt{position:relative;border-bottom:2px dotted var(--flame);cursor:help;font-weight:700;color:var(--flame2);border-radius:2px;padding:0 1px}
.vt:hover,.vt:focus{background:var(--fglow)}
.vt-tip{visibility:hidden;opacity:0;position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#1e293b;color:#fbbf24;padding:5px 10px;border-radius:8px;font-size:0.74rem;font-weight:700;white-space:nowrap;pointer-events:none;z-index:120;transition:opacity 0.15s,visibility 0.15s;box-shadow:0 4px 14px rgba(0,0,0,0.28)}
.vt-tip::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:#1e293b}
.vt:hover .vt-tip,.vt:focus .vt-tip,.vt-tip.show{visibility:visible;opacity:1}

/* TTS listen bar */
.tts-bar{display:flex;align-items:center;gap:0.6rem;flex-wrap:wrap;margin-bottom:0.9rem}
.btn-tts{display:flex;align-items:center;gap:0.4rem;padding:0.45rem 0.9rem;background:var(--flame);color:#fff;border:none;border-radius:20px;font-family:inherit;font-weight:700;font-size:0.78rem;cursor:pointer;transition:all 0.15s}
.btn-tts:hover{background:var(--flame2)}
.btn-tts.playing{background:var(--leaf)}
.tts-rate{padding:0.4rem 0.6rem;border:1px solid var(--border);border-radius:16px;font-family:inherit;font-size:0.74rem;background:var(--surface);cursor:pointer;color:var(--text)}
.tts-hint{font-size:0.72rem;color:var(--text3);font-style:italic}

/* ---------- STORY LIBRARY (Bài 2B) & GENERALIZED MCQ ---------- */
.mini-story-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:0.6rem;margin-top:0.3rem}
.mini-story-tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);padding:0.85rem 0.7rem;text-align:left;transition:all 0.15s;cursor:pointer;font-family:inherit}
.mini-story-tile:hover{border-color:var(--flame);transform:translateY(-1px)}
.mini-story-tile.done{border-color:var(--leaf);background:var(--lbg)}
.mst-icon{font-size:1.2rem;display:block;margin-bottom:0.35rem}
.mst-title{font-size:0.82rem;font-weight:600;line-height:1.3;display:block;color:var(--text)}

.story-link-tag{background:var(--gbg);border-left:3px solid var(--gold);border-radius:0 var(--rxs) var(--rxs) 0;padding:0.5rem 0.8rem;font-size:0.78rem;color:var(--text2);margin-bottom:0.9rem}

.vocab-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.4rem}
.vocab-item{display:flex;gap:0.5rem;padding:0.4rem 0.6rem;border-radius:var(--rxs);background:var(--surface2);font-size:0.8rem}
.vocab-vn{font-weight:700;min-width:100px}
.vocab-en{color:var(--text3)}
.grammar-box{background:var(--gbg);border-left:4px solid var(--gold);padding:0.6rem 0.9rem;border-radius:0 var(--rxs) var(--rxs) 0;font-size:0.8rem;color:var(--text2);line-height:1.6}
@media(max-width:560px){.vocab-grid{grid-template-columns:1fr}}

.question-block{margin-bottom:1.1rem;padding-bottom:1.1rem;border-bottom:1px solid var(--border)}
.question-block:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.q-number{font-size:0.66rem;font-weight:800;text-transform:uppercase;letter-spacing:0.05em;color:var(--text3);margin-bottom:0.3rem}
.q-text{font-size:0.9rem;font-weight:600;margin-bottom:0.6rem;line-height:1.5}
.options{display:grid;gap:0.45rem}
.opt-btn{width:100%;text-align:left;padding:0.6rem 0.85rem;border:1.5px solid var(--border);border-radius:var(--rxs);background:var(--surface);font-family:inherit;font-size:0.84rem;cursor:pointer;transition:all 0.15s;color:var(--text)}
.opt-btn:hover:not(:disabled){border-color:var(--flame);background:var(--fglow)}
.opt-btn:disabled{cursor:default}
.opt-btn.correct{border-color:var(--leaf);background:var(--lbg);color:var(--leaf);font-weight:700}
.opt-btn.wrong{border-color:var(--coral);background:var(--cbg);color:var(--coral)}
.q-feedback{font-size:0.78rem;font-weight:700;margin-top:0.45rem;min-height:1em}
.quiz-result{text-align:center;margin-top:0.6rem}
.qr-circle{display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:50%;font-weight:800;font-size:1.05rem}

/* ---------- FLUENCY SPRINT (Bài 6) ---------- */
.sprint-stage{background:linear-gradient(135deg,#faf5ff,#f3e8ff);border:1px solid #e9d5ff;border-radius:var(--r);padding:1.6rem;text-align:center}
.sprint-timer{font-size:2.2rem;font-weight:800;font-variant-numeric:tabular-nums;color:var(--lotus);margin-bottom:0.6rem}
.sprint-word{font-size:1.6rem;font-weight:700;margin-bottom:1.1rem;min-height:2.2rem;color:var(--text)}
.sprint-btns{display:flex;gap:0.7rem;justify-content:center;margin-bottom:1rem}
.sprint-btn{padding:0.7rem 1.4rem;border:none;border-radius:var(--rs);font-family:inherit;font-weight:700;font-size:0.9rem;cursor:pointer;transition:transform 0.1s}
.sprint-btn:active{transform:scale(0.96)}
.sprint-btn.know{background:var(--leaf);color:#fff}
.sprint-btn.dontknow{background:var(--coral);color:#fff}
.sprint-result{text-align:center}

.ft-round{background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);padding:1rem;margin-bottom:0.7rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.ft-round.done{border-color:var(--leaf);background:var(--lbg)}
.ft-round-label{font-weight:700;font-size:0.86rem;flex:1;min-width:120px}
.ft-round-timer{font-size:1.3rem;font-weight:800;font-variant-numeric:tabular-nums;color:var(--lotus)}
.ft-round.done .ft-round-timer{color:var(--leaf)}

/* fill-in table */
.fill-table{width:100%;border-collapse:collapse}
.fill-table th{text-align:left;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--text3);padding:0.5rem 0.6rem;border-bottom:1px solid var(--border)}
.fill-table td{padding:0.65rem 0.6rem;border-bottom:1px solid var(--border);font-size:0.86rem;vertical-align:top}
.fill-table tr:last-child td{border-bottom:none}
.fill-table .region{font-weight:700;color:var(--gold);white-space:nowrap}
.fill-table input.blank{background:var(--surface3);border:1px solid var(--border2);border-radius:var(--rxs);padding:0.3rem 0.5rem;color:var(--text);font-size:0.84rem;width:110px}
.fill-table input.blank:focus{outline:none;border-color:var(--flame)}
.fill-table input.blank.ok{border-color:var(--leaf);background:var(--lbg)}
.table-wrap{overflow-x:auto}

/* true/false */
.tf-row{display:flex;align-items:center;gap:0.9rem;padding:0.75rem 0;border-bottom:1px solid var(--border)}
.tf-row:last-child{border-bottom:none}
.tf-text{flex:1;font-size:0.88rem}
.tf-btns{display:flex;gap:0.4rem;flex-shrink:0}
.tf-btn{width:42px;height:36px;border-radius:var(--rxs);border:1px solid var(--border);background:var(--surface2);color:var(--text2);font-weight:700;font-size:0.8rem;transition:all 0.15s}
.tf-btn:hover{border-color:var(--border2)}
.tf-btn.sel-d{background:var(--fglow);border-color:var(--flame);color:var(--flame2)}
.tf-btn.correct{background:var(--lbg);border-color:var(--leaf);color:var(--leaf)}
.tf-btn.wrong{background:var(--cbg);border-color:var(--coral);color:var(--coral)}
.tf-btn:disabled{cursor:default;opacity:0.9}
.tf-feedback{font-size:0.76rem;font-weight:700;margin-top:0.3rem;min-height:1em}
.check-btn{margin-top:1rem;background:var(--flame);color:#ffffff;border:none;border-radius:var(--rs);padding:0.6rem 1.2rem;font-size:0.84rem;font-weight:700}
.check-btn:hover{background:var(--flame2)}
.check-btn.secondary{background:var(--surface2);color:var(--text2);border:1px solid var(--border)}
.check-btn.secondary:hover{border-color:var(--border2)}

/* connector chips + textarea highlight */
.connector-bank{display:flex;flex-wrap:wrap;gap:0.5rem;margin-bottom:1rem}
.cchip{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:0.4rem 0.85rem;font-size:0.8rem;font-weight:600;transition:all 0.15s}
.cchip.used{background:var(--lbg);border-color:var(--leaf);color:var(--leaf)}
.connector-target{font-size:0.78rem;color:var(--text3);margin-top:0.5rem}

/* generic checklist */
.ck-row{display:flex;align-items:center;gap:0.7rem;padding:0.6rem 0;border-bottom:1px solid var(--border)}
.ck-row:last-child{border-bottom:none}
.ck-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--flame);flex-shrink:0}
.ck-row label{font-size:0.88rem;cursor:pointer}

/* pair tables */
.pair-table{width:100%;border-collapse:collapse}
.pair-table th{text-align:left;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--text3);padding:0.5rem 0.6rem;border-bottom:1px solid var(--border)}
.pair-table td{padding:0.5rem 0.6rem;border-bottom:1px solid var(--border);vertical-align:top}
.pair-table tr:last-child td{border-bottom:none}
.pair-table .qcell{font-size:0.84rem;max-width:220px}
.pair-table input{background:var(--surface3);border:1px solid var(--border2);border-radius:var(--rxs);padding:0.4rem 0.55rem;color:var(--text);font-size:0.84rem;width:100%}
.pair-table input:focus{outline:none;border-color:var(--flame)}
.pair-table .daycell{font-weight:700;color:var(--flame2);white-space:nowrap}

.link-btn{display:inline-flex;align-items:center;gap:0.5rem;background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);padding:0.6rem 1rem;font-size:0.86rem;color:var(--text);text-decoration:none;transition:all 0.15s}
.link-btn:hover{border-color:var(--flame);color:var(--flame2)}

/* rubric table */
.rubric-table{width:100%;border-collapse:collapse;font-size:0.82rem}
.rubric-table th{background:var(--surface2);text-align:left;padding:0.6rem 0.7rem;border:1px solid var(--border);font-size:0.72rem;text-transform:uppercase;letter-spacing:0.04em;color:var(--text3)}
.rubric-table td{padding:0.7rem;border:1px solid var(--border);vertical-align:top;line-height:1.5}
.rubric-table td:first-child{font-weight:700;color:var(--flame2)}

/* glossary */
.gloss-search{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);padding:0.7rem 1rem;color:var(--text);font-size:0.9rem;margin-bottom:1.2rem}
.gloss-search:focus{outline:none;border-color:var(--flame)}
.gloss-cat{margin-bottom:1.3rem}
.gloss-cat h4{font-size:0.72rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--gold);margin-bottom:0.6rem;padding-bottom:0.4rem;border-bottom:1px solid var(--border)}
.gterm{display:flex;justify-content:space-between;gap:1rem;padding:0.5rem 0;border-bottom:1px dashed var(--border);font-size:0.86rem}
.gterm:last-child{border-bottom:none}
.gterm .vn{font-weight:600}
.gterm .en{color:var(--text3);font-style:italic;text-align:right}
.gterm.hide{display:none}

.progress-pill{display:inline-flex;align-items:center;gap:0.4rem;font-size:0.72rem;color:var(--text3);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:0.25rem 0.7rem}
.progress-pill .dot{width:6px;height:6px;border-radius:50%;background:var(--leaf)}

/* ═══════ GAMIFICATION: XP HEADER ═══════ */
.xp-header{background:linear-gradient(135deg,#0f766e,#0d9488);color:#fff;padding:0.85rem 1.25rem;position:sticky;top:0;z-index:200;box-shadow:0 2px 10px rgba(15,118,110,0.25)}
.xp-header-inner{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:0.9rem;flex-wrap:wrap}
.xp-level{font-size:0.8rem;font-weight:700;white-space:nowrap;flex-shrink:0}
.xp-track-wrap{flex:1;min-width:140px}
.xp-track{height:8px;background:rgba(255,255,255,0.25);border-radius:20px;overflow:hidden}
.xp-track-fill{height:100%;background:linear-gradient(90deg,#fbbf24,#f59e0b);border-radius:20px;width:0%;transition:width 0.6s cubic-bezier(.34,1.56,.64,1)}
.xp-count{font-size:0.76rem;font-weight:600;white-space:nowrap;flex-shrink:0;font-variant-numeric:tabular-nums;opacity:0.95}

/* XP popup + milestone toast */
#xp-pop{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%) scale(0);background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;padding:0.65rem 1.5rem;border-radius:30px;font-size:1.15rem;font-weight:800;z-index:9999;pointer-events:none;white-space:nowrap;transition:transform 0.22s,top 0.45s;letter-spacing:0.03em;box-shadow:0 8px 24px rgba(217,119,6,0.35)}
#xp-pop.show{transform:translate(-50%,-50%) scale(1);top:32%}
#milestone-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);background:linear-gradient(135deg,#0f766e,#0d9488);color:#fff;padding:0.9rem 1.75rem;border-radius:16px;font-size:0.92rem;font-weight:700;z-index:9998;pointer-events:none;transition:transform 0.4s cubic-bezier(.34,1.56,.64,1),opacity 0.5s;opacity:0;text-align:center;box-shadow:0 8px 28px rgba(0,0,0,0.22);min-width:200px}
#milestone-toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#milestone-toast .mt-emoji{font-size:1.6rem;display:block;margin-bottom:0.2rem}
#milestone-toast .mt-sub{font-size:0.7rem;opacity:0.85;font-weight:400;margin-top:0.2rem}

/* Done badge on part cards */
.pcard.done{border-color:var(--leaf)}
.pc-done-badge{position:absolute;top:0.9rem;right:0.9rem;background:var(--lbg);color:var(--leaf);border:1px solid var(--leaf);font-size:0.66rem;font-weight:700;padding:2px 9px;border-radius:20px}
.pc-required-badge{position:absolute;top:0.9rem;right:0.9rem;background:var(--gbg);color:#b45309;border:1px solid var(--gold);font-size:0.66rem;font-weight:700;padding:2px 9px;border-radius:20px}
.pcard.core{border-width:2px}

/* credit requirements panel */
.credit-req-row{display:flex;align-items:center;gap:0.6rem;padding:0.5rem 0;border-bottom:1px solid var(--border);font-size:0.86rem}
.credit-req-row:last-child{border-bottom:none}
.credit-req-icon{font-size:1.1rem;flex-shrink:0}
.credit-grade-badge{display:inline-flex;align-items:center;gap:0.5rem;font-weight:800;font-size:1.1rem;padding:0.4rem 1rem;border-radius:20px;margin-top:0.8rem}

/* ═══════ COMPLETION REPORT ═══════ */
.report-name-row{display:flex;gap:0.6rem;flex-wrap:wrap;align-items:center;margin-bottom:1rem}
.report-name-row input{flex:1;min-width:200px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);padding:0.6rem 0.9rem;color:var(--text);font-size:0.9rem}
.report-name-row input:focus{outline:none;border-color:var(--flame)}
.checklist{list-style:none;display:flex;flex-direction:column;gap:0.5rem}
.checklist li{display:flex;align-items:center;gap:0.7rem;font-size:0.86rem;padding:0.65rem 0.9rem;border-radius:var(--rxs);border:1.5px solid var(--border);background:var(--surface2);flex-wrap:wrap}
.checklist li.cl-done{background:var(--lbg);border-color:var(--leaf);color:var(--leaf)}
.checklist li.cl-partial{background:var(--gbg);border-color:var(--gold);color:var(--gold)}
.checklist li.cl-missing{background:var(--surface2);border-color:var(--border);color:var(--text2)}
.cl-icon{font-size:1rem;flex-shrink:0}
.cl-text{flex:1;font-weight:600;color:var(--text)}
.cl-xp{font-size:0.72rem;font-weight:700;opacity:0.85;white-space:nowrap}
.cl-go-btn{font-size:0.72rem;padding:0.25rem 0.7rem;border:1.5px solid currentColor;border-radius:6px;cursor:pointer;background:transparent;color:inherit;font-weight:700;font-family:inherit;opacity:0.85;transition:opacity 0.2s;white-space:nowrap;flex-shrink:0}
.cl-go-btn:hover{opacity:1}
.reflect-counter{font-size:0.74rem;color:var(--text3)}
.reflect-counter.ok{color:var(--leaf);font-weight:700}
.code-box{background:linear-gradient(135deg,#0f766e,#0d9488);border-radius:var(--r);padding:1.4rem 1.6rem;text-align:center;margin:1rem 0}
.code-label{font-size:0.68rem;font-weight:700;letter-spacing:0.1em;color:rgba(255,255,255,0.75);text-transform:uppercase;margin-bottom:0.6rem}
.code-value{font-size:1.6rem;font-weight:800;color:#fff;letter-spacing:0.2em;font-family:'Lexend',monospace;margin-bottom:0.8rem;word-break:break-all}
.code-copy-btn{background:#fff;color:#0f766e;border:none;padding:0.55rem 1.3rem;border-radius:var(--rxs);font-size:0.8rem;font-weight:700;cursor:pointer;transition:all 0.2s}
.code-copy-btn:hover{background:#f0fdfa;transform:scale(1.03)}
.code-locked{background:var(--surface2);border:2px dashed var(--border);border-radius:var(--r);padding:1.2rem 1.4rem;color:var(--text2);font-size:0.86rem;line-height:1.7}
.code-locked strong{color:var(--text)}
.code-locked ul{margin:0.6rem 0 0 1.1rem}
.report-actions{display:flex;gap:0.6rem;flex-wrap:wrap;margin-top:1rem}
.sentence-box{background:var(--gbg);border:1px solid var(--gold);border-left:4px solid var(--gold);border-radius:0 var(--rxs) var(--rxs) 0;padding:0.75rem 1rem;font-size:0.85rem;line-height:1.65;color:var(--text)}

@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div id="app">
  <nav id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo"><span class="logo-icon"><img src="/uncviet/uncviet-mascott.png" alt="UNC Vietnamese mascot"></span>VIET 203</div>
      <div class="sidebar-sub">Mùa Hè Của Tôi · Bài 1 / 5</div>
    </div>
    <div class="sidebar-trau" id="trau-companion"></div>
    <div class="sidebar-progress">
      <div class="sp-label">Tiến độ Bài 1</div>
      <div class="sp-bar"><div class="sp-fill" id="xp-track-fill"></div></div>
      <div class="sp-text" id="xp-count-lbl">0 / 0 XP</div>
    </div>
    <div class="sidebar-nav" id="sidebar-nav"></div>
    <div class="sidebar-footer">
      <button class="btn-report-sb" onclick="openPart('report')">🏆 Báo Cáo Hoàn Thành</button>
      <button class="btn-reset-sb" id="reset-all">↩ Xóa tiến trình Bài 1</button>
      <button class="btn-reset-sb" onclick="resetTrau()">🐃 Đặt lại trâu (cả khóa)</button>
    </div>
  </nav>

  <div id="main">
    <div id="topbar">
      <div class="tb-left">
        <button id="menu-toggle" onclick="toggleSidebar()">☰</button>
        <div class="tb-title" id="tb-title">Mùa Hè Của Tôi &amp; Mùa Hè Của Nghiêm</div>
      </div>
      <span class="v2-badge">🧪 V2 DRAFT — TESTING</span>
      <span class="xp-level tb-badge" id="xp-level-lbl">🐮 Nghé Con</span>
    </div>
    <div id="content-area"></div>
  </div>
</div>

<div id="xp-pop"></div>
<div id="milestone-toast"><span class="mt-emoji"></span><span id="mt-msg"></span><div class="mt-sub" id="mt-sub"></div></div>

<script>
/* ===================== FOUR STRANDS (Paul Nation) =====================
   Every learning part below is tagged with its primary strand. XP is also
   tagged at the individual award-key level (see xpStrand()) so the dashboard
   balance meter reflects what a student actually DID, not just which part
   they clicked into — a part like Bài 2 mixes input (reading) and output
   (the connector paragraph), so its XP splits across two strands. */
const STRANDS = {
  input:   {vn:'Tiếp Nhận Ý Nghĩa',      en:'Meaning-Focused Input',  emoji:'📥', color:'#0d9488'},
  output:  {vn:'Tạo Ra Ý Nghĩa',         en:'Meaning-Focused Output', emoji:'📤', color:'#e11d48'},
  language:{vn:'Học Ngôn Ngữ Có Chủ Đích',en:'Language-Focused Learning', emoji:'🔍', color:'#b45309'},
  fluency: {vn:'Phát Triển Trôi Chảy',   en:'Fluency Development',   emoji:'⚡', color:'#a855f7'},
};

/* ===================== DATA =====================
   Three-tier structure: a WARM-UP (Khởi Động) comes first, then 3 CORE TASKS
   (T1 interpretive / T2 interpersonal / T3 presentational — the same IPA
   pattern used across VIET 203 modules) required for credit, then SUPPORT
   activities — optional practice that feeds one of the four strands and pads
   XP toward the 70% floor, but completing it is never itself required. */
/* ===================== V2 STRUCTURAL REDESIGN (2026-08-20) =====================
   See _archive/viet203-m1-revision/course-VIET203-M1-MuaHe-PEDAGOGY-REVISION.md §11
   for the full design rationale. Summary of what changed vs v1:
   - Khởi Động: 3 activities → 2 cards (p1a Lead-in hook, p1b Diagnostic can-do check).
     Tìm người mà... relocated into p3 as T2's in-class pre-task. Viết Nhanh dropped
     (no confirmed home — see §11.8 item 2).
   - Core tasks (p2/p3/p5) unchanged in count, but T2 and T3 now have explicit
     pre-task/post-task tabs matching T1's existing before/while/after shape.
   - Support: 5 parts → 3 (gl Language Lab unchanged; p6 Fluency & Extensive Skills
     absorbs the story library + song + new recycled-vocab listening/viewing content;
     pextra Extra Practice is new — A-grade enrichment across all four strands).
   - New Nộp Bài tier: pquick (can-do post-check + quick quiz) added before report.
   - Weighting: Core 100 / Fluency 42 / Language Lab 28 / ordinary-graded 10 = 180,
     plus a 20-point gamification bonus pool tracked separately (BONUS_MAX_XP below,
     not part of any single part) = 200 total, matching §11.7's confirmed 50/35/15 split. */
const PARTS = [
  {id:'p1a', num:'Khởi động', emoji:'🌤️', title:'3 Từ Về Mùa Hè', meta:'Khởi động — kích hoạt hứng thú trước khi đọc', tag:'Lead-in', strand:'output', warmup:true, where:'home'},
  {id:'p1b', num:'Khởi động', emoji:'✅', title:'Tự Đánh Giá "Tôi Có Thể"', meta:'Can-do statements — tự đánh giá trước module', tag:'Diagnostic', strand:'output', warmup:true, where:'home'},
  {id:'p2', num:'T1', emoji:'📖', title:'Đọc Hiểu: Mùa Hè Của Nghiêm', meta:'3 trình độ đọc · Điền bảng · Đúng/Sai', tag:'Interpretive', strand:'input', core:'T1', where:'home'},
  {id:'p3', num:'T2', emoji:'🗺️', title:'Kế Hoạch 3 Miền', meta:'Tìm người mà... · Khảo sát cặp · Lịch trình 5 ngày · Nhận xét', tag:'Interpersonal', strand:'output', core:'T2', where:'mixed'},

/* Max XP obtainable per part — drives module progress %, done-badges, and the report
   checklist. Values below are a first-pass allocation matching §11.7's confirmed
   50/35/15 band split (Core 100 · Fluency 42 · Language Lab 28 · ordinary-graded 10 =
   180, + a 20-pt gamification bonus pool tracked outside PART_MAX_XP = 200 total).
   Per-activity amounts inside each part are a reasonable first cut, not a calibrated
   audit — same "provisional, expect drift" caveat v1 already carried in §7. */
const PART_MAX_XP = {p1a:1, p1b:2, p2:36, p3:32, p5:32, p6:42, gl:28, pextra:4, pquick:3};
/* Sums to §11.7's confirmed bands: Core (p2+p3+p5)=100 · Fluency (p6)=42 · Language Lab
   (gl)=28 · "ordinary graded" (p1a+p1b+pextra+pquick)=10 → 180. pextra (Extra Practice)
   is intentionally thin (1 XP per strand slot) — it lives in the 15%-band "everything
   else" bucket alongside Khởi Động/Nộp Bài, not its own separate allocation; it's a
   light enrichment nudge for A-grade seekers, not core substance. */
const BONUS_MAX_XP = 20; // gamification pool (random bonus-XP + streak rewards) — see awardBonusXP()
const CORE_IDS = PARTS.filter(p=>p.core).map(p=>p.id);
const CREDIT_FLOOR_PCT = 70; // C grade — minimum for credit
const TOTAL_MAX_XP = Object.values(PART_MAX_XP).reduce((a,b)=>a+b,0) + BONUS_MAX_XP;
const XP_PART_COUNT = Object.keys(PART_MAX_XP).length;
// Requiring literal 100% on a part meant one exact-match miss on a single
// low-point item (e.g. one fill-in-blank spelling) permanently blocked that
// part's ✅, even though the student substantially did the work. "Done"
// everywhere in the UI (sidebar, dashboard, report, credit gating) now means
// "reached this share of the part's XP", not "got every micro-item perfect".
const PART_DONE_FRAC = 0.85;
function partDoneXP(id){ return Math.ceil(PART_MAX_XP[id]*PART_DONE_FRAC); }
function isPartDone(id){ return partXP(id) >= partDoneXP(id); }

/* ===================== STORAGE ===================== */
const NS = 'viet203-m1-v2::'; /* separate namespace from the live v1 module — testing here never touches real student data */
const NS_TRAU = 'viet203-trau::v1'; /* shared companion state — same key on every VIET 203 module page, same origin */
function save(key,val){ localStorage.setItem(NS+key, typeof val==='string'?val:JSON.stringify(val)); }
function load(key,fallback){ const v=localStorage.getItem(NS+key); if(v===null) return fallback; try{return JSON.parse(v);}catch(e){return v;} }
function saveRaw(key,val){ localStorage.setItem(key, typeof val==='string'?val:JSON.stringify(val)); }
function loadRaw(key,fallback){ const v=localStorage.getItem(key); if(v===null) return fallback; try{return JSON.parse(v);}catch(e){return v;} }
function trackedKeysWithPrefix(prefix){ return Object.keys(localStorage).filter(k=>k.startsWith(NS+prefix)); }

/* ===================== CON TRÂU COMPANION (persists across all modules) ===================== */
function trauLoad(){ return loadRaw(NS_TRAU, {xp:0, last:0, fired:[]}); }
function trauSave(s){ saveRaw(NS_TRAU, s); }
function trauStage(xp){
  let st = TRAU_STAGES[0];
  const frac = xp/COURSE_XP_ESTIMATE;
  TRAU_STAGES.forEach(s=>{ if(frac>=s.min) st=s; });
  return st;
}
function trauCondition(lastTs){
  if(!lastTs) return {emoji:'😴', label:'đang chờ bạn'};
  const days = (Date.now()-lastTs)/86400000;
  return days<=3 ? {emoji:'💪', label:'đang hăng hái'} : {emoji:'😴', label:'đang nghỉ ngơi'};
}
function growBuffalo(amount){
  const s = trauLoad();
  const prevStage = trauStage(s.xp);
  s.xp += amount;
  s.last = Date.now();
  const newStage = trauStage(s.xp);
  if(newStage.label !== prevStage.label && !s.fired.includes(newStage.label)){
    s.fired.push(newStage.label);
    trauSave(s);
    showMilestone(newStage.emoji, 'Trâu của bạn lên bậc: '+newStage.label+'!', newStage.sub);
    launchConfetti();
  } else {
    trauSave(s);
  }
  renderTrauCompanion();
}
function renderTrauCompanion(){
  const el = document.getElementById('trau-companion');
  if(!el) return;
  const s = trauLoad();
  const stage = trauStage(s.xp);
  const cond = trauCondition(s.last);
  const cosmetics = s.cosmetics||[];
  const cosmeticRow = cosmetics.length ? `<div class="cosmetic-row">${COSMETIC_UNLOCKS.map(c=>`<span class="${cosmetics.includes(c.id)?'unlocked':''}" title="${c.label}">${c.emoji}</span>`).join('')}</div>` : '';
  el.innerHTML = `<span class="tc-emoji">${stage.emoji}</span>
    <span class="tc-text"><span>${stage.label} <span class="tc-sub">· ${cond.emoji} ${cond.label}</span></span><span class="tc-sub">${stage.sub} — ${s.xp} XP cả khóa học${s.streak?' · 🔥 '+s.streak+' ngày liên tiếp':''}</span>${cosmeticRow}</span>`;
  el.title = 'Chú trâu này sẽ theo bạn qua mọi mô-đun của VIET 203 trong học kỳ.';
}
function resetTrau(){
  if(confirm('Đặt lại chú trâu của cả khóa học (XP tích lũy qua mọi mô-đun)? Không thể hoàn tác.')){
    localStorage.removeItem(NS_TRAU);
    renderTrauCompanion();
    updateXPHeader();
  }
}

/* ===================== GAMIFICATION (§11.7 — random bonus-XP, mystery unlocks, streaks) =====================
   A 20-point pool (BONUS_MAX_XP), separate from PART_MAX_XP, guardrailed off the credit
   floor structurally: Core alone (100/200=50%) plus a fully-maxed bonus pool (20/200=10%)
   still only reaches 60%, below the 70% floor — gamification can never substitute for
   genuine module engagement by construction, not by an extra runtime check (§12 review). */
function bonusState(){ return load('bonus-state', {total:0, lastAwardWasBonus:false, lastBonusDay:null}); }
function maybeAwardBonusXP(){
  const s = bonusState();
  if(s.total >= BONUS_MAX_XP) return;
  const today = new Date().toDateString();
  if(s.lastBonusDay === today){ return; } // max 1 bonus event per day
  if(s.lastAwardWasBonus){ s.lastAwardWasBonus=false; save('bonus-state', s); return; } // never two in a row
  if(Math.random() > 0.15) return; // ~15% chance per genuine completion
  const amount = Math.min(2, BONUS_MAX_XP - s.total);
  if(awardXP('bonus:random-'+Date.now(), amount)){
    s.total += amount; s.lastAwardWasBonus = true; s.lastBonusDay = today;
    save('bonus-state', s);
    showMilestone('🎁', 'Thưởng ngẫu nhiên! +'+amount+' XP', 'Phần thưởng bất ngờ vì bạn đang chăm chỉ học!');
  }
}
/* Daily activity streak — lives in the shared con trâu namespace so it persists across
   modules like the buffalo's own XP. A streak only ADDS a small reward; a broken streak
   never costs anything, matching the buffalo's existing "gentle neglect" condition logic. */
function checkStreak(){
  const s = trauLoad();
  const today = new Date().toDateString();
  if(s.streakDay === today) return; // already credited today
  const wasYesterday = s.streakDay && (Date.now() - new Date(s.streakDay).getTime()) < 2*86400000;
  s.streak = wasYesterday ? (s.streak||0)+1 : 1;
  s.streakDay = today;
  trauSave(s);
  if(s.streak>=2 && bonusState().total < BONUS_MAX_XP){
    const bs = bonusState();
    const amount = Math.min(1, BONUS_MAX_XP - bs.total);
    if(amount>0 && awardXP('bonus:streak-'+today, amount, true)){
      bs.total += amount; save('bonus-state', bs);
      showMilestone('🔥', 'Chuỗi ngày học: '+s.streak+' ngày liên tiếp!', '+'+amount+' XP thưởng — không mất gì nếu bạn nghỉ một ngày.');
    }
  }
}
/* Mystery unlocks — con trâu cosmetic accessories revealed at 3 progress thresholds,
   not shown as locked tiles in advance. Purely cosmetic, no XP attached. */
const COSMETIC_UNLOCKS = [
  {id:'hat', emoji:'🎩', at:()=>CORE_IDS.some(isPartDone), label:'Nón lá — hoàn thành nhiệm vụ chính đầu tiên'},
  {id:'flower', emoji:'🌸', at:()=>xpPct()>=50, label:'Hoa sen — đạt 50% tổng XP'},
  {id:'flag', emoji:'🚩', at:()=>creditGrade().eligible, label:'Cờ hoàn thành — đủ điều kiện tín chỉ'},
];
function checkMysteryUnlocks(){
  const s = trauLoad();
  s.cosmetics = s.cosmetics || [];
  let changed = false;
  COSMETIC_UNLOCKS.forEach(c=>{
    if(!s.cosmetics.includes(c.id) && c.at()){
      s.cosmetics.push(c.id);
      changed = true;
      showMilestone(c.emoji, 'Mở khóa bất ngờ!', c.label);
    }
  });
  if(changed){ trauSave(s); renderTrauCompanion(); }
}

function renderField(){

function renderStrandBalance(hostId){

/* ===================== XP / GAMIFICATION (this module) ===================== */
function xpAwarded(){ return load('xp-awarded', {}); }
function xpTotal(){ const a=xpAwarded(); return Object.values(a).reduce((s,v)=>s+v,0); }
function partXP(partId){
  const a=xpAwarded();
  return Object.keys(a).filter(k=>k.startsWith(partId+':')).reduce((s,k)=>s+a[k],0);
}
/* Which of Nation's four strands does this XP-award key belong to? Tagged at the
   activity level (not the part level) because a part like p2 mixes strands: the
   reading+quiz is input, the connector paragraph is output. */
function xpStrand(key){
  if(key.startsWith('bonus:')) return null; // gamification pool — deliberately untagged, doesn't skew the strand balance (§12 review)
  if(key.startsWith('p6:')) return 'fluency'; // includes relocated story library + song + recycled-vocab listening/viewing, per §11.4's confirmed recycled-only rule
  if(key.startsWith('gl:')) return 'language';
  if(key.startsWith('p2:post')) return 'output'; // after-reading reaction/compare — student produces language, not just processes it
  if(key.startsWith('p2:')) return 'input'; // T1 — reading + comprehension (pre-reading schema-building counts as input too)
  if(key.startsWith('p3:pretask-priming')) return 'input'; // vocab priming — receiving, not yet producing
  if(key.startsWith('pextra:input')) return 'input';
  if(key.startsWith('pextra:language')) return 'language';
  if(key.startsWith('pextra:fluency')) return 'fluency';
  if(key.startsWith('pextra:output')) return 'output';
  return 'output'; // p1a/p1b (reflection/self-check), p3 (T2 mixer+negotiation+noticing+feedback), p5 (T3 blog+speaking+self-assess), pquick (cando+quiz recall)
}
function strandTotals(){
  const totals = {input:0, output:0, language:0, fluency:0};
  const a = xpAwarded();
  Object.entries(a).forEach(([k,v])=>{ const s=xpStrand(k); if(s) totals[s] += v; });
  return totals;
}

/* ===================== CREDIT / GRADING =====================
   Credit requires BOTH: all 3 core tasks (T1/T2/T3) complete, AND total XP
   at or above the 70% floor (a C). Support-activity XP alone can never
   substitute for a missing core task — that's the whole point of splitting
   them out. */
function coreTasksDone(){ return CORE_IDS.every(isPartDone); }
function xpPct(){ return TOTAL_MAX_XP ? Math.round(xpTotal()/TOTAL_MAX_XP*100) : 0; }
function creditGrade(){
  const pct = xpPct();
  const allCore = coreTasksDone();
  let grade = null;
  if(allCore && pct>=90) grade='A';
  else if(allCore && pct>=80) grade='B';
  else if(allCore && pct>=CREDIT_FLOOR_PCT) grade='C';
  return {pct, allCore, grade, eligible: !!grade};
}
function renderCreditPanel(hostId){
  const host = document.getElementById(hostId||'credit-panel');
  if(!host) return;
  const g = creditGrade();
  const rows = PARTS.filter(p=>p.core).map(p=>{
    const earned = partXP(p.id), max = PART_MAX_XP[p.id];
    const done = isPartDone(p.id);
    const goBtn = done ? '' : `<button class="cl-go-btn" onclick="openPart('${p.id}')">Đi tới →</button>`;
    return `<div class="credit-req-row"><span class="credit-req-icon">${done?'✅':'⭕'}</span><span style="flex:1">${p.core} — ${p.title} <span style="color:var(--text3);font-size:0.78rem">(${earned} / ${max} XP)</span></span>${goBtn}</div>`;
  }).join('');
  const xpRow = `<div class="credit-req-row"><span class="credit-req-icon">${g.pct>=CREDIT_FLOOR_PCT?'✅':'⭕'}</span><span>Tổng XP ≥ ${CREDIT_FLOOR_PCT}% <span style="color:var(--text3)">(hiện tại: ${g.pct}%)</span></span></div>`;
  const badgeColor = g.grade==='A' ? 'var(--lbg);color:var(--leaf)' : g.grade==='B' ? 'var(--fglow);color:var(--flame2)' : g.grade==='C' ? 'var(--gbg);color:#b45309' : 'var(--cbg);color:var(--coral)';
  const badgeText = g.eligible ? `🎓 Đủ điều kiện lấy tín chỉ — Hạng ${g.grade}` : (g.allCore ? `Cần thêm XP để đạt ${CREDIT_FLOOR_PCT}% (còn thiếu ${Math.max(0,CREDIT_FLOOR_PCT-g.pct)}%)` : 'Chưa đủ điều kiện — còn thiếu nhiệm vụ chính');
  host.innerHTML = rows + xpRow + `<div class="credit-grade-badge" style="background:${badgeColor}">${badgeText}</div>`;
}
function awardXP(key, amount, silent){
  const a = xpAwarded();
  if(a[key]!==undefined) return false; // already awarded — idempotent
  a[key]=amount;
  save('xp-awarded', a);
  // `silent` skips the celebratory popup/buffalo-growth (and any milestone
  // toast/confetti growBuffalo triggers) — used when a check function runs
  // during setup to restore already-saved-correct state, so re-opening a
  // tab never surprises a student with a "reward" animation for something
  // they did before this session. Counters/badges still update either way.
  if(!silent){ showXPPopup(amount); growBuffalo(amount); }
  updateXPHeader();
  refreshLiveUI();
  // Gamification pool (§11.7) — only a genuine, non-bonus, non-restored award can
  // trigger a bonus/streak check, so bonus-XP itself never chains into more bonus-XP.
  if(!silent && !key.startsWith('bonus:')){ maybeAwardBonusXP(); checkStreak(); checkMysteryUnlocks(); }
  return true;
}
/* Keep the sidebar badges, dashboard cards, and progress widgets in sync the
   moment XP lands — awardXP() used to only update the header, so a part
   finished last (e.g. T1) stayed marked incomplete in the sidebar/report
   until you navigated away and back. Everything called here is null-guarded
   for the view that isn't currently mounted, so this is safe to call from
   any part. */
function refreshLiveUI(){
  buildSidebarNav();
  renderField();
  renderStrandBalance();
  renderCreditPanel();
}

/* ===================== TIME-ON-TASK TRACKING (estimate, not authoritative) =====================
   Wall-clock time between switching into a part and switching away, paused while the tab is
   hidden. It's an estimate for the instructor's report, not a real focus/attention measure —
   a student who leaves the tab open and visible but steps away still accrues time. */
let _timeTrackedPart = null;
let _timeSegmentStart = null;
function timeSpentMap(){ return load('time-spent', {}); }
function addPartTime(id, ms){
  if(!id || ms<=0) return;
  const t = timeSpentMap();
  t[id] = (t[id]||0) + ms;
  save('time-spent', t);
}
function flushTimeSegment(){
  if(_timeTrackedPart && _timeSegmentStart) addPartTime(_timeTrackedPart, Date.now()-_timeSegmentStart);
  _timeSegmentStart = null;
}
function trackViewChange(id){
  flushTimeSegment();
  _timeTrackedPart = PART_MAX_XP.hasOwnProperty(id) ? id : null;
  _timeSegmentStart = (_timeTrackedPart && !document.hidden) ? Date.now() : null;
}
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden) flushTimeSegment();
  else if(_timeTrackedPart) _timeSegmentStart = Date.now();
});
window.addEventListener('beforeunload', flushTimeSegment);
function formatDuration(ms){
  const totalMin = Math.round(ms/60000);
  if(totalMin<1) return '<1 phút';
  if(totalMin<60) return totalMin+' phút';
  const h = Math.floor(totalMin/60), m = totalMin%60;
  return h+'g'+(m?' '+m+'p':'');
}
function showXPPopup(amount){
  const pop = document.getElementById('xp-pop');
  if(!pop) return;
  pop.textContent = '+'+amount+' XP';
  pop.classList.remove('show'); void pop.offsetWidth;
  pop.classList.add('show');
  clearTimeout(pop._t);
  pop._t = setTimeout(()=>pop.classList.remove('show'), 1300);
}
function showMilestone(emoji, msg, sub){
  const t = document.getElementById('milestone-toast');
  if(!t) return;
  t.querySelector('.mt-emoji').textContent = emoji;
  document.getElementById('mt-msg').textContent = msg;
  document.getElementById('mt-sub').textContent = sub||'';
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(()=>t.classList.remove('show'), 3200);
}
function launchConfetti(){
  const colors=['#0d9488','#fbbf24','#15803d','#e11d48','#a855f7'];
  for(let i=0;i<50;i++){
    setTimeout(()=>{
      const el=document.createElement('div'); el.className='confetti-piece';
      el.style.left=Math.random()*100+'vw';
      el.style.background=colors[Math.floor(Math.random()*colors.length)];
      el.style.animationDuration=(1.1+Math.random()*0.8)+'s';
      el.style.width=el.style.height=(7+Math.random()*7)+'px';
      document.body.appendChild(el);
      setTimeout(()=>el.remove(),2200);
    },i*22);
  }
}
function updateXPHeader(){
  const total = xpTotal();
  const frac = TOTAL_MAX_XP ? Math.min(1,total/TOTAL_MAX_XP) : 0;
  const fillEl = document.getElementById('xp-track-fill');
  const lvlEl = document.getElementById('xp-level-lbl');

  keys.forEach(k=>{

      <div class="sec-title" style="margin-top:1.8rem">Hoạt Động Hỗ Trợ <span style="font-weight:400;text-transform:none;font-size:0.72rem;color:var(--text3)">luyện tập, không bắt buộc từng phần</span></div>

      <div class="parts-grid" id="report-grid"></div>

    const earned = partXP(p.id);
    const max = PART_MAX_XP[p.id];
    const done = isPartDone(p.id);
    const pct = max? Math.round((earned/max)*100) : 0;
    return `<button class="pcard${done?' done':''}${p.core?' core':''}" data-part="${p.id}">
      ${done?'<span class="pc-done-badge">✓ Hoàn thành</span>':(p.core?'<span class="pc-required-badge">Bắt buộc</span>':'')}
      <div class="pc-num" ${p.core?'style="color:#b45309"':''}>${p.core?p.core:p.num}</div>

      <div class="pc-title">${p.title}</div>
      <div class="pc-meta">${p.meta}</div>
      <div style="margin-top:0.5rem">${strandBadge}</div>
      <div class="pc-bar"><div class="pc-fill" style="width:${pct}%"></div></div>
      <div style="font-size:0.68rem;color:var(--text3);margin-top:0.35rem;font-variant-numeric:tabular-nums">${earned} / ${max} XP</div>
    </button>`;
  };
  document.getElementById('warmup-grid').innerHTML = warmupParts.map(renderCard).join('');
  document.getElementById('core-grid').innerHTML = coreParts.map(renderCard).join('');
  document.getElementById('support-grid').innerHTML = supportParts.map(renderCard).join('');
  const pquickP = PARTS.find(p=>p.id==='pquick');
  const reportP = PARTS.find(p=>p.id==='report');
  const ready = isReportReady();
  document.getElementById('report-grid').innerHTML = renderCard(pquickP) + `<button class="pcard${ready?' done':''}" data-part="report" style="${ready?'':'border-color:var(--gold)'}">
    ${ready?'<span class="pc-done-badge">✓ Sẵn sàng</span>':''}
    <div class="pc-num" style="color:var(--gold)">${reportP.num}</div>
    <span class="pc-emoji">${reportP.emoji}</span>
    <div class="pc-title">${reportP.title}</div>
    <div class="pc-meta">${reportP.meta}</div>
  </button>`;
  document.querySelectorAll('.pcard').forEach(el=>el.addEventListener('click',()=>openPart(el.dataset.part)));

  renderField();
  renderStrandBalance();
  renderCreditPanel();
  renderTrauCompanion();
  buildSidebarNav();
  updateXPHeader();
  window.scrollTo(0,0);
}

/* ===================== VIEW ROUTING ===================== */
function openPart(id){
  if(id==='home'){ renderDashboard(); return; }
  if(id==='report'){ openReport(); return; }
  currentView = id;
  trackViewChange(id);
  const p = PARTS.find(x=>x.id===id);
  const host = document.getElementById('content-area');
  document.getElementById('tb-title').textContent = p.emoji+' '+p.title;
  host.innerHTML = buildPartShell(p);
  buildSidebarNav();
  window.scrollTo(0,0);
  if(window.innerWidth<=860) closeSidebar();
  initPart(id);
}
function openReport(){
  currentView = 'report';
  trackViewChange('report');
  const p = PARTS.find(x=>x.id==='report');
  const host = document.getElementById('content-area');
  document.getElementById('tb-title').textContent = p.emoji+' '+p.title;
  host.innerHTML = buildPartShell(p);
  buildSidebarNav();
  window.scrollTo(0,0);
  if(window.innerWidth<=860) closeSidebar();
  initReport();
}
function toggleSidebar(){ document.getElementById('sidebar').classList.toggle('open'); }
function closeSidebar(){ document.getElementById('sidebar').classList.remove('open'); }

function buildPartShell(p){
  const tabsHtml = (p.tabs||[]).map((t,i)=>`<button class="mtab ${i===0?'active':''}" data-tab="${t.id}">${t.label}</button>`).join('');
  const viewsHtml = (p.tabs||[]).map((t,i)=>`<div class="mview ${i===0?'active':''}" id="mv-${t.id}"></div>`).join('');
  // At-home/in-class tag (§11.6) — 'mixed' (e.g. T2, which has an in-class pre-task
  // tab) shows both badges since the tag is part-level, not tab-level, in this build.
  const whereTag = p.where==='class' ? `<span class="tag-inclass">🏫 Trên lớp</span>`
    : p.where==='mixed' ? `<span class="tag-athome">🏠 Ở nhà</span><span class="tag-inclass">🏫 Có phần trên lớp</span>`
    : p.where==='home' ? `<span class="tag-athome">🏠 Ở nhà</span>` : '';
  return `
  <div class="lhdr">
    <button class="back-btn" onclick="renderDashboard()">← Trang chính</button>
    <div class="lhdr-title">${p.emoji} ${p.title}</div>
    ${whereTag}
    <div class="lhdr-tag">${p.tag}</div>
  </div>
  ${p.tabs ? `<div class="mode-tabs">${tabsHtml}</div>` : ''}
  <div class="lbody">${viewsHtml || '<div class="mview active" id="mv-single"></div>'}</div>`;
}

function wireTabs(){
  document.querySelectorAll('.mtab').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.mtab').forEach(b=>b.classList.remove('active'));
      document.querySelectorAll('.mview').forEach(v=>v.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('mv-'+btn.dataset.tab).classList.add('active');
    });
  });
}

function initPart(id){
  const fns = {p1a:initP1a, p1b:initP1b, p2:initP2, p3:initP3, p5:initP5, p6:initP6, gl:initGlossary, pextra:initPextra, pquick:initPquick};
  fns[id]();
}

  bindPersist(predictHost);

    if(n>=3) awardXP('p2:pre-predict', 2);

    <div class="block">
      <div class="block-title">Văn Bản Đọc Phân Hóa</div>

        <select class="tts-rate" id="p2-tts-rate">
          <option value="0.7">🐢 Chậm</option>

          <option value="1.1">🏃 Nhanh</option>
        </select>
        <span class="tts-hint">💡 Chạm vào từ được gạch chân để xem nghĩa tiếng Anh</span>
      </div>
      <div class="reading-card" id="reading-content"></div>

  const setLevel = i=>{
    stopP2TTS();

    document.getElementById('reading-content').innerHTML = parseVocabTooltips(READINGS[i].html);

              <td>Thăm <input class="blank" data-key="p2::blank-favorite" data-answer="Huế" placeholder="địa điểm yêu thích"> (địa điểm yêu thích nhất)</td></tr>

        </tbody>
      </table></div>
    </div>
    <div class="block">
      <div class="block-title">Hoạt động 2 · Đọc hiểu chi tiết (Đúng / Sai)</div>

      <div id="tf-list"></div>
    </div>`;

  compHost.querySelectorAll('.blank').forEach(inp=>{
    inp.value = load(inp.dataset.key,'');
    const checkBlank = (isInit)=>{
      const ok = normalizeVN(inp.value) === normalizeVN(inp.dataset.answer);
      inp.classList.toggle('ok', ok);
      if(ok){ awardXP('p2:fill:'+inp.dataset.key, 3, isInit); inp.title=''; }
      else {
        const ansSafe = (inp.dataset.answer||'').normalize('NFC');
        inp.title = inp.value.trim() ? 'Gợi ý: đáp án bắt đầu bằng "'+(ansSafe[0]||'')+'"' : '';
      }
    };
    inp.addEventListener('input',()=>{ save(inp.dataset.key, inp.value); checkBlank(false); });
    checkBlank(true); // restore saved state silently — no popup for answers already correct before this page load
  });

  const tfList = document.getElementById('tf-list');
  tfList.innerHTML = TF_ITEMS.map((t,i)=>`
    <div class="tf-row" id="tf-row-${i}">
      <div class="tf-text">${i+1}. ${t.q}<div class="tf-feedback" id="tf-fb-${i}"></div></div>
      <div class="tf-btns">

  // A wrong guess used to lock the question forever — one mistake meant
  // those 5 XP (and full T1 completion) were permanently unreachable, no
  // matter what a student did afterward. Now it only locks once the
  // CORRECT answer is chosen; a wrong guess shows feedback and lets you
  // try again, matching how every other T1 activity already works.
  function revealTF(i, chosen, locked){
    const t = TF_ITEMS[i];
    const isRight = chosen===t.a;
    tfList.querySelectorAll(`.tf-btn[data-i="${i}"]`).forEach(b=>{

      save('p2::tf-'+i, btn.dataset.v);

/* ===================== INLINE VOCAB TOOLTIPS (reading passages) ===================== */
function parseVocabTooltips(html){
  return html.replace(/\|([^|]+)\|([^|]+)\|/g,(_,vn,en)=>`<span class="vt" tabindex="0">${vn}<span class="vt-tip">${en}</span></span>`);
}
function stripForTTS(html){
  return html.replace(/\|([^|]+)\|[^|]+\|/g,'$1').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
}

/* ===================== RECORDED AUDIO (falls back to browser TTS) =====================
   `files` is a list of real recordings (one per paragraph for longer passages) played
   back-to-back; on any load/playback error (missing file, blocked autoplay) it drops to
   speechSynthesis for `text` instead, same fallback pattern as ipa-204's RP_AUDIO. */
let _activeAudioEl = null;
function stopAnyAudio(){
  if(_activeAudioEl){ _activeAudioEl.pause(); _activeAudioEl=null; }
  if(window.speechSynthesis) speechSynthesis.cancel();
}
function speakTTS(text, rate, onEnd){
  if(!window.speechSynthesis){ onEnd&&onEnd(); return; }
  const u = new SpeechSynthesisUtterance(text);
  u.lang='vi-VN'; u.rate=rate;
  const voices = speechSynthesis.getVoices().filter(v=>v.lang.startsWith('vi'));
  if(voices.length) u.voice=voices[0];
  u.onend=()=>onEnd&&onEnd();
  u.onerror=()=>onEnd&&onEnd();
  speechSynthesis.speak(u);
}
function playAudioOrTTS(files, text, rate, onEnd){
  if(!files || !files.length){ speakTTS(text, rate, onEnd); return; }
  let idx = 0;
  const playNext = ()=>{
    if(idx>=files.length){ onEnd&&onEnd(); return; }
    const audio = new Audio(files[idx]);
    audio.playbackRate = rate;
    _activeAudioEl = audio;
    audio.onended = ()=>{ idx++; playNext(); };
    audio.onerror = ()=> speakTTS(text, rate, onEnd);
    audio.play().catch(()=> speakTTS(text, rate, onEnd));
  };
  playNext();
}
function wireVocabTooltips(scope){
  scope.querySelectorAll('.vt').forEach(el=>{
    el.addEventListener('click',e=>{
      e.stopPropagation();
      const tip = el.querySelector('.vt-tip'); if(!tip) return;
      document.querySelectorAll('.vt-tip.show').forEach(t=>{ if(t!==tip) t.classList.remove('show'); });
      tip.classList.toggle('show');
    });
  });
}

  document.getElementById('btn-p2x-tts').addEventListener('click',()=>{
    if(p2xTtsPlaying){ stopP2xTTS(); return; }
    const rate = parseFloat(document.getElementById('p2x-tts-rate').value);
    p2xTtsPlaying = true;
    updateP2xTtsBtn(true);
    playAudioOrTTS(s.audio?[s.audio]:null, stripForTTS(s.body), rate, stopP2xTTS);
  });
  window.scrollTo(0,0);
}
function updateP2xTtsBtn(playing){
  const b = document.getElementById('btn-p2x-tts'); if(!b) return;
  b.className = 'btn-tts'+(playing?' playing':'');
  b.innerHTML = playing ? '⏹ Dừng' : '🔊 Nghe';
}
function stopP2xTTS(){
  stopAnyAudio();
  p2xTtsPlaying = false;
  updateP2xTtsBtn(false);
}
function closeStoryReader(){
  document.getElementById('story-reader').innerHTML = '';
  renderStoryGrid();
  window.scrollTo(0,0);
}
function renderStoryQuiz(id){
  const s = STORIES.find(x=>x.id===id);
  const block = document.getElementById('story-quiz-block');
  block.innerHTML = `<div class="block-title">❓ Câu Hỏi Đọc Hiểu</div>` +
    s.qs.map((q,qi)=>`
    <div class="question-block" id="sq-${id}-${qi}">
      <div class="q-number">Câu ${qi+1}</div>
      <div class="q-text">${q.q}</div>
      <div class="options">${q.opts.map((opt,oi)=>`<button class="opt-btn" data-oi="${oi}" onclick="selectStoryOpt(${id},${qi},${oi})">${String.fromCharCode(65+oi)}. ${opt}</button>`).join('')}</div>
      <div class="q-feedback" id="sq-fb-${id}-${qi}"></div>
    </div>`).join('') +
    `<div class="quiz-result" id="story-result-${id}"></div>`;
  s.qs.forEach((q,qi)=>{
    const saved = load('story-'+id+'-q'+qi, null);
    if(saved!==null) revealStoryOpt(id, qi, saved);
  });
  maybeShowStoryResult(id);
}
function selectStoryOpt(id, qi, oi){
  const key = 'story-'+id+'-q'+qi;
  if(load(key, null)!==null) return; // already answered — locked, like the marathon quiz it's adapted from
  save(key, oi);
  revealStoryOpt(id, qi, oi);
  maybeShowStoryResult(id);
}
function revealStoryOpt(id, qi, chosen){
  const s = STORIES.find(x=>x.id===id);
  const q = s.qs[qi];
  const isRight = chosen===q.ans;
  const block = document.getElementById('sq-'+id+'-'+qi);
  if(!block) return;
  block.querySelectorAll('.opt-btn').forEach((btn,i)=>{
    btn.disabled = true;
    if(i===q.ans) btn.classList.add('correct');
    if(i===chosen && !isRight) btn.classList.add('wrong');
  });
  const fb = document.getElementById('sq-fb-'+id+'-'+qi);
  if(fb){
    fb.textContent = isRight ? '✅ Đúng!' : '❌ Sai — đáp án đúng đã được đánh dấu.';
    fb.style.color = isRight ? 'var(--leaf)' : 'var(--coral)';
  }
}
function storyScore(id){
  const s = STORIES.find(x=>x.id===id);
  let correct=0, answered=0;
  s.qs.forEach((q,qi)=>{
    const v = load('story-'+id+'-q'+qi, null);
    if(v!==null){ answered++; if(v===q.ans) correct++; }
  });
  return {correct, answered, total:s.qs.length};
}
function maybeShowStoryResult(id){
  const {correct,answered,total} = storyScore(id);
  const resEl = document.getElementById('story-result-'+id);
  if(!resEl) return;
  if(answered<total){ resEl.innerHTML=''; return; }
  const good = correct>=4, ok = correct>=3;
  resEl.innerHTML = `<div class="qr-circle" style="background:${good?'var(--lbg)':ok?'var(--gbg)':'var(--cbg)'};color:${good?'var(--leaf)':ok?'var(--gold)':'var(--coral)'}">${correct}/${total}</div>`;
  if(ok && awardXP('p6:story-'+id, 2)){
    save('story-'+id+'-done', true);
  }
}

function buildVocabPool(){
  const flat = [];
  VOCAB_P1.forEach(g=>g.items.forEach(pair=>flat.push(pair)));
  GLOSSARY.forEach(g=>g.items.forEach(pair=>flat.push(pair)));
  for(let i=flat.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [flat[i],flat[j]]=[flat[j],flat[i]]; }
  return flat;
}

    </div>`;
}
function startVocabSprint(){
  clearInterval(vsTimer);
  vsPool = buildVocabPool(); vsIdx=0; vsKnown=0; vsSeen=0; vsRunning=true;
  document.getElementById('vs-start').style.display='none';
  document.getElementById('vs-btns').style.display='flex';
  document.getElementById('vs-result').innerHTML='';
  showNextVsWord();
  let t=60;
  document.getElementById('vs-timer').textContent=t;
  vsTimer = setInterval(()=>{
    t--;
    document.getElementById('vs-timer').textContent=Math.max(0,t);
    if(t<=0) endVocabSprint();
  },1000);
}
function showNextVsWord(){
  if(vsIdx>=vsPool.length) vsIdx=0;
  const el = document.getElementById('vs-word');
  if(el) el.textContent = vsPool[vsIdx][0];
}
function vsAnswer(knew){
  if(!vsRunning) return;
  vsSeen++;
  if(knew) vsKnown++;
  vsIdx++;
  showNextVsWord();
}
function endVocabSprint(){
  vsRunning=false;
  clearInterval(vsTimer);
  const btns=document.getElementById('vs-btns'), word=document.getElementById('vs-word'), start=document.getElementById('vs-start');
  if(btns) btns.style.display='none';
  if(word) word.textContent='⏱ Hết giờ!';
  if(start){ start.style.display='inline-block'; start.textContent='↻ Thử lại'; }
  const best = load('p6::vocab-best', 0);
  const isRecord = vsKnown>best;
  if(isRecord) save('p6::vocab-best', vsKnown);
  const resEl = document.getElementById('vs-result');
  if(resEl) resEl.innerHTML = `<p class="instr" style="margin-top:0.8rem">Bạn nhớ được <strong>${vsKnown}</strong> / ${vsSeen} từ đã xem trong 60 giây.${isRecord?' 🎉 Kỷ lục mới!':''}</p>`;
  if(vsKnown>=15) awardXP('p6:vocabsprint', 4);
}

/* --- Dictation drill: TTS reads a sentence, student transcribes, exact-match check
   (punctuation-insensitive but diacritic-strict). --- */
const DICTATION_ITEMS = [
  "Mùa hè này tôi đã đi thăm Vịnh Hạ Long.",
  "Trước hết, tôi muốn kể về chuyến đi mùa hè vừa rồi.",

  "Chúng tôi đã cùng nhau đi bắn cung hai lần.",
];
function normalizeDictation(s){
  return (s||'').replace(/[.,!?;:"'…]/g,'').normalize('NFC').toLowerCase().trim().replace(/\s+/g,' ');
}
function renderDictationDrill(){
  const host = document.getElementById('mv-dict');

    </div>`).join('');
  list.querySelectorAll('textarea').forEach(ta=>{
    ta.value = load(ta.dataset.key,'');
    ta.addEventListener('input',()=>save(ta.dataset.key, ta.value));
  });
  document.getElementById('dict-check').addEventListener('click',()=>{
    let correct=0;
    DICTATION_ITEMS.forEach((s,i)=>{
      const ta = list.querySelector(`[data-key="gl::dict-${i}"]`);
      const ok = normalizeDictation(ta.value)===normalizeDictation(s);
      ta.style.borderColor = ok?'var(--leaf)':'var(--coral)';
      if(ok) correct++;
    });
    document.getElementById('dict-result').innerHTML = `Bạn chép đúng <strong>${correct}/${DICTATION_ITEMS.length}</strong> câu. ${correct<DICTATION_ITEMS.length?'Nghe lại và so sánh với câu gốc để tự sửa.':''}`;

let dictTtsPlaying = false;
function playDictation(i){
  if(!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(DICTATION_ITEMS[i]);
  u.lang = 'vi-VN'; u.rate = 0.85;
  const voices = speechSynthesis.getVoices().filter(v=>v.lang.startsWith('vi'));
  if(voices.length) u.voice = voices[0];
  speechSynthesis.speak(u);
}

/* --- Grammar drill: MCQ cloze on the taught forms (đã, connectors, sequencing) —
   tests FORM, distinct from the comprehension quizzes which test meaning. --- */
const GRAMMAR_ITEMS = [
  {q:"Mùa hè này, tôi ___ đi Đà Lạt chơi bốn ngày.", opts:["đã","sẽ","đang","hay"], ans:0},
  {q:"___, tôi muốn kể về chuyến đi Hà Nội. Sau đó tôi sẽ nói về Huế.", opts:["Trước hết","Tuy nhiên","Vì vậy","Nếu"], ans:0},
  {q:"Tôi thích Hà Nội. ___, tôi cũng rất thích Huế.", opts:["Ngoài ra","Vì","Nhưng mà không","Nếu không"], ans:0},
  {q:"Đầu tiên tôi đi thăm Vịnh Hạ Long, ___ tôi đi Huế.", opts:["sau đó","trước đây","chưa bao giờ","đừng"], ans:0},
  {q:"___, tôi rất vui vì chuyến đi này rất đáng nhớ.", opts:["Cuối cùng","Bởi vì","Nếu như","Trong khi"], ans:0},

  const qHost = document.getElementById('gram-questions');

function selectGramOpt(qi, oi){
  const key = 'gl::gram-'+qi;

function revealGramOpt(qi, chosen){
  const q = GRAMMAR_ITEMS[qi];
  const isRight = chosen===q.ans;
  const block = document.getElementById('gq-'+qi);
  if(!block) return;

/* ===================== VOCAB IN CONTEXT (YouGlish embed) =====================
   Real native pronunciations of a word pulled from real YouTube videos —
   https://youglish.com/pronounce/m%C3%B9a_h%C3%A8/vietnamese is the default
   query. YouGlish's own page sends X-Frame-Options: DENY, so a plain <iframe>
   to that URL won't render — their public widget.js (loaded once, reused
   across tab re-visits) builds its own embeddable iframe internally instead. */
let ygWidget = null;
let ygScriptLoading = false;
function ensureYouglishScript(cb){
  if(window.YG){ cb(); return; }
  window._ygCallbacks = window._ygCallbacks || [];
  window._ygCallbacks.push(cb);
  if(ygScriptLoading) return;
  ygScriptLoading = true;
  window.onYouglishAPIReady = function(){
    (window._ygCallbacks||[]).forEach(fn=>fn());
    window._ygCallbacks = [];
  };
  const s = document.createElement('script');
  s.src = 'https://youglish.com/public/emb/widget.js';
  document.head.appendChild(s);
}
function renderVocabInContext(){
  const host = document.getElementById('mv-ctx');
  if(!host) return;
  host.innerHTML = `
    <div class="block">
      <div class="block-title">🎬 Từ Vựng Trong Ngữ Cảnh <span style="font-weight:400;color:var(--text3);font-size:0.8rem">nghe từ được phát âm trong video thật (YouGlish)</span></div>
      <p class="instr">Gõ một từ tiếng Việt để nghe người bản xứ phát âm từ đó trong các video YouTube thật — hữu ích để nghe ngữ điệu và cách dùng từ trong ngữ cảnh tự nhiên, không chỉ đọc nghĩa.</p>
      <div class="tts-bar">
        <input type="text" class="gloss-search" id="yg-query" value="mùa hè" style="flex:1;min-width:160px">
        <button class="btn-tts" id="yg-search-btn">🔎 Tìm</button>
      </div>
      <div id="yg-widget-container" style="margin-top:1rem;min-height:340px"></div>
      <div class="tts-bar" style="margin-top:0.6rem">
        <button class="btn-tts" id="yg-prev-btn">⬅ Video trước</button>
        <button class="btn-tts" id="yg-next-btn">Video tiếp theo ➡</button>
        <span class="tts-hint">💡 Chuyển sang video khác cũng chứa từ khóa bạn vừa tìm</span>
      </div>
    </div>`;
  let ygSearchCount = load('gl::yg-search-count', 0);
  const doYgSearch = ()=>{
    const q = document.getElementById('yg-query').value.trim();
    if(!q || !ygWidget) return;
    ygWidget.fetch(q, 'vietnamese');
    ygSearchCount++;
    save('gl::yg-search-count', ygSearchCount);
    if(ygSearchCount>=2) awardXP('gl:youglish', 4);
  };
  document.getElementById('yg-search-btn').addEventListener('click', doYgSearch);
  document.getElementById('yg-query').addEventListener('keydown', e=>{ if(e.key==='Enter') doYgSearch(); });
  document.getElementById('yg-prev-btn').addEventListener('click', ()=>{ if(ygWidget) ygWidget.previous(); });
  document.getElementById('yg-next-btn').addEventListener('click', ()=>{ if(ygWidget) ygWidget.next(); });
  ensureYouglishScript(()=>{
    ygWidget = new YG.Widget('yg-widget-container', {components: 9});
    ygWidget.fetch(document.getElementById('yg-query').value.trim(), 'vietnamese');
  });
}

        <div class="q-feedback" id="pq-fb-${i}"></div></div>`;
    }

  }).join('');
  QUICK_QUIZ.forEach((q,i)=>{
    const saved = load('pquick::q-'+i, null);
    if(saved!==null) pquickReveal(i, saved);
  });

function pquickAnswer(i, chosen){
  if(load('pquick::q-'+i, null)!==null) return;
  save('pquick::q-'+i, chosen);
  pquickReveal(i, chosen);
  pquickMaybeShowResult();
}
function pquickIsCorrect(i, chosen){
  const q = QUICK_QUIZ[i];
  return q.type==='mcq' ? chosen===q.ans : chosen===(q.a?'D':'S');
}
function pquickReveal(i, chosen){
  const q = QUICK_QUIZ[i];
  const block = document.getElementById('pq-'+i);
  if(!block) return;
  const isRight = pquickIsCorrect(i, chosen);
  if(q.type==='mcq'){
    block.querySelectorAll('.opt-btn').forEach((btn,oi)=>{
      btn.disabled = true;
      if(oi===q.ans) btn.classList.add('correct');
      if(oi===chosen && !isRight) btn.classList.add('wrong');
    });
  } else {
    const correctV = q.a?'D':'S';
    block.querySelectorAll('.tf-btn').forEach(btn=>{
      btn.disabled = true;
      if(btn.dataset.v===correctV) btn.classList.add('correct');
      if(btn.dataset.v===chosen && !isRight) btn.classList.add('wrong');
    });
  }
  const fb = document.getElementById('pq-fb-'+i);
  if(fb){ fb.textContent = isRight ? '✅ Đúng!' : '❌ Sai — đáp án đúng đã được đánh dấu.'; fb.style.color = isRight ? 'var(--leaf)' : 'var(--coral)'; }
}
function pquickMaybeShowResult(){
  const answered = QUICK_QUIZ.filter((_,i)=>load('pquick::q-'+i,null)!==null);
  const resEl = document.getElementById('pquick-quiz-result');
  if(!resEl) return;
  if(answered.length < QUICK_QUIZ.length){ resEl.innerHTML=''; return; }
  const correct = QUICK_QUIZ.filter((_,i)=>pquickIsCorrect(i, load('pquick::q-'+i,null))).length;
  const good = correct>=6;
  resEl.innerHTML = `<div class="qr-circle" style="background:${good?'var(--lbg)':'var(--gbg)'};color:${good?'var(--leaf)':'var(--gold)'}">${correct}/${QUICK_QUIZ.length}</div>`;
  if(good) awardXP('pquick:quiz', 2);
}

function generateCode(score){
  const d = new Date(); const day=d.getDate(); const month=d.getMonth()+1;
  const seed = (score*31 + day*7 + month*13) % 4096;
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const c1 = chars[seed%32], c2 = chars[Math.floor(seed/32)%32], c3 = chars[(score*3+day+month)%32];
  return 'VS203-'+String(score).padStart(3,'0')+'-'+c1+c2+c3;
}

    const icon = {done:'✅',partial:'🔸',missing:'⭕'}[st];

    const goBtn = st!=='done' ? `<button class="cl-go-btn" onclick="openPart('${id}')">Đi tới →</button>` : '';

  const started = startedAt ? new Date(startedAt).toLocaleString('vi-VN',dtFmt) : 'Không rõ';
  const code = generateCode(total);
  const times = timeSpentMap();
  const totalTimeMs = Object.values(times).reduce((a,b)=>a+b,0);
  const rows = Object.keys(PART_MAX_XP).map(id=>{
    const earned=partXP(id), max=PART_MAX_XP[id];
    return `<tr><td>${REPORT_PART_LABELS[id]}</td><td style="text-align:right">${earned} / ${max} XP</td><td style="text-align:center">${isPartDone(id)?'✅ Hoàn thành':(earned>0?'🔸 Một phần':'⭕ Chưa làm')}</td><td style="text-align:right">${times[id]?formatDuration(times[id]):'—'}</td></tr>`;
  }).join('');
  const sTotals = strandTotals();
  const sSum = Object.values(sTotals).reduce((a,b)=>a+b,0);
  const strandRows = ['input','output','language','fluency'].map(s=>{
    const pct = sSum? Math.round(sTotals[s]/sSum*100) : 0;
    return `<tr><td>${STRANDS[s].emoji} ${STRANDS[s].en}</td><td style="text-align:right">${sTotals[s]} XP</td><td style="text-align:center">${pct}%</td></tr>`;
  }).join('');
  const g = creditGrade();
  const coreRows = PARTS.filter(p=>p.core).map(p=>{
    const done = isPartDone(p.id);
    return `<tr><td>${done?'✅':'⭕'} ${p.core}</td><td>${p.title}</td></tr>`;
  }).join('');
  const reflection = escapeHtml(load('report::reflection','')) || '<em>[Không có]</em>';
  const p2react = escapeHtml(load('p2::post-reaction','')) || '<em>[Không có]</em>';
  const p3noticing = escapeHtml(load('p3::post-noticing','')) || '<em>[Không có]</em>';
  const pextraText = escapeHtml(load('pextra::output-paragraph','')) || '<em>[Không có]</em>';
  const p5w = escapeHtml(load('p5::blog','')) || '<em>[Không có]</em>';
  return `<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

.header .sub{color:#64748b;font-size:13px;margin-top:3px}
.meta{text-align:right;font-size:12px;color:#64748b}
.info-row{display:flex;gap:20px;background:#f0fdfa;border:1px dashed #99f6e4;border-radius:8px;padding:12px 16px;margin-bottom:20px;font-size:13.5px;flex-wrap:wrap}
.section-title{font-size:14px;font-weight:700;color:#0f766e;background:#ccfbf1;padding:5px 12px;border-radius:6px;display:inline-block;margin-bottom:10px}

table{width:100%;border-collapse:collapse;font-size:13px}

.sample strong{display:block;color:#854d0e;font-size:11px;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:4px}

function downloadReport(){
  const html = buildReportDoc();
  const name = (load('report::name','')||'Student').replace(/[^a-zA-Z0-9]/g,'_');
  const blob = new Blob([html], {type:'text/html'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `VIET203_SummerReport_${name}.html`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}
function printReport(){
  const html = buildReportDoc();
  const w = window.open('', '_blank');
  if(!w){ alert('Trình duyệt đã chặn cửa sổ mới. Vui lòng cho phép popup, hoặc dùng nút "Tải Báo Cáo" rồi in file đó.'); return; }
  w.document.open(); w.document.write(html); w.document.close();
}

/* ===================== PERSIST HELPER ===================== */
function bindPersist(scope){
  scope.querySelectorAll('input[data-key], textarea[data-key]').forEach(el=>{
    const saved = load(el.dataset.key, null);
    if(saved!==null){
      if(el.type==='checkbox') el.checked = saved===true || saved==='true';
      else el.value = saved;
    }
    const evt = el.type==='checkbox' ? 'change' : 'input';
    el.addEventListener(evt, ()=>{
      save(el.dataset.key, el.type==='checkbox' ? el.checked : el.value);
    });
  });
}

/* ===================== INIT ===================== */
if(!load('report::started-at', null)) save('report::started-at', Date.now());
