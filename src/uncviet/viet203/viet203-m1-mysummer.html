body{background:#f8fafc;color:#1e293b;padding:28px 16px}
.wrap{max-width:760px;margin:0 auto;background:#fff;border-radius:12px;border:1px solid #e2e8f0;padding:32px 36px;box-shadow:0 4px 15px rgba(0,0,0,0.05)}
.header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2.5px solid #0d9488;padding-bottom:14px;margin-bottom:20px}
.header h1{color:#0f766e;font-size:22px;font-weight:800}
.header .sub{color:#64748b;font-size:13px;margin-top:3px}
.meta{text-align:right;font-size:12px;color:#64748b}
.info-row{display:flex;gap:20px;background:#f0fdfa;border:1px dashed #99f6e4;border-radius:8px;padding:12px 16px;margin-bottom:20px;font-size:13.5px;flex-wrap:wrap}
.section-title{font-size:14px;font-weight:700;color:#0f766e;background:#ccfbf1;padding:5px 12px;border-radius:6px;display:inline-block;margin-bottom:10px}
.section{margin-bottom:22px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border:1px solid #cbd5e1;padding:8px 10px;text-align:left}
th{background:#f1f5f9;color:#334155}
.sample{background:#fefce8;border:1px solid #fef08a;border-left:4px solid #eab308;padding:10px 14px;border-radius:0 6px 6px 0;font-size:13px;line-height:1.65;margin-bottom:10px;white-space:pre-wrap}
.sample strong{display:block;color:#854d0e;font-size:11px;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:4px}

</style>
</head><body>
<button class="print-btn no-print" onclick="window.print()" style="margin:0 auto 16px;display:block">🖨 In / Lưu PDF</button>

    <table><thead><tr><th>Trụ cột</th><th>XP</th><th>Tỉ lệ</th></tr></thead><tbody>${strandRows}</tbody></table>
  </div>
  <div class="section">
    <div class="section-title">Điểm XP theo phần</div>
    <table><thead><tr><th>Phần học</th><th>XP</th><th>Trạng thái</th><th>Thời gian (ước tính)</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="footer-note" style="text-align:left;margin-top:6px">Thời gian là ước tính từ lúc trình duyệt mở một phần đến lúc chuyển sang phần khác (tạm dừng khi chuyển tab) — không phải thước đo mức độ tập trung tuyệt đối.</div>
  </div>
  <div class="section">
    <div class="section-title">Bài viết tiêu biểu</div>
    <div class="sample"><strong>Viết ngắn — Bài 1</strong>${qw}</div>

    <div class="sample"><strong>Đoạn văn mở rộng — Nâng Cấp Viết</strong>${p2wText}</div>
    <div class="sample"><strong>Bài blog mùa hè — Bài 5</strong>${p5w}</div>
  </div>
  <div class="section">
    <div class="section-title">Suy ngẫm của sinh viên</div>
    <div class="reflect-box">${reflection}</div>
  </div>
  <div class="section">
    <div class="section-title">Mã Xác Nhận Hoàn Thành</div>
    <div class="code-box">
      <div class="code-label">Completion Code</div>
      <div class="code-value">${code}</div>
    </div>
  </div>
  <div class="footer-note">Nộp file này (hoặc bản in PDF) qua Canvas assignment. Giảng viên có thể đối chiếu mã hoàn thành với điểm XP ghi trên báo cáo.</div>
</div>
</body></html>`;
}

function downloadReport(){
  const html = buildReportDoc();
  const name = (load('report::name','')||'Student').replace(/[^a-zA-Z0-9]/g,'_');
  const blob = new Blob([html], {type:'text/html'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `VIET203_SummerReport_${name}.html`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}
function printReport(){
  const html = buildReportDoc();
  const w = window.open('', '_blank');
  if(!w){ alert('Trình duyệt đã chặn cửa sổ mới. Vui lòng cho phép popup, hoặc dùng nút "Tải Báo Cáo" rồi in file đó.'); return; }
  w.document.open(); w.document.write(html); w.document.close();
}

/* ===================== PERSIST HELPER ===================== */
function bindPersist(scope){
  scope.querySelectorAll('input[data-key], textarea[data-key]').forEach(el=>{
    const saved = load(el.dataset.key, null);
    if(saved!==null){
      if(el.type==='checkbox') el.checked = saved===true || saved==='true';
      else el.value = saved;
    }
    const evt = el.type==='checkbox' ? 'change' : 'input';
    el.addEventListener(evt, ()=>{
      save(el.dataset.key, el.type==='checkbox' ? el.checked : el.value);
    });
  });
}

/* ===================== INIT ===================== */
if(!load('report::started-at', null)) save('report::started-at', Date.now());
renderDashboard();
