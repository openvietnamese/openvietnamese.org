<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foundation · VIET 101 Module 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f8fafc;--surface:#ffffff;--surface2:#f1f5f9;--surface3:#e8eef4;
  --border:#e2e8f0;--border2:#cbd5e1;
  --text:#1e293b;--text2:#64748b;--text3:#94a3b8;
  --flame:#0d9488;--flame2:#0f766e;--fglow:rgba(13,148,136,0.12);
  --leaf:#15803d;--lbg:rgba(21,128,61,0.09);
  --coral:#e11d48;--cbg:rgba(225,29,72,0.09);
  --lotus:#a855f7;--lobg:rgba(168,85,247,0.09);
  --gold:#b45309;--gbg:rgba(234,179,8,0.14);
  --r:16px;--rs:10px;--rxs:6px;
}
html{font-size:16px;scroll-behavior:smooth}
body{font-family:'Lexend',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.65}
h1,h2,h3,.display{font-family:'Lexend',sans-serif;font-weight:700}
button{font-family:'Lexend',sans-serif;cursor:pointer}
input,textarea{font-family:'Lexend',sans-serif}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
a{color:var(--flame2)}
::selection{background:var(--fglow);color:var(--text)}

#app{display:flex;min-height:100vh}
#sidebar{width:264px;background:linear-gradient(180deg,#0f766e,#0c5f59);color:#fff;display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;overflow-y:auto;z-index:100;transition:transform 0.3s}
#main{margin-left:264px;flex:1;min-height:100vh;display:flex;flex-direction:column}
#content-area{flex:1}

.sidebar-header{padding:1.1rem 1.1rem 0.8rem}
.sidebar-logo{font-size:1.02rem;font-weight:800;display:flex;align-items:center;gap:0.5rem}
.sidebar-logo .logo-icon{font-size:1.35rem}
.sidebar-logo .logo-icon img{width:1.9rem;height:1.9rem;border-radius:50%;object-fit:cover;object-position:center;display:block;border:1.5px solid rgba(255,255,255,0.35);background:#fff}
.sidebar-sub{font-size:0.66rem;opacity:0.72;margin-top:0.25rem;letter-spacing:0.01em}

.sidebar-trau{margin:0 1.1rem 0.9rem;padding:0.7rem 0.8rem;border-radius:var(--rs);background:rgba(255,255,255,0.08);display:flex;align-items:center;gap:0.6rem;cursor:default}
.sidebar-trau .tc-emoji{font-size:1.55rem;line-height:1}
.sidebar-trau .tc-text{display:flex;flex-direction:column;line-height:1.35}
.sidebar-trau .tc-sub{font-size:0.62rem;opacity:0.78;font-weight:400}

.sidebar-progress{padding:0 1.1rem 0.9rem}
.sp-label{font-size:0.6rem;text-transform:uppercase;letter-spacing:0.07em;opacity:0.6;margin-bottom:0.4rem}
.sp-bar{height:7px;background:rgba(255,255,255,0.18);border-radius:4px;overflow:hidden}
.sp-fill{height:100%;background:linear-gradient(90deg,#fbbf24,#f59e0b);border-radius:4px;transition:width 0.5s}
.sp-text{font-size:0.66rem;margin-top:0.4rem;opacity:0.85}

.sidebar-nav{flex:1;padding:0.5rem 0;overflow-y:auto;border-top:1px solid rgba(255,255,255,0.13)}
.nav-group-label{font-size:0.6rem;font-weight:800;letter-spacing:0.07em;text-transform:uppercase;opacity:0.55;padding:0.7rem 1.1rem 0.3rem}
.nav-item{display:flex;align-items:center;gap:0.6rem;padding:0.6rem 1.1rem;cursor:pointer;font-size:0.82rem;transition:background 0.15s}
.nav-item:hover{background:rgba(255,255,255,0.08)}
.nav-item.active{background:rgba(255,255,255,0.16)}
.nav-item.core{border-left:3px solid #fbbf24}
.ni-icon{font-size:1rem;width:1.15rem;text-align:center;flex-shrink:0}
.ni-title{flex:1;font-weight:600;line-height:1.3}
.ni-meta{font-size:0.62rem;opacity:0.65;font-weight:400}
.ni-badge{font-size:0.62rem;font-weight:700;background:rgba(255,255,255,0.18);border-radius:10px;padding:2px 7px;flex-shrink:0;white-space:nowrap}
.ni-badge.done{background:#fff;color:#0f766e}

.sidebar-footer{padding:0.9rem 1.1rem 1.1rem;border-top:1px solid rgba(255,255,255,0.13);display:flex;flex-direction:column;gap:0.45rem}
.btn-report-sb{background:#fbbf24;color:#0f4c46;border:none;border-radius:var(--rs);padding:0.6rem;font-family:inherit;font-weight:800;font-size:0.8rem;cursor:pointer;transition:opacity 0.15s}
.btn-report-sb:hover{opacity:0.88}
.btn-reset-sb{background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.72);border:1px solid rgba(255,255,255,0.2);border-radius:var(--rs);padding:0.4rem;font-family:inherit;font-size:0.68rem;cursor:pointer;transition:all 0.15s}
.btn-reset-sb:hover{background:rgba(225,29,72,0.25);color:#fff;border-color:rgba(225,29,72,0.4)}

#topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 1.25rem;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:60}
#menu-toggle{display:none;background:none;border:none;font-size:1.3rem;cursor:pointer;color:var(--text);padding:0 0.3rem 0 0}
.tb-title{font-size:0.92rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-left{display:flex;align-items:center;gap:0.7rem;min-width:0}
.tb-badge{font-size:0.68rem;font-weight:700;padding:3px 10px;border-radius:20px;background:var(--fglow);color:var(--flame2);white-space:nowrap}

@media(max-width:860px){
  #sidebar{transform:translateX(-100%)}
  #sidebar.open{transform:translateX(0)}
  #main{margin-left:0}
  #menu-toggle{display:block}
}

.confetti-piece{position:fixed;width:9px;height:9px;border-radius:2px;animation:fall 1.7s ease-in forwards;pointer-events:none;z-index:9997}
@keyframes fall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(680deg);opacity:0}}

.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-20px);background:var(--text);color:#fff;padding:0.6rem 1.1rem;border-radius:var(--rs);font-size:0.82rem;font-weight:600;z-index:9998;opacity:0;transition:all 0.3s;box-shadow:0 8px 24px rgba(0,0,0,0.2);display:flex;align-items:center;gap:0.5rem}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast .t-sub{font-weight:400;opacity:0.8;font-size:0.74rem}
.milestone{position:fixed;inset:0;background:rgba(15,23,42,0.55);display:flex;align-items:center;justify-content:center;z-index:9999;opacity:0;pointer-events:none;transition:opacity 0.3s}
.milestone.show{opacity:1;pointer-events:auto}
.milestone-card{background:var(--surface);border-radius:var(--r);padding:2.2rem 2rem;text-align:center;max-width:340px;box-shadow:0 20px 60px rgba(0,0,0,0.3);transform:scale(0.85);transition:transform 0.3s}
.milestone.show .milestone-card{transform:scale(1)}
.milestone-emoji{font-size:3.2rem;margin-bottom:0.6rem}
.milestone-title{font-size:1.15rem;font-weight:800;margin-bottom:0.4rem}
.milestone-sub{font-size:0.84rem;color:var(--text2);margin-bottom:1.1rem}
.milestone-btn{background:var(--flame);color:#fff;border:none;border-radius:var(--rs);padding:0.6rem 1.4rem;font-weight:700;font-size:0.85rem}

.home-hero{padding:3rem 1.5rem 1.2rem;text-align:center;position:relative;overflow:hidden}
.home-hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 75% 50% at 50% -10%,rgba(13,148,136,0.14),transparent);pointer-events:none}
.home-kicker{font-size:0.72rem;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:var(--flame2);position:relative}
.home-title{font-weight:800;font-size:clamp(1.9rem,5vw,2.9rem);letter-spacing:-0.01em;margin-top:0.5rem;position:relative;text-wrap:balance}
.home-title em{font-style:italic;color:var(--flame)}
.home-subtitle{font-size:0.85rem;font-weight:600;color:var(--text3);margin-top:0.4rem;letter-spacing:0.01em;position:relative}
.home-sub{font-size:0.95rem;color:var(--text2);margin-top:0.6rem;max-width:560px;margin-left:auto;margin-right:auto;position:relative}
.home-body{max-width:900px;margin:0 auto;padding:0 1.25rem 3.5rem}

.trau-companion{margin-top:0.9rem;display:inline-flex;align-items:center;gap:0.55rem;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:0.45rem 1rem 0.45rem 0.6rem;font-size:0.82rem;font-weight:600;position:relative}
.trau-companion .tc-emoji{font-size:1.5rem;line-height:1}
.trau-companion .tc-text{display:flex;flex-direction:column;align-items:flex-start;line-height:1.25}
.trau-companion .tc-sub{font-weight:400;color:var(--text3);font-size:0.7rem}

.card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0.85rem;margin-top:1.6rem}
.hcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1.1rem 1.2rem;text-align:left;cursor:pointer;transition:all 0.15s;position:relative}
.hcard:hover{border-color:var(--flame);transform:translateY(-2px);box-shadow:0 6px 18px rgba(15,118,110,0.1)}
.hcard.core{border-color:#fbbf24}
.hcard-icon{font-size:1.5rem;margin-bottom:0.5rem}
.hcard-title{font-weight:700;font-size:0.95rem;margin-bottom:0.25rem}
.hcard-desc{font-size:0.78rem;color:var(--text2);line-height:1.5}
.hcard-xp{position:absolute;top:0.9rem;right:1rem;font-size:0.66rem;font-weight:700;color:var(--flame2);background:var(--fglow);border-radius:10px;padding:2px 8px}

.section{max-width:820px;margin:0 auto;padding:2.2rem 1.25rem 4rem}
.sec-eyebrow{font-size:0.72rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--flame2)}
.sec-title{font-size:clamp(1.5rem,3.4vw,2.1rem);font-weight:800;margin-top:0.35rem;margin-bottom:0.6rem}
.sec-intro{color:var(--text2);font-size:0.92rem;margin-bottom:1.6rem}
.block{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1.3rem 1.4rem;margin-bottom:1.3rem}
.block h3{font-size:1.02rem;margin-bottom:0.6rem;display:flex;align-items:center;gap:0.4rem}
.block p{font-size:0.88rem;color:var(--text2);margin-bottom:0.6rem}
.block p:last-child{margin-bottom:0}
.note{background:var(--fglow);border-left:3px solid var(--flame);border-radius:0 var(--rxs) var(--rxs) 0;padding:0.65rem 0.9rem;font-size:0.82rem;color:var(--flame2);margin:0.7rem 0}
.warn{background:var(--gbg);border-left:3px solid var(--gold);border-radius:0 var(--rxs) var(--rxs) 0;padding:0.65rem 0.9rem;font-size:0.82rem;color:#78350f;margin:0.7rem 0}

table.vtable{width:100%;border-collapse:collapse;font-size:0.85rem;margin:0.6rem 0}
table.vtable th{text-align:left;font-size:0.68rem;text-transform:uppercase;letter-spacing:0.04em;color:var(--text3);padding:0.4rem 0.6rem;border-bottom:1px solid var(--border2)}
table.vtable td{padding:0.5rem 0.6rem;border-bottom:1px solid var(--border)}
table.vtable tr:last-child td{border-bottom:none}
.vn{font-weight:700;color:var(--flame2)}

.letter-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:0.5rem;margin:0.8rem 0}
.letter-tile{background:var(--surface2);border:1px solid var(--border);border-radius:var(--rxs);text-align:center;padding:0.55rem 0.2rem;font-weight:700;font-size:1.05rem;color:var(--flame2)}
.letter-tile.hookhat{background:var(--gbg);border-color:var(--gold);color:#78350f}
.letter-tile.samesame{opacity:0.85}
.hookhat-callout{display:inline-block;background:var(--gbg);color:#78350f;border:1px solid var(--gold);border-radius:var(--rxs);padding:1px 7px;font-weight:800}

.flashcard-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:0.6rem;margin:0.8rem 0}
.flashcard{background:var(--surface2);border:1.5px solid var(--border2);border-radius:var(--rs);padding:0.7rem 0.5rem;text-align:center;cursor:pointer;transition:all 0.15s;min-height:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.15rem}
.flashcard:hover{border-color:var(--flame)}
.flashcard.seen{border-color:var(--leaf);background:var(--lbg)}
.flashcard .fc-letter{font-size:1.3rem;font-weight:800;color:var(--flame2)}
.flashcard .fc-back{font-size:0.7rem;color:var(--text2);line-height:1.3}
.flashcard .fc-check{font-size:0.68rem;color:var(--leaf);font-weight:700}

.match-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:0.5rem;margin:0.8rem 0}
.match-tile{background:var(--surface);border:1.5px solid var(--border2);border-radius:var(--rxs);padding:0.55rem 0.4rem;text-align:center;font-size:0.85rem;font-weight:700;cursor:pointer;transition:all 0.12s;min-height:44px;display:flex;align-items:center;justify-content:center}
.match-tile:hover{border-color:var(--flame)}
.match-tile.selected{border-color:var(--flame);background:var(--fglow)}
.match-tile.matched{border-color:var(--leaf);background:var(--lbg);color:var(--leaf);opacity:0.6;pointer-events:none}
.match-tile.wrong{border-color:var(--coral);background:var(--cbg)}
.match-status{font-size:0.8rem;font-weight:700;color:var(--text2);margin-top:0.5rem}

.tone-staff-svg{width:100%;height:auto;display:block}
.timeline-block{border-left:2px solid var(--border2);margin-left:0.5rem;padding-left:1rem}
.timeline-item{position:relative;padding-bottom:1.1rem}
.timeline-item:last-child{padding-bottom:0}
.timeline-item::before{content:'';position:absolute;left:-1.31rem;top:0.15rem;width:9px;height:9px;border-radius:50%;background:var(--flame)}
.timeline-year{font-size:0.68rem;font-weight:800;letter-spacing:0.04em;text-transform:uppercase;color:var(--flame2)}
.timeline-title{font-weight:700;font-size:0.88rem;margin:0.15rem 0 0.2rem}
.timeline-body{font-size:0.82rem;color:var(--text2);line-height:1.5}

.reading-page{display:flex;gap:0.8rem;align-items:flex-start;padding:0.7rem 0;border-bottom:1px solid var(--border)}
.reading-page:last-child{border-bottom:none}
.reading-page-num{flex-shrink:0;width:1.7rem;height:1.7rem;border-radius:50%;background:var(--fglow);color:var(--flame2);font-weight:800;font-size:0.76rem;display:flex;align-items:center;justify-content:center;margin-top:0.1rem}
.reading-page-vn{font-weight:600;font-size:1.4rem;line-height:1.5;color:var(--text)}
.reading-page-en{font-size:0.85rem;color:var(--text2);margin-top:0.25rem}
.attribution{font-size:0.72rem;color:var(--text3);line-height:1.5;margin-top:0.8rem;padding-top:0.8rem;border-top:1px dashed var(--border2)}

.record-box{margin-top:1rem;padding:0.9rem 1rem;background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs)}
.rec-btn.recording-active{background:var(--coral);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.65}}
.rec-player{margin-top:0.6rem;display:flex;align-items:center;gap:0.6rem;flex-wrap:wrap}
.rec-player audio{width:auto;flex:1;min-width:200px}
.rec-download{font-size:0.72rem;font-weight:700;color:var(--flame2);text-decoration:none;background:var(--fglow);border-radius:var(--rxs);padding:0.35rem 0.7rem;white-space:nowrap}
.story-block{margin-top:1.6rem;padding-top:1.4rem;border-top:1px dashed var(--border2)}
.story-block:first-child{margin-top:0;padding-top:0;border-top:none}

audio{width:100%;height:34px;margin:0.4rem 0}
.audio-row{display:flex;flex-direction:column;gap:0.3rem;margin:0.5rem 0}
.audio-label{font-size:0.76rem;font-weight:600;color:var(--text2)}

.mcq{margin:1rem 0;padding:0.9rem 1rem;background:var(--surface2);border-radius:var(--rs);border:1px solid var(--border)}
.mcq-q{font-size:0.88rem;font-weight:600;margin-bottom:0.65rem}
.mcq-choices{display:flex;flex-wrap:wrap;gap:0.45rem}
.mcq-choice{background:var(--surface);border:1.5px solid var(--border2);border-radius:var(--rxs);padding:0.42rem 0.85rem;font-size:0.82rem;font-weight:600;cursor:pointer;transition:all 0.12s}
.mcq-choice:hover{border-color:var(--flame)}
.mcq-choice.correct{background:var(--lbg);border-color:var(--leaf);color:var(--leaf)}
.mcq-choice.wrong{background:var(--cbg);border-color:var(--coral);color:var(--coral)}
.mcq-choice.disabled{pointer-events:none;opacity:0.55}
.mcq-choice.locked{pointer-events:none}
.mcq-fb{font-size:0.78rem;margin-top:0.5rem;font-weight:600}
.mcq-fb.ok{color:var(--leaf)}
.mcq-fb.bad{color:var(--coral)}
.mcq-xp{font-size:0.66rem;font-weight:700;color:var(--flame2);background:var(--fglow);border-radius:10px;padding:2px 7px;margin-left:0.4rem}

.telex-item{background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);padding:0.85rem 1rem;margin:0.8rem 0}
.telex-en{font-size:0.78rem;color:var(--text2);margin-bottom:0.5rem}
.telex-row{display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap}
.telex-input{flex:1;min-width:160px;background:var(--surface);border:1.5px solid var(--border2);border-radius:var(--rxs);padding:0.5rem 0.7rem;font-size:0.92rem;outline:none}
.telex-input:focus{border-color:var(--flame)}
.telex-check{background:var(--flame);color:#fff;border:none;border-radius:var(--rxs);padding:0.5rem 1rem;font-weight:700;font-size:0.8rem}
.telex-preview{font-size:1.15rem;font-weight:700;color:var(--flame2);min-width:90px}
.telex-fb{font-size:0.78rem;margin-top:0.45rem;font-weight:600}
.telex-fb.ok{color:var(--leaf)}
.telex-fb.bad{color:var(--coral)}

.part-progress{display:flex;align-items:center;gap:0.6rem;margin-bottom:1.4rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);padding:0.7rem 1rem}
.pp-bar{flex:1;height:8px;background:var(--surface3);border-radius:4px;overflow:hidden}
.pp-fill{height:100%;background:linear-gradient(90deg,var(--flame),var(--leaf));border-radius:4px;transition:width 0.4s}
.pp-text{font-size:0.76rem;font-weight:700;color:var(--text2);white-space:nowrap}

.report-wrap{max-width:720px;margin:0 auto;padding:2.2rem 1.25rem 4rem}
.report-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.report-head{background:linear-gradient(135deg,#0f766e,#0c5f59);color:#fff;padding:2rem 1.6rem}
.report-head .rh-kicker{font-size:0.68rem;letter-spacing:0.12em;text-transform:uppercase;opacity:0.85}
.report-head h2{font-size:1.5rem;margin-top:0.3rem}
.report-head .rh-subtitle{font-size:0.8rem;font-weight:600;opacity:0.85;margin-top:0.2rem}
.meta-row{display:flex;flex-wrap:wrap;gap:0.9rem;font-size:0.78rem;margin-top:0.9rem;opacity:0.92}
.report-body{padding:1.5rem 1.6rem}
.checklist{list-style:none}
.checklist li{display:flex;align-items:center;gap:0.6rem;padding:0.55rem 0;border-bottom:1px solid var(--border);font-size:0.86rem}
.checklist li:last-child{border-bottom:none}
.cl-icon{font-size:1rem;width:1.3rem;text-align:center}
.cl-text{flex:1}
.cl-xp{font-size:0.76rem;color:var(--text2);font-weight:600}
.checklist li.done .cl-text{color:var(--text)}
.checklist li:not(.done) .cl-text{color:var(--text3)}
.report-actions{display:flex;gap:0.6rem;margin-top:1.4rem;flex-wrap:wrap}
.btn-primary{background:var(--flame);color:#fff;border:none;border-radius:var(--rs);padding:0.65rem 1.2rem;font-weight:700;font-size:0.84rem}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border2);border-radius:var(--rs);padding:0.65rem 1.2rem;font-weight:700;font-size:0.84rem}
.verify-code{font-family:monospace;font-size:0.9rem;background:var(--surface2);border:1px dashed var(--border2);border-radius:var(--rxs);padding:0.5rem 0.8rem;display:inline-block;margin-top:0.5rem;letter-spacing:0.05em}
.credit-note{font-size:0.8rem;color:var(--text2);margin-top:1rem;padding-top:1rem;border-top:1px solid var(--border)}

<script>
/* =========================================================
   VIET 101 — Module 1: Foundation
   (Vietnamese Alphabet, Pronunciation, Spelling & Typing)
   XP / con trâu companion / completion report — ported from
   the VIET 203 M1 "Mùa Hè Của Tôi" build pattern, scaled to
   a Language-Focused Learning module (recognition + spelling
   + typing drills) rather than IPA task performance.
   Instructional text is in English throughout (learners can't
   read Vietnamese yet); Vietnamese appears only as the target-
   language content being taught (examples, quiz content, the
   dictogloss sentence, tone/letter names).
   Pronunciation content adapted from: Hoang, Tung. "Basic
   Vietnamese." Michigan State University, 2023. Sections 1–9
   (Getting Started: Vietnamese Alphabet and Pronunciation).
   CC BY-NC 4.0 — https://openbooks.lib.msu.edu/vietnamese/
   Reading passage: "Tớ đi học", Vietnamese translation of
   "I Know" by All Children Reading Cambodia, © Let's Read 2019,
   published on StoryWeaver by The Asia Foundation, CC BY 4.0.
   ========================================================= */

const NS = 'viet101-m1-foundation::v1';
const NS_TRAU = 'viet101-trau::v1'; /* shared companion state across all VIET 101 modules */

function save(key,val){ localStorage.setItem(NS+key, typeof val==='string'?val:JSON.stringify(val)); }
function load(key,fallback){ const v=localStorage.getItem(NS+key); if(v===null) return fallback; try{return JSON.parse(v);}catch(e){return v;} }
function saveRaw(key,val){ localStorage.setItem(key, typeof val==='string'?val:JSON.stringify(val)); }
function loadRaw(key,fallback){ const v=localStorage.getItem(key); if(v===null) return fallback; try{return JSON.parse(v);}catch(e){return v;} }

const PARTS = [
  {id:'gd', title:'Getting Started', icon:'🌱', group:'Getting Started'},
  {id:'gdcheck', title:'Self-Check (Before)', icon:'✅', group:'Getting Started'},
  {id:'p1', title:'Alphabet', icon:'🔤', group:'Core Skills'},
  {id:'p2', title:'Tones', icon:'🎵', group:'Core Skills'},
  {id:'p3', title:'Vowels', icon:'🔊', group:'Core Skills'},
  {id:'p4', title:'Consonants', icon:'🗣️', group:'Core Skills'},
  {id:'p5', title:'Spelling', icon:'✏️', group:'Apply It'},
  {id:'p6', title:'Typing (Telex)', icon:'⌨️', group:'Apply It'},
  {id:'p7', title:'Reading', icon:'📖', group:'Apply It'},
  {id:'quiz', title:'Quick Quiz', icon:'🧩', group:'Wrap-Up'},
  {id:'closingcheck', title:'Self-Check (After)', icon:'✅', group:'Wrap-Up'},
  {id:'report', title:'Completion Report', icon:'📋', group:'Wrap-Up'}
];
const PART_MAX_XP = {gd:16, gdcheck:6, p1:28, p2:20, p3:24, p4:24, p5:16, p6:16, p7:24, quiz:10, closingcheck:6};
const PART_DONE_FRAC = 0.85;
const TOTAL_MAX_XP = Object.values(PART_MAX_XP).reduce((a,b)=>a+b,0);
const XP_PART_COUNT = Object.keys(PART_MAX_XP).length;
const REPORT_PART_LABELS = {gd:'🌱 Getting Started', gdcheck:'✅ Self-Check (Before)', p1:'🔤 Alphabet', p2:'🎵 Tones', p3:'🔊 Vowels', p4:'🗣️ Consonants', p5:'✏️ Spelling', p6:'⌨️ Typing (Telex)', p7:'📖 Reading', quiz:'🧩 Quick Quiz', closingcheck:'✅ Self-Check (After)'};

/* shared can-do statements — worded identically pre/post so the report can show growth */
const CANDO_STATEMENTS = [
  'I can recognize and write all 29 letters of the Vietnamese alphabet.',
  'I can tell apart the vowels with a "hat" or "hook" (â/ê/ô and ă/ơ/ư) from letters that look like English.',
  'I can recognize the 6 tones and know where to place the tone mark.',
  'I can distinguish commonly-confused vowels and consonants (e.g. ư/ơ, s/x, ch/tr, gh/g).',
  'I can apply the basic spelling rules (c/k/qu, g/gh, ng/ngh).',
  'I can type Vietnamese with diacritics using Telex on a regular keyboard.'
];
const CANDO_SCALE = ['Not yet','Somewhat','I can do this'];

function partXP(id){ const xp=load('xp',{}); return Object.entries(xp).filter(([k])=>k.startsWith(id+'-')).reduce((a,[,v])=>a+v,0); }
function partDoneXP(id){ return Math.ceil(PART_MAX_XP[id]*PART_DONE_FRAC); }
function isPartDone(id){ return partXP(id) >= partDoneXP(id); }
function totalXP(){ return Object.keys(PART_MAX_XP).reduce((a,id)=>a+partXP(id),0); }

/* ---------- con trâu companion ---------- */
const COURSE_XP_ESTIMATE = 650; /* rough total across ~5 VIET101 modules, mirrors VIET203's calibration */
const TRAU_STAGES = [
  {min:0.00, emoji:'🐮', label:'Nghé Con',       sub:'just starting out'},
  {min:0.10, emoji:'🐃', label:'Trâu Tơ',        sub:'settling in, building momentum'},
  {min:0.45, emoji:'🐃', label:'Trâu Đầu Đàn',   sub:'steady, leading the herd'}
];
function trauLoad(){ return loadRaw(NS_TRAU, {xp:0, last:0}); }
function trauSave(s){ saveRaw(NS_TRAU, s); }
function trauStage(xp){
  const frac = xp/COURSE_XP_ESTIMATE;
  let s = TRAU_STAGES[0];
  for(const st of TRAU_STAGES){ if(frac>=st.min) s=st; }
  return s;
}
function trauCondition(lastTs){
  if(!lastTs) return {label:'no activity yet', ok:false};
  const days = (Date.now()-lastTs)/86400000;
  return days<=3 ? {label:'healthy, full of energy', ok:true} : {label:'resting (no worries, come back anytime)', ok:false};
}
function trauAward(amount){
  const s = trauLoad();
  const prevStage = trauStage(s.xp);
  s.xp += amount;
  s.last = Date.now();
  const newStage = trauStage(s.xp);
  trauSave(s);
  if(newStage.label !== prevStage.label){
    showMilestone(newStage.emoji, 'Your buffalo leveled up: '+newStage.label+'!', newStage.sub);
  }
  renderTrauCompanion();
}
function renderTrauCompanion(){
  const s = trauLoad();
  const stage = trauStage(s.xp);
  const cond = trauCondition(s.last);
  const el = document.getElementById('sidebar-trau');
  if(el) el.innerHTML = `<span class="tc-emoji">${stage.emoji}</span><span class="tc-text"><strong>${stage.label}</strong><span class="tc-sub">${cond.label}</span></span>`;
}

/* ---------- XP award / UI feedback ---------- */
function awardXP(key, amount){
  const xp = load('xp',{});
  if(xp[key]) return false; /* already awarded, no double counting */
  xp[key] = amount;
  save('xp', xp);
  trauAward(amount);
  showToast('+'+amount+' XP', '');
  spawnConfetti();
  refreshChrome();
  return true;
}
function hasAward(key){ const xp=load('xp',{}); return !!xp[key]; }

function showToast(main, sub){
  const t = document.getElementById('toast');
  t.innerHTML = main + (sub?' <span class="t-sub">'+sub+'</span>':'');
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
}
function showMilestone(emoji, title, sub){
  document.getElementById('ms-emoji').textContent = emoji;
  document.getElementById('ms-title').textContent = title;
  document.getElementById('ms-sub').textContent = sub;
  document.getElementById('milestone').classList.add('show');
}
function spawnConfetti(){
  const colors=['#0d9488','#fbbf24','#e11d48','#a855f7','#15803d'];
  for(let i=0;i<16;i++){
    const p=document.createElement('div');
    p.className='confetti-piece';
    p.style.left=Math.random()*100+'vw';
    p.style.top='-10px';
    p.style.background=colors[Math.floor(Math.random()*colors.length)];
    p.style.animationDelay=(Math.random()*0.3)+'s';
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),2100);
  }
}

/* ---------- chrome (sidebar nav, progress bar, topbar) ---------- */
let currentPart = 'home';
function refreshChrome(){
  const total = totalXP();
  document.getElementById('sp-fill').style.width = Math.min(100, total/TOTAL_MAX_XP*100)+'%';
  document.getElementById('sp-text').textContent = total+' / '+TOTAL_MAX_XP+' XP';
  document.getElementById('tb-xp').textContent = total+' XP';
  renderNav();
  renderTrauCompanion();
}
function renderNav(){
  const groups = [...new Set(PARTS.map(p=>p.group))];
  let html = `<div class="nav-item ${currentPart==='home'?'active':''}" onclick="goto('home')"><span class="ni-icon">🏠</span><span class="ni-title">Home</span></div>`;
  groups.forEach(g=>{
    html += `<div class="nav-group-label">${g}</div>`;
    PARTS.filter(p=>p.group===g).forEach(p=>{
      const isXpPart = PART_MAX_XP.hasOwnProperty(p.id);
      const earned = isXpPart ? partXP(p.id) : null;
      const max = isXpPart ? PART_MAX_XP[p.id] : null;
      const done = isXpPart && isPartDone(p.id);
      const badge = isXpPart ? `<span class="ni-badge ${done?'done':''}">${done?'✓':earned+'/'+max}</span>` : '';
      html += `<div class="nav-item ${currentPart===p.id?'active':''}" onclick="goto('${p.id}')"><span class="ni-icon">${p.icon}</span><span class="ni-title">${p.title}</span>${badge}</div>`;
    });
  });
  document.getElementById('sidebar-nav').innerHTML = html;
}
function partProgressBar(id){
  const earned = partXP(id), max = PART_MAX_XP[id];
  return `<div class="part-progress"><div class="pp-bar"><div class="pp-fill" style="width:${Math.min(100,earned/max*100)}%"></div></div><div class="pp-text">${earned} / ${max} XP ${isPartDone(id)?'· ✅ Done':''}</div></div>`;
}

function goto(id){
  currentPart = id;
  document.getElementById('sidebar').classList.remove('open');
  const meta = PARTS.find(p=>p.id===id);
  document.getElementById('tb-title').textContent = meta ? meta.title : 'Home';
  window.scrollTo(0,0);
  render();
  refreshChrome();
}

/* ---------- generic MCQ engine ---------- */
function mcqBlock(partId, idx, q, choices, correctIdx, xp){
  const key = partId+'-i'+idx;
  const locked = hasAward(key);
  const choicesHtml = choices.map((c,ci)=>{
    let cls='mcq-choice';
    if(locked){
      if(ci===correctIdx) cls+=' correct locked';
      else cls+=' disabled';
    }
    return `<button class="${cls}" onclick="mcqAnswer('${partId}',${idx},${ci},${correctIdx},${xp},this)">${c}</button>`;
  }).join('');
  const fb = locked ? `<div class="mcq-fb ok">✅ Correct!</div>` : '';
  return `<div class="mcq" id="mcq-${key}"><div class="mcq-q">${idx+1}. ${q}<span class="mcq-xp">+${xp} XP</span></div><div class="mcq-choices">${choicesHtml}</div>${fb}</div>`;
}
function mcqAnswer(partId, idx, chosenIdx, correctIdx, xp, btnEl){
  const key = partId+'-i'+idx;
  if(hasAward(key)) return;
  const wrapper = document.getElementById('mcq-'+key);
  const buttons = wrapper.querySelectorAll('.mcq-choice');
  if(chosenIdx===correctIdx){
    buttons.forEach((b,ci)=>{ b.classList.add(ci===correctIdx?'correct':'disabled'); b.classList.add('locked'); });
    let fb = wrapper.querySelector('.mcq-fb');
    if(!fb){ fb=document.createElement('div'); fb.className='mcq-fb'; wrapper.appendChild(fb); }
    fb.className='mcq-fb ok';
    fb.textContent='✅ Correct!';
    awardXP(key, xp);
  } else {
    btnEl.classList.add('wrong');
    let fb = wrapper.querySelector('.mcq-fb');
    if(!fb){ fb=document.createElement('div'); fb.className='mcq-fb'; wrapper.appendChild(fb); }
    fb.className='mcq-fb bad';
    fb.textContent='❌ Not quite — try again.';
    setTimeout(()=>btnEl.classList.remove('wrong'), 700);
  }
}

/* ---------- flashcard self-check (Part 1) ---------- */
const FLASHCARD_KEY = 'p1-flashcards-seen';
const FLASHCARD_XP_KEY = 'p1-flashcards-done';
function flashcardSeenSet(){ return new Set(load(FLASHCARD_KEY, [])); }
function flipFlashcard(letterIdx, totalCount){
  const seen = flashcardSeenSet();
  seen.add(letterIdx);
  save(FLASHCARD_KEY, [...seen]);
  const card = document.getElementById('fc-'+letterIdx);
  if(card) card.classList.add('seen');
  if(seen.size >= totalCount && !hasAward(FLASHCARD_XP_KEY)){
    awardXP(FLASHCARD_XP_KEY, 4);
  }
  const status = document.getElementById('fc-status');
  if(status) status.textContent = seen.size+' / '+totalCount+' seen';
}

/* ---------- pre-reading vocab primer (Part 7) ---------- */
const P7VOCAB_KEY = 'p7-vocab-seen';
const P7VOCAB_XP_KEY = 'p7-vocab-done';
function p7VocabSeenSet(){ return new Set(load(P7VOCAB_KEY, [])); }
function flipP7Vocab(idx, totalCount){
  const seen = p7VocabSeenSet();
  seen.add(idx);
  save(P7VOCAB_KEY, [...seen]);
  const card = document.getElementById('p7v-'+idx);
  if(card) card.classList.add('seen');
  if(seen.size >= totalCount && !hasAward(P7VOCAB_XP_KEY)){
    awardXP(P7VOCAB_XP_KEY, 4);
  }
  const status = document.getElementById('p7v-status');
  if(status) status.textContent = seen.size+' / '+totalCount+' seen';
}
const P7READ_XP_KEY = 'p7-read-done';
function markStoryRead(){
  if(!hasAward(P7READ_XP_KEY)) awardXP(P7READ_XP_KEY, 2);
  const el = document.getElementById('p7-read-status');
  if(el) el.textContent = '✓ Done';
}

/* ---------- read-aloud recording (Part 7) ---------- */
/* Session-only: recordings live in the browser tab as blob URLs, never
   uploaded or persisted — they disappear on reload. That's a deliberate
   scope limit, not a bug: no server-side storage exists for this module. */
const recorders = {};
async function toggleRecording(storyId){
  const btn = document.getElementById('rec-btn-'+storyId);
  const existing = recorders[storyId];
  if(existing && existing.recording){
    existing.mediaRecorder.stop();
    return;
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder==='undefined'){
    alert("Your browser doesn't support audio recording. Try Chrome, Firefox, or Safari on a laptop or phone.");
    return;
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    const mediaRecorder = new MediaRecorder(stream);
    const chunks = [];
    mediaRecorder.ondataavailable = e => { if(e.data.size>0) chunks.push(e.data); };
    mediaRecorder.onstop = () => {
      const blob = new Blob(chunks, {type: mediaRecorder.mimeType || 'audio/webm'});
      const url = URL.createObjectURL(blob);
      const player = document.getElementById('rec-player-'+storyId);
      if(player) player.innerHTML = `<audio controls src="${url}"></audio><a class="rec-download" href="${url}" download="reading-${storyId}.webm">⬇️ Download</a>`;
      stream.getTracks().forEach(t=>t.stop());
      recorders[storyId] = {recording:false};
      if(btn){ btn.textContent = '🎙️ Record again'; btn.classList.remove('recording-active'); }
      const key = 'p7-rec-'+storyId;
      if(!hasAward(key)) awardXP(key, 2);
      const status = document.getElementById('rec-status-'+storyId);
      if(status) status.textContent = '✓ Recorded';
    };
    mediaRecorder.start();
    recorders[storyId] = {mediaRecorder, recording:true};
    if(btn){ btn.textContent = '⏹ Stop recording'; btn.classList.add('recording-active'); }
  } catch(err){
    alert("Couldn't access your microphone. Please allow microphone access in your browser and try again.");
  }
}
function recordBox(storyId){
  const done = hasAward('p7-rec-'+storyId);
  return `<div class="record-box">
    <button class="telex-check rec-btn" id="rec-btn-${storyId}" onclick="toggleRecording('${storyId}')">🎙️ Record yourself reading</button>
    <span class="fc-check" id="rec-status-${storyId}">${done?'✓ Recorded':''}</span>
    <div class="rec-player" id="rec-player-${storyId}"></div>
  </div>`;
}

/* ---------- memory match game (Part 1) ---------- */
const MATCH_XP_KEY = 'p1-match-done';
let matchState = { selected:null, matched:new Set(), tiles:[] };
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function buildMatchTiles(pairs){
  const tiles = [];
  pairs.forEach((p,pi)=>{ tiles.push({text:p[0], pairIdx:pi, kind:'letter'}); tiles.push({text:p[1], pairIdx:pi, kind:'word'}); });
  matchState = { selected:null, matched:new Set(), tiles: shuffle(tiles) };
  return matchState.tiles;
}
function renderMatchGrid(){
  return matchState.tiles.map((t,ti)=>{
    const matched = matchState.matched.has(t.pairIdx);
    return `<div class="match-tile ${matched?'matched':''}" id="match-${ti}" onclick="matchClick(${ti})">${t.text}</div>`;
  }).join('');
}
function matchClick(ti){
  if(hasAward(MATCH_XP_KEY)) return;
  const tile = matchState.tiles[ti];
  if(matchState.matched.has(tile.pairIdx)) return;
  const el = document.getElementById('match-'+ti);
  if(matchState.selected===null){
    matchState.selected = ti;
    el.classList.add('selected');
    return;
  }
  if(matchState.selected===ti) return;
  const first = matchState.tiles[matchState.selected];
  const firstEl = document.getElementById('match-'+matchState.selected);
  if(first.pairIdx===tile.pairIdx && first.kind!==tile.kind){
    matchState.matched.add(tile.pairIdx);
    firstEl.classList.remove('selected'); firstEl.classList.add('matched');
    el.classList.add('matched');
    matchState.selected = null;
    const status = document.getElementById('match-status');
    if(status) status.textContent = matchState.matched.size+' / '+(matchState.tiles.length/2)+' correct pairs';
    if(matchState.matched.size >= matchState.tiles.length/2 && !hasAward(MATCH_XP_KEY)){
      awardXP(MATCH_XP_KEY, 8);
    }
  } else {
    el.classList.add('wrong'); firstEl.classList.add('wrong');
    setTimeout(()=>{ el.classList.remove('wrong','selected'); firstEl.classList.remove('wrong','selected'); }, 550);
    matchState.selected = null;
  }
}

/* ---------- tone music sheet (Part 2) ---------- */
/* Pitch ladder, top→bottom: Đô(high)=10, La=30, Sol=50 (baseline/reference), Mi=60, Rê=70, Đô(low)=90 */
const TONE_SHEETS = {
  ngang: {desc:'Flat — stay level at Sol, no rise or fall.'},
  sac:   {desc:'Sol ↗ Đô (high) — rise decisively.'},
  huyen: {desc:'Sol ↘ Rê — fall gently, gradually.'},
  hoi:   {desc:'Sol ↘ Đô(low), then ↗ slightly to Mi — dip, then partly recover.'},
  nga:   {desc:'Sol ↗ Đô like Sắc, but with a "break" partway through (a catch in the throat).'},
  nang:  {desc:'Sol ↓ Đô(low), short and cut off abruptly — don\'t draw it out.'}
};
/* ---------- Telex trainer ---------- */
const TONE_MAP = {
  a:['á','à','ả','ã','ạ'], ă:['ắ','ằ','ẳ','ẵ','ặ'], â:['ấ','ầ','ẩ','ẫ','ậ'],
  e:['é','è','ẻ','ẽ','ẹ'], ê:['ế','ề','ể','ễ','ệ'],
  i:['í','ì','ỉ','ĩ','ị'],
  o:['ó','ò','ỏ','õ','ọ'], ô:['ố','ồ','ổ','ỗ','ộ'], ơ:['ớ','ờ','ở','ỡ','ợ'],
  u:['ú','ù','ủ','ũ','ụ'], ư:['ứ','ừ','ử','ữ','ự'],
  y:['ý','ỳ','ỷ','ỹ','ỵ']
};
const TONE_KEYS = {s:0, f:1, r:2, x:3, j:4};
const VOWELS = new Set(['a','ă','â','e','ê','i','o','ô','ơ','u','ư','y']);
function telexBase(word){
  let w = word;
  w = w.replace(/dd/g,'đ');
  w = w.replace(/aa/g,'â').replace(/aw/g,'ă').replace(/ee/g,'ê').replace(/oo/g,'ô').replace(/ow/g,'ơ').replace(/uw/g,'ư');
  return w;
}
function telexConvert(rawWord){
  let w = rawWord.toLowerCase().trim();
  let toneIdx = -1;
  const last = w[w.length-1];
  if(TONE_KEYS.hasOwnProperty(last)){
    toneIdx = TONE_KEYS[last];
    w = w.slice(0,-1);
  }
  w = telexBase(w);
  if(toneIdx===-1) return w;
  const chars = [...w];
  let vowelPositions = [];
  for(let i=0;i<chars.length;i++){ if(VOWELS.has(chars[i])) vowelPositions.push(i); }
  /* semi-consonant skips: leading "qu" — the u is an onset glide, not the nucleus */
  if(chars[0]==='q' && chars[1]==='u') vowelPositions = vowelPositions.filter(p=>p!==1);
  /* leading "gi" + another vowel — the i is onset, not the nucleus */
  if(chars[0]==='g' && chars[1]==='i' && vowelPositions.length>1) vowelPositions = vowelPositions.filter(p=>p!==1);
  if(vowelPositions.length===0) return w;
  const reachesEnd = vowelPositions[vowelPositions.length-1] === chars.length-1;
  let targetPos;
  if(vowelPositions.length===1) targetPos = vowelPositions[0];
  else if(!reachesEnd) targetPos = vowelPositions[vowelPositions.length-1];
  else targetPos = vowelPositions[vowelPositions.length-2];
  const baseVowel = chars[targetPos];
  if(TONE_MAP[baseVowel]) chars[targetPos] = TONE_MAP[baseVowel][toneIdx];
  return chars.join('');
}
function telexCheck(partId, idx, expected, xp, inputId, fbId){
  const key = partId+'-i'+idx;
  const raw = document.getElementById(inputId).value;
  const words = raw.split(' ').map(w=>telexConvert(w)).join(' ');
  const fb = document.getElementById(fbId);
  if(words.trim().toLowerCase() === expected.trim().toLowerCase()){
    fb.className='telex-fb ok';
    fb.textContent='✅ Correct — "'+words+'"';
    document.getElementById(inputId).disabled = true;
    if(!hasAward(key)) awardXP(key, xp);
  } else {
    fb.className='telex-fb bad';
    fb.textContent='❌ The converter read: "'+words+'" — doesn\'t match "'+expected+'". Try again.';
  }
}

  const total = totalXP();
  const seed = total*97 + XP_PART_COUNT*13 + doneParts().length*7;
  return 'V101M1-' + Math.abs(seed).toString(36).toUpperCase().padStart(5,'0').slice(0,5) + '-' + (total).toString(36).toUpperCase();
}
function doneParts(){ return Object.keys(PART_MAX_XP).filter(isPartDone); }

function renderCanDoComparison(){
  const ratings = canDoRatings();
  const pre = ratings.gdcheck || {}, post = ratings.closingcheck || {};
  const anyPre = Object.keys(pre).length>0, anyPost = Object.keys(post).length>0;
  if(!anyPre && !anyPost) return '';
  return `<div class="credit-note">
    <strong>Self-Check — Before &amp; After</strong>
    <table class="vtable" style="margin-top:0.5rem">
      <tr><th>Skill</th><th>Before</th><th>After</th></tr>
      ${CANDO_STATEMENTS.map((s,i)=>{
        const preVal = pre[i]!==undefined ? CANDO_SCALE[pre[i]] : '—';
        const postVal = post[i]!==undefined ? CANDO_SCALE[post[i]] : '—';
        const improved = pre[i]!==undefined && post[i]!==undefined && post[i]>pre[i];
        return `<tr><td style="font-size:0.78rem">${s}</td><td>${preVal}</td><td>${postVal}${improved?' 📈':''}</td></tr>`;
      }).join('')}
    </table>
  </div>`;
}
function renderReport(){
  const total = totalXP();
  const pct = Math.round(total/TOTAL_MAX_XP*100);
  const complete = doneParts().length === XP_PART_COUNT;
  const s = trauLoad();
  const stage = trauStage(s.xp);
  const rows = Object.keys(PART_MAX_XP).map(id=>{
    const earned = partXP(id), max = PART_MAX_XP[id];
    const done = isPartDone(id);
    const icon = done ? '✅' : (earned>0 ? '🔸' : '⭕');
    return `<li class="${done?'done':''}"><span class="cl-icon">${icon}</span><span class="cl-text">${REPORT_PART_LABELS[id]}</span><span class="cl-xp">${earned} / ${max} XP</span></li>`;
  }).join('');
  return `<div class="report-wrap">
    <div class="report-card">
      <div class="report-head">
        <div class="rh-kicker">VIET 101 · Module 1 · Completion Report</div>
        <h2>Foundation</h2>
        <div class="rh-subtitle">Vietnamese Alphabet, Pronunciation, Spelling &amp; Typing</div>
        <div class="meta-row">
          <span>${stage.emoji} ${stage.label}</span>
          <span>${total} / ${TOTAL_MAX_XP} XP (${pct}%)</span>
          <span>${doneParts().length} / ${XP_PART_COUNT} parts complete</span>
        </div>
      </div>
      <div class="report-body">
        <ul class="checklist">${rows}</ul>
        ${renderCanDoComparison()}
        <div class="credit-note">
          ${complete ? '🎉 <strong>Module 1 complete!</strong> You\'ve learned the alphabet, tones, vowels, consonants, spelling, and how to type Vietnamese with Telex.' : (XP_PART_COUNT-doneParts().length)+' part(s) haven\'t reached the 85% XP mark yet — go back to the ⭕/🔸 items in the sidebar to finish.'}
        </div>
        <div class="credit-note">
          Date: ${new Date().toLocaleDateString('en-US')} &nbsp;·&nbsp; Verification code:
          <div class="verify-code">${verificationCode()}</div>
        </div>
        <div class="report-actions">
          <button class="btn-primary" onclick="window.print()">🖨️ Print / Save PDF</button>
          <button class="btn-secondary" onclick="downloadReport()">⬇️ Download report (.txt)</button>
        </div>
      </div>
    </div>
    <p class="source-credit">Pronunciation content and audio in Parts 1–4 are adapted from <em>Basic Vietnamese</em> by Hoang, Tung (Michigan State University, 2023), Chapter I "Getting Started: Vietnamese Alphabet and Pronunciation" — <a href="https://openbooks.lib.msu.edu/vietnamese/" target="_blank" rel="noopener">openbooks.lib.msu.edu/vietnamese</a>, CC BY-NC 4.0. Parts 5 (Spelling) and 6 (Telex) are original content by the Open Vietnamese Initiative. The Part 7 reading "Tớ đi học" is a Vietnamese translation (© Let's Read, 2019) of "I Know" by All Children Reading Cambodia, published on StoryWeaver by The Asia Foundation, CC BY 4.0.</p>
  </div>`;
}
function downloadReport(){
  const total = totalXP();
  const pct = Math.round(total/TOTAL_MAX_XP*100);
  let text = 'VIET 101 — Module 1 — Completion Report\n';
  text += 'Foundation: Vietnamese Alphabet, Pronunciation, Spelling & Typing\n';
  text += '='.repeat(50)+'\n\n';
  Object.keys(PART_MAX_XP).forEach(id=>{
    const earned=partXP(id), max=PART_MAX_XP[id];
    text += `${isPartDone(id)?'[x]':'[ ]'} ${REPORT_PART_LABELS[id]} — ${earned}/${max} XP\n`;
  });
  text += `\nTotal: ${total} / ${TOTAL_MAX_XP} XP (${pct}%)\n`;
  text += `Date: ${new Date().toLocaleString('en-US')}\n`;
  text += `Verification code: ${verificationCode()}\n`;
  const blob = new Blob([text], {type:'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'VIET101-M1-Report.txt';
  document.body.appendChild(a); a.click(); a.remove();
}

function resetModule(){
  if(!confirm('Clear all progress for Module 1 and start over?')) return;
  Object.keys(localStorage).filter(k=>k.startsWith(NS)).forEach(k=>localStorage.removeItem(k));
  goto('home');
}

/* ---------- boot ---------- */
goto('home');
</script>
</body>
</html>
