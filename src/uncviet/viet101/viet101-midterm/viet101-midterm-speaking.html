const Qs=[

   vi:'Bạn tên là gì?\nBạn là sinh viên năm thứ mấy?',

   en:'What is your name?\nWhat year are you in?',
   kw:['tên','là','sinh viên','năm','thứ','nhất','hai','ba','tư'],rp:false},
  // ── Stage 1: Level Check — Getting acquainted (L2) ────────
  {stage:1,lesson:2,time:40,
   vi:'Bạn là người nước nào?\nBạn học ở đâu? Trường bạn có đẹp không?',
   tts:'Bạn là người nước nào? Bạn học ở đâu? Trường bạn có đẹp không?',
   en:'Where are you from?\nWhere do you study? Is your school beautiful?',
   kw:['người','nước','mỹ','việt','học','ở','trường','đại học','đẹp','lắm','rất'],rp:false},
  {stage:1,lesson:2,time:45,
   vi:'Hôm nay bạn có những gì ở lớp?\nHãy nói về hai hoặc ba đồ vật: cái gì, màu gì, mới hay cũ?',
   tts:'Hôm nay bạn có những gì ở lớp? Hãy nói về hai hoặc ba đồ vật: cái gì, màu gì, mới hay cũ?',
   en:'What do you have with you in class today?\nTalk about two or three things: what they are, what colour, new or old?',
   kw:['có','quyển','cái','chiếc','tờ','sách','vở','bút','từ điển','màu','đen','trắng','đỏ','xanh','vàng','nâu','mới','cũ'],rp:false},
  // ── Stage 2: Level Check — Languages & numbers (L3 + L4) ──
  {stage:2,lesson:3,time:45,
   vi:'Bạn biết những tiếng gì?\nTiếng Việt khó hay dễ? Bạn nói tiếng Việt thế nào?',
   tts:'Bạn biết những tiếng gì? Tiếng Việt khó hay dễ? Bạn nói tiếng Việt thế nào?',
   en:'What languages do you know?\nIs Vietnamese hard or easy? How well do you speak Vietnamese?',
   kw:['biết','tiếng','anh','việt','pháp','tây ban nha','khó','dễ','lắm','rất','quá','giỏi','nói','cũng'],rp:false},

   vi:'Học kỳ này bạn học mấy môn?\nLớp tiếng Việt có bao nhiêu sinh viên?',

  {stage:3,lesson:0,time:60,
   vi:'Hãy nói về một người bạn ở trường.\nBạn ấy tên là gì? Bạn ấy là người nước nào?\nBạn ấy học gì? Bạn ấy biết tiếng gì?',
   tts:'Hãy nói về một người bạn ở trường. Bạn ấy tên là gì? Bạn ấy là người nước nào? Bạn ấy học gì? Bạn ấy biết tiếng gì?',
   en:'Tell me about a friend at school.\nWhat is their name? Where are they from?\nWhat do they study? What languages do they know?',
   kw:['bạn','tên','là','người','học','biết','tiếng','anh ấy','chị ấy','bạn ấy','cũng','nhưng','và','giỏi','lắm'],rp:false},

   en:'ROLE PLAY: You go to Minh\'s home. Minh\'s father — bác Hùng — opens the door.\n\nBác Hùng: "Hello!"\n\nPlease:\n① Greet him politely (thưa, ạ)\n② Ask how he is\n③ Say your name and where you are from\n④ Ask if Minh is home',

  {stage:5,lesson:0,time:30,
   vi:'Dạo này bạn có bận không?\nCảm ơn bạn. Chào bạn!',
   tts:'Dạo này bạn có bận không? Cảm ơn bạn. Chào bạn!',
   en:'Are you busy these days?\nThank you. Goodbye!',
   kw:['bận','lắm','không','cảm ơn','cám ơn','chào','thi','nhiều việc'],rp:false}
];

// ─── STATE ────────────────────────────────────────────────────
let S={
  screen:'welcome',
  name:'',section:'',
  qi:0,qState:'tts',
  cdown:3,
  timeLeft:0,totalTime:0,
  curTr:'',finalTr:'',
  responses:[],
  audioChunks:[],
  audioBlobs:[],
  audioURLs:[],
  scores:null,
  stream:null,recorder:null,recog:null,
  timerInterval:null,cdInterval:null
};

// ─── QUESTION AUDIO PLAYBACK (recorded prompts, replaces TTS) ────
let _qAudio = null;
function ttsQuestion(text, done){
  if(!('speechSynthesis' in window)){ done(); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'vi-VN'; u.rate = 0.85;
  const v = speechSynthesis.getVoices().find(x => /^vi/i.test(x.lang));
  if(v) u.voice = v;
  u.onend = done; u.onerror = done;
  speechSynthesis.speak(u);
}
function speakQuestion(text, onDone){
  if(_qAudio){ _qAudio.pause(); _qAudio.src=''; _qAudio=null; }
  let fired = false;
  function done(){ if(!fired){ fired=true; _qAudio=null; onDone(); } }
  const file = Q_AUDIO[S.qi];
  if(!file){ ttsQuestion(text, done); return; }
  const audio = new Audio(file);
  _qAudio = audio;
  let started = false, fell = false;
  const fallback = () => { if(!started && !fired && !fell){ fell = true; _qAudio=null; ttsQuestion(text, done); } };   // no recording yet → browser voice (error and play() rejection can both fire)
  audio.onplaying = () => { started = true; };
  audio.onended  = done;
  audio.onerror  = () => { if(started) done(); else fallback(); };
  audio.play().catch(fallback);
}

// ─── RECORDING ────────────────────────────────────────────────
async function askMic(){
  try{S.stream=await navigator.mediaDevices.getUserMedia({audio:true});return true}
  catch(e){return false}
}
function startRecording(){
  S.curTr='';S.finalTr='';S.audioChunks=[];
  if(S.stream){
    try{S.recorder=new MediaRecorder(S.stream,{mimeType:'audio/webm'})}
    catch(e){try{S.recorder=new MediaRecorder(S.stream)}catch(e2){S.recorder=null}}
    if(S.recorder){
      S.recorder.ondataavailable=e=>{if(e.data&&e.data.size>0)S.audioChunks.push(e.data)};
      S.recorder.onstop=()=>{
        if(S.audioChunks.length>0){
          const blob=new Blob(S.audioChunks,{type:S.recorder.mimeType||'audio/webm'});
          S.audioBlobs.push(blob);S.audioURLs.push(URL.createObjectURL(blob));
        }else{S.audioBlobs.push(null);S.audioURLs.push(null)}
      };
      S.recorder.start(200);
    }
  }else{S.audioBlobs.push(null);S.audioURLs.push(null)}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(SR){
    S.recog=new SR();
    S.recog.continuous=true;S.recog.interimResults=true;S.recog.lang='vi-VN';
    S.recog.onresult=e=>{
      let fin='',int='';
      for(let i=e.resultIndex;i<e.results.length;i++){
        if(e.results[i].isFinal)fin+=e.results[i][0].transcript+' ';
        else int+=e.results[i][0].transcript;
      }
      S.finalTr+=fin;S.curTr=S.finalTr+int;
      const el=document.getElementById('trbox');
      if(el){el.textContent=S.curTr||'Đang nghe…';el.className='tr-box'}
    };
    S.recog.onerror=()=>{};
    try{S.recog.start()}catch(e){}
  }
}
function stopRecording(){
  if(S.recog){try{S.recog.stop()}catch(e){}}
  if(S.recorder&&S.recorder.state!=='inactive'){try{S.recorder.stop()}catch(e){}}
  else if(S.stream&&S.recorder===null){S.audioBlobs.push(null);S.audioURLs.push(null)}
  S.curTr=S.finalTr.trim();
}

// ─── TIMER ────────────────────────────────────────────────────
function startTimer(seconds){
  S.totalTime=seconds*1000;S.timeLeft=S.totalTime;
  clearInterval(S.timerInterval);
  S.timerInterval=setInterval(()=>{
    S.timeLeft-=100;updateTimerUI();
    if(S.timeLeft<=0){clearInterval(S.timerInterval);handleTimerEnd()}
  },100);
}
function updateTimerUI(){
  const pct=Math.max(0,S.timeLeft/S.totalTime*100);const secs=Math.ceil(S.timeLeft/1000);
  const fill=document.getElementById('timer-fill');const num=document.getElementById('timer-num');
  if(fill){fill.style.width=pct+'%';fill.style.background=pct>50?'#27AE60':pct>25?'#F39C12':'#E74C3C'}
  if(num){num.textContent=secs+'s';num.style.color=pct>50?'#27AE60':pct>25?'#F39C12':'#E74C3C'}
}
function handleTimerEnd(){
  stopRecording();S.qState='advancing';render();setTimeout(()=>advanceQuestion(),1400);
}
function doneSpeaking(){
  clearInterval(S.timerInterval);stopRecording();S.qState='advancing';render();setTimeout(()=>advanceQuestion(),1100);
}
function advanceQuestion(){
  S.responses.push(S.curTr||S.finalTr||'');
  if(S.qi<Qs.length-1){S.qi++;S.qState='tts';S.curTr='';S.finalTr='';render();beginQuestion();}
  else{S.scores=calcScores(S.responses);S.screen='results';render()}
}
function beginQuestion(){speakQuestion(Qs[S.qi].tts,()=>startCountdown())}
function startCountdown(){
  S.qState='countdown';S.cdown=3;render();
  S.cdInterval=setInterval(()=>{
    S.cdown--;
    if(S.cdown<=0){
      clearInterval(S.cdInterval);S.qState='recording';render();startRecording();startTimer(Qs[S.qi].time);
    }else{
      const el=document.getElementById('cdnum');
      if(el){el.textContent=S.cdown;el.style.animation='none';void el.offsetHeight;el.style.animation=''}
    }
  },1000);
}

// ─── SCORING ──────────────────────────────────────────────────
function wc(t){return t.trim().split(/\s+/).filter(w=>w.length>1).length}
function calcScores(rs){
  // Tasks & Functions /12 — 9 questions, up to 1.5 pts each, capped at 12
  let tp=0;
  rs.forEach(r=>{const w=wc(r);if(w>=12)tp+=1.5;else if(w>=6)tp+=1.0;else if(w>=2)tp+=0.5});
  const task=Math.min(12,Math.round(tp));
  const avg=rs.reduce((s,r)=>s+wc(r),0)/Math.max(rs.length,1);
  const txt=avg<3?1:avg<6?2:avg<10?3:avg<15?4:avg<22?5:6;
  const all=rs.join(' ').toLowerCase();
  const totKW=Qs.reduce((s,q)=>s+q.kw.length,0);
  const matKW=Qs.reduce((s,q,i)=>{
    if(!rs[i])return s;const t=rs[i].toLowerCase();
    return s+q.kw.filter(k=>t.includes(k)).length
  },0);
  const kvr=matKW/totKW;const cont=kvr<0.12?1:kvr<0.25?2:3;
  const pol=['dạ','vâng','thưa','ạ','xin lỗi','cảm ơn','cám ơn','cháu chào','bác'];
  const pc=pol.filter(p=>all.includes(p)).length;const ctx=pc===0?1:pc<=2?2:3;
  const conn=['và','nhưng','còn','cũng','hay','rất','lắm','quá'];
  const cc=conn.filter(c=>all.includes(c)).length;
  const acc=avg<3?1:avg<6&&cc<2?2:avg<6?3:cc<3?4:cc<5?5:6;
  return{task,txt,cont,ctx,acc,total:task+txt+cont+ctx+acc};
}
function grade(n){return n>=27?'A':n>=24?'A−':n>=22?'B+':n>=20?'B':n>=18?'B−':n>=16?'C+':n>=15?'C':'D'}
function level(n){
  if(n>=26)return{lbl:'Novice High',clr:'#27AE60'};
  if(n>=20)return{lbl:'Novice Mid',clr:'#F39C12'};
  return{lbl:'Novice Low',clr:'#C0392B'};
}
function detectedVocab(rs){
  const all=rs.join(' ').toLowerCase();
  return[
    // L1
    'chào','cảm ơn','xin lỗi','tên là','có khoẻ không','sinh viên',
    // L2
    'người mỹ','người việt','học ở','phải không','quyển','cái','tờ','màu',
    // L3
    'tiếng việt','tiếng anh','rất','lắm','quá','cũng','thế nào','năm thứ',
    // L4
    'bao nhiêu','mấy','môn','bận','thưa','cháu','bác','dạ','vâng'
  ].filter(v=>all.includes(v));
}
function missingStructures(rs){
  const all=rs.join(' ').toLowerCase();
  return[
    {t:t=>/chào|cảm ơn|cám ơn/.test(t),       m:'greetings and thanks — L1 (chào, cảm ơn, xin lỗi)'},
    {t:t=>/tên là|là người|là sinh viên/.test(t),m:'là sentences — L1–2 (Tôi là …, Tôi tên là …)'},
    {t:t=>/quyển|cái|chiếc|tờ|con/.test(t),   m:'classifiers — L2 (quyển, cái, tờ, con)'},
    {t:t=>/rất|lắm|quá/.test(t),              m:'degree words — L3 (rất / lắm / quá)'},
    {t:t=>t.includes('cũng'),                 m:'"cũng" (also) — L3'},
    {t:t=>/mười|mươi/.test(t),                m:'numbers 10–99 — L4 (mười, hai mươi …)'},
    {t:t=>/thưa|ạ|dạ|vâng/.test(t),           m:'polite markers — L4 (thưa, ạ, dạ / vâng)'},
    {t:t=>/và|nhưng|còn/.test(t),             m:'connectors (và, nhưng, còn)'}
  ].filter(c=>!c.t(all)).map(c=>c.m).slice(0,4);
}
function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

// ─── DOWNLOAD ─────────────────────────────────────────────────
async function downloadRecordings(){
  const btn=document.getElementById('dl-btn');const status=document.getElementById('dl-status');
  if(btn)btn.disabled=true;
  if(status){status.style.display='block';status.textContent='Preparing recordings…'}
  const hasAudio=S.audioBlobs.some(b=>b!==null);
  if(!hasAudio){if(status)status.textContent='No recordings found.';if(btn)btn.disabled=false;return}
  try{
    const zip=new JSZip();
    const safeName=(S.name||'Student').replace(/[^a-zA-Z0-9]/g,'_');
    const ext=S.audioBlobs.find(b=>b)?.type?.includes('ogg')?'ogg':'webm';
    S.audioBlobs.forEach((blob,i)=>{
      if(!blob)return;
      const q=Qs[i];
      const stageName=STAGES[q.stage].replace(/[^a-zA-Z]/g,'_');
      zip.file(`Q${String(i+1).padStart(2,'0')}_${stageName}.${ext}`,blob);
    });
    let txt=`VIET 101 — Midterm Speaking Exam (Lessons 1–4)\n`;
    txt+=`Student: ${S.name||'Unknown'}${S.section?' | Section '+S.section:''}\n`;
    txt+=`Date: ${new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})}\n`;
    txt+=`Automatic estimate: ${S.scores.total}/30 (${grade(S.scores.total)}) — ${level(S.scores.total).lbl} · final grade by your instructor\n\n`;
    Qs.forEach((q,i)=>{
      const l=q.lesson?`[L${q.lesson}] `:'';
      txt+=`Q${i+1} — ${STAGES[q.stage]} ${l}\n`;
      txt+=`Prompt (VI): ${q.vi.replace(/\n/g,' ')}\n`;
      txt+=`Transcript: ${S.responses[i]||'[no response]'}\n\n`;
    });
    zip.file('transcript.txt',txt);
    const content=await zip.generateAsync({type:'blob'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(content);
    a.download=`VIET101_Midterm_Speaking_${safeName}.zip`;
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    if(status)status.textContent='✓ Downloaded! Submit this ZIP file to your instructor.';
  }catch(e){if(status)status.textContent='Download failed. Try right-clicking each audio player to save individually.'}
  if(btn)btn.disabled=false;
}

    <div class="grade-lbl" style="color:${lv.clr}">${g}</div>
    <span class="lvl-pill" style="background:${lv.clr}30;color:${lv.clr}">${lv.lbl}</span>
    <p style="font-size:13px;color:#A8C0D6;margin-top:10px">Automatic ACTFL estimate · ${pct}% — your instructor listens to your recordings and gives the final grade</p>
  </div>

  <div class="section">
    <h3>Score Breakdown</h3>
    ${rubrics.map(r=>`<div class="rub-row">
      <div class="rub-lbl"><span class="rub-name">${r.name}</span><span class="rub-pts">${r.v}/${r.max} · ${r.pct}</span></div>
      ${bar(r.v,r.max,r.clr)}
    </div>`).join('')}
  </div>

  <div class="section">
    <h3>Response Log</h3>
    ${logItems}
  </div>

  ${det.length?`<div class="section">
    <h3>Vocabulary &amp; Structures Detected</h3>
    <div class="tags">${det.map(v=>`<span class="tag tag-g">${v}</span>`).join('')}</div>
  </div>`:''}

  ${mis.length?`<div class="section">
    <h3>Structures to Practice</h3>
    <div class="tags">${mis.map(v=>`<span class="tag tag-r">${v}</span>`).join('')}</div>
  </div>`:''}

  <div class="section">
    <h3>Instructor Notes</h3>
    <div class="instructor-notes">Space for written instructor feedback…</div>
  </div>

  <div class="res-footer">
    <button class="btn btn-blue" id="dl-btn" onclick="downloadRecordings()">
      📥 Download Recordings + Transcript (.zip)
    </button>
    <button class="btn btn-ghost" onclick="window.print()">🖨️ Print Score Report (PDF)</button>
  </div>
  <p class="download-status" id="dl-status"></p>
  <p style="text-align:center;font-size:12px;color:var(--gray);padding-bottom:24px">Submit the ZIP file to your instructor via Canvas or email · Print the score report for your records</p>
</div></div>`}

// ─── ACTIONS ──────────────────────────────────────────────────
function goInstructions(){
  const n=document.getElementById('inp-name');const sec=document.getElementById('inp-sec');
  if(n)S.name=n.value.trim();if(sec)S.section=sec.value.trim();
  if(!S.name){alert('Please enter your name before continuing.');return}
  S.screen='instructions';render();
}
async function grantMic(){
  const ok=await askMic();
  if(ok){S.screen='exam';render();beginQuestion();}
  else{alert('Microphone access was denied.\n\nClick the microphone icon in your browser address bar, allow access, and reload the page.')}
}

// ─── INIT ─────────────────────────────────────────────────────
render();
</script>
<p style="text-align:center;font-size:12px;color:#6B7C8F;padding:0 16px 20px">UNC Viet · Vietnamese Language Program, UNC-Chapel Hill</p>
